<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<script src="suite-theme.js" data-suite-theme></script>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Mechanism scheme editor</title>
<meta name="theme-color" content="#5A4360">
<meta name="color-scheme" content="dark">
<style>
:root{
  color-scheme:dark;
  --paper:var(--t-bg,#000000); --surface:var(--t-surface,#131316); --sunk:var(--t-field,#0F0F12); --ink:var(--t-ink,#F2F2F4); --muted:var(--t-muted,#9D9DA5); --line:var(--t-line,#2E2E35);
  --accent:var(--t-accent,#EBA8E4); --accent-soft:var(--t-accent-soft,#35263A); --sel:#B15FC0; --bad:var(--t-danger,#EF5A50);
  --sheet:#FFFFFF; --grid:#DDE3E1;
  --grad:linear-gradient(90deg,var(--t-grad1,#F0A8DC) 0%,var(--t-grad2,#C9B6EF) 50%,var(--t-grad3,#A6CCF5) 100%);
  --r:10px;
  --sans:Roboto,"Google Sans",system-ui,-apple-system,"Segoe UI",sans-serif;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
html{scroll-padding-top:env(safe-area-inset-top,0px);height:100%}
*,*::before,*::after{box-sizing:inherit}
body{margin:0;height:100%;background:var(--paper);color:var(--ink);font-family:var(--sans);font-size:15px;line-height:1.45;-webkit-font-smoothing:antialiased;display:flex;flex-direction:column}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

header{flex:none;display:flex;align-items:center;gap:.6rem;flex-wrap:wrap;padding:.6rem .8rem;border-bottom:1px solid var(--line);background:var(--paper)}
header h1{font-size:1.05rem;margin:0 .4rem 0 0;font-weight:600;white-space:nowrap}
.grow{flex:1 1 auto}
select,input[type=text],input[type=number],textarea{background:var(--sunk);border:1px solid var(--line);border-radius:6px;padding:.35rem .5rem;min-height:2.2rem}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:.35rem;background:var(--surface);border:1px solid var(--line);border-radius:6px;padding:.3rem .65rem;min-height:2.2rem;cursor:pointer;font-weight:500;white-space:nowrap}
.btn:hover{border-color:var(--accent)}
.btn:disabled{opacity:.45;cursor:default}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--surface)}
.btn.danger{color:var(--bad)}
.sync{font-size:.8rem;color:var(--muted)}

.tools{flex:none;display:flex;gap:.3rem;padding:.45rem .8rem;border-bottom:1px solid var(--line);overflow-x:auto;background:var(--paper);scrollbar-width:thin}
.tool{flex:none;display:flex;flex-direction:column;align-items:center;gap:.1rem;min-width:3.3rem;padding:.3rem .35rem;border:1px solid transparent;border-radius:var(--r);background:none;cursor:pointer;color:var(--muted);font-size:.72rem}
.tool svg{width:22px;height:22px;stroke:var(--ink);fill:none;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}
.tool[aria-pressed="true"]{background:var(--surface);border-color:var(--accent);color:var(--ink)}
.subbar{flex:none;display:flex;gap:.3rem;align-items:center;flex-wrap:wrap;padding:.4rem .8rem;border-bottom:1px solid var(--line);min-height:2.9rem;background:var(--sunk)}
.subbar .opt{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:.2rem .7rem;cursor:pointer;min-height:2rem;font-size:.88rem}
.subbar .opt[aria-pressed="true"]{background:var(--accent-soft);border-color:var(--accent)}
.subbar .hint{color:var(--muted);font-size:.85rem;margin-left:.3rem}
.swatch{width:1.6rem;height:1.6rem;border-radius:50%;border:2px solid var(--surface);box-shadow:0 0 0 1px var(--line);cursor:pointer;padding:0}
.swatch[aria-pressed="true"]{box-shadow:0 0 0 2px var(--accent)}

.work{flex:1 1 auto;display:flex;min-height:0}
.canvas-wrap{flex:1 1 auto;overflow:auto;background:var(--paper);position:relative;min-height:320px}
#stage{display:block;background:var(--sheet);margin:12px;box-shadow:0 0 0 1px var(--line);touch-action:none;user-select:none;-webkit-user-select:none}
.side{flex:0 0 280px;border-left:1px solid var(--line);background:var(--surface);padding:.8rem;overflow-y:auto}
.side h2{font-size:.95rem;margin:0 0 .6rem;font-weight:600}
.side .field{margin-bottom:.7rem}
.side label.f{display:block;font-size:.8rem;color:var(--muted);margin-bottom:.2rem}
.side input[type=text],.side select,.side textarea{width:100%}
.side p{margin:.2rem 0 .6rem;color:var(--muted);font-size:.88rem}
.side kbd{font-family:inherit;font-size:.8rem;border:1px solid var(--line);border-bottom-width:2px;border-radius:4px;padding:0 .3rem;background:var(--sunk)}
.row{display:flex;gap:.5rem;flex-wrap:wrap}
.row>*{flex:1 1 90px}
.zoom{position:sticky;left:12px;bottom:12px;display:inline-flex;gap:.3rem;margin:0 12px 12px}
@media (max-width:820px){
  .work{flex-direction:column}
  .side{flex:none;border-left:0;border-top:1px solid var(--line);max-height:38vh}
  .canvas-wrap{min-height:52vh}
}
.toast{position:fixed;left:50%;bottom:calc(1rem + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--paper);padding:.45rem .9rem;border-radius:6px;font-size:.9rem;opacity:0;pointer-events:none;transition:opacity .2s;z-index:50}
.toast.show{opacity:1}
@media (prefers-reduced-motion:reduce){.toast{transition:none}}
dialog{border:1px solid var(--line);border-radius:12px;background:var(--surface);color:var(--ink);padding:1rem;width:min(420px,calc(100vw - 2rem))}
dialog::backdrop{background:var(--t-backdrop,rgba(10,15,20,.45))}
dialog h3{margin:0 0 .6rem;font-size:1rem}

/* ---- Theme: dark with pink-to-blue accents (shared with research-log) ---- */
/* The drawing sheet stays white with black ink so exports look like journal figures. */
header{background:linear-gradient(172deg,var(--t-head,#5A4360) 0%,var(--t-headbar,#2A2432) 100%);border-bottom-color:var(--t-line,#2E2E35)}
header h1{font-weight:500;font-size:1.15rem}
.tools{background:var(--t-bg,#000)}
.subbar{background:var(--t-field,#0B0B0D)}
select,input[type=text],input[type=number],textarea{border-radius:10px}
select:focus,input:focus,textarea:focus{border-color:var(--t-focus,#9C8BC0);outline:none}
.btn{background:var(--t-bg,#000);border:1.5px solid var(--t-edge,#3B3B43);border-radius:10px}
.btn:hover{border-color:var(--t-focus,#9C8BC0)}
.btn.primary{background:var(--grad);border-color:transparent;color:var(--t-on-grad,#17161C)}
.tool[aria-pressed="true"]{background:var(--t-raised,#1D1D22);border-color:var(--t-focus,#9C8BC0)}
.subbar .opt{background:var(--t-bg,#000);border:1.5px solid var(--t-edge,#3B3B43)}
.subbar .opt[aria-pressed="true"]{background:var(--grad);border-color:transparent;color:var(--t-on-grad,#17161C)}
.side{background:var(--t-surface,#131316);border-left-color:var(--t-faint,#28282E)}
.toast{background:var(--t-raised2,#26262C);color:var(--ink)}
dialog{background:var(--t-raised,#1D1D22);border-color:var(--t-line,#2E2E35)}
dialog::backdrop{background:var(--t-backdrop,rgba(0,0,0,.6))}
.sync{color:var(--t-dim,#6F6F77)}
</style>
</head>
<body>
<header>
  <h1>Mechanism schemes</h1>
  <select id="scheme-sel" aria-label="Open scheme" style="max-width:14rem"></select>
  <button class="btn" id="b-new">New</button>
  <button class="btn" id="b-rename">Rename</button>
  <button class="btn" id="b-dup">Duplicate</button>
  <button class="btn danger" id="b-del">Delete</button>
  <span class="sync" id="sync"></span>
  <span class="grow"></span>
  <button class="btn" id="b-undo" title="Undo (Ctrl+Z)">Undo</button>
  <button class="btn" id="b-redo" title="Redo (Ctrl+Y)">Redo</button>
  <button class="btn primary" id="b-png">PNG 600 dpi</button>
  <button class="btn" id="b-svg">SVG</button>
</header>

<div class="tools" role="toolbar" aria-label="Drawing tools" id="tools"></div>
<div class="subbar" id="subbar"></div>

<div class="work">
  <div class="canvas-wrap" id="wrap">
    <svg id="stage" xmlns="http://www.w3.org/2000/svg">
      <defs>
        <pattern id="dots" width="20" height="20" patternUnits="userSpaceOnUse"><circle cx="1" cy="1" r="1" fill="var(--grid)"/></pattern>
      </defs>
      <rect id="bg" width="100%" height="100%" fill="url(#dots)"/>
      <g id="content"></g>
      <g id="overlay"></g>
    </svg>
    <div class="zoom">
      <button class="btn" id="z-out" aria-label="Zoom out">−</button>
      <button class="btn" id="z-fit" style="min-width:4rem">100%</button>
      <button class="btn" id="z-in" aria-label="Zoom in">+</button>
    </div>
  </div>
  <aside class="side" id="side" aria-live="polite"></aside>
</div>

<dialog id="dlg"><form method="dialog" id="dlg-form"><h3 id="dlg-title"></h3><div class="field"><input type="text" id="dlg-in" style="width:100%"></div><p id="dlg-hint" style="color:var(--muted);font-size:.85rem;margin:.3rem 0 .8rem"></p><div class="row" style="justify-content:flex-end"><button class="btn" value="cancel" style="flex:0 0 auto">Cancel</button><button class="btn primary" value="ok" style="flex:0 0 auto">OK</button></div></form></dialog>
<div class="toast" id="toast" role="status" aria-live="polite"></div>

<script>
/* ================================================================
   Helpers
================================================================ */
const $=s=>document.querySelector(s);
const esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
function toast(m){const t=$("#toast");t.textContent=m;t.classList.add("show");clearTimeout(toast._t);toast._t=setTimeout(()=>t.classList.remove("show"),2200);}
const uid=()=>Math.random().toString(36).slice(2,9);
const dist=(a,b)=>Math.hypot(a.x-b.x,a.y-b.y);
const R2D=180/Math.PI;
function ask(title,value="",hint=""){
  return new Promise(res=>{
    const d=$("#dlg"); $("#dlg-title").textContent=title; $("#dlg-in").value=value; $("#dlg-hint").textContent=hint;
    d.onclose=()=>res(d.returnValue==="ok"?$("#dlg-in").value:null);
    d.returnValue=""; d.showModal(); setTimeout(()=>{$("#dlg-in").focus();$("#dlg-in").select();},30);
  });
}

/* ================================================================
   Storage: this browser (keys start with "mech.")
================================================================ */
const Store={
  async get(k,fb){ try{ const r=localStorage.getItem("mech."+k); return r?JSON.parse(r):fb; }catch{ return fb; } },
  async set(k,v){ try{localStorage.setItem("mech."+k,JSON.stringify(v));}catch(e){console.warn("local storage full or blocked",e);} },
  async del(k){ try{localStorage.removeItem("mech."+k);}catch{} }
};

/* ================================================================
   Model
================================================================ */
const L=40;                 // bond length
const FS=22;                // atom label font size
const FONT="Arial, Helvetica, sans-serif";
const INK="#000000";
let S=emptyScheme();
function emptyScheme(){ return {atoms:[],bonds:[],arrows:[],rxns:[],texts:[],brackets:[]}; }
const A=id=>S.atoms.find(a=>a.id===id);
const Bd=id=>S.bonds.find(b=>b.id===id);
const bondsOf=id=>S.bonds.filter(b=>b.a===id||b.b===id);
const nbrs=id=>bondsOf(id).map(b=>A(b.a===id?b.b:b.a)).filter(Boolean);
const deg=id=>bondsOf(id).length;
const findBond=(x,y)=>S.bonds.find(b=>(b.a===x&&b.b===y)||(b.a===y&&b.b===x));

let hist=[],fut=[];
function snap(){ hist.push(JSON.stringify(S)); if(hist.length>150) hist.shift(); fut=[]; updUndo(); }
function undo(){ if(!hist.length) return; fut.push(JSON.stringify(S)); S=JSON.parse(hist.pop()); sel.clear(); changed(); }
function redo(){ if(!fut.length) return; hist.push(JSON.stringify(S)); S=JSON.parse(fut.pop()); sel.clear(); changed(); }
function updUndo(){ $("#b-undo").disabled=!hist.length; $("#b-redo").disabled=!fut.length; }

function addAtom(x,y,label=""){ const a={id:uid(),x,y,label,charge:"",lp:0,rad:false}; S.atoms.push(a); return a; }
function addBond(a,b,order=1,style="plain"){ if(a===b) return null; let e=findBond(a,b); if(e) return e; e={id:uid(),a,b,order,style}; S.bonds.push(e); return e; }
function nearAtom(p,tol=12,skip){ let best=null,bd=tol; for(const a of S.atoms){ if(a.id===skip) continue; const d=dist(a,p); if(d<bd){bd=d;best=a;} } return best; }
function removeRefs(pred){ S.arrows=S.arrows.filter(r=>!(pred(r.from)||pred(r.to))); }
function deleteAtom(id){ const bs=bondsOf(id).map(b=>b.id); S.bonds=S.bonds.filter(b=>b.a!==id&&b.b!==id); S.atoms=S.atoms.filter(a=>a.id!==id);
  removeRefs(r=>r&&((r.t==="atom"||r.t==="lp")&&r.id===id || r.t==="bond"&&bs.includes(r.id))); }
function deleteBond(id){ const b=Bd(id); S.bonds=S.bonds.filter(x=>x.id!==id); removeRefs(r=>r&&r.t==="bond"&&r.id===id);
  if(b) [b.a,b.b].forEach(x=>{ const a=A(x); if(a&&!deg(x)&&!a.label&&!a.charge&&!a.lp&&!a.rad&&!S.arrows.some(r=>(r.from.id===x||r.to.id===x))) deleteAtom(x); }); }

/* ================================================================
   Geometry for labels and decorations
================================================================ */
function vlabel(a){ return a.label || (deg(a.id)===0 ? "C" : ""); }
function textW(str,fs){ let w=0; for(const c of str){ if(/[0-9]/.test(c)) w+=.42*fs; else if(/[A-Z]/.test(c)) w+=.68*fs; else if(/[a-z]/.test(c)) w+=.5*fs; else w+=.55*fs; } return w; }
function halfBox(a){ const l=vlabel(a); if(!l) return null; return {hw:textW(l,FS)/2+2, hh:FS*.52}; }
function trimAt(a,ux,uy){ const hb=halfBox(a); if(!hb) return 0; const tx=Math.abs(ux)>1e-6?hb.hw/Math.abs(ux):1e9, ty=Math.abs(uy)>1e-6?hb.hh/Math.abs(uy):1e9; return Math.min(tx,ty)+1.5; }
function angDiff(a,b){ let d=Math.abs(a-b)%(2*Math.PI); return d>Math.PI?2*Math.PI-d:d; }
function decor(a){
  const taken=nbrs(a.id).map(n=>Math.atan2(n.y-a.y,n.x-a.x));
  const pick=pref=>{ let best=pref,bs=-1;
    for(let k=0;k<24;k++){ const t=k*Math.PI/12; const s=taken.length?Math.min(...taken.map(x=>angDiff(x,t))):Math.PI; const score=s-0.02*angDiff(t,pref); if(score>bs+1e-9){bs=score;best=t;} } taken.push(best); return best; };
  const hb=halfBox(a); const rad=t=>{ if(!hb) return 11; const c=Math.abs(Math.cos(t)),s=Math.abs(Math.sin(t)); return Math.min(c>1e-6?hb.hw/c:1e9, s>1e-6?hb.hh/s:1e9)+6; };
  const out={};
  if(a.charge){ const t=pick(-Math.PI/4); const r=rad(t)+ (a.charge.length>1?5:2); out.charge={x:a.x+r*Math.cos(t),y:a.y+r*Math.sin(t),t}; }
  out.lps=[]; const prefs=[-Math.PI/2,Math.PI/2,Math.PI,0];
  for(let i=0;i<(a.lp||0);i++){ const t=pick(prefs[i%4]); const r=rad(t)+1; out.lps.push({x:a.x+r*Math.cos(t),y:a.y+r*Math.sin(t),t}); }
  if(a.rad){ const t=pick(-Math.PI/2); const r=rad(t); out.rad={x:a.x+r*Math.cos(t),y:a.y+r*Math.sin(t),t}; }
  return out;
}

/* ================================================================
   Rich text: x^{sup} x_{sub}, \Delta, \ddag, \to ...
================================================================ */
const MACROS={"\\Delta":"Δ","\\delta":"δ","\\alpha":"α","\\beta":"β","\\gamma":"γ","\\pi":"π","\\sigma":"σ","\\mu":"µ","\\ddag":"‡","\\dag":"†","\\pm":"±","\\to":"→","\\deg":"°","\\times":"×","\\approx":"≈","\\ne":"≠","\\le":"≤","\\ge":"≥"};
const MKEYS=Object.keys(MACROS).sort((a,b)=>b.length-a.length);
function macro(s){ return s.replace(/\\[A-Za-z]+/g,m=>{ for(const k of MKEYS){ if(m.startsWith(k)) return MACROS[k]+m.slice(k.length); } return m; }); }
function rich(str,fs){
  str=macro(String(str)); let out="",i=0,base=0;
  const seg=(txt,mode)=>{ if(!txt) return; const dy= mode==="sup"? -.38*fs : mode==="sub"? .3*fs : 0;
    const shift=dy-base; base=dy; out+=`<tspan${shift?` dy="${shift.toFixed(2)}"`:""}${mode?` font-size="${(fs*.68).toFixed(1)}"`:""}>${esc(txt)}</tspan>`; };
  let buf="";
  while(i<str.length){ const c=str[i];
    if((c==="^"||c==="_")&&i+1<str.length){ seg(buf,null); buf=""; let t; if(str[i+1]==="{"){ const j=str.indexOf("}",i+2); t=str.slice(i+2,j<0?str.length:j); i=j<0?str.length:j+1; } else { t=str[i+1]; i+=2; } seg(t,c==="^"?"sup":"sub"); }
    else { buf+=c; i++; } }
  seg(buf,null); if(base) out+=`<tspan dy="${(-base).toFixed(2)}"></tspan>`; return out;
}
function labelSpans(l){ // digits after letters become subscripts, + / - after a letter become superscripts
  let out="",base=0;
  for(const m of l.match(/[0-9]+|[+\-−]+|[^0-9+\-−]+/g)||[]){
    let mode=null; if(/^[0-9]+$/.test(m)) mode="sub"; else if(/^[+\-−]+$/.test(m)) mode="sup";
    const dy= mode==="sub"? .32*FS : mode==="sup"? -.4*FS : 0; const sh=dy-base; base=dy;
    out+=`<tspan${sh?` dy="${sh.toFixed(1)}"`:""}${mode?` font-size="${(FS*.68).toFixed(1)}"`:""}>${esc(m.replace(/-/g,"−"))}</tspan>`; }
  if(base) out+=`<tspan dy="${(-base).toFixed(1)}"></tspan>`; return out;
}

/* ================================================================
   Rendering
================================================================ */
const f1=n=>(+n).toFixed(1);
function lineSVG(x1,y1,x2,y2,extra=""){ return `<line x1="${f1(x1)}" y1="${f1(y1)}" x2="${f1(x2)}" y2="${f1(y2)}" stroke="${INK}" stroke-width="1.7" stroke-linecap="round"${extra}/>`; }
function bondSVG(b){
  const a=A(b.a), c=A(b.b); if(!a||!c) return "";
  let dx=c.x-a.x, dy=c.y-a.y; const len=Math.hypot(dx,dy)||1; const ux=dx/len, uy=dy/len, nx=-uy, ny=ux;
  const t1=trimAt(a,ux,uy), t2=trimAt(c,-ux,-uy);
  const x1=a.x+ux*t1,y1=a.y+uy*t1,x2=c.x-ux*t2,y2=c.y-uy*t2;
  if(b.style==="wedge"){ const w=3.6; return `<polygon points="${f1(x1)},${f1(y1)} ${f1(x2+nx*w)},${f1(y2+ny*w)} ${f1(x2-nx*w)},${f1(y2-ny*w)}" fill="${INK}"/>`; }
  if(b.style==="hash"){ let s=""; const n=Math.max(4,Math.floor((len-t1-t2)/3.6)); for(let i=0;i<=n;i++){ const f=i/n, w=.6+3.2*f, px=x1+(x2-x1)*f, py=y1+(y2-y1)*f; s+=`<line x1="${f1(px+nx*w)}" y1="${f1(py+ny*w)}" x2="${f1(px-nx*w)}" y2="${f1(py-ny*w)}" stroke="${INK}" stroke-width="1.3"/>`; } return s; }
  if(b.style==="dash") return lineSVG(x1,y1,x2,y2,` stroke-dasharray="4 3.2"`);
  if(b.style==="bold") return `<line x1="${f1(x1)}" y1="${f1(y1)}" x2="${f1(x2)}" y2="${f1(y2)}" stroke="${INK}" stroke-width="5" stroke-linecap="butt"/>`;
  if(b.order===3){ const o=5; return lineSVG(x1,y1,x2,y2)+lineSVG(x1+nx*o,y1+ny*o,x2+nx*o,y2+ny*o)+lineSVG(x1-nx*o,y1-ny*o,x2-nx*o,y2-ny*o); }
  if(b.order===2 || b.style==="partial2"){
    const dash = b.style==="partial2" ? ` stroke-dasharray="4 3.2"` : "";
    // pick side
    let side=0; const cross=p=>Math.sign((p.x-a.x)*uy*-1+(p.y-a.y)*ux);
    nbrs(a.id).filter(p=>p.id!==c.id).forEach(p=>side+=cross(p)); nbrs(c.id).filter(p=>p.id!==a.id).forEach(p=>side+=cross(p));
    if(b.side) side=b.side;
    if(vlabel(a)||vlabel(c)||side===0){ if(!b.side){ const o=3.2; return lineSVG(x1+nx*o,y1+ny*o,x2+nx*o,y2+ny*o)+lineSVG(x1-nx*o,y1-ny*o,x2-nx*o,y2-ny*o,dash); } }
    const s=Math.sign(side)||1, o=6.8, sh=.13*len;
    const ix1=a.x+ux*Math.max(t1,sh)+nx*o*s, iy1=a.y+uy*Math.max(t1,sh)+ny*o*s, ix2=c.x-ux*Math.max(t2,sh)+nx*o*s, iy2=c.y-uy*Math.max(t2,sh)+ny*o*s;
    return lineSVG(x1,y1,x2,y2)+lineSVG(ix1,iy1,ix2,iy2,dash);
  }
  return lineSVG(x1,y1,x2,y2);
}
function atomSVG(a){
  let s=""; const l=vlabel(a);
  if(l) s+=`<text x="${f1(a.x)}" y="${f1(a.y+FS*.36)}" text-anchor="middle" font-family="${FONT}" font-size="${FS}" fill="${INK}">${labelSpans(l)}</text>`;
  const d=decor(a);
  if(d.charge){ const ch=a.charge.replace("-","−"); const circ=a.circ;

  let best=cands[0],bs=-1; for(const t of cands){ const p={x:a.x+L*Math.cos(t),y:a.y+L*Math.sin(t)}; const c=Math.min(1e9,...S.atoms.filter(x=>x.id!==a.id).map(x=>dist(x,p))); if(c>bs){bs=c;best=t;} } return best;

stage.addEventListener("pointerdown",async e=>{

    if(tool==="charge") a.charge = a.charge===opt.charge ? "" : opt.charge;

    const dst=((x=>x&&{t:"atom",id:x.id})(nearAtom(p,11)))||((x=>x&&{t:"bond",id:x.id})(hitBond(p,7)))||{t:"pt",x:p.x,y:p.y};

function bondEnd(d=drag){ const o=d.from||d.start; const tgt=nearAtom(d.cur,12,d.from&&d.from.id); if(tgt) return {atom:tgt,x:tgt.x,y:tgt.y};

const KEY_EL={c:"",n:"N",o:"O",s:"S",p:"P",h:"H",f:"F",i:"I",l:"Cl",b:"Br"};
document.addEventListener("keydown",e=>{

  if(hoverP){ const a=nearAtom(hoverP,12); const k=e.key.toLowerCase();

    if(a&&(e.key==="+"||e.key==="-")){ snap(); a.charge= a.charge===e.key?"":e.key; changed(); return; }

});

  if(t==="b") h=`<h2>Bond</h2><div class="field"><label class="f" for="p-bond">Type</label><select id="p-bond">${[["1|plain","Single"],["2|plain","Double"],["3|plain","Triple"],["1|wedge","Wedge"],["1|hash","Hash"],["1|dash","Partial (forming or breaking)"],["2|partial2","Partial double"],["1|bold","Bold"]].map(([v,l])=>`<option value="${v}" ${v===o.order+"|"+o.style?"selected":""}>${l}</option>`).join("")}</select></div>
    <div class="row"><button class="btn" id="p-flip">Flip direction</button>${o.order===2?`<button class="btn" id="p-side">Move second line</button>`:""}</div>`;
  if(t==="e") h=`<h2>Electron arrow</h2><div class="field"><label class="f" for="p-head">Head</label><select id="p-head"><option value="full" ${o.head==="full"?"selected":""}>Electron pair (full head)</option><option value="half" ${o.head==="half"?"selected":""}>Single electron (fishhook)</option></select></div>
    ${colorRow(o.color)}<div class="row"><button class="btn" id="p-bendflip">Flip curve</button><button class="btn" id="p-reverse">Reverse</button></div><p style="margin-top:.6rem">Drag the round handle to change the curvature.</p>`;
  if(t==="r") h=`<h2>Reaction arrow</h2><div class="field"><label class="f" for="p-rtype">Type</label><select id="p-rtype">${[["forward","Forward →"],["equil","Equilibrium ⇌"],["resonance","Resonance ↔"],["retro","Retrosynthetic ⇒"],["dashed","Dashed"],["noreact","No reaction"]].map(([v,l])=>`<option value="${v}" ${o.type===v?"selected":""}>${l}</option>`).join("")}</select></div>
    <div class="field"><label class="f" for="p-above">Above</label><input type="text" id="p-above" value="${esc(o.above)}" placeholder="k_1, reagent"></div>
    <div class="field"><label class="f" for="p-below">Below</label><input type="text" id="p-below" value="${esc(o.below)}" placeholder="\\DeltaG^\\ddag = 14.8 kcal/mol"></div>${colorRow(o.color)}<p>Drag the round ends to change length or angle.</p>`;
  if(t==="t") h=`<h2>Text</h2><div class="field"><label class="f" for="p-text">Text</label><input type="text" id="p-text" value="${esc(o.text)}"></div>
    <div class="row"><div class="field"><label class="f" for="p-size">Size</label><input type="number" id="p-size" value="${o.size||18}" min="8" max="72"></div><div class="field"><label class="f" for="p-anchor">Align</label><select id="p-anchor"><option value="middle" ${o.anchor!=="start"?"selected":""}>Centre</option><option value="start" ${o.anchor==="start"?"selected":""}>Left</option></select></div></div>
    <div class="field"><label><input type="checkbox" id="p-bold" ${o.bold?"checked":""}> Bold</label> <label style="margin-left:.8rem"><input type="checkbox" id="p-italic" ${o.italic?"checked":""}> Italic</label></div>${colorRow(o.color)}
    <p>x^{sup}, x_{sub}, \\Delta, \\ddag, \\alpha, \\beta, \\to, \\pm</p>`;
  if(t==="k") h=`<h2>Transition state bracket</h2><div class="field"><label class="f" for="p-sup">Superscript</label><input type="text" id="p-sup" value="${esc(o.sup)}"></div>`;
  h+=`<div style="margin-top:.8rem"><button class="btn danger" id="p-del">Delete</button></div>`;
  side.innerHTML=h;
  const live=(id,fn,ev="input")=>{ const el=$(id); if(!el) return; let first=true; el.addEventListener(ev,()=>{ if(first){snap();first=false;} fn(el); render(); scheduleSave(); }); };
  live("#p-label",el=>o.label=el.value.trim()); live("#p-charge",el=>o.charge=el.value,"change"); live("#p-lp",el=>o.lp=+el.value,"change"); live("#p-circ",el=>o.circ=el.checked,"change"); live("#p-rad",el=>o.rad=el.checked,"change");
  live("#p-bond",el=>{ const [ord,st]=el.value.split("|"); o.order=+ord; o.style=st; },"change");
  live("#p-head",el=>o.head=el.value,"change"); live("#p-rtype",el=>o.type=el.value,"change"); live("#p-above",el=>o.above=el.value); live("#p-below",el=>o.below=el.value);
  live("#p-text",el=>o.text=el.value); live("#p-size",el=>o.size=Math.max(8,+el.value||18)); live("#p-anchor",el=>o.anchor=el.value,"change"); live("#p-bold",el=>o.bold=el.checked,"change"); live("#p-italic",el=>o.italic=el.checked,"change"); live("#p-sup",el=>o.sup=el.value);
  side.querySelectorAll("[data-pc]").forEach(b=>b.onclick=()=>{ snap(); o.color=b.dataset.pc; changed(); });
  const bt=(id,fn)=>{ const el=$(id); if(el) el.onclick=()=>{ snap(); fn(); changed(); }; };
  bt("#p-flip",()=>{ const x=o.a; o.a=o.b; o.b=x; }); bt("#p-side",()=>{ o.side = o.side===1?-1 : o.side===-1?0 : 1; });
  bt("#p-bendflip",()=>o.bend=-o.bend); bt("#p-reverse",()=>{ if(o.to.t==="pt"){ toast("Reverse needs an atom or bond at both ends"); return; } const x=o.from; o.from=o.to; o.to=x.t==="lp"?{t:"atom",id:x.id}:x; o.bend=-o.bend; });
  $("#p-del").onclick=deleteSel;
}

/* ================================================================
   Schemes: list, autosave
================================================================ */
let index={}, curId=null, saveT=null;
function changed(){ render(); renderSide(); updUndo(); scheduleSave(); }
function scheduleSave(){ $("#sync").textContent="Saving…"; clearTimeout(saveT); saveT=setTimeout(saveNow,900); }
async function saveNow(){ if(!curId) return; index[curId].updated=Date.now(); await Promise.all([Store.set("scheme_"+curId,S),Store.set("index",index)]); $("#sync").textContent="Saved in this browser"; }
function renderIndex(){ const ids=Object.keys(index).sort((a,b)=>index[b].updated-index[a].updated);
  $("#scheme-sel").innerHTML=ids.map(id=>`<option value="${id}" ${id===curId?"selected":""}>${esc(index[id].name)}</option>`).join(""); }
async function openScheme(id){ curId=id; S=await Store.get("scheme_"+id,emptyScheme()); ["atoms","bonds","arrows","rxns","texts","brackets"].forEach(k=>S[k]=S[k]||[]); hist=[];fut=[]; sel.clear(); pending=null; render(); renderSide(); updUndo(); renderIndex(); try{localStorage.setItem("mech.last",id);}catch{} }
async function newScheme(name){ const id=uid(); index[id]={name,updated:Date.now()}; curId=id; S=emptyScheme(); hist=[];fut=[]; sel.clear(); await Store.set("scheme_"+id,S); await Store.set("index",index); renderIndex(); render(); renderSide(); updUndo(); }
$("#scheme-sel").onchange=async e=>{ clearTimeout(saveT); await saveNow(); openScheme(e.target.value); };
$("#b-new").onclick=async()=>{ const n=await ask("New scheme name","Mechanism "+(Object.keys(index).length+1)); if(!n) return; clearTimeout(saveT); await saveNow(); await newScheme(n.trim()); };
$("#b-rename").onclick=async()=>{ const n=await ask("Rename scheme",index[curId].name); if(!n) return; index[curId].name=n.trim(); await Store.set("index",index); renderIndex(); };
$("#b-dup").onclick=async()=>{ clearTimeout(saveT); await saveNow(); const copy=JSON.parse(JSON.stringify(S)); const id=uid(); index[id]={name:index[curId].name+" copy",updated:Date.now()}; await Store.set("scheme_"+id,copy); await Store.set("index",index); openScheme(id); toast("Duplicated"); };
$("#b-del").onclick=async()=>{ if(!confirm(`Delete "${index[curId].name}"? This cannot be undone.`)) return; const id=curId; delete index[id]; await Store.del("scheme_"+id); await Store.set("index",index);
  const rest=Object.keys(index); if(rest.length) openScheme(rest[0]); else newScheme("Mechanism 1"); };
$("#b-undo").onclick=undo; $("#b-redo").onclick=redo;
$("#z-in").onclick=()=>setZoom(zoom*1.25); $("#z-out").onclick=()=>setZoom(zoom/1.25); $("#z-fit").onclick=()=>setZoom(1);

/* ================================================================
   Export: cropped SVG and 600 dpi PNG
================================================================ */
function exportSVG(){
  const g=document.createElementNS("http://www.w3.org/2000/svg","g"); g.innerHTML=drawing(); $("#overlay").appendChild(g);
  const bb=g.getBBox(); g.remove();
  if(!bb.width){ toast("Nothing to export yet"); return null; }
  const m=12, x=bb.x-m, y=bb.y-m, w=bb.width+2*m, h=bb.height+2*m;
  const svg=`<svg xmlns="http://www.w3.org/2000/svg" width="${w.toFixed(1)}" height="${h.toFixed(1)}" viewBox="${x.toFixed(1)} ${y.toFixed(1)} ${w.toFixed(1)} ${h.toFixed(1)}"><rect x="${x.toFixed(1)}" y="${y.toFixed(1)}" width="${w.toFixed(1)}" height="${h.toFixed(1)}" fill="#FFFFFF"/>${drawing()}</svg>`;
  return {svg,w,h};
}
const CRC=(()=>{ const t=new Uint32Array(256); for(let n=0;n<256;n++){ let c=n; for(let k=0;k<8;k++) c=c&1?0xEDB88320^(c>>>1):c>>>1; t[n]=c>>>0; } return b=>{ let c=0xFFFFFFFF; for(const x of b) c=t[(c^x)&255]^(c>>>8); return (c^0xFFFFFFFF)>>>0; }; })();
function withDPI(buf,dpi){ // insert a pHYs chunk after IHDR so apps read 600 dpi
  const ppm=Math.round(dpi/0.0254); const data=new Uint8Array(9); const dv=new DataView(data.buffer); dv.setUint32(0,ppm); dv.setUint32(4,ppm); data[8]=1;
  const type=new TextEncoder().encode("pHYs"); const chunk=new Uint8Array(21); const cv=new DataView(chunk.buffer); cv.setUint32(0,9); chunk.set(type,4); chunk.set(data,8);
  const crcIn=new Uint8Array(13); crcIn.set(type,0); crcIn.set(data,4); cv.setUint32(17,CRC(crcIn));
  const src=new Uint8Array(buf); const cut=33; const out=new Uint8Array(src.length+21); out.set(src.slice(0,cut),0); out.set(chunk,cut); out.set(src.slice(cut),cut+21); return out;
}
function saveFile(name,data,mime){
  const blob=data instanceof Blob?data:new Blob([data],{type:mime}); const a=document.createElement("a"); a.href=URL.createObjectURL(blob); a.download=name; document.body.appendChild(a); a.click(); setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove();},1000);
}
const fname=()=> (index[curId]?.name||"scheme").replace(/[^\w\- ]+/g,"").trim().replace(/\s+/g,"_")||"scheme";
$("#b-svg").onclick=()=>{ const r=exportSVG(); if(r) saveFile(fname()+".svg",r.svg,"image/svg+xml"); };
$("#b-png").onclick=()=>{ const r=exportSVG(); if(!r) return; const scale=600/96; const img=new Image();
  img.onload=()=>{ const c=document.createElement("canvas"); c.width=Math.round(r.w*scale); c.height=Math.round(r.h*scale); const ctx=c.getContext("2d"); ctx.fillStyle="#fff"; ctx.fillRect(0,0,c.width,c.height); ctx.drawImage(img,0,0,c.width,c.height);
    c.toBlob(async b=>{ const out=withDPI(await b.arrayBuffer(),600); saveFile(fname()+"_600dpi.png",new Blob([out],{type:"image/png"}),"image/png"); },"image/png"); };
  img.onerror=()=>toast("PNG export failed; try SVG");
  img.src="data:image/svg+xml;charset=utf-8,"+encodeURIComponent(r.svg); };

/* ================================================================
   Boot
================================================================ */
setZoom(window.innerWidth<700?.8:1); renderTools(); render(); renderSide(); updUndo();
(async()=>{
  index=await Store.get("index",{}); let last=null; try{last=localStorage.getItem("mech.last");}catch{}
  const ids=Object.keys(index);
  if(!ids.length) await newScheme("Mechanism 1"); else await openScheme(index[last]?last:ids.sort((a,b)=>index[b].updated-index[a].updated)[0]);
  $("#sync").textContent="Saved in this browser";
})();
</script>
