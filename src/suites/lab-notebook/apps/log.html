<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<script src="suite-theme.js" data-suite-theme></script>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, interactive-widget=resizes-content">
<meta name="theme-color" content="#5A4360">
<meta name="color-scheme" content="dark">
<title>Research log</title>
<style>
:root{
  color-scheme:dark;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);
  --bg:var(--t-bg,#14161B);--surface:var(--t-surface,#1C1F26);--raised:var(--t-raised,#242832);--ink:var(--t-ink,#E7E9EE);--muted:var(--t-muted,#8B919E);--faint:var(--t-faint,#2C303A);
  --accent:var(--t-accent,#9DB2FF);--danger:var(--t-red,#F28B82);--gold:var(--t-gold,#E6C170);--green:var(--t-green,#7DCB9C);--violet:var(--t-violet,#C3A6F0);--pink:var(--t-pink,#EE93AF);--teal:var(--t-teal,#8CC3CC);
  --font:"Manrope",system-ui,Roboto,"Segoe UI",sans-serif;
  --mono:"JetBrains Mono",ui-monospace,"Roboto Mono",Menlo,Consolas,monospace;
}
html{height:100%;scroll-padding-top:env(safe-area-inset-top,0px)}
*,*::before,*::after{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;min-height:100%;background:var(--bg);color:var(--ink);font-family:var(--font);font-size:16px;line-height:1.45}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer;background:none;border:0}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:6px}
.wrap{max-width:760px;margin:0 auto;padding:16px 16px calc(110px + env(safe-area-inset-bottom,0px))}
header{display:flex;align-items:center;justify-content:space-between;gap:8px;margin:4px 0 16px}
h1{font-size:1.5rem;font-weight:700;margin:0;letter-spacing:-.01em}
h1 .n{font-weight:400;color:var(--muted);font-size:1rem;margin-left:6px}
.hbtns{display:flex;gap:4px;position:relative}
.ibtn{min-width:44px;min-height:44px;border-radius:12px;color:var(--muted);display:grid;place-items:center;font-size:1.1rem}
.ibtn:active{background:var(--surface)}
.menu{position:absolute;right:0;top:48px;background:var(--raised);border-radius:12px;padding:6px;min-width:200px;display:none;z-index:5;box-shadow:0 8px 24px var(--t-shadow,rgba(0,0,0,.4))}
.menu.open{display:block}
.menu button{display:block;width:100%;text-align:left;padding:12px;border-radius:8px}
.menu button:active{background:var(--faint)}
.search{width:100%;background:var(--surface);border:0;border-radius:12px;padding:12px 14px;min-height:48px}
.search::placeholder{color:var(--muted)}
.chips{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;margin:10px -16px 0;padding:0 16px}
.chips::-webkit-scrollbar{display:none}
.chip{flex:0 0 auto;border-radius:999px;padding:8px 14px;min-height:38px;color:var(--muted);background:var(--surface);white-space:nowrap;display:inline-flex;align-items:center;gap:6px}
.chip .c{opacity:.7}
.chip .dot{width:8px;height:8px;border-radius:50%;background:var(--cc)}
.chip[aria-pressed="true"]{background:var(--ink);color:var(--bg)}
.bar{display:flex;justify-content:space-between;align-items:center;margin:14px 2px 8px;color:var(--muted);font-size:.85rem;gap:8px}
.bar select{background:transparent;border:0;color:var(--muted);padding:6px 0;min-height:40px;max-width:60%}
.list{display:flex;flex-direction:column;gap:8px}
.card{background:var(--surface);border-radius:14px;padding:14px 10px 8px 16px}
.card h3{font-size:1rem;font-weight:500;margin:0;overflow-wrap:anywhere}
.top{display:flex;justify-content:space-between;gap:10px;align-items:flex-start}
.tags{display:flex;flex-wrap:wrap;gap:4px 12px;margin-top:4px;font-size:.82rem;color:var(--muted)}
.pill{flex:0 0 auto;font-size:.75rem;font-weight:700;padding:3px 10px;border-radius:999px;color:var(--cc);background:color-mix(in srgb,var(--cc) 16%,transparent)}
.note{font-size:.88rem;color:var(--muted);margin-top:6px;white-space:pre-wrap;overflow-wrap:anywhere}
.acts{display:flex;justify-content:flex-end;margin-top:2px;flex-wrap:wrap}
.acts .ibtn{min-width:40px;min-height:40px;font-size:.95rem}
.acts .txt{font-size:.85rem;padding:0 10px;color:var(--accent)}
.star-on{color:var(--gold)}
.empty{color:var(--muted);text-align:center;padding:48px 16px}
.fab{position:fixed;right:20px;bottom:calc(20px + env(safe-area-inset-bottom,0px));width:60px;height:60px;border-radius:18px;background:var(--accent);color:var(--t-on-accent,#14161B);font-size:1.8rem;box-shadow:0 6px 18px var(--t-shadow,rgba(0,0,0,.45));z-index:4}
dialog{border:0;padding:0;background:var(--raised);color:var(--ink);width:100%;max-width:560px;margin:auto auto 0;border-radius:20px 20px 0 0;max-height:92vh}
@media (min-width:600px){dialog{margin:auto;border-radius:20px}}
dialog::backdrop{background:var(--t-backdrop,rgba(0,0,0,.6))}
.sheet{padding:20px 20px calc(20px + env(safe-area-inset-bottom,0px));display:flex;flex-direction:column;gap:12px}
.sheet h2{margin:0;font-size:1.15rem;font-weight:700}
.sheet h4{margin:6px 0 -4px;font-size:.8rem;font-weight:500;color:var(--accent)}
.sheet label{display:flex;flex-direction:column;gap:6px;font-size:.85rem;color:var(--muted);min-width:0}
.sheet input,.sheet select,.sheet textarea{background:var(--surface);border:0;border-radius:12px;padding:12px;color:var(--ink);min-height:48px;width:100%;min-width:0}
.sheet textarea{min-height:90px;resize:vertical}
.mono{font-family:var(--mono)!important;font-size:.88rem!important}
.row{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.row3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px}
.check{flex-direction:row!important;align-items:center;gap:10px!important;color:var(--ink)!important;font-size:1rem!important}
.check input{min-height:auto!important;width:20px!important;height:20px;accent-color:var(--accent)}
.hint{font-size:.8rem;color:var(--danger);min-height:1em;margin:0}
.sbar{display:flex;justify-content:space-between;gap:8px;margin-top:4px}
.btn{border-radius:12px;padding:12px 16px;min-height:48px}
.btn.primary{background:var(--accent);color:var(--t-on-accent,#14161B);font-weight:700}
.btn.ghost{color:var(--muted)}
.btn.danger{color:var(--danger)}
.toast{position:fixed;left:50%;bottom:calc(96px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--raised);padding:10px 16px;border-radius:12px;font-size:.9rem;opacity:0;pointer-events:none;transition:opacity .2s;max-width:90vw;text-align:center;z-index:6}
.toast.show{opacity:1}
.sync{font-size:.8rem;color:var(--muted);text-align:center;margin-top:24px}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
.hidden{display:none!important}
.tabs{display:grid;grid-template-columns:repeat(3,1fr);border-bottom:1px solid var(--faint);margin:0 0 12px}
.tab{padding:12px 4px;color:var(--muted);font-weight:500;position:relative;min-height:48px}
.tab .c{font-size:.78rem;opacity:.8;margin-left:4px}
.tab[aria-selected="true"]{color:var(--ink)}
.tab[aria-selected="true"]::after{content:"";position:absolute;left:25%;right:25%;bottom:-1px;height:2px;background:var(--accent);border-radius:2px}
.day{margin-top:20px}
.day:first-child{margin-top:4px}
.dayhead{font-size:.85rem;font-weight:700;color:var(--muted);margin:0 2px 8px;display:flex;justify-content:space-between}
.entry{background:var(--surface);border-radius:14px;padding:12px 10px 6px 16px;box-shadow:inset 3px 0 0 var(--cc)}
.entry .body{white-space:pre-wrap;overflow-wrap:anywhere}
.entry code,.mtg code{font-family:var(--mono);font-size:.85em;background:var(--bg);padding:1px 5px;border-radius:5px}
.entry .meta{display:flex;flex-wrap:wrap;gap:4px 10px;align-items:center;margin-top:6px;font-size:.8rem;color:var(--muted)}
.entry .kind{color:var(--cc);font-weight:700}
.entry .proj{color:var(--accent)}
.mtitle{font-weight:700;font-size:1.02rem;overflow-wrap:anywhere}
.people{font-size:.82rem;color:var(--muted);margin-top:2px}
.msec{margin-top:10px}
.msec > span{display:block;font-size:.72rem;font-weight:700;letter-spacing:.04em;text-transform:uppercase;color:var(--muted);margin-bottom:3px}
.msec .txt{white-space:pre-wrap;overflow-wrap:anywhere;font-size:.95rem}
.more{color:var(--accent);font-size:.85rem;padding:4px 0;min-height:32px}
.clamp{display:-webkit-box;-webkit-line-clamp:4;-webkit-box-orient:vertical;overflow:hidden}
.act{display:flex;align-items:flex-start;gap:10px;padding:6px 0}
.act input{width:22px;height:22px;margin-top:1px;accent-color:var(--accent);flex:0 0 auto}
.act .at{flex:1;min-width:0;overflow-wrap:anywhere}
.act .am{display:flex;flex-wrap:wrap;gap:2px 10px;font-size:.78rem;color:var(--muted);margin-top:1px}
.act.done .at > div:first-child{text-decoration:line-through;color:var(--muted)}
.overdue{color:var(--danger)!important}
.soon{color:var(--gold)!important}
.kinds{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}
.kinds button{padding:11px 4px;border-radius:12px;background:var(--surface);color:var(--cc);font-weight:500;font-size:.9rem}
.kinds button[aria-pressed="true"]{background:color-mix(in srgb,var(--cc) 22%,var(--surface));outline:1px solid var(--cc)}
.filters2{display:flex;gap:8px;margin-top:10px}
.filters2 select{flex:1;background:var(--surface);border:0;border-radius:12px;padding:10px 12px;min-height:44px;color:var(--ink);min-width:0}
#fText{min-height:150px}
.arow{background:var(--surface);border-radius:12px;padding:8px;display:flex;flex-direction:column;gap:6px}
.arow .l2{display:grid;grid-template-columns:1fr 1fr 44px 44px;gap:6px;align-items:center}
.arow input[type="text"],.arow input[type="date"]{min-height:44px!important;padding:10px!important;background:var(--bg)!important}
.arow input[type="checkbox"]{width:22px;height:22px;justify-self:center;accent-color:var(--accent)}
.arow .x{color:var(--danger);min-height:44px}
.carry{background:color-mix(in srgb,var(--gold) 10%,var(--surface));border-radius:12px;padding:10px 12px}
.carry > b{display:block;font-size:.8rem;color:var(--gold);margin-bottom:4px}
.group{margin-top:18px}
.group:first-child{margin-top:4px}
.ghead{font-size:.85rem;font-weight:700;margin:0 2px 8px;display:flex;justify-content:space-between;color:var(--muted)}
.acard{background:var(--surface);border-radius:14px;padding:6px 12px}
.acard .src{color:var(--accent);cursor:pointer}
.linkbtn{color:var(--accent);min-height:40px;padding:0 4px;font-size:.9rem}
/* ---- Theme: dark with pink-to-blue accents ---- */
:root{
  --bg:var(--t-bg,#000000);--surface:var(--t-surface,#131316);--raised:var(--t-raised,#1D1D22);--ink:var(--t-ink,#F2F2F4);--muted:var(--t-muted,#9D9DA5);--faint:var(--t-faint,#28282E);
  --accent:var(--t-accent,#EBA8E4);--accent2:var(--t-accent2,#A7CBF4);
  --grad:linear-gradient(90deg,var(--t-grad1,#F0A8DC) 0%,var(--t-grad2,#C9B6EF) 50%,var(--t-grad3,#A6CCF5) 100%);
  --danger:var(--t-danger,#EF5A50);--star:var(--t-accent,#EBA8E4);--pinbg:var(--t-pinbg,#2A2413);
  --font:Roboto,"Google Sans",system-ui,-apple-system,"Segoe UI",sans-serif;
  --mono:"Roboto Mono","Droid Sans Mono",ui-monospace,Menlo,Consolas,monospace;
}
body{background-color:var(--t-bg,#000);background-image:linear-gradient(172deg,var(--t-head,#5A4360) 0%,var(--t-head2,#352C3F) 90px,var(--t-head3,#15121A) 210px,var(--t-bg,#000) 320px);background-repeat:no-repeat;background-size:100% 340px}
h1{font-weight:500;font-size:1.85rem;letter-spacing:0}
h1 .n{font-size:1rem}
.search{background:var(--t-field,#0E0E11);border:1.5px solid var(--t-line,#2E2E35);border-radius:999px}
.search:focus{border-color:var(--t-focus,#9C8BC0);outline:none}
.chip{background:var(--t-bg,#000);border:1.5px solid var(--t-edge,#3B3B43);color:var(--ink)}
.chip[aria-pressed="true"]{background:var(--grad);border-color:transparent;color:var(--t-on-grad,#17161C);font-weight:500}
.chip.add{color:var(--accent)}
.tab[aria-selected="true"]::after{background:var(--grad)}
.btn.primary,.add{background:var(--grad)!important;color:var(--t-on-grad,#17161C)!important}
.fab{background:var(--t-fab,#17171C);border:1px solid var(--t-edge,#3A3A42);color:var(--t-fab-ink,#D9B9EE);box-shadow:0 8px 22px var(--t-shadow,rgba(0,0,0,.7))}
.star-on{color:var(--star)!important}
.card:has(.star-on),.paper:has(.star-on),.entry:has(.star-on){background:var(--pinbg)}
.menu{background:var(--raised);border:1px solid var(--t-line,#2E2E35)}
dialog{background:var(--raised)}
.sheet input,.sheet select,.sheet textarea,.dlg input,.dlg textarea,.dlg select{background:var(--t-field,#0F0F12)}
.toast{background:var(--t-raised2,#26262C);color:var(--ink)}
.doi{color:var(--accent2)}
.sync{color:var(--t-dim,#6F6F77)}
.seg button[aria-pressed="true"]{background:var(--grad);color:var(--t-on-grad,#17161C)}
.topbar{background:linear-gradient(172deg,var(--t-head,#5A4360) 0%,var(--t-headbar,#2A2432) 100%)}
.toolbar{background:var(--t-bg,#000)}
.bk.hidden{display:none!important}
.bk{display:flex;align-items:center;gap:8px;background:var(--pinbg,var(--t-pinbg,#2A2413));border-radius:14px;padding:10px 8px 10px 14px;margin:0 0 14px}
.bk .bkt{flex:1;min-width:0;font-size:.9rem;line-height:1.3}
.bk .bkt b{display:block;font-weight:500}
.bk .bkt span{color:var(--muted);font-size:.8rem}
.bk .bkgo{background:var(--grad);color:var(--t-on-grad,#17161C);border-radius:999px;padding:10px 14px;min-height:44px;font-weight:500;white-space:nowrap}
.bk .bkno{color:var(--muted);padding:10px 8px;min-height:44px}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>Research log<span class="n" id="total"></span></h1>
    <div class="hbtns">
      <button class="ibtn" id="moreBtn" aria-label="More options" aria-expanded="false">⋮</button>
      <div class="menu" id="menu" role="menu">
        <button role="menuitem" id="mdBtn">Export view as Markdown</button>
        <button role="menuitem" id="exportBtn">Export backup</button>
        <button role="menuitem" id="importBtn">Import backup</button>
      </div>
      <input type="file" id="importFile" accept="application/json,.json" hidden>
    </div>
  </header>

  <nav class="tabs" role="tablist" id="tabs"></nav>

  <label class="sr" for="search">Search</label>
  <input class="search" id="search" type="search" placeholder="Search entries, meetings, people, #tags">

  <div id="logFilters">
    <div class="chips" id="chips"></div>
    <div class="filters2">
      <label class="sr" for="kindF">Entry type</label><select id="kindF"></select>
      <label class="sr" for="rangeF">Time range</label>
      <select id="rangeF"><option value="">Any time</option><option value="7">Last 7 days</option><option value="30">Last 30 days</option><option value="90">Last 3 months</option><option value="365">Last year</option></select>
    </div>
  </div>
  <div id="actFilters" class="hidden">
    <div class="chips" id="ownerChips"></div>
  </div>

  <div class="bar"><span id="count"></span><button class="linkbtn hidden" id="showDone"></button></div>
  <main id="list"></main>
  <p class="sync" id="sync"></p>
</div>
<button class="fab" id="fab" aria-label="New entry">+</button>
<datalist id="dlProj"></datalist>
<datalist id="dlPeople"></datalist>
<datalist id="dlTitles"></datalist>

<!-- quick entry -->
<dialog id="dlg">
  <form class="sheet" id="form" autocomplete="off" novalidate>
    <h2 id="dTitle">New entry</h2>
    <div class="kinds" id="kinds"></div>
    <label>What happened<textarea id="fText" maxlength="6000" placeholder="Tried a larger QM region; barrier dropped 3 kcal/mol. Use #tags and `code`."></textarea></label>
    <div class="row">
      <label>Project<input id="fProj" list="dlProj" maxlength="60"></label>
      <label>Date<input id="fDate" type="date"></label>
    </div>
    <label class="check"><input type="checkbox" id="fPin"> Pin as important</label>
    <p class="hint" id="hint"></p>
    <div class="sbar">
      <button type="button" class="btn danger" id="delBtn">Delete</button>
      <span style="display:flex;gap:6px;margin-left:auto">
        <button type="button" class="btn ghost" data-close>Cancel</button>
        <button type="submit" class="btn primary">Save</button>
      </span>
    </div>
  </form>
</dialog>

<!-- meeting -->
<dialog id="mdlg">
  <form class="sheet" id="mform" autocomplete="off" novalidate>
    <h2 id="mTitle">New meeting</h2>
    <label>Title<input id="mName" list="dlTitles" maxlength="120" placeholder="Weekly group meeting"></label>
    <div class="row">
      <label>Type<select id="mType"></select></label>
      <label>Date<input id="mDate" type="date"></label>
    </div>
    <label><span id="mPeopleLabel">People</span><input id="mPeople" list="dlPeople" maxlength="400" placeholder="Comma separated"></label>
    <label>Project<input id="mProj" list="dlProj" maxlength="60"></label>
    <div id="mCarry"></div>
    <label>Notes<textarea id="mNotes" maxlength="12000" placeholder="Discussion, results shown, questions raised. #tags and `code` work here."></textarea></label>
    <label>Decisions<textarea id="mDec" maxlength="4000" style="min-height:70px" placeholder="What was agreed"></textarea></label>
    <h4>Action items</h4>
    <div id="mActs" style="display:flex;flex-direction:column;gap:8px"></div>
    <button type="button" class="btn" id="mAddAct" style="background:var(--surface);color:var(--accent)">+ Add action item</button>
    <label class="check"><input type="checkbox" id="mPin"> Pin as important</label>
    <p class="hint" id="mHint"></p>
    <div class="sbar">
      <button type="button" class="btn danger" id="mDel">Delete</button>
      <span style="display:flex;gap:6px;margin-left:auto">
        <button type="button" class="btn ghost" data-close>Cancel</button>
        <button type="submit" class="btn primary">Save</button>
      </span>
    </div>
  </form>
</dialog>

<!-- choose what to add -->
<dialog id="pick">
  <div class="sheet">
    <h2>Add</h2>
    <button class="btn primary" id="pickEntry">Log entry</button>
    <button class="btn" id="pickMeeting" style="background:var(--surface)">Meeting notes</button>
  </div>
</dialog>

<div class="toast" id="toast" role="status" aria-live="polite"></div>
<script>
const $=s=>document.querySelector(s);
const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,7);
const esc=s=>String(s??"").replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[m]));
const num=v=>{const n=parseFloat(v);return isFinite(n)?n:null};
const stamp=()=>new Date().toISOString().slice(0,10);
let _tt=null;
function toast(t){const el=$("#toast");el.textContent=t;el.classList.add("show");clearTimeout(_tt);_tt=setTimeout(()=>el.classList.remove("show"),2400)}
async function copyText(t,msg){
  try{await navigator.clipboard.writeText(t);toast(msg||"Copied")}
  catch(_){const a=document.createElement("textarea");a.value=t;document.body.appendChild(a);a.select();
    try{document.execCommand("copy");toast(msg||"Copied")}catch(__){toast("Copy not available")}a.remove()}
}
function storageWorks(){try{const k="__probe"+Math.random();localStorage.setItem(k,"1");localStorage.removeItem(k);return true}catch(_){return false}}
function saveFile(filename,data){
  try{
    const ext=(filename.split(".").pop()||"").toLowerCase();
    const type={json:"application/json",csv:"text/csv",md:"text/markdown",py:"text/x-python",sh:"text/x-shellscript",png:"image/png"}[ext]||"text/plain";
    const blob=data instanceof Blob?data:new Blob([data],{type:type+";charset=utf-8"});
    const url=URL.createObjectURL(blob);
    const a=document.createElement("a");a.href=url;a.download=filename;a.style.display="none";
    document.body.appendChild(a);a.click();a.remove();
    setTimeout(()=>URL.revokeObjectURL(url),10000);
    toast("Saved to Downloads");if(/\.json$/i.test(filename)&&window.__markBackup)window.__markBackup();
  }catch(_){toast("Couldn't save the file")}
}
function setupMenu(){
  const menu=$("#menu"),btn=$("#moreBtn");
  const close=()=>{menu.classList.remove("open");btn.setAttribute("aria-expanded","false")};
  btn.addEventListener("click",e=>{e.stopPropagation();btn.setAttribute("aria-expanded",menu.classList.toggle("open"))});
  document.addEventListener("click",e=>{if(!e.target.closest("#menu"))close()});
  menu.addEventListener("click",close);
  document.querySelectorAll("[data-close]").forEach(b=>b.addEventListener("click",()=>b.closest("dialog").close()));
  document.querySelectorAll("dialog").forEach(d=>d.addEventListener("click",e=>{if(e.target===d)d.close()}));
}
// Store: kept in this browser's local storage only.
function makeStore(lsKey,docName,listKeys,onChange){
  const S={data:null};
  try{const r=localStorage.getItem(lsKey);S.data=r?JSON.parse(r):null}catch(_){}
  if(!S.data||typeof S.data!=="object") S.data={};
  listKeys.forEach(k=>{if(!Array.isArray(S.data[k]))S.data[k]=[]});
  S.saveLocal=()=>{try{localStorage.setItem(lsKey,JSON.stringify(S.data))}catch(_){toast("Couldn't save. Storage is full or blocked; export a backup.")}};
  S.persist=()=>S.saveLocal();
  S.connect=()=>{
    $("#sync").textContent=storageWorks()?(localStorage.getItem("sync.github")?"Saved on this device and synced to your other devices.":"Saved on this device. Turn on sync in the control center, or export a backup now and then."):"Storage is blocked here, so changes will be lost when you close this page.";
  };
  return S;
}

(function(){
  const KINDS=[
    {id:"note",name:"Note",c:"--muted"},{id:"result",name:"Result",c:"--green"},{id:"problem",name:"Problem",c:"--danger"},
    {id:"fix",name:"Fix",c:"--teal"},{id:"decision",name:"Decision",c:"--gold"},{id:"idea",name:"Idea",c:"--violet"}
  ];
  const MEETING={id:"meeting",name:"Meeting",c:"--accent"};
  const MTYPES=[["group","Group meeting"],["supervision","Supervision"],["collab","Collaboration"],["seminar","Seminar or talk"],["oneone","One-to-one"],["other","Other"]];
  let tab="log",proj="",kind="",range="",query="",editing=null,fKind="note",ownerF="me",showDone=false;
  let mEditing=null,mActs=[],mCarryIds=[];
  const store=makeStore("researchlog.v1","log",["entries"],render);
  const D=()=>store.data;
  const allKinds=[...KINDS,MEETING];
  const kc=k=>`var(${(allKinds.find(x=>x.id===k)||KINDS[0]).c})`;
  const kn=k=>(allKinds.find(x=>x.id===k)||KINDS[0]).name;
  const mtn=t=>(MTYPES.find(x=>x[0]===t)||MTYPES[MTYPES.length-1])[1];
  const isM=e=>e.kind==="meeting";
  const fmt=t=>esc(t).replace(/`([^`\n]+)`/g,"<code>$1</code>").replace(/(^|\s)#([\w\-/.]+)/g,'$1<span style="color:var(--accent)">#$2</span>');
  function localDate(ms){const d=new Date(ms);d.setMinutes(d.getMinutes()-d.getTimezoneOffset());return d.toISOString().slice(0,10)}
  const localToday=()=>localDate(Date.now());
  const shortDate=d=>new Date(d+"T12:00").toLocaleDateString("en-GB",{day:"numeric",month:"short"});
  const dayLabel=d=>{
    if(d===localToday()) return "Today"; if(d===localDate(Date.now()-864e5)) return "Yesterday";
    return new Date(d+"T12:00").toLocaleDateString("en-GB",{weekday:"short",day:"numeric",month:"short",year:"numeric"});
  };
  /* "me" in action owners: blank, me/myself/eu/yo, or a name set in the control center (stored as suite.me) */
  const MY_NAMES=(()=>{try{return (localStorage.getItem("suite.me")||"").split(/[,;]/).map(s=>s.trim().toLowerCase()).filter(Boolean)}catch(_){return []}})();
  const isMe=o=>!o||/^(me|myself|eu|yo)$/i.test(o.trim())||MY_NAMES.includes(o.trim().toLowerCase());
  function dueState(a){
    if(a.done||!a.due) return "";
    const t=localToday(); if(a.due<t) return "overdue";
    const soon=localDate(Date.now()+3*864e5); return a.due<=soon?"soon":"";
  }
  const dueLabel=a=>{if(!a.due)return"";const s=dueState(a);return s==="overdue"?`overdue, ${shortDate(a.due)}`:(a.due===localToday()?"due today":`due ${shortDate(a.due)}`)};
  const allActions=()=>D().entries.filter(isM).flatMap(m=>(m.actions||[]).map(a=>({a,m})));

  $("#kindF").innerHTML=`<option value="">All types</option>`+allKinds.map(k=>`<option value="${k.id}">${k.name}${k.id==="meeting"?"s":""}</option>`).join("");
  $("#mType").innerHTML=MTYPES.map(t=>`<option value="${t[0]}">${t[1]}</option>`).join("");

  // ---------- filtering ----------
  function haystack(e){
    return isM(e)?[e.title,mtn(e.mtype),(e.people||[]).join(" "),e.text,e.decisions,(e.actions||[]).map(a=>a.text+" "+(a.owner||"")).join(" "),e.proj].join(" ")
      :(e.text+" "+(e.proj||"")+" "+kn(e.kind));
  }
  function visible(e){
    if(tab==="meetings"&&!isM(e)) return false;
    if(proj==="__pin"){ if(!e.pin) return false; }
    else if(proj&&e.proj!==proj) return false;
    if(tab==="log"&&kind&&e.kind!==kind) return false;
    if(range){const lim=localDate(Date.now()-range*864e5); if(e.date<lim) return false}
    if(!query) return true;
    return haystack(e).toLowerCase().includes(query);
  }

  // ---------- rendering ----------
  function renderTabs(){
    const open=allActions().filter(x=>!x.a.done).length;
    const nm=D().entries.filter(isM).length;
    $("#tabs").innerHTML=[["log","Log",D().entries.length],["meetings","Meetings",nm],["actions","Actions",open]]
      .map(([id,n,c])=>`<button class="tab" role="tab" data-tab="${id}" aria-selected="${tab===id}">${n}${c?`<span class="c">${c}</span>`:""}</button>`).join("");
  }
  function refreshLists(){
    const E=D().entries;
    const projects=[...new Set(E.map(e=>e.proj).filter(Boolean))].sort((a,b)=>a.localeCompare(b));
    $("#dlProj").innerHTML=projects.map(p=>`<option>${esc(p)}</option>`).join("");
    const people=new Set(); E.filter(isM).forEach(m=>{(m.people||[]).forEach(p=>people.add(p));(m.actions||[]).forEach(a=>{if(a.owner)people.add(a.owner)})});
    people.add("Me");
    $("#dlPeople").innerHTML=[...people].sort((a,b)=>a.localeCompare(b)).map(p=>`<option>${esc(p)}</option>`).join("");
    $("#dlTitles").innerHTML=[...new Set(E.filter(isM).map(m=>m.title))].sort().map(t=>`<option>${esc(t)}</option>`).join("");
    return projects;
  }
  function render(){
    const projects=refreshLists();
    if(proj&&proj!=="__pin"&&!projects.includes(proj)) proj="";
    const E=D().entries;
    $("#total").textContent=E.length||"";
    renderTabs();
    $("#logFilters").classList.toggle("hidden",tab==="actions");
    $("#actFilters").classList.toggle("hidden",tab!=="actions");
    $("#kindF").parentElement.querySelector("#kindF").classList.toggle("hidden",tab!=="log");
    $("#showDone").classList.toggle("hidden",tab!=="actions");
    $("#fab").setAttribute("aria-label",tab==="log"?"Add":"New meeting");
    if(tab==="actions"){renderActions();return}
    const pool=tab==="meetings"?E.filter(isM):E;
    $("#chips").innerHTML=[`<button class="chip" data-f="" aria-pressed="${!proj}">All<span class="c">${pool.length}</span></button>`,
      `<button class="chip" data-f="__pin" aria-pressed="${proj==="__pin"}">📌 Pinned<span class="c">${pool.filter(e=>e.pin).length}</span></button>`]
      .concat(projects.map(p=>`<button class="chip" data-f="${esc(p)}" aria-pressed="${proj===p}">${esc(p)}<span class="c">${pool.filter(e=>e.proj===p).length}</span></button>`)).join("");
    const vis=E.filter(visible).sort((a,b)=>b.date.localeCompare(a.date)||b.added-a.added);
    const noun=tab==="meetings"?["meeting","meetings"]:["entry","entries"];
    $("#count").textContent=`${vis.length} ${vis.length===1?noun[0]:noun[1]}`;
    if(!vis.length){
      $("#list").innerHTML=`<div class="empty">${E.length&&(tab==="log"||E.some(isM))?"Nothing matches.":tab==="meetings"?"Tap + to take notes in your next meeting.":"Tap + to write your first entry or meeting notes."}</div>`;
      return;
    }
    const days=[...new Set(vis.map(e=>e.date))];
    $("#list").innerHTML=days.map(d=>{
      const es=vis.filter(e=>e.date===d);
      return `<section class="day"><div class="dayhead"><span>${dayLabel(d)}</span><span>${es.length}</span></div>
        <div class="list">${es.map(e=>isM(e)?meetingCard(e):entryCard(e)).join("")}</div></section>`;
    }).join("");
  }
  function pinEdit(e){
    return `<span style="margin-left:auto;display:flex">
      ${isM(e)?`<button class="ibtn" data-act="follow" aria-label="Follow-up meeting" title="Follow-up meeting" style="min-width:40px;min-height:40px">↻</button>`:""}
      <button class="ibtn ${e.pin?"star-on":""}" data-act="pin" aria-label="${e.pin?"Unpin":"Pin"}" style="min-width:40px;min-height:40px">${e.pin?"📌":"⚲"}</button>
      <button class="ibtn" data-act="edit" aria-label="Edit" style="min-width:40px;min-height:40px">✎</button></span>`;
  }
  function entryCard(e){
    return `<article class="entry" data-id="${e.id}" style="--cc:${kc(e.kind)}">
      <div class="body">${fmt(e.text)}</div>
      <div class="meta"><span class="kind">${kn(e.kind)}</span>${e.proj?`<span class="proj">${esc(e.proj)}</span>`:""}${pinEdit(e)}</div>
    </article>`;
  }
  function actionRow(a,m,showSrc){
    const st=dueState(a);
    return `<label class="act ${a.done?"done":""}"><input type="checkbox" data-aid="${a.id}" data-mid="${m.id}" ${a.done?"checked":""} aria-label="Done">
      <div class="at"><div>${fmt(a.text)}</div><div class="am">${a.owner?`<span>${esc(a.owner)}</span>`:""}${a.due?`<span class="${st}">${dueLabel(a)}</span>`:""}
      ${showSrc?`<span class="src" data-open="${m.id}">${esc(m.title)}, ${shortDate(m.date)}</span>`:""}</div></div></label>`;
  }
  function meetingCard(m){
    const long=(m.text||"").length>320||(m.text||"").split("\n").length>5;
    const acts=m.actions||[], open=acts.filter(a=>!a.done).length;
    return `<article class="entry mtg" data-id="${m.id}" style="--cc:${kc("meeting")}">
      <div class="mtitle">${esc(m.title)}</div>
      ${(m.people||[]).length?`<div class="people">${m.mtype==="seminar"?"Speaker: ":""}${esc(m.people.join(", "))}</div>`:""}
      ${m.text?`<div class="msec"><span>Notes</span><div class="txt ${long?"clamp":""}">${fmt(m.text)}</div>${long?`<button class="more" data-act="more">Show more</button>`:""}</div>`:""}
      ${m.decisions?`<div class="msec"><span>Decisions</span><div class="txt">${fmt(m.decisions)}</div></div>`:""}
      ${acts.length?`<div class="msec"><span>Actions${open?` (${open} open)`:""}</span>${acts.map(a=>actionRow(a,m,false)).join("")}</div>`:""}
      <div class="meta"><span class="kind">${esc(mtn(m.mtype))}</span>${m.proj?`<span class="proj">${esc(m.proj)}</span>`:""}${pinEdit(m)}</div>
    </article>`;
  }
  function renderActions(){
    const all=allActions();
    const owners=[...new Set(all.map(x=>x.a.owner).filter(o=>o&&!isMe(o)))].sort((a,b)=>a.localeCompare(b));
    if(ownerF!=="me"&&ownerF!==""&&!owners.includes(ownerF)) ownerF="me";
    const cnt=f=>all.filter(x=>!x.a.done&&f(x)).length;
    $("#ownerChips").innerHTML=[`<button class="chip" data-o="me" aria-pressed="${ownerF==="me"}">Mine<span class="c">${cnt(x=>isMe(x.a.owner))}</span></button>`,
      `<button class="chip" data-o="" aria-pressed="${ownerF===""}">Everyone<span class="c">${cnt(()=>true)}</span></button>`]
      .concat(owners.map(o=>`<button class="chip" data-o="${esc(o)}" aria-pressed="${ownerF===o}">${esc(o)}<span class="c">${cnt(x=>x.a.owner===o)}</span></button>`)).join("");
    let vis=all.filter(x=>ownerF==="me"?isMe(x.a.owner):ownerF?x.a.owner===ownerF:true)
      .filter(x=>!query||(x.a.text+" "+(x.a.owner||"")+" "+x.m.title).toLowerCase().includes(query));
    const openL=vis.filter(x=>!x.a.done), doneL=vis.filter(x=>x.a.done);
    $("#showDone").textContent=doneL.length?(showDone?"Hide done":`Show done (${doneL.length})`):"";
    $("#count").textContent=`${openL.length} open`;
    const groups=[
      ["Overdue",openL.filter(x=>dueState(x.a)==="overdue")],
      ["Due in the next 3 days",openL.filter(x=>dueState(x.a)==="soon")],
      ["Later",openL.filter(x=>x.a.due&&!dueState(x.a))],
      ["No date",openL.filter(x=>!x.a.due)]
    ];
    if(showDone) groups.push(["Done",doneL]);
    const sortD=l=>l.sort((p,q)=>(p.a.due||"9").localeCompare(q.a.due||"9")||q.m.date.localeCompare(p.m.date));
    const html=groups.filter(g=>g[1].length).map(([n,l])=>`<section class="group"><div class="ghead"><span>${n}</span><span>${l.length}</span></div>
      <div class="acard">${sortD(l).map(x=>actionRow(x.a,x.m,true)).join("")}</div></section>`).join("");
    $("#list").innerHTML=html||`<div class="empty">${all.length?"Nothing open here. Nice.":"Action items from your meeting notes will collect here."}</div>`;
  }

  // ---------- tabs and filters ----------
  $("#tabs").addEventListener("click",e=>{const b=e.target.closest("[data-tab]");if(!b)return;tab=b.dataset.tab;if(tab!=="log")kind="";$("#kindF").value=kind;render();window.scrollTo(0,0)});
  $("#search").addEventListener("input",e=>{query=e.target.value.trim().toLowerCase();render()});
  $("#chips").addEventListener("click",e=>{const b=e.target.closest("[data-f]");if(!b)return;proj=b.dataset.f;render()});
  $("#ownerChips").addEventListener("click",e=>{const b=e.target.closest("[data-o]");if(!b)return;ownerF=b.dataset.o;render()});
  $("#showDone").addEventListener("click",()=>{showDone=!showDone;render()});
  $("#kindF").addEventListener("change",e=>{kind=e.target.value;render()});
  $("#rangeF").addEventListener("change",e=>{range=num(e.target.value)||"";render()});

  // ---------- list actions ----------
  $("#list").addEventListener("change",ev=>{
    const cb=ev.target.closest("[data-aid]"); if(!cb) return;
    const m=D().entries.find(x=>x.id===cb.dataset.mid); const a=m&&(m.actions||[]).find(x=>x.id===cb.dataset.aid); if(!a) return;
    a.done=cb.checked; a.doneAt=cb.checked?Date.now():null; m.updated=Date.now(); store.persist();
    setTimeout(render,cb.checked?350:0);
  });
  $("#list").addEventListener("click",ev=>{
    const src=ev.target.closest("[data-open]");
    if(src){ev.preventDefault();openMeeting(src.dataset.open);return}
    const b=ev.target.closest("[data-act]"); if(!b) return;
    const card=b.closest(".entry"); const e=card&&D().entries.find(x=>x.id===card.dataset.id); if(!e) return;
    const a=b.dataset.act;
    if(a==="pin"){e.pin=!e.pin;e.updated=Date.now();store.persist();render()}
    else if(a==="edit") isM(e)?openMeeting(e.id):openEdit(e.id);
    else if(a==="follow") openMeeting(null,e);
    else if(a==="more"){const t=card.querySelector(".clamp");if(t){t.classList.remove("clamp");b.remove()}}
  });

  // ---------- add ----------
  const pick=$("#pick");
  $("#fab").addEventListener("click",()=>{if(tab==="log")pick.showModal();else openMeeting()});
  $("#pickEntry").addEventListener("click",()=>{pick.close();openEdit()});
  $("#pickMeeting").addEventListener("click",()=>{pick.close();openMeeting()});

  // ---------- log entry sheet ----------
  const dlg=$("#dlg");
  function renderKinds(){$("#kinds").innerHTML=KINDS.map(k=>`<button type="button" data-k="${k.id}" style="--cc:var(${k.c})" aria-pressed="${fKind===k.id}">${k.name}</button>`).join("")}
  $("#kinds").addEventListener("click",e=>{const b=e.target.closest("[data-k]");if(!b)return;fKind=b.dataset.k;renderKinds()});
  function defaultProj(){return proj&&proj!=="__pin"?proj:(D().lastProj||"")}
  function openEdit(id){
    editing=id||null; $("#hint").textContent="";
    const e=id?D().entries.find(x=>x.id===id):null;
    $("#dTitle").textContent=e?"Edit entry":"New entry";
    fKind=e?.kind||(kind&&kind!=="meeting"?kind:"note"); renderKinds();
    $("#fText").value=e?.text||""; $("#fProj").value=e?e.proj||"":defaultProj();
    $("#fDate").value=e?.date||localToday(); $("#fPin").checked=!!e?.pin;
    $("#delBtn").style.display=e?"":"none"; dlg.showModal(); if(!e) $("#fText").focus();
  }
  $("#form").addEventListener("submit",ev=>{
    ev.preventDefault();
    const text=$("#fText").value.trim(); if(!text){$("#hint").textContent="Write something first.";return}
    const data={text,kind:fKind,proj:$("#fProj").value.trim(),date:$("#fDate").value||localToday(),pin:$("#fPin").checked,updated:Date.now()};
    const e=editing?D().entries.find(x=>x.id===editing):null;
    if(e) Object.assign(e,data); else D().entries.push({id:uid(),added:Date.now(),...data});
    D().lastProj=data.proj;
    store.persist(); render(); dlg.close(); toast(e?"Saved":"Entry added");
  });
  $("#delBtn").addEventListener("click",()=>{
    if(!confirm("Delete this entry?")) return;
    D().entries=D().entries.filter(x=>x.id!==editing); store.persist(); render(); dlg.close(); toast("Deleted");
  });

  // ---------- meeting sheet ----------
  const mdlg=$("#mdlg");
  function renderActRows(){
    $("#mActs").innerHTML=mActs.length?mActs.map((a,i)=>`<div class="arow" data-i="${i}">
      <input type="text" data-f="text" value="${esc(a.text)}" placeholder="What needs doing" aria-label="Action">
      <div class="l2">
        <input type="text" data-f="owner" list="dlPeople" value="${esc(a.owner||"")}" placeholder="Who" aria-label="Owner">
        <input type="date" data-f="due" value="${esc(a.due||"")}" aria-label="Due date">
        <input type="checkbox" data-f="done" ${a.done?"checked":""} aria-label="Done">
        <button type="button" class="ibtn x" data-rm aria-label="Remove action">✕</button>
      </div></div>`).join(""):`<p style="margin:0;font-size:.85rem;color:var(--muted)">No action items yet.</p>`;
  }
  $("#mActs").addEventListener("input",e=>{
    const row=e.target.closest(".arow"); if(!row) return; const a=mActs[+row.dataset.i], f=e.target.dataset.f;
    if(f==="done") a.done=e.target.checked; else a[f]=e.target.value;
  });
  $("#mActs").addEventListener("change",e=>{const row=e.target.closest(".arow");if(row&&e.target.dataset.f==="done")mActs[+row.dataset.i].done=e.target.checked});
  $("#mActs").addEventListener("click",e=>{const b=e.target.closest("[data-rm]");if(!b)return;mActs.splice(+b.closest(".arow").dataset.i,1);renderActRows()});
  $("#mAddAct").addEventListener("click",()=>{
    mActs.push({id:uid(),text:"",owner:"Me",due:"",done:false}); renderActRows();
    const rows=document.querySelectorAll("#mActs .arow"); rows[rows.length-1].querySelector('[data-f="text"]').focus();
  });
  $("#mType").addEventListener("change",()=>{$("#mPeopleLabel").textContent=$("#mType").value==="seminar"?"Speaker":"People"});

  function renderCarry(title,excludeId){
    // open actions from earlier meetings with the same title
    const prev=D().entries.filter(x=>isM(x)&&x.id!==excludeId&&title&&x.title.trim().toLowerCase()===title.trim().toLowerCase());
    const items=prev.flatMap(m=>(m.actions||[]).filter(a=>!a.done||mCarryIds.includes(a.id)).map(a=>({a,m})));
    mCarryIds=items.map(x=>x.a.id);
    $("#mCarry").innerHTML=items.length?`<div class="carry"><b>Open from earlier meetings</b>${items.map(x=>actionRow(x.a,x.m,false)).join("")}</div>`:"";
  }
  $("#mCarry").addEventListener("change",ev=>{
    const cb=ev.target.closest("[data-aid]"); if(!cb) return;
    const m=D().entries.find(x=>x.id===cb.dataset.mid); const a=m&&m.actions.find(x=>x.id===cb.dataset.aid); if(!a) return;
    a.done=cb.checked; a.doneAt=cb.checked?Date.now():null; m.updated=Date.now(); store.persist();
    cb.closest(".act").classList.toggle("done",cb.checked);
  });
  $("#mName").addEventListener("change",()=>{if(!mEditing){mCarryIds=[];renderCarry($("#mName").value,null)}});

  function openMeeting(id,followOf){
    mEditing=id||null; $("#mHint").textContent=""; mCarryIds=[];
    const m=id?D().entries.find(x=>x.id===id):null;
    const src=m||followOf;
    $("#mTitle").textContent=m?"Edit meeting":followOf?"Follow-up meeting":"New meeting";
    $("#mName").value=src?.title||"";
    $("#mType").value=src?.mtype||"group";
    $("#mPeopleLabel").textContent=$("#mType").value==="seminar"?"Speaker":"People";
    $("#mDate").value=m?.date||localToday();
    $("#mPeople").value=(src?.people||[]).join(", ");
    $("#mProj").value=src?src.proj||"":defaultProj();
    $("#mNotes").value=m?.text||""; $("#mDec").value=m?.decisions||""; $("#mPin").checked=!!m?.pin;
    mActs=m?(m.actions||[]).map(a=>({...a})):[];
    renderActRows(); renderCarry(src?.title||"",m?.id||null);
    $("#mDel").style.display=m?"":"none";
    mdlg.showModal(); if(!src) $("#mName").focus();
  }
  $("#mform").addEventListener("submit",ev=>{
    ev.preventDefault();

    if(!title){$("#mHint").textContent="Give the meeting a title.";$("#mName").focus();return}
    const actions=mActs.map(a=>({...a,text:(a.text||"").trim(),owner:(a.owner||"").trim()})).filter(a=>a.text);
    actions.forEach(a=>{if(a.done&&!a.doneAt)a.doneAt=Date.now();if(!a.done)a.doneAt=null});
    const data={kind:"meeting",title,mtype:$("#mType").value,date:$("#mDate").value||localToday(),
      people:$("#mPeople").value.split(",").map(s=>s.trim()).filter(Boolean),proj:$("#mProj").value.trim(),
      text:$("#mNotes").value.trim(),decisions:$("#mDec").value.trim(),actions,pin:$("#mPin").checked,updated:Date.now()};
    const m=mEditing?D().entries.find(x=>x.id===mEditing):null;
    if(m) Object.assign(m,data); else D().entries.push({id:uid(),added:Date.now(),...data});
    if(data.proj) D().lastProj=data.proj;
    store.persist(); render(); mdlg.close(); toast(m?"Saved":"Meeting saved");
  });
  $("#mDel").addEventListener("click",()=>{
    const m=D().entries.find(x=>x.id===mEditing); if(!m) return;
    const n=(m.actions||[]).filter(a=>!a.done).length;
    if(!confirm(`Delete "${m.title}"?${n?` Its ${n} open action item${n===1?"":"s"} will be deleted too.`:""}`)) return;
    D().entries=D().entries.filter(x=>x.id!==mEditing); store.persist(); render(); mdlg.close(); toast("Deleted");
  });

  // ---------- export ----------
  function mdMeeting(m,out){
    out.push(`### ${m.title} (${mtn(m.mtype)})`);
    if((m.people||[]).length) out.push(`*${m.mtype==="seminar"?"Speaker":"People"}: ${m.people.join(", ")}*`);
    if(m.proj&&!proj) out.push(`*Project: ${m.proj}*`);
    out.push("");
    if(m.text) out.push(m.text,"");
    if(m.decisions) out.push("**Decisions**","",m.decisions,"");
    if((m.actions||[]).length){out.push("**Actions**","");m.actions.forEach(a=>out.push(`- [${a.done?"x":" "}] ${a.text}${a.owner?` (${a.owner})`:""}${a.due?`, due ${a.due}`:""}`));out.push("")}
  }
  $("#mdBtn").addEventListener("click",()=>{
    if(tab==="actions"){
      const open=allActions().filter(x=>!x.a.done).sort((p,q)=>(p.a.due||"9").localeCompare(q.a.due||"9"));
      if(!open.length){toast("No open actions");return}
      const out=["# Open action items",""];
      open.forEach(x=>out.push(`- [ ] ${x.a.text}${x.a.owner?` (${x.a.owner})`:""}${x.a.due?`, due ${x.a.due}`:""}. From ${x.m.title}, ${x.m.date}`));
      saveFile(`actions-${stamp()}.md`,out.join("\n")+"\n"); return;
    }
    const vis=D().entries.filter(visible).sort((a,b)=>a.date.localeCompare(b.date)||a.added-b.added);
    if(!vis.length){toast("Nothing to export");return}
    const title=proj==="__pin"?"Pinned entries":proj||(tab==="meetings"?"Meeting notes":"Research log");
    const out=[`# ${title}`,""]; let cur="";
    for(const e of vis){
      if(e.date!==cur){cur=e.date;out.push(`## ${e.date}`,"")}
      if(isM(e)) mdMeeting(e,out);
      else out.push(`- **${kn(e.kind)}**${e.proj&&!proj?` (${e.proj})`:""}: ${e.text.replace(/\n/g,"\n  ")}`,"");
    }
    saveFile(`${title.toLowerCase().replace(/[^\w]+/g,"-").replace(/^-|-$/g,"")}-${stamp()}.md`,out.join("\n").replace(/\n{3,}/g,"\n\n")+"\n");
  });
  $("#exportBtn").addEventListener("click",()=>saveFile(`research-log-${stamp()}.json`,JSON.stringify({version:2,exported:new Date().toISOString(),entries:D().entries},null,2)));
  $("#importBtn").addEventListener("click",()=>$("#importFile").click());
  $("#importFile").addEventListener("change",async e=>{
    const f=e.target.files[0]; if(!f) return;
    try{const o=JSON.parse(await f.text()); if(!Array.isArray(o.entries)) throw 0;
      const ids=new Set(D().entries.map(x=>x.id)); let n=0;
      for(const x of o.entries) if(x&&x.date&&(x.text||x.title)&&!ids.has(x.id)){D().entries.push({...x,id:x.id||uid(),updated:Date.now()});n++}
      store.persist(); render(); toast(`Imported ${n} entr${n===1?"y":"ies"}`);
    }catch(_){toast("Choose a .json backup exported from this log")}
    e.target.value="";
  });

  setupMenu(); render(); store.connect();
})();
</script>
<script>window.__BACKUP={id:"research-log",key:"researchlog.v1"};</script>
<script>
(function(){
  const C=window.__BACKUP, LK=C.id+".lastBackup", SK=C.id+".backupSnooze", WEEK=7*864e5;
  const get=k=>{try{return +localStorage.getItem(k)||0}catch(_){return 0}};
  const set=(k,v)=>{try{localStorage.setItem(k,String(v))}catch(_){}};
  function hasData(){
    try{const v=JSON.parse(localStorage.getItem(C.key)||"null");if(!v)return false;
      if(Array.isArray(v))return v.length>0;
      return Object.values(v).some(x=>Array.isArray(x)&&x.length>0)}catch(_){return false}
  }
  const bar=document.createElement("div");
  bar.className="bk hidden"; bar.setAttribute("role","status");
  bar.innerHTML='<div class="bkt"><b></b><span>Save a copy to Files or Downloads, or turn on sync in the control center.</span></div><button class="bkno" type="button">Later</button><button class="bkgo" type="button">Back up now</button>';
  const wrap=document.querySelector(".wrap"), head=wrap&&wrap.querySelector(":scope > header");
  if(head) head.insertAdjacentElement("afterend",bar); else if(wrap) wrap.prepend(bar);
  function check(){
    const now=Date.now(), last=get(LK), data=hasData();
    // never backed up: start the 7-day clock from when data first appears
    if(!last&&data&&!get(C.id+".firstData")) set(C.id+".firstData",now);
    const ref=last||get(C.id+".firstData")||now;
    const due=data&&now-ref>WEEK&&now>get(SK);
    bar.classList.toggle("hidden",!due);
    if(due){
      const days=last?Math.floor((now-last)/864e5):0;
      bar.querySelector("b").textContent=last?`Last backup ${days} days ago`:"Not backed up yet";
    }
  }
  window.__markBackup=()=>{set(LK,Date.now());set(SK,0);check()};
  bar.querySelector(".bkgo").addEventListener("click",()=>{const b=document.getElementById("exportBtn");if(b)b.click()});
  bar.querySelector(".bkno").addEventListener("click",()=>{set(SK,Date.now()+864e5);check()});
  document.addEventListener("visibilitychange",()=>{if(!document.hidden)check()});
  window.addEventListener("storage",check);
  setInterval(check,36e5);
  // first check after the app has loaded its data; recheck when data changes
  setTimeout(check,300);
  let t=null; document.addEventListener("click",()=>{clearTimeout(t);t=setTimeout(check,600)},true);
})();
</script>
