<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<script src="suite-theme.js" data-suite-theme></script>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, interactive-widget=resizes-content">
<meta name="theme-color" content="#5A4360">
<meta name="color-scheme" content="dark">
<title>Idea board</title>
<style>
:root{
  color-scheme:dark;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  --bg:var(--t-bg,#14161B); --surface:var(--t-surface,#1C1F26); --raised:var(--t-raised,#242832); --ink:var(--t-ink,#E7E9EE); --muted:var(--t-muted,#8B919E); --faint:var(--t-faint,#2C303A);
  --accent:var(--t-accent,#9DB2FF);
  --c-research:var(--t-blue,#8FB0FF); --c-grants:var(--t-gold,#E6C170); --c-teaching:var(--t-violet,#C3A6F0); --c-outdoors:var(--t-green,#7DCB9C); --c-minerals:var(--t-pink,#EE93AF); --c-home:var(--t-teal,#8CC3CC); --c-other:var(--t-muted,#8B919E);
  --font:"Manrope",system-ui,Roboto,"Segoe UI",sans-serif;
  --bar:72px;
}
html{height:100%;scroll-padding-top:env(safe-area-inset-top,0px)}
*,*::before,*::after{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;min-height:100%;background:var(--bg);color:var(--ink);font-family:var(--font);font-size:16px;line-height:1.45}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer;background:none;border:0}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:6px}
.wrap{max-width:1200px;margin:0 auto;padding:16px 16px calc(var(--bar) + env(safe-area-inset-bottom,0px) + 24px)}

/* header */
header{display:flex;align-items:center;justify-content:space-between;gap:8px;margin:4px 0 16px}
h1{font-size:1.5rem;font-weight:700;margin:0;letter-spacing:-.01em}
.hbtns{display:flex;gap:4px;position:relative}
.ibtn{min-width:44px;min-height:44px;border-radius:12px;color:var(--muted);display:grid;place-items:center;font-size:1.15rem}
.ibtn:active{background:var(--surface)}
.menu{position:absolute;right:0;top:48px;background:var(--raised);border-radius:12px;padding:6px;min-width:160px;display:none;z-index:5;box-shadow:0 8px 24px var(--t-shadow,rgba(0,0,0,.4))}
.menu.open{display:block}
.menu button{display:block;width:100%;text-align:left;padding:12px;border-radius:8px}
.menu button:active{background:var(--faint)}

/* filters */
.search{width:100%;background:var(--surface);border:0;border-radius:12px;padding:12px 14px;min-height:48px}
.search::placeholder{color:var(--muted)}
.chips{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;margin:10px -16px 0;padding:0 16px}
.chips::-webkit-scrollbar{display:none}
.chip{flex:0 0 auto;border-radius:999px;padding:8px 14px;min-height:38px;color:var(--muted);display:inline-flex;align-items:center;gap:8px;background:var(--surface)}
.chip .dot{width:8px;height:8px;border-radius:50%}
.chip[aria-pressed="true"]{background:var(--ink);color:var(--bg)}

/* stage tabs (mobile) */
.tabs{display:grid;grid-template-columns:repeat(4,1fr);margin:18px 0 12px;border-bottom:1px solid var(--faint)}
.tab{padding:10px 2px 12px;color:var(--muted);font-size:.9rem;font-weight:500;position:relative;min-height:48px}
.tab .n{display:block;font-size:.8rem;opacity:.8}
.tab[aria-selected="true"]{color:var(--ink)}
.tab[aria-selected="true"]::after{content:"";position:absolute;left:25%;right:25%;bottom:-1px;height:2px;background:var(--accent);border-radius:2px}

/* board */
.board{display:block}
.col{display:none}
.col.active{display:block}
.col h2{display:none}
@media (min-width:900px){
  .tabs{display:none}
  .board{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:16px;margin-top:20px}
  .col{display:block;min-height:200px;border-radius:14px;padding:4px}
  .col.over{background:var(--surface)}
  .col h2{display:flex;justify-content:space-between;font-size:.95rem;font-weight:500;color:var(--muted);margin:0 4px 10px}
}
.cards{display:flex;flex-direction:column;gap:8px}
.empty{color:var(--muted);font-size:.9rem;padding:32px 8px;text-align:center}

.card{background:var(--surface);border-radius:14px;padding:14px 14px 10px;position:relative}
.card.dragging{opacity:.4}
.card h3{font-size:1rem;font-weight:500;margin:0;overflow-wrap:anywhere;display:flex;gap:8px;align-items:baseline}
.card h3 .dot{flex:0 0 8px;height:8px;border-radius:50%;background:var(--cc);transform:translateY(-1px)}
.card p{margin:6px 0 0 16px;color:var(--muted);font-size:.9rem;white-space:pre-wrap;overflow-wrap:anywhere}
.tags{margin:8px 0 0 16px;display:flex;flex-wrap:wrap;gap:4px 10px;font-size:.8rem;color:var(--muted)}
.cardbar{display:flex;justify-content:flex-end;align-items:center;margin-top:4px;gap:2px}
.cardbar .ibtn{min-width:40px;min-height:40px;font-size:1rem}
.cardbar .ibtn:disabled{opacity:.25}
.star-on{color:var(--c-grants)}
.card.picked{animation:pick 1.4s ease}
@keyframes pick{0%,100%{box-shadow:none}30%{box-shadow:0 0 0 2px var(--accent)}}
@media (prefers-reduced-motion:reduce){.card.picked{animation:none;box-shadow:0 0 0 2px var(--accent)}}

/* capture bar */
.capture{position:fixed;left:0;right:0;bottom:0;z-index:4;background:var(--bg);padding:10px 12px calc(10px + env(safe-area-inset-bottom,0px));border-top:1px solid var(--faint)}
.capture form{max-width:1200px;margin:0 auto;display:flex;gap:8px;align-items:center}
.capture input{flex:1;min-width:0;background:var(--surface);border:0;border-radius:24px;padding:12px 16px;min-height:48px}
.capture input::placeholder{color:var(--muted)}
.catpick{width:48px;height:48px;border-radius:50%;background:var(--surface);display:grid;place-items:center;flex:0 0 auto}
.catpick span{width:12px;height:12px;border-radius:50%;background:var(--cc)}
.add{width:48px;height:48px;border-radius:50%;background:var(--accent);color:var(--t-on-accent,#14161B);font-size:1.5rem;font-weight:500;flex:0 0 auto}

/* sheets */
dialog{border:0;padding:0;background:var(--raised);color:var(--ink);width:100%;max-width:560px;margin:auto auto 0;border-radius:20px 20px 0 0;max-height:90vh}
@media (min-width:600px){dialog{margin:auto;border-radius:20px}}
dialog::backdrop{background:var(--t-backdrop,rgba(0,0,0,.6))}
.sheet{padding:20px 20px calc(20px + env(safe-area-inset-bottom,0px));display:flex;flex-direction:column;gap:14px}
.sheet h2{margin:0;font-size:1.15rem;font-weight:700}
.sheet label{display:flex;flex-direction:column;gap:6px;font-size:.85rem;color:var(--muted)}
.sheet input,.sheet textarea,.sheet select{background:var(--surface);border:0;border-radius:12px;padding:12px;color:var(--ink);min-height:48px}
.sheet textarea{min-height:110px;resize:vertical}
.row{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.check{flex-direction:row!important;align-items:center;gap:10px!important;color:var(--ink)!important;font-size:1rem!important}
.check input{min-height:auto;width:20px;height:20px;accent-color:var(--accent)}
.sbar{display:flex;justify-content:space-between;gap:8px;margin-top:4px}
.btn{border-radius:12px;padding:12px 16px;min-height:48px}
.btn.primary{background:var(--accent);color:var(--t-on-accent,#14161B);font-weight:700}
.btn.ghost{color:var(--muted)}
.btn.danger{color:var(--t-red,#F28B82)}
.catlist{display:grid;grid-template-columns:1fr 1fr;gap:6px}
.catlist button{display:flex;align-items:center;gap:10px;padding:14px;border-radius:12px;background:var(--surface);text-align:left}
.catlist button[aria-pressed="true"]{outline:2px solid var(--accent)}
.catlist .dot{width:10px;height:10px;border-radius:50%}

.toast{position:fixed;left:50%;bottom:calc(var(--bar) + env(safe-area-inset-bottom,0px) + 12px);transform:translateX(-50%);background:var(--raised);color:var(--ink);padding:10px 16px;border-radius:12px;font-size:.9rem;opacity:0;pointer-events:none;transition:opacity .2s;max-width:90vw;text-align:center;z-index:6}
.toast.show{opacity:1}
.sync{font-size:.8rem;color:var(--muted);text-align:center;margin-top:24px}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
/* ---- Theme: dark with pink-to-blue accents ---- */
:root{
  --bg:var(--t-bg,#000000);--surface:var(--t-surface,#131316);--raised:var(--t-raised,#1D1D22);--ink:var(--t-ink,#F2F2F4);--muted:var(--t-muted,#9D9DA5);--faint:var(--t-faint,#28282E);
  --accent:var(--t-accent,#EBA8E4);--accent2:var(--t-accent2,#A7CBF4);
  --grad:linear-gradient(90deg,var(--t-grad1,#F0A8DC) 0%,var(--t-grad2,#C9B6EF) 50%,var(--t-grad3,#A6CCF5) 100%);
  --danger:var(--t-danger,#EF5A50);--star:var(--t-accent,#EBA8E4);--pinbg:var(--t-pinbg,#2A2413);
  --font:Roboto,"Google Sans",system-ui,-apple-system,"Segoe UI",sans-serif;
  --mono:"Roboto Mono","Droid Sans Mono",ui-monospace,Menlo,Consolas,monospace;
}
body{background-color:var(--t-bg,#000);background-image:linear-gradient(172deg,var(--t-head,#5A4360) 0%,var(--t-head2,#352C3F) 90px,var(--t-head3,#15121A) 210px,var(--t-bg,#000) 320px);background-repeat:no-repeat;background-size:100% 340px}
h1{font-weight:500;font-size:1.85rem;letter-spacing:0}
h1 .n{font-size:1rem}
.search{background:var(--t-field,#0E0E11);border:1.5px solid var(--t-line,#2E2E35);border-radius:999px}
.search:focus{border-color:var(--t-focus,#9C8BC0);outline:none}
.chip{background:var(--t-bg,#000);border:1.5px solid var(--t-edge,#3B3B43);color:var(--ink)}
.chip[aria-pressed="true"]{background:var(--grad);border-color:transparent;color:var(--t-on-grad,#17161C);font-weight:500}
.chip.add{color:var(--accent)}
.tab[aria-selected="true"]::after{background:var(--grad)}
.btn.primary,.add{background:var(--grad)!important;color:var(--t-on-grad,#17161C)!important}
.fab{background:var(--t-fab,#17171C);border:1px solid var(--t-edge,#3A3A42);color:var(--t-fab-ink,#D9B9EE);box-shadow:0 8px 22px var(--t-shadow,rgba(0,0,0,.7))}
.star-on{color:var(--star)!important}
.card:has(.star-on),.paper:has(.star-on),.entry:has(.star-on){background:var(--pinbg)}
.menu{background:var(--raised);border:1px solid var(--t-line,#2E2E35)}
dialog{background:var(--raised)}
.sheet input,.sheet select,.sheet textarea,.dlg input,.dlg textarea,.dlg select{background:var(--t-field,#0F0F12)}
.toast{background:var(--t-raised2,#26262C);color:var(--ink)}
.doi{color:var(--accent2)}
.sync{color:var(--t-dim,#6F6F77)}
.seg button[aria-pressed="true"]{background:var(--grad);color:var(--t-on-grad,#17161C)}
.topbar{background:linear-gradient(172deg,var(--t-head,#5A4360) 0%,var(--t-headbar,#2A2432) 100%)}
.toolbar{background:var(--t-bg,#000)}
.bk.hidden{display:none!important}
.bk{display:flex;align-items:center;gap:8px;background:var(--pinbg,var(--t-pinbg,#2A2413));border-radius:14px;padding:10px 8px 10px 14px;margin:0 0 14px}
.bk .bkt{flex:1;min-width:0;font-size:.9rem;line-height:1.3}
.bk .bkt b{display:block;font-weight:500}
.bk .bkt span{color:var(--muted);font-size:.8rem}
.bk .bkgo{background:var(--grad);color:var(--t-on-grad,#17161C);border-radius:999px;padding:10px 14px;min-height:44px;font-weight:500;white-space:nowrap}
.bk .bkno{color:var(--muted);padding:10px 8px;min-height:44px}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>Ideas</h1>
    <div class="hbtns">
      <button class="ibtn" id="spark" aria-label="Pick a random spark" title="Surprise me">✦</button>
      <button class="ibtn" id="moreBtn" aria-label="More options" aria-expanded="false">⋮</button>
      <div class="menu" id="menu" role="menu">
        <button role="menuitem" id="exportBtn">Export backup</button>
        <button role="menuitem" id="importBtn">Import backup</button>
      </div>
      <input type="file" id="importFile" accept="application/json,.json" hidden>
    </div>
  </header>

  <label class="sr" for="search">Search ideas</label>
  <input class="search" id="search" type="search" placeholder="Search">
  <div class="chips" id="chips"></div>

  <nav class="tabs" id="tabs" role="tablist"></nav>
  <main class="board" id="board"></main>
  <p class="sync" id="sync"></p>
</div>

<div class="capture">
  <form id="capture" autocomplete="off">
    <button type="button" class="catpick" id="catpick" aria-label="Choose category"><span></span></button>
    <label class="sr" for="qTitle">New idea</label>
    <input id="qTitle" placeholder="New idea" maxlength="200" enterkeyhint="done">
    <button class="add" type="submit" aria-label="Add idea">+</button>
  </form>
</div>

<dialog id="catDlg">
  <div class="sheet">
    <h2>Category</h2>
    <div class="catlist" id="catlist"></div>
  </div>
</dialog>

<dialog id="dlg">
  <form class="sheet" id="editForm">
    <h2>Edit idea</h2>
    <label>Title<input id="eTitle" required maxlength="200"></label>
    <label>Notes<textarea id="eNotes" placeholder="Why it matters, first step, links"></textarea></label>
    <div class="row">
      <label>Category<select id="eCat"></select></label>
      <label>Stage<select id="eStage"></select></label>
    </div>
    <label>Tags<input id="eTags" placeholder="Comma separated"></label>
    <label class="check"><input type="checkbox" id="eStar"> Favourite</label>
    <div class="sbar">
      <button type="button" class="btn danger" id="delBtn">Delete</button>
      <span style="display:flex;gap:6px">
        <button type="button" class="btn ghost" id="cancelBtn">Cancel</button>
        <button type="submit" class="btn primary">Save</button>
      </span>
    </div>
  </form>
</dialog>

<div class="toast" id="toast" role="status" aria-live="polite"></div>

<script>
(function(){
  function offlineSave(filename,data){
    try{
      const ext=(filename.split(".").pop()||"").toLowerCase();
      const type={json:"application/json",csv:"text/csv",md:"text/markdown",png:"image/png"}[ext]||"text/plain";
      const blob=data instanceof Blob?data:new Blob([data],{type:type+";charset=utf-8"});
      const url=URL.createObjectURL(blob);
      const a=document.createElement("a");a.href=url;a.download=filename;a.style.display="none";
      document.body.appendChild(a);a.click();a.remove();
      setTimeout(()=>URL.revokeObjectURL(url),10000);
      toast("Saved to Downloads");if(/\.json$/i.test(filename)&&window.__markBackup)window.__markBackup();
    }catch(_){toast("Couldn't save the file")}
  }
  function storageWorks(){try{const k="__probe"+Math.random();localStorage.setItem(k,"1");localStorage.removeItem(k);return true}catch(_){return false}}
  const STORAGE_MSG=()=>storageWorks()?(localStorage.getItem("sync.github")?"Saved on this device and synced to your other devices.":"Saved on this device. Turn on sync in the control center, or export a backup now and then."):"Storage is blocked here, so changes will be lost when you close this page.";
  const STAGES=[
    {id:"spark",name:"Sparks"},{id:"explore",name:"Exploring"},
    {id:"doing",name:"Doing"},{id:"done",name:"Done"}
  ];
  const CATS=[
    {id:"research",name:"Research"},{id:"grants",name:"Grants"},{id:"teaching",name:"Teaching"},
    {id:"outdoors",name:"Outdoors"},{id:"minerals",name:"Minerals"},{id:"home",name:"Home"},{id:"other",name:"Other"}
  ];
  const LS_KEY="ideaboard.v1";
  let ideas=[], filterCat=null, query="", editingId=null, activeStage="spark", newCat="research";

  const $=s=>document.querySelector(s);
  const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,7);
  const cc=c=>`var(--c-${c||"other"})`;
  const esc=s=>String(s).replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[m]));

  $("#eCat").innerHTML=CATS.map(c=>`<option value="${c.id}">${c.name}</option>`).join("");
  $("#eStage").innerHTML=STAGES.map(s=>`<option value="${s.id}">${s.name}</option>`).join("");

  // toast
  let tt=null;
  function toast(t){const el=$("#toast");el.textContent=t;el.classList.add("show");clearTimeout(tt);tt=setTimeout(()=>el.classList.remove("show"),2600)}

  // storage
  function loadLocal(){try{const r=localStorage.getItem(LS_KEY);return r?JSON.parse(r):null}catch(e){return null}}
  function saveLocal(){try{localStorage.setItem(LS_KEY,JSON.stringify(ideas))}catch(e){toast("Couldn\'t save. Storage is full or blocked; export a backup.")}}
  function persist(){saveLocal()}

  // render
  function visible(i){
    if(filterCat&&i.cat!==filterCat) return false;
    if(!query) return true;
    return (i.title+" "+(i.notes||"")+" "+(i.tags||[]).join(" ")).toLowerCase().includes(query);
  }
  function renderCatPick(){$("#catpick").style.setProperty("--cc",cc(newCat));$("#catpick").setAttribute("aria-label","Category: "+CATS.find(c=>c.id===newCat).name)}
  function renderChips(){
    $("#chips").innerHTML=[`<button class="chip" data-cat="" aria-pressed="${!filterCat}">All</button>`]
      .concat(CATS.map(c=>`<button class="chip" data-cat="${c.id}" aria-pressed="${filterCat===c.id}"><span class="dot" style="background:${cc(c.id)}"></span>${c.name}</button>`)).join("");
  }
  function renderTabs(){
    $("#tabs").innerHTML=STAGES.map(s=>{
      const n=ideas.filter(i=>i.stage===s.id&&visible(i)).length;
      return `<button class="tab" role="tab" data-stage="${s.id}" aria-selected="${activeStage===s.id}">${s.name}<span class="n">${n}</span></button>`;
    }).join("");
  }
  function cardHTML(i){
    const si=STAGES.findIndex(s=>s.id===i.stage);
    const tags=(i.tags||[]).length?`<div class="tags">${i.tags.map(t=>"#"+esc(t)).join(" ")}</div>`:"";
    return `<article class="card" draggable="true" data-id="${i.id}" style="--cc:${cc(i.cat)}">
      <h3><span class="dot" aria-hidden="true"></span>${esc(i.title)}</h3>
      ${i.notes?`<p>${esc(i.notes.length>160?i.notes.slice(0,160)+"...":i.notes)}</p>`:""}
      ${tags}
      <div class="cardbar">
        <button class="ibtn ${i.star?"star-on":""}" data-act="star" aria-label="${i.star?"Remove favourite":"Mark favourite"}">${i.star?"★":"☆"}</button>
        <button class="ibtn" data-act="left" aria-label="Move back" ${si<=0?"disabled":""}>‹</button>
        <button class="ibtn" data-act="right" aria-label="Move forward" ${si>=STAGES.length-1?"disabled":""}>›</button>
      </div>
    </article>`;
  }
  function render(){
    renderChips(); renderTabs(); renderCatPick();
    const sorted=[...ideas].sort((a,b)=>(b.star?1:0)-(a.star?1:0)||b.updated-a.updated);
    $("#board").innerHTML=STAGES.map(s=>{
      const list=sorted.filter(i=>i.stage===s.id&&visible(i));
      const emptyMsg=!ideas.length&&s.id==="spark"?"Add your first idea below.":(query||filterCat?"Nothing matches.":"Empty");
      return `<section class="col ${activeStage===s.id?"active":""}" data-stage="${s.id}" aria-label="${s.name}">
        <h2>${s.name}<span>${list.length}</span></h2>
        <div class="cards">${list.length?list.map(cardHTML).join(""):`<div class="empty">${emptyMsg}</div>`}</div>
      </section>`;
    }).join("");
  }

  // actions
  function update(id,patch){
    const i=ideas.find(x=>x.id===id); if(!i) return;
    Object.assign(i,patch,{updated:Date.now()}); persist(); render();
  }
  function move(id,dir){
    const i=ideas.find(x=>x.id===id); if(!i) return;
    const si=STAGES.findIndex(s=>s.id===i.stage)+dir;
    if(si<0||si>=STAGES.length) return;
    update(id,{stage:STAGES[si].id}); toast("Moved to "+STAGES[si].name);
  }

  $("#capture").addEventListener("submit",e=>{
    e.preventDefault();
    const t=$("#qTitle").value.trim(); if(!t) return;
    const now=Date.now();
    ideas.push({id:uid(),title:t,notes:"",cat:newCat,stage:"spark",tags:[],star:false,created:now,updated:now});
    $("#qTitle").value=""; activeStage="spark"; persist(); render(); toast("Added to Sparks");
  });

  // category picker for new ideas
  const catDlg=$("#catDlg");
  $("#catpick").addEventListener("click",()=>{
    $("#catlist").innerHTML=CATS.map(c=>`<button data-cat="${c.id}" aria-pressed="${newCat===c.id}"><span class="dot" style="background:${cc(c.id)}"></span>${c.name}</button>`).join("");
    catDlg.showModal();
  });
  $("#catlist").addEventListener("click",e=>{const b=e.target.closest("[data-cat]");if(!b)return;newCat=b.dataset.cat;renderCatPick();catDlg.close();$("#qTitle").focus()});
  catDlg.addEventListener("click",e=>{if(e.target===catDlg)catDlg.close()});

  $("#search").addEventListener("input",e=>{query=e.target.value.trim().toLowerCase();render()});
  $("#chips").addEventListener("click",e=>{const b=e.target.closest(".chip");if(!b)return;filterCat=b.dataset.cat||null;render()});
  $("#tabs").addEventListener("click",e=>{const b=e.target.closest(".tab");if(!b)return;activeStage=b.dataset.stage;render()});

  $("#board").addEventListener("click",e=>{
    const card=e.target.closest(".card"); if(!card) return;
    const id=card.dataset.id; const btn=e.target.closest("[data-act]");
    if(!btn){openEdit(id);return}
    const a=btn.dataset.act;
    if(a==="left") move(id,-1);
    else if(a==="right") move(id,1);
    else if(a==="star"){const i=ideas.find(x=>x.id===id);update(id,{star:!i.star})}
  });

  // swipe between stages on phone
  let sx=0, sy=0, st=0;
  $("#board").addEventListener("touchstart",e=>{const t=e.touches[0];sx=t.clientX;sy=t.clientY;st=Date.now()},{passive:true});
  $("#board").addEventListener("touchend",e=>{
    if(window.innerWidth>=900) return;
    const t=e.changedTouches[0]; const dx=t.clientX-sx, dy=t.clientY-sy;
    if(Math.abs(dx)<60||Math.abs(dx)<Math.abs(dy)*1.5||Date.now()-st>600) return;
    const si=STAGES.findIndex(s=>s.id===activeStage)+(dx<0?1:-1);
    if(si>=0&&si<STAGES.length){activeStage=STAGES[si].id;render()}
  },{passive:true});

  // drag and drop (wide screens)
  let dragId=null;
  $("#board").addEventListener("dragstart",e=>{const c=e.target.closest(".card");if(!c)return;dragId=c.dataset.id;c.classList.add("dragging");try{e.dataTransfer.setData("text/plain",dragId)}catch(_){}});
  $("#board").addEventListener("dragend",e=>{const c=e.target.closest(".card");if(c)c.classList.remove("dragging");document.querySelectorAll(".col.over").forEach(x=>x.classList.remove("over"))});
  $("#board").addEventListener("dragover",e=>{const col=e.target.closest(".col");if(!col||!dragId)return;e.preventDefault();document.querySelectorAll(".col.over").forEach(x=>{if(x!==col)x.classList.remove("over")});col.classList.add("over")});
  $("#board").addEventListener("drop",e=>{const col=e.target.closest(".col");if(!col||!dragId)return;e.preventDefault();update(dragId,{stage:col.dataset.stage});dragId=null});

  // edit sheet
  const dlg=$("#dlg");
  function openEdit(id){
    const i=ideas.find(x=>x.id===id); if(!i) return;
    editingId=id;
    $("#eTitle").value=i.title; $("#eNotes").value=i.notes||""; $("#eCat").value=i.cat;
    $("#eStage").value=i.stage; $("#eTags").value=(i.tags||[]).join(", "); $("#eStar").checked=!!i.star;
    dlg.showModal();
  }
  $("#editForm").addEventListener("submit",e=>{
    e.preventDefault(); if(!editingId) return;
    const title=$("#eTitle").value.trim(); if(!title){$("#eTitle").focus();return}
    const stage=$("#eStage").value;
    update(editingId,{title,notes:$("#eNotes").value.trim(),cat:$("#eCat").value,stage,
      tags:$("#eTags").value.split(",").map(t=>t.trim().replace(/^#/,"")).filter(Boolean).slice(0,12),star:$("#eStar").checked});
    dlg.close(); editingId=null;
  });
  $("#cancelBtn").addEventListener("click",()=>{dlg.close();editingId=null});
  dlg.addEventListener("click",e=>{if(e.target===dlg){dlg.close();editingId=null}});
  $("#delBtn").addEventListener("click",()=>{
    if(!editingId) return;
    const i=ideas.find(x=>x.id===editingId);
    if(!confirm(`Delete "${i.title}"?`)) return;
    ideas=ideas.filter(x=>x.id!==editingId); persist(); render(); dlg.close(); editingId=null; toast("Deleted");
  });

  // surprise me
  $("#spark").addEventListener("click",()=>{
    const pool=ideas.filter(i=>i.stage==="spark");
    if(!pool.length){toast("No sparks yet");return}
    filterCat=null;query="";$("#search").value="";activeStage="spark";render();
    const pick=pool[Math.floor(Math.random()*pool.length)];
    const el=document.querySelector(`.card[data-id="${pick.id}"]`);
    if(el){el.scrollIntoView({behavior:"smooth",block:"center"});el.classList.add("picked");setTimeout(()=>el.classList.remove("picked"),1500)}
  });

  // overflow menu
  const menu=$("#menu");
  $("#moreBtn").addEventListener("click",e=>{e.stopPropagation();const o=menu.classList.toggle("open");$("#moreBtn").setAttribute("aria-expanded",o)});
  document.addEventListener("click",e=>{if(!e.target.closest("#menu")){menu.classList.remove("open");$("#moreBtn").setAttribute("aria-expanded","false")}});

  $("#exportBtn").addEventListener("click",async()=>{
    menu.classList.remove("open");
    const data=JSON.stringify({version:1,exported:new Date().toISOString(),ideas},null,2);
    offlineSave(`idea-board-${new Date().toISOString().slice(0,10)}.json`,data);
  });
  $("#importBtn").addEventListener("click",()=>{menu.classList.remove("open");$("#importFile").click()});
  $("#importFile").addEventListener("change",async e=>{
    const f=e.target.files[0]; if(!f) return;
    try{
      const obj=JSON.parse(await f.text()); const list=Array.isArray(obj)?obj:obj.ideas;
      if(!Array.isArray(list)) throw 0;
      const have=new Set(ideas.map(i=>i.id)); let n=0;
      for(const i of list){ if(i&&i.title&&!have.has(i.id)){ideas.push({id:i.id||uid(),title:String(i.title),notes:i.notes||"",cat:CATS.some(c=>c.id===i.cat)?i.cat:"other",stage:STAGES.some(s=>s.id===i.stage)?i.stage:"spark",tags:Array.isArray(i.tags)?i.tags:[],star:!!i.star,created:i.created||Date.now(),updated:i.updated||Date.now()});n++} }
      persist();render();toast(`Imported ${n} idea${n===1?"":"s"}`);
    }catch(_){toast("Choose a .json backup exported from this board")}
    e.target.value="";
  });

  // boot
  ideas=loadLocal()||[]; render();
  $("#sync").textContent=STORAGE_MSG();
})();
</script>
<script>window.__BACKUP={id:"idea-board",key:"ideaboard.v1"};</script>
<script>
(function(){
  const C=window.__BACKUP, LK=C.id+".lastBackup", SK=C.id+".backupSnooze", WEEK=7*864e5;
  const get=k=>{try{return +localStorage.getItem(k)||0}catch(_){return 0}};
  const set=(k,v)=>{try{localStorage.setItem(k,String(v))}catch(_){}};
  function hasData(){
    try{const v=JSON.parse(localStorage.getItem(C.key)||"null");if(!v)return false;
      if(Array.isArray(v))return v.length>0;
      return Object.values(v).some(x=>Array.isArray(x)&&x.length>0)}catch(_){return false}
  }
  const bar=document.createElement("div");
  bar.className="bk hidden"; bar.setAttribute("role","status");
  bar.innerHTML='<div class="bkt"><b></b><span>Save a copy to Files or Downloads, or turn on sync in the control center.</span></div><button class="bkno" type="button">Later</button><button class="bkgo" type="button">Back up now</button>';
  const wrap=document.querySelector(".wrap"), head=wrap&&wrap.querySelector(":scope > header");
  if(head) head.insertAdjacentElement("afterend",bar); else if(wrap) wrap.prepend(bar);
  function check(){
    const now=Date.now(), last=get(LK), data=hasData();
    // never backed up: start the 7-day clock from when data first appears
    if(!last&&data&&!get(C.id+".firstData")) set(C.id+".firstData",now);
    const ref=last||get(C.id+".firstData")||now;
    const due=data&&now-ref>WEEK&&now>get(SK);
    bar.classList.toggle("hidden",!due);
    if(due){
      const days=last?Math.floor((now-last)/864e5):0;
      bar.querySelector("b").textContent=last?`Last backup ${days} days ago`:"Not backed up yet";
    }
  }
  window.__markBackup=()=>{set(LK,Date.now());set(SK,0);check()};
  bar.querySelector(".bkgo").addEventListener("click",()=>{const b=document.getElementById("exportBtn");if(b)b.click()});
  bar.querySelector(".bkno").addEventListener("click",()=>{set(SK,Date.now()+864e5);check()});
  document.addEventListener("visibilitychange",()=>{if(!document.hidden)check()});
  window.addEventListener("storage",check);
  setInterval(check,36e5);
  // first check after the app has loaded its data; recheck when data changes
  setTimeout(check,300);
  let t=null; document.addEventListener("click",()=>{clearTimeout(t);t=setTimeout(check,600)},true);
})();
</script>
