<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<script src="suite-theme.js" data-suite-theme></script>
<script src="suite-sync.js"></script>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, interactive-widget=resizes-content">
<meta name="theme-color" content="#5A4360">
<meta name="color-scheme" content="dark">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="{{APP_SHORT}}">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="manifest" href="app.webmanifest">
<link rel="icon" type="image/png" sizes="192x192" href="icons/control-center-192.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<title>{{APP_NAME}}</title>
<style>
:root{
  color-scheme:dark;
  --bg:var(--t-bg,#000000);--surface:var(--t-surface,#131316);--raised:var(--t-raised,#1D1D22);--raised2:var(--t-raised2,#26262C);--field:var(--t-field,#0F0F12);--ink:var(--t-ink,#F2F2F4);--muted:var(--t-muted,#9D9DA5);--dim:var(--t-dim,#6F6F77);--faint:var(--t-faint,#28282E);--edge:var(--t-edge,#3B3B43);
  --accent:var(--t-accent,#EBA8E4);--accent2:var(--t-accent2,#A7CBF4);
  --grad:linear-gradient(90deg,var(--t-grad1,#F0A8DC) 0%,var(--t-grad2,#C9B6EF) 50%,var(--t-grad3,#A6CCF5) 100%);
  --danger:var(--t-danger,#EF5A50);--red:var(--t-red,#F28B82);--gold:var(--t-gold,#E6C170);--green:var(--t-green,#7DCB9C);--violet:var(--t-violet,#C3A6F0);--pink:var(--t-pink,#EE93AF);--teal:var(--t-teal,#8CC3CC);--sky:var(--t-sky,#A6CCF5);--blue:var(--t-blue,#9DB2FF);
  --pinbg:var(--t-pinbg,#2A2413);
  --font:Roboto,"Google Sans",system-ui,-apple-system,"Segoe UI",sans-serif;
  --mono:"Roboto Mono","Droid Sans Mono",ui-monospace,Menlo,Consolas,monospace;
}
*,*::before,*::after{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{height:100%}
body{
  margin:0;height:100%;height:100dvh;display:grid;grid-template-rows:minmax(0,1fr) auto;
  padding-top:env(safe-area-inset-top,0px);
  background:var(--t-bg,#000) linear-gradient(var(--t-head,#5A4360),var(--t-head,#5A4360)) top/100% env(safe-area-inset-top,0px) no-repeat;
  color:var(--ink);font-family:var(--font);font-size:16px;line-height:1.45;
}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer;background:none;border:0;padding:0}
a{color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:8px}
.hidden{display:none!important}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}

/* ---------- frame ---------- */
.stage{position:relative;min-height:0;min-width:0;overflow:hidden}
.scroller{position:absolute;inset:0;overflow-y:auto;overscroll-behavior:contain;
  background-color:var(--t-bg,#000);background-image:linear-gradient(172deg,var(--t-head,#5A4360) 0%,var(--t-head2,#352C3F) 90px,var(--t-head3,#15121A) 210px,var(--t-bg,#000) 320px);background-repeat:no-repeat;background-size:100% 340px}
.wrap{max-width:1180px;margin:0 auto;padding:16px 16px calc(104px + env(safe-area-inset-bottom,0px))}
header.top{display:flex;align-items:flex-start;justify-content:space-between;gap:10px;margin:4px 0 14px}
h1{font-weight:500;font-size:clamp(1.5rem,6vw,1.85rem);margin:0;line-height:1.15}
.sub{margin:4px 0 0;color:var(--muted);font-size:.88rem}
.hbtns{display:flex;gap:4px;align-items:center;flex:0 0 auto}
.ibtn{min-width:44px;min-height:44px;border-radius:12px;color:var(--muted);display:inline-grid;place-items:center;font-size:1.1rem}
.ibtn:hover{background:var(--surface)}
.ibtn svg,.btn svg{width:20px;height:20px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.srcchip{display:inline-flex;align-items:center;gap:6px;border:1.5px solid var(--edge);border-radius:999px;padding:6px 12px;min-height:40px;font-size:.82rem;color:var(--ink);background:var(--t-bg,#000);white-space:nowrap}
.srcchip i{width:8px;height:8px;border-radius:50%;background:var(--green);flex:0 0 auto}
.srcchip[data-mode="backup"] i,.srcchip[data-mode="file"] i{background:var(--gold)}
.srcchip[data-mode="mixed"] i{background:var(--gold)}

nav#nav{display:flex;gap:2px;background:var(--t-bg,#000);border-top:1px solid var(--faint);padding:6px 6px calc(6px + env(safe-area-inset-bottom,0px))}
nav#nav button{flex:1 1 0;min-width:0;min-height:58px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;color:var(--muted);font-size:.74rem;padding:2px}
nav#nav .ic{width:56px;height:30px;border-radius:999px;display:grid;place-items:center;position:relative}
nav#nav svg{width:22px;height:22px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
nav#nav .lb{max-width:100%;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
nav#nav button[aria-current="page"]{color:var(--ink);font-weight:500}
nav#nav button[aria-current="page"] .ic{background:var(--grad);color:var(--t-on-grad,#17161C)}
nav#nav button:focus-visible{outline:2px solid var(--accent);outline-offset:-2px;border-radius:12px}
nav#nav .badge{position:absolute;top:0;right:8px;min-width:16px;height:16px;border-radius:999px;background:var(--danger);color:#fff;font-size:.62rem;font-weight:700;display:grid;place-items:center;padding:0 4px;box-shadow:0 0 0 2px var(--t-bg,#000)}
nav#nav .dot{position:absolute;top:3px;right:12px;width:8px;height:8px;border-radius:50%;box-shadow:0 0 0 2px var(--t-bg,#000)}
@media (min-width:900px){
  body{grid-template-rows:minmax(0,1fr);grid-template-columns:auto minmax(0,1fr)}
  nav#nav{order:-1;flex-direction:column;justify-content:flex-start;gap:10px;width:96px;border-top:0;border-right:1px solid var(--faint);padding:18px 6px calc(18px + env(safe-area-inset-bottom,0px))}
  nav#nav button{flex:none}
  .wrap{padding:22px 28px 60px}
}

.fab{position:absolute;right:18px;bottom:calc(18px + env(safe-area-inset-bottom,0px));width:60px;height:60px;border-radius:18px;background:var(--t-fab,#17171C);border:1px solid var(--t-edge,#3A3A42);color:var(--t-fab-ink,#D9B9EE);font-size:1.9rem;line-height:1;box-shadow:0 8px 22px var(--t-shadow,rgba(0,0,0,.7));z-index:4;display:grid;place-items:center}
.fab:disabled{opacity:.4}

/* ---------- building blocks ---------- */
.grid{display:grid;grid-template-columns:minmax(0,1fr);gap:14px}
@media (min-width:760px){.grid.two{grid-template-columns:repeat(2,minmax(0,1fr))}.grid .span2{grid-column:1/-1}}
@media (min-width:1100px){.grid.three{grid-template-columns:repeat(3,minmax(0,1fr))}}
.card{background:var(--surface);border-radius:18px;padding:14px 14px 10px;min-width:0}
.card > h2,.sech{display:flex;align-items:center;justify-content:space-between;gap:8px;margin:0 0 8px;font-size:1rem;font-weight:500}
.card > h2 small,.sech small{color:var(--muted);font-weight:400;font-size:.8rem}
.card > h2 .lk,.sech .lk{font-size:.82rem;color:var(--accent);font-weight:400;text-decoration:none;white-space:nowrap}
.card h3{margin:14px 0 4px;font-size:.72rem;font-weight:700;letter-spacing:.05em;text-transform:uppercase;color:var(--muted)}
.card h3:first-of-type{margin-top:4px}
.empty{color:var(--muted);font-size:.9rem;padding:12px 2px}
.muted{color:var(--muted)}
.mono{font-family:var(--mono)}
.warnbox{background:var(--pinbg);border-radius:14px;padding:12px 14px;margin:0 0 14px;font-size:.9rem;line-height:1.45;display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.warnbox b{font-weight:500}
.warnbox .grow{flex:1 1 220px;min-width:0}
.infobox{background:var(--t-info-bg,#12141B);border:1px solid var(--t-info-line,#232838);border-radius:14px;padding:12px 14px;margin:0 0 14px;font-size:.88rem;color:var(--muted)}
.infobox code,.note code{font-family:var(--mono);font-size:.82rem;color:var(--ink)}

.tiles{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px;margin:0 0 14px}
@media (min-width:600px){.tiles{grid-template-columns:repeat(3,minmax(0,1fr))}}
@media (min-width:1000px){.tiles{grid-template-columns:repeat(6,minmax(0,1fr))}}
.tile{background:var(--surface);border-radius:16px;padding:12px 14px;text-align:left;display:flex;flex-direction:column;gap:2px;min-height:78px;border:1.5px solid transparent}
.tile b{font-size:1.6rem;font-weight:500;line-height:1.1;color:var(--tc,var(--ink))}
.tile span{font-size:.8rem;color:var(--muted)}
.tile.zero b{color:var(--dim)}
.tile:hover{border-color:var(--edge)}

.rows{display:flex;flex-direction:column}
.row{display:flex;align-items:flex-start;gap:10px;padding:9px 0;border-top:1px solid var(--faint);min-width:0}
.rows > .row:first-child{border-top:0}
.row .bar{width:3px;align-self:stretch;border-radius:3px;background:var(--cc,var(--muted));flex:0 0 auto}
.row .main{flex:1;min-width:0}
.row .t{overflow-wrap:anywhere;font-size:.95rem}
.row .t a{text-decoration:none}
.row .t a:hover{text-decoration:underline}
.row .m{display:flex;flex-wrap:wrap;gap:2px 10px;font-size:.78rem;color:var(--muted);margin-top:2px}
.row .m .app{color:var(--cc)}
.row .side{display:flex;align-items:center;gap:2px;flex:0 0 auto;margin:-6px -6px -6px 0}
.row .side .ibtn{min-width:40px;min-height:40px;font-size:.95rem}
.row input[type="checkbox"]{width:22px;height:22px;margin:1px 0 0;accent-color:var(--accent);flex:0 0 auto}
.row.done .t{text-decoration:line-through;color:var(--muted)}
.tag{display:inline-block;font-size:.72rem;font-weight:700;padding:2px 8px;border-radius:999px;color:var(--cc,var(--muted));background:color-mix(in srgb,var(--cc,var(--muted)) 16%,transparent);white-space:nowrap}
.over{color:var(--red)!important}
.soon{color:var(--gold)!important}
.ok{color:var(--green)!important}
.txtbtn{color:var(--accent);font-size:.85rem;padding:0 8px;min-height:40px;border-radius:10px;white-space:nowrap}
.txtbtn:hover{background:var(--raised)}
.txtbtn:disabled{opacity:.4;cursor:default}
.more{color:var(--accent);font-size:.85rem;padding:8px 0 2px;min-height:36px}

.day{margin-top:10px}
.day:first-child{margin-top:0}
.dayh{font-size:.8rem;font-weight:700;color:var(--muted);display:flex;justify-content:space-between;margin:0 0 2px}
.dayh.today{color:var(--accent)}

.prog{margin-top:6px}
.track{height:6px;background:var(--t-track,#2A2A31);border-radius:999px;overflow:hidden}
.fill{height:100%;background:var(--pc,var(--grad));border-radius:999px}
.plab{display:flex;justify-content:space-between;gap:8px;font-size:.76rem;color:var(--muted);margin-top:4px;flex-wrap:wrap}

.chips{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;margin:0 -16px 12px;padding:0 16px}
.chips::-webkit-scrollbar{display:none}
.chip{flex:0 0 auto;border-radius:999px;padding:7px 13px;min-height:38px;white-space:nowrap;display:inline-flex;align-items:center;gap:6px;background:var(--t-bg,#000);border:1.5px solid var(--edge);color:var(--ink);font-size:.9rem}
.chip .c{opacity:.65;font-size:.82rem}
.chip .dot{width:8px;height:8px;border-radius:50%;background:var(--cc)}
.chip[aria-pressed="true"]{background:var(--grad);border-color:transparent;color:var(--t-on-grad,#17161C);font-weight:500}
.search{width:100%;background:var(--t-field,#0E0E11);border:1.5px solid var(--t-line,#2E2E35);border-radius:999px;padding:12px 18px;min-height:50px;color:var(--ink);margin:0 0 12px}
.search:focus{border-color:var(--t-focus,#9C8BC0);outline:none}
.search::placeholder{color:var(--muted)}

.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border-radius:12px;padding:11px 16px;min-height:46px;background:var(--raised);color:var(--ink);text-decoration:none;font-size:.95rem;border:0}
.btn.primary{background:var(--grad);color:var(--t-on-grad,#17161C);font-weight:700}
.btn.ghost{background:transparent;color:var(--muted)}
.btn.danger{color:var(--red)}
.btn:disabled{opacity:.45;cursor:default}
.btnrow{display:flex;gap:8px;flex-wrap:wrap}

.masonry{display:flex;flex-direction:column;gap:14px}
@media (min-width:760px){.masonry{display:block;column-count:2;column-gap:14px}.masonry > .card{display:block;break-inside:avoid;margin:0 0 14px}}
@media (min-width:1600px){.masonry{column-count:3}}
.bkapp .state{vertical-align:2px;margin-left:4px}

/* ---------- apps ---------- */
.suite{display:flex;flex-direction:column;gap:10px}
.suitehead{display:flex;gap:12px;align-items:center;text-decoration:none}
.suitehead img{width:48px;height:48px;border-radius:14px;flex:0 0 auto;background:var(--t-headicon,#241e2b)}
.suitehead b{display:block;font-weight:500;font-size:1.05rem}
.suitehead span{display:block;font-size:.8rem;color:var(--muted)}
.applist{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
.appbtn{display:flex;flex-direction:column;gap:2px;background:var(--t-field,#0B0B0E);border:1px solid var(--faint);border-radius:14px;padding:10px 12px;text-decoration:none;min-height:62px;min-width:0}
.appbtn b{font-weight:500;font-size:.92rem;display:flex;align-items:flex-start;gap:6px}
.appbtn b::before{content:"";width:8px;height:8px;border-radius:50%;background:var(--cc);flex:0 0 auto;margin-top:.45em}
.appbtn span{font-size:.76rem;color:var(--muted);overflow-wrap:anywhere}
.appbtn:hover{border-color:var(--edge)}

/* ---------- projects ---------- */
.projhead{display:flex;align-items:flex-start;justify-content:space-between;gap:10px;margin:2px 0 12px;flex-wrap:wrap}
.projhead h2{margin:0;font-size:1.35rem;font-weight:500}
.kv{display:flex;flex-wrap:wrap;gap:6px 14px;font-size:.82rem;color:var(--muted)}
.kv b{color:var(--ink);font-weight:500}

/* ---------- backup ---------- */
.bkgrid{display:grid;grid-template-columns:minmax(0,1fr);gap:8px}
.bkapp{display:flex;gap:10px;align-items:flex-start;background:var(--t-field,#0B0B0E);border:1px solid var(--faint);border-radius:14px;padding:10px 12px}
.bkapp .main{flex:1;min-width:0}
.bkapp b{font-weight:500}
.bkapp .m{font-size:.78rem;color:var(--muted);overflow-wrap:anywhere}
.state{font-size:.72rem;font-weight:700;padding:2px 8px;border-radius:999px;white-space:nowrap;flex:0 0 auto}
.state.ok{background:color-mix(in srgb,var(--green) 16%,transparent)}
.state.chg{color:var(--gold);background:color-mix(in srgb,var(--gold) 16%,transparent)}
.state.err{color:var(--red);background:color-mix(in srgb,var(--red) 16%,transparent)}
.state.none{color:var(--muted);background:var(--t-track,#1B1B20)}
.meter{height:8px;background:var(--t-track,#2A2A31);border-radius:999px;overflow:hidden;margin:6px 0 4px}
.meter > div{height:100%;background:var(--grad)}
.sw{display:flex;align-items:center;justify-content:space-between;gap:12px;background:var(--t-field,#0B0B0E);border:1px solid var(--faint);border-radius:14px;padding:12px 14px;min-height:56px;cursor:pointer}
.sw span{flex:1;min-width:0}
.sw small{display:block;color:var(--muted);font-size:.8rem}
.sw input{appearance:none;width:46px;height:28px;border-radius:999px;background:var(--t-edge,#3B3B43);position:relative;flex:0 0 auto;cursor:pointer;margin:0}
.sw input::after{content:"";position:absolute;top:3px;left:3px;width:22px;height:22px;border-radius:50%;background:var(--t-knob,#F2F2F4);transition:left .15s}
.sw input:checked{background:var(--grad)}
.sw input:checked::after{left:21px;background:var(--t-on-grad,#17161C)}
.sw input:disabled{opacity:.4}

/* ---------- sheets ---------- */
dialog{border:0;padding:0;background:var(--raised);color:var(--ink);width:100%;max-width:600px;margin:auto auto 0;border-radius:20px 20px 0 0;max-height:92vh;max-height:92dvh;font-family:var(--font)}
@media (min-width:600px){dialog{margin:auto;border-radius:20px}}
dialog::backdrop{background:var(--t-backdrop,rgba(0,0,0,.62))}
.sheet{padding:20px 20px calc(20px + env(safe-area-inset-bottom,0px));display:flex;flex-direction:column;gap:12px}
.sheet h2{margin:0;font-size:1.15rem;font-weight:700;display:flex;justify-content:space-between;align-items:center;gap:8px}
.sheet h4{margin:6px 0 -4px;font-size:.8rem;font-weight:500;color:var(--accent)}
.sheet p{margin:0}
.sheet .note{font-size:.85rem;color:var(--muted);line-height:1.45}
.sheet label{display:flex;flex-direction:column;gap:6px;font-size:.85rem;color:var(--muted);min-width:0}
.sheet input:not([type="checkbox"]),.sheet select,.sheet textarea{background:var(--field);border:0;border-radius:12px;padding:12px;color:var(--ink);min-height:48px;width:100%;min-width:0}
.sheet textarea{min-height:96px;resize:vertical}
.sheet .check{flex-direction:row;align-items:center;gap:10px;color:var(--ink);font-size:.95rem}
.sheet .check input{width:20px;height:20px;accent-color:var(--accent);flex:0 0 auto}
.f2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.f3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px}
.seg{display:flex;gap:4px;overflow-x:auto;scrollbar-width:none;background:var(--field);border-radius:14px;padding:4px}
.seg::-webkit-scrollbar{display:none}
.seg button{flex:1 0 auto;padding:9px 12px;border-radius:10px;color:var(--muted);font-size:.88rem;min-height:40px;white-space:nowrap}
.seg button[aria-pressed="true"],.seg button[aria-checked="true"]{background:var(--grad);color:var(--t-on-grad,#17161C);font-weight:500}
.kinds{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}
.kinds button{padding:10px 4px;border-radius:12px;background:var(--field);color:var(--cc);font-weight:500;font-size:.88rem}
.kinds button[aria-pressed="true"]{background:color-mix(in srgb,var(--cc) 22%,var(--field));outline:1px solid var(--cc)}
.hint{font-size:.82rem;color:var(--red);min-height:1em;margin:0}
.sbar{display:flex;justify-content:space-between;gap:8px;margin-top:4px;flex-wrap:wrap}
.calc{background:var(--t-info-bg,#12141B);border:1px solid var(--t-info-line,#232838);border-radius:12px;padding:10px 12px;font-size:.86rem;color:var(--muted);line-height:1.5}
.calc b{color:var(--ink);font-weight:500}
.pre{background:var(--field);border-radius:12px;padding:12px;font-family:var(--mono);font-size:.8rem;white-space:pre-wrap;overflow-wrap:anywhere;max-height:44vh;overflow:auto;margin:0}
.cmdrow{background:var(--field);border-radius:12px;padding:10px 12px;display:flex;flex-direction:column;gap:6px}
.cmdrow .cmd{font-family:var(--mono);font-size:.8rem;white-space:pre-wrap;overflow-wrap:anywhere}
.cmdrow .cmd .v{color:var(--gold)}
.cmdrow .cmd .f{color:var(--green)}
.picklist{display:flex;flex-direction:column;gap:6px;max-height:48vh;overflow:auto}
.pick{display:flex;gap:10px;align-items:flex-start;background:var(--field);border-radius:12px;padding:10px 12px;cursor:pointer}
.pick input{width:20px;height:20px;accent-color:var(--accent);margin-top:2px;flex:0 0 auto}
.pick .m{font-size:.78rem;color:var(--muted)}
.res{display:block;width:100%;text-align:left;background:var(--field);border-radius:12px;padding:10px 12px;font-size:.9rem}
.res small{display:block;color:var(--muted);font-size:.78rem}
.res.hit{cursor:pointer;border:1.5px solid var(--faint);color:inherit}
.res.hit:hover,.res.hit:focus-visible{border-color:var(--edge)}
.res.hit b{font-weight:500;overflow-wrap:anywhere}
.res.hit .mono{font-size:.76rem;overflow-wrap:anywhere}
.res .have{color:var(--accent2)}
.hithead{display:block;color:var(--muted);font-size:.78rem}
.linkbtn{background:none;border:0;padding:0;color:var(--accent2);font:inherit;text-decoration:underline;cursor:pointer}
.spin{display:inline-block;width:14px;height:14px;border:2px solid var(--edge);border-top-color:var(--accent);border-radius:50%;animation:sp .8s linear infinite;vertical-align:-2px;margin-right:6px}
@keyframes sp{to{transform:rotate(360deg)}}
.toast{position:fixed;left:50%;bottom:calc(96px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--t-raised2,#26262C);color:var(--ink);padding:10px 16px;border-radius:12px;font-size:.9rem;opacity:0;pointer-events:none;transition:opacity .2s;max-width:92vw;text-align:center;z-index:20;display:flex;gap:12px;align-items:center}
.toast.show{opacity:1;pointer-events:auto}
.toast a{color:var(--accent);font-weight:500;text-decoration:none;white-space:nowrap}
@media (min-width:900px){.toast{bottom:28px}}

<script>
"use strict";
/* =====================================================================
   {{APP_NAME}} control center (adapted from the CompChemKit control
   center by A. R. V. Pinto, MIT licence)
   Reads every app's data from this browser's storage, shows the day,
   projects and search across apps, syncs through GitHub (suite-sync.js)
   and backs everything up to a file.
   ===================================================================== */

/* ---------------- basics ---------------- */
const $=s=>document.querySelector(s), $$=(s,r)=>[...(r||document).querySelectorAll(s)];
const esc=s=>String(s??"").replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[m]));
const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,7);
const DAY=864e5, HOUR=36e5;
const arr=v=>Array.isArray(v)?v:[];
const obj=v=>v&&typeof v==="object"&&!Array.isArray(v)?v:{};
const num=v=>{const n=parseFloat(v);return isFinite(n)?n:null};
const clone=o=>JSON.parse(JSON.stringify(o));
const has=(o,k)=>Object.prototype.hasOwnProperty.call(o,k);
function localDate(ms){const d=new Date(ms);d.setMinutes(d.getMinutes()-d.getTimezoneOffset());return d.toISOString().slice(0,10)}
const todayStr=()=>localDate(Date.now());
const dayMs=d=>new Date(d+"T12:00").getTime();
const shortDate=d=>new Date(d+"T12:00").toLocaleDateString("en-GB",{day:"numeric",month:"short"});
const longDate=d=>new Date(d+"T12:00").toLocaleDateString("en-GB",{weekday:"short",day:"numeric",month:"short",...(String(d).slice(0,4)===String(new Date().getFullYear())?{}:{year:"numeric"})});
const fmtWhen=t=>new Date(t).toLocaleString("en-GB",{day:"numeric",month:"short",hour:"2-digit",minute:"2-digit"});
const fmtTime=t=>new Date(t).toLocaleTimeString("en-GB",{hour:"2-digit",minute:"2-digit"});
function ago(t){
  if(!t) return "never";
  const s=(Date.now()-t)/1000;
  if(s<60) return "just now"; if(s<3600) return Math.floor(s/60)+" min ago"; if(s<86400) return Math.floor(s/3600)+" h ago";
  const d=Math.floor(s/86400); return d===1?"yesterday":d+" days ago";
}
function fmtDur(ms){const neg=ms<0;ms=Math.abs(ms);const d=Math.floor(ms/DAY),h=Math.floor(ms%DAY/HOUR),m=Math.floor(ms%HOUR/6e4);const s=d?`${d}d ${h}h`:h?`${h}h ${m}m`:`${m}m`;return neg?"-"+s:s}
const fmtN=n=>n==null||!isFinite(n)?"":(Math.abs(n)>=1e4?Math.round(n).toLocaleString("en-GB"):(+(+n).toFixed(2)).toLocaleString("en-GB"));
const f3=n=>n==null||!isFinite(n)?"-":n>=100?Math.round(n).toLocaleString("en-GB"):(+n.toPrecision(3)).toLocaleString("en-GB");
const size=b=>b<1024?b+" B":b<1048576?(b/1024).toFixed(b<10240?1:0)+" KB":(b/1048576).toFixed(1)+" MB";
const plural=(n,w,p)=>`${n.toLocaleString("en-GB")} ${n===1?w:(p||w+"s")}`;
const safeUrl=u=>/^https?:\/\//i.test(String(u||"").trim())?String(u).trim():"";
const firstLine=(t,n)=>String(t||"").split("\n")[0].trim().slice(0,n||80);
const clip=(t,n)=>{t=String(t||"").replace(/\s+/g," ").trim();return t.length>n?t.slice(0,n-1)+"…":t};

let _tt=null;
function toast(t,link){
  const el=$("#toast");
  el.innerHTML=`<span>${esc(t)}</span>`+(link?`<a href="${esc(link.href)}">${esc(link.label||"Open")}</a>`:"");
  el.classList.add("show"); clearTimeout(_tt); _tt=setTimeout(()=>el.classList.remove("show"),link?5200:2600);
}
async function copyText(t,msg){
  try{await navigator.clipboard.writeText(t);toast(msg||"Copied")}
  catch(_){const a=document.createElement("textarea");a.value=t;document.body.appendChild(a);a.select();
    try{document.execCommand("copy");toast(msg||"Copied")}catch(__){toast("Copy not available")}a.remove()}
}
function saveFile(filename,data,type){
  try{
    const blob=data instanceof Blob?data:new Blob([data],{type:(type||"application/json")+";charset=utf-8"});
    const url=URL.createObjectURL(blob), a=document.createElement("a");
    a.href=url;a.download=filename;a.style.display="none";document.body.appendChild(a);a.click();a.remove();
    setTimeout(()=>URL.revokeObjectURL(url),15000);
    return true;
  }catch(_){toast("Couldn't save the file");return false}
}

/* ---------------- the suites and what each app keeps ----------------
   Mirrors BACKUP_APPS in each suite file, so backups made here are the
   same files the suites make and can be restored from either place. */
const SUITES=[
 {id:"lab-notebook",title:"Lab notebook",apps:[
  {id:"log",label:"Log",name:"Research log",file:"research-log",keys:["researchlog.v1"],reminder:"research-log",color:"--blue"},
  {id:"tasks",label:"Tasks",name:"Tasks",file:"task-list",keys:["tasks.v1"],reminder:"task-list",color:"--green"},
  {id:"ideas",label:"Ideas",name:"Idea board",file:"idea-board",keys:["ideaboard.v1"],reminder:"idea-board",color:"--violet"},
  {id:"plans",label:"Script plans",name:"Script planner",file:"script-planner",keys:["scriptplans.v1"],reminder:"script-planner",color:"--pink"},
  {id:"deadlines",label:"Deadlines",name:"Deadline tracker",file:"deadline-tracker",keys:["deadlines.v1"],reminder:"deadline-radar",color:"--gold"}]},
 {id:"literature-hub",title:"Literature hub",apps:[
  {id:"radar",label:"Radar",name:"Literature radar",file:"literature-radar",keys:["litradar.v1","net.mailto"],reminder:"lit-radar",color:"--teal"},
  {id:"citations",label:"Citations",name:"Citation tracker",file:"citation-tracker",keys:["citedash.v1","net.mailto"],reminder:"cite-dash",color:"--violet"}]},
 {id:"structure-studio",title:"Structure studio",apps:[
  {id:"viewer",label:"Viewer",name:"Structure viewer",file:"structure-viewer",keys:["structviewer.prefs"],color:"--sky"}]},
 {id:"paper-kit",title:"Paper kit",apps:[
  {id:"plots",label:"Plot guide",name:"Python plot guide",color:"--sky",blurb:"Pick a plot type and its code"},
  {id:"schemes",label:"Schemes",name:"Mechanism scheme editor",file:"mechanism-scheme-editor",keys:[],prefixes:["mech."],color:"--pink"}]},
 {id:"control-center",title:"Control center",hidden:true,apps:[
  {id:"settings",label:"Control center",name:"Control center settings",file:"settings",keys:["controlcenter.v1"],color:"--accent"}]}
];
const APPS=/*APPS*/[];
for(const s of SUITES) for(const a of s.apps){a.suite=s;a.keys=a.keys||[];a.prefixes=a.prefixes||[];a.reminder=a.reminder||"";APPS.push(a)}
const DATA_APPS=APPS.filter(a=>a.file);
const APP=(s,id)=>APPS.find(a=>a.suite.id===s&&a.id===id);
const A={log:APP("lab-notebook","log"),tasks:APP("lab-notebook","tasks"),ideas:APP("lab-notebook","ideas"),plans:APP("lab-notebook","plans"),deadlines:APP("lab-notebook","deadlines"),
  radar:APP("literature-hub","radar"),citations:APP("literature-hub","citations"),
  viewer:APP("structure-studio","viewer"),schemes:APP("paper-kit","schemes"),
  settings:APP("control-center","settings")};
const cc=a=>`var(${a.color||"--muted"})`;
/* link into a suite, optionally filtered to one item (needs the live-sync patch in the suite) */
function href(a,opt){
  if(a.suite.id==="control-center") return "control-center.html";
  const q=new URLSearchParams(); if(opt&&opt.find) q.set("find",opt.find); if(opt&&opt.pick) q.set("pick",opt.pick);
  const s=q.toString(); return `${a.suite.id}.html${s?"?"+s:""}#${a.id}`;
}

/* open a structure in the viewer: structure-studio.html?load=pdb:5XJH#viewer (af:ACCESSION for AlphaFold) */
const viewerHref=(src,id)=>`structure-studio.html?load=${encodeURIComponent(src+":"+id)}#viewer`;
/* ---------------- browser storage ---------------- */
/* kept on this device only, never written into backup files */
const PRIVATE_KEYS=new Set(["net.openalexKey"]);
const isPrivate=k=>PRIVATE_KEYS.has(k)||String(k).startsWith("sync.");
const SYNC=()=>window.SuiteSync||null;
const LS={
  keys(){const out=[];try{for(let i=0;i<localStorage.length;i++){const k=localStorage.key(i);if(k!=null)out.push(k)}}catch(_){}return out},
  get(k){try{return localStorage.getItem(k)}catch(_){return null}},
  set(k,v){localStorage.setItem(k,v)},
  del(k){try{localStorage.removeItem(k)}catch(_){}},
  json(k,fb){try{const r=localStorage.getItem(k);return r?JSON.parse(r):fb}catch(_){return fb}}
};
const STORAGE_OK=(()=>{try{const k="__cc"+Math.random();localStorage.setItem(k,"1");localStorage.removeItem(k);return true}catch(_){return false}})();
const owned=(a,k)=>a.keys.includes(k)||a.prefixes.some(p=>k.startsWith(p));
const keysOf=a=>LS.keys().filter(k=>owned(a,k)).sort();
function snapshot(a){
  const json={}, text={};
  for(const k of keysOf(a)){const v=LS.get(k);if(v==null)continue;try{json[k]=JSON.parse(v)}catch(_){text[k]=v}}
  return {json,text};
}
/* identical to the suites' fingerprint, so both sides agree on "changed since the last backup" */
function fingerprint(a){
  let h=0x811c9dc5;
  for(const k of keysOf(a)){const v=k+"\u0000"+(LS.get(k)||"")+"\u0001";
    for(let i=0;i<v.length;i++){h^=v.charCodeAt(i);h=Math.imul(h,0x01000193)>>>0}}
  return h.toString(16);
}
function payloadOf(a){
  const {json,text}=snapshot(a);
  if(!Object.keys(json).length&&!Object.keys(text).length) return null;
  return {format:"suite-backup",version:1,suite:a.suite.id,suiteTitle:a.suite.title,app:a.file,label:a.label,saved:new Date().toISOString(),json,text};
}
const bytesOfKey=k=>(k.length+(LS.get(k)||"").length)*2;
const bytesOf=a=>keysOf(a).reduce((n,k)=>n+bytesOfKey(k),0);
const ownedByAny=k=>DATA_APPS.some(a=>owned(a,k));
function suiteState(id){let s=LS.json("suite."+id+".backup",null);if(!s||typeof s!=="object")s={on:false,apps:{}};if(!s.apps||typeof s.apps!=="object")s.apps={};return s}
function setSuiteState(id,fn){const s=suiteState(id);fn(s);try{LS.set("suite."+id+".backup",JSON.stringify(s))}catch(_){}}

/* control center settings (backed up like an app) and view state (not backed up) */
const SET_KEY="controlcenter.v1";
const SETDEF={auto:false,mine:true,projects:{},digestDays:7};
function settings(){const s=LS.json(SET_KEY,null);return {...SETDEF,...obj(s)}}
function saveSettings(patch){const s={...settings(),...patch};try{LS.set(SET_KEY,JSON.stringify(s))}catch(_){toast("Couldn't save the setting")}if(window.SuiteSync)window.SuiteSync.changed();return s}
const UI={get(k,fb){const v=LS.json("controlcenter.ui",{});return has(obj(v),k)?v[k]:fb},set(k,val){const v=obj(LS.json("controlcenter.ui",{}));v[k]=val;try{LS.set("controlcenter.ui",JSON.stringify(v))}catch(_){}}};

/* ---------------- backup server (serve_apps.py) ----------------
   Static hosts such as GitHub Pages never run it, so they are not asked. */
const STATIC_HOST=/(^|\.)(github\.io|gitlab\.io|netlify\.app|pages\.dev|vercel\.app|codeberg\.page)$/i.test(location.hostname);
const SRV={
  ok:null, dir:"", keep:null, files:{}, listed:0, cache:new Map(),
  http:location.protocol==="http:"||location.protocol==="https:",
  async ping(){
    if(!this.http||STATIC_HOST){this.ok=false;return false}
    try{const r=await fetch("/api/backup/ping",{cache:"no-store"});const j=r.ok?await r.json():{};this.ok=j.ok===true;this.dir=j.dir||"";this.keep=j.keep??null}
    catch(_){this.ok=false}
    return this.ok;
  },
  async listAll(){
    if(!this.ok) return this.files;
    const out={};
    await Promise.all(SUITES.map(async s=>{
      try{const r=await fetch(`/api/backup/list?suite=${encodeURIComponent(s.id)}`,{cache:"no-store"});const j=await r.json();out[s.id]=j.ok?arr(j.files):[]}
      catch(_){out[s.id]=[]}
    }));
    this.files=out; this.listed=Date.now(); return out;
  },
  filesOf(a){return arr(this.files[a.suite.id]).filter(f=>f.app===a.file)},
  latest(a,upTo){return this.filesOf(a).filter(f=>!f.tag&&(!upTo||f.date<=upTo))[0]||null},
  dates(){const s=new Set();for(const a of DATA_APPS)this.filesOf(a).forEach(f=>{if(!f.tag)s.add(f.date)});return [...s].sort().reverse()},
  async read(name){
    if(this.cache.has(name)) return this.cache.get(name);
    const r=await fetch("/"+encodeURIComponent(name),{cache:"no-store"});
    if(!r.ok) throw new Error("HTTP "+r.status);
    const j=await r.json(); this.cache.set(name,j); return j;
  },
  async save(a,payload,tag){
    const r=await fetch("/api/backup/save",{method:"POST",headers:{"Content-Type":"application/json"},
      body:JSON.stringify({suite:a.suite.id,app:a.file,tag:tag||"",payload})});
    let j={}; try{j=await r.json()}catch(_){}
    if(!r.ok||!j.ok) throw new Error(j.error||("HTTP "+r.status));
    this.cache.delete(j.file);
    return j.file;
  }
};

/* ---------------- where the data comes from ----------------
   auto:   this device; apps with nothing stored here fall back to their latest backup
   backup: latest backup of every app on the server (read only)
   file:   backup files picked by hand (read only)                           */
const SRC={mode:"auto",files:{},names:[]};
let SNAP={}, D=null, GEN=0;
async function loadData(){
  const snaps={}, jobs=[];
  for(const a of DATA_APPS){
    if(SRC.mode==="file"){
      const p=SRC.files[a.suite.id+"/"+a.file];
      if(p) snaps[a.file]={src:"file",json:obj(p.json),text:obj(p.text),saved:p.saved||"",name:p.__name||""};
      continue;
    }
    if(SRC.mode==="auto"){
      const s=snapshot(a);
      if(Object.keys(s.json).length||Object.keys(s.text).length){snaps[a.file]={src:"live",...s};continue}
    }
    const f=SRV.ok?SRV.latest(a):null;
    if(f) jobs.push(SRV.read(f.file).then(p=>{
      if(p&&p.format==="suite-backup"&&p.app===a.file) snaps[a.file]={src:"backup",json:obj(p.json),text:obj(p.text),saved:p.saved||f.date,name:f.file};
    }).catch(()=>{}));
  }
  await Promise.all(jobs);
  SNAP=snaps; D=buildModel(); GEN++;
}
function V(key,fb){
  for(const a of DATA_APPS){
    if(!owned(a,key)) continue;
    const s=SNAP[a.file]; if(!s) continue;
    if(has(s.json,key)) return s.json[key];
    if(has(s.text,key)) return s.text[key];
  }
  return fb;
}
const srcOf=a=>SNAP[a.file]?SNAP[a.file].src:"none";
const canWrite=a=>SRC.mode==="auto"&&STORAGE_OK&&(!SNAP[a.file]||SNAP[a.file].src==="live");

/* ---------------- one model of everything ---------------- */
const RADAR_DEF={mode:"days",days:45,from:"",to:"",types:[],oa:false,abs:false,en:false,minCites:0,sort:"date",max:100};
function buildModel(){
  const lg=obj(V("researchlog.v1")), rd=obj(V("litradar.v1")), cd=obj(V("citedash.v1")), idx=obj(V("mech.index")), tk=obj(V("tasks.v1"));
  const ok=x=>x&&typeof x==="object";
  const M={
    entries:arr(lg.entries).filter(ok), lastProj:lg.lastProj||"",
    ideas:arr(V("ideaboard.v1")).filter(ok),
    plans:arr(obj(V("scriptplans.v1")).plans).filter(ok),
    deadlines:arr(obj(V("deadlines.v1")).items).filter(ok),
    tasks:arr(tk.items).filter(x=>ok(x)&&x.title),
    topics:arr(rd.topics).filter(ok), works:arr(rd.works).filter(ok), rf:{...RADAR_DEF,...obj(rd.filters)}, radarRun:rd.lastRun||0,
    saved:arr(rd.saved).filter(x=>ok(x)&&x.title),
    author:ok(cd.author)?cd.author:null, cworks:arr(cd.works).filter(ok), snaps:arr(cd.snaps).filter(ok), citeRun:cd.lastRun||0,
    schemes:Object.entries(idx).map(([id,v])=>({id,name:(v&&v.name)||"Scheme",updated:(v&&v.updated)||0})).sort((a,b)=>b.updated-a.updated),
    mailto:String(V("net.mailto","")||"")
  };
  M.meetings=M.entries.filter(e=>e.kind==="meeting");
  M.actions=M.meetings.flatMap(m=>arr(m.actions).filter(ok).map(a=>({a,m})));
  M.unseen=M.works.filter(w=>!w.seen&&radarPasses(w,M.rf));
  return M;
}

/* ---------------- app rules, kept the same as inside the apps ---------------- */
const LOG_KINDS=[{id:"note",name:"Note",c:"--muted"},{id:"result",name:"Result",c:"--green"},{id:"problem",name:"Problem",c:"--red"},
  {id:"fix",name:"Fix",c:"--teal"},{id:"decision",name:"Decision",c:"--gold"},{id:"idea",name:"Idea",c:"--violet"}];
const logKind=k=>LOG_KINDS.find(x=>x.id===k)||(k==="meeting"?{id:"meeting",name:"Meeting",c:"--accent"}:LOG_KINDS[0]);
const MTYPES={group:"Group meeting",supervision:"Supervision",collab:"Collaboration",seminar:"Seminar or talk",oneone:"One-to-one",other:"Other"};
const IDEA_STAGES=[{id:"spark",name:"Sparks"},{id:"explore",name:"Exploring"},{id:"doing",name:"Doing"},{id:"done",name:"Done"}];

/* tasks: the same ranking as the Tasks app. points = priority (low 10, medium 20, high 35)
   + due date (overdue +45, today +35, tomorrow +28, 2-3 days +20, 4-7 days +12, 8-14 days +6)
   + 5 when planned for today or carried over; 60+ do now, 35+ urgent, 20+ normal */
const TPRIO={low:{n:"Low",w:10,c:"--muted"},medium:{n:"Medium",w:20,c:"--sky"},high:{n:"High",w:35,c:"--red"}};
const TLEVELS={critical:{n:"Do now",c:"--red"},urgent:{n:"Urgent",c:"--gold"},normal:{n:"Normal",c:"--sky"},low:{n:"Can wait",c:"--muted"}};
const daysTo=d=>Math.round((dayMs(d)-dayMs(todayStr()))/DAY);
function taskUrgency(t){
  const T=todayStr(), p=TPRIO[t.prio]||TPRIO.medium; let s=p.w; const why=[p.n.toLowerCase()+" priority"];
  if(t.due){const n=daysTo(t.due);
    if(n<0){s+=45;why.push(n===-1?"due yesterday":`${-n} days overdue`)}
    else if(n===0){s+=35;why.push("due today")}
    else if(n===1){s+=28;why.push("due tomorrow")}
    else if(n<=3){s+=20;why.push(`due in ${n} days`)}
    else if(n<=7){s+=12;why.push(`due in ${n} days`)}
    else if(n<=14){s+=6;why.push(`due in ${n} days`)}}
  if(t.plan&&t.plan<=T){s+=5;why.push(t.plan<T?"carried over":"planned for today")}
  return {s,lvl:s>=60?"critical":s>=35?"urgent":s>=20?"normal":"low",why:why.join(", ")};
}
const taskToday=t=>!t.done&&((t.plan&&t.plan<=todayStr())||(t.due&&t.due<=todayStr()));
const taskOverdue=t=>!t.done&&!!t.due&&t.due<todayStr();

function actDue(a){
  if(a.done||!a.due) return "";
  if(a.due<todayStr()) return "overdue";
  return a.due<=localDate(Date.now()+3*DAY)?"soon":"";
}
const dlWhen=i=>new Date(i.date+"T"+(i.time||"23:59")).getTime();
function dlCountdown(i,now){
  const ms=dlWhen(i)-now;
  if(ms<0) return {t:"passed",cls:"over"};
  const d=Math.floor(ms/DAY), h=Math.floor(ms%DAY/HOUR);
  return {t:d>0?`${d} day${d===1?"":"s"}`:`${h} h`,cls:d<=7?"soon":""};
}
function radarPasses(w,f){
  const dstr=d=>new Date(d).toISOString().slice(0,10);
  const win=f.mode==="range"?{from:f.from||"",to:f.to||""}:{from:dstr(Date.now()-Math.max(1,f.days|0)*DAY),to:""};
  if(win.from&&w.date&&w.date<win.from) return false;
  if(win.to&&w.date&&w.date>win.to) return false;
  if(arr(f.types).length&&w.type&&!f.types.includes(w.type)) return false;
  if(f.oa&&w.oa===false) return false;
  if(f.abs&&!w.abs) return false;
  if(f.en&&w.lang&&w.lang!=="en") return false;
  if(f.minCites>0&&(w.cites||0)<f.minCites) return false;
  return true;
}
/* ---------------- writing into the apps ----------------
   Always read, change and write back the freshest stored copy in one step.
   The patched suites reload an app when its data changes from here. */
function mutate(a,key,def,fn){
  if(!STORAGE_OK) throw new Error("Browser storage is blocked here");
  if(!canWrite(a)) throw new Error(`${a.name} is showing a backup. Restore it or switch to live data first.`);
  let d=null; try{const r=localStorage.getItem(key); d=r?JSON.parse(r):null}catch(_){throw new Error(`${a.name} data could not be read`)}
  if(d===null) d=clone(def);
  else if(typeof d!=="object"||Array.isArray(d)!==Array.isArray(def)) throw new Error(`${a.name} data has an unexpected shape; open the app instead`);
  const out=fn(d);
  try{localStorage.setItem(key,JSON.stringify(d))}catch(_){throw new Error("Couldn't save: storage is full or blocked")}
  return out;
}
async function write(a,key,def,fn,msg,link){
  let out;
  try{out=mutate(a,key,def,fn)}catch(e){toast(e&&e.message?e.message:"Couldn't save");return false}
  if(SYNC()) SYNC().changed();
  await refresh(false);
  if(msg) toast(msg,link);
  autoSoon();
  return out===undefined?true:out;
}

const normDoi=s=>{s=String(s||"").trim().replace(/^doi:\s*/i,"").replace(/^https?:\/\/(dx\.)?doi\.org\//i,"");try{s=decodeURIComponent(s)}catch(_){}return s.trim()};
const validDoi=d=>/^10\.\d{4,9}\/\S+$/.test(d);
function withMail(url){const m=D&&D.mailto;return m?url+(url.includes("?")?"&":"?")+"mailto="+encodeURIComponent(m):url}
async function getJSON(url){
  const c=new AbortController(), t=setTimeout(()=>c.abort(),20000);
  try{const r=await fetch(withMail(url),{signal:c.signal,headers:{Accept:"application/json"}});if(!r.ok)throw new Error("HTTP "+r.status);return await r.json()}
  catch(e){throw new Error(e&&e.name==="AbortError"?"The service did not answer in time":e&&/HTTP/.test(e.message)?e.message:"No connection, or the service refused the request")}
  finally{clearTimeout(t)}
}
const yearOf=m=>{for(const k of ["issued","published-print","published-online","posted"]){const y=(((m[k]||{})["date-parts"]||[[]])[0]||[])[0];if(y)return String(y)}return ""};
function fromCrossref(m){
  const au=(m.author||[]).map(a=>a.family?`${a.family}, ${(a.given||"").split(/\s+/).map(x=>x[0]?x[0]+".":"").join(" ")}`.trim():(a.name||"")).filter(Boolean);
  const server=(m.institution&&m.institution[0]&&m.institution[0].name)||"";
  return {title:(m.title&&m.title[0]||"").replace(/\s+/g," ").trim(),authors:au.join("; "),
    venue:(m["container-title"]&&m["container-title"][0])||(m.type==="posted-content"?(server||"Preprint"):server),
    year:yearOf(m),doi:(m.DOI||"").toLowerCase(),type:m.type||"",
    cites:typeof m["is-referenced-by-count"]==="number"?m["is-referenced-by-count"]:null};
}
/* Crossref only accepts its own list of fields in select, and answers 400 to anything else */
const CR_ROWS=10, CR_MAX=100;
const CR_SEL="DOI,title,author,container-title,issued,published-print,published-online,posted,type,is-referenced-by-count";
async function crossrefSearch(q,offset){
  const base=`https://api.crossref.org/works?rows=${CR_ROWS}&offset=${offset||0}&query.bibliographic=${encodeURIComponent(q)}`;
  let r;
  try{r=await getJSON(base+"&select="+CR_SEL)}
  catch(e){if(/HTTP 400/.test(e.message))r=await getJSON(base);else throw e}
  const m=(r&&r.message)||{};
  return {hits:arr(m.items).map(fromCrossref).filter(x=>x.title),total:+m["total-results"]||0};
}
async function crossrefDoi(doi){
  const r=await getJSON(`https://api.crossref.org/works/${encodeURIComponent(doi)}`);
  return fromCrossref((r&&r.message)||{});
}

/* ---------------- recent structures (structure viewer, IndexedDB) ---------------- */
const IDB={
  async exists(){try{if(indexedDB.databases){const l=await indexedDB.databases();return l.some(d=>d.name==="structviewer")}}catch(_){}return true},
  open(){return new Promise((res,rej)=>{let r;try{r=indexedDB.open("structviewer",1)}catch(e){rej(e);return}
    r.onupgradeneeded=()=>r.result.createObjectStore("files",{keyPath:"name"});r.onsuccess=()=>res(r.result);r.onerror=()=>rej(r.error)})},
  async meta(){
    try{ if(!(await this.exists())) return [];
      const db=await this.open();
      return await new Promise(res=>{const out=[];const q=db.transaction("files").objectStore("files").openCursor();
        q.onsuccess=()=>{const c=q.result;if(!c){res(out.sort((a,b)=>b.at-a.at));return}const v=c.value||{};out.push({name:v.name,fmt:v.fmt,at:v.at||0,size:v.size||(v.text||"").length});c.continue()};
        q.onerror=()=>res(out)});
    }catch(_){return []}
  },
  async all(){
    try{ if(!(await this.exists())) return [];
      const db=await this.open();
      return await new Promise(res=>{const q=db.transaction("files").objectStore("files").getAll();q.onsuccess=()=>res(q.result||[]);q.onerror=()=>res([])});
    }catch(_){return []}
  },
  async put(items){
    const db=await this.open();
    await new Promise((res,rej)=>{const tx=db.transaction("files","readwrite"),s=tx.objectStore("files");
      items.forEach(x=>{if(x&&x.name&&typeof x.text==="string")s.put(x)});tx.oncomplete=res;tx.onerror=()=>rej(tx.error)});
  }
};

function attentionCount(){
  const now=Date.now(), mine=settings().mine; let n=0;
  D.deadlines.forEach(i=>{if(!i.done&&dlWhen(i)<now)n++});
  D.actions.forEach(x=>{if(!x.a.done&&actDue(x.a)==="overdue"&&(!mine||isMe(x.a.owner)))n++});
  D.tasks.forEach(x=>{if(taskOverdue(x))n++});
  return n;
}
function backupSummary(){
  const out={changed:[],never:[],err:[],ok:[],none:[]};
  for(const a of DATA_APPS){const s=bkState(a);(out[s.k]||out.none).push(a)}
  return out;
}
function bkState(a){
  const rec=obj(suiteState(a.suite.id).apps[a.file]);
  if(!keysOf(a).length) return {k:"none",rec};
  if(rec.err) return {k:"err",rec};
  if(!rec.fp) return {k:"never",rec};
  if(rec.fp!==fingerprint(a)) return {k:"changed",rec};
  return {k:"ok",rec};
}

  if(!t.done&&t.plan&&t.plan<T) meta.push(`<span>carried over</span>`);

  const side=opts.plan&&!t.done?`<div class="side"><button class="txtbtn" data-op="task-plan" data-id="${esc(t.id)}" data-day="${esc(T)}" ${disabled(A.tasks)}>Do today</button></div>`:"";
  return `<label class="row ${t.done?"done":""}" style="--cc:var(${p.c})"><input type="checkbox" data-op="task-done" data-id="${esc(t.id)}" ${t.done?"checked":""} ${disabled(A.tasks)} aria-label="Done">

/* ---------------- activity across apps ---------------- */
function activity(since,m){
  const out=[], P=m?m.proj:()=>true, T=m?m.text:()=>true;
  const add=(t,app,title,meta,link)=>{if(t&&t>=since)out.push({t,app,title,meta:meta||"",link:link||""})};
  for(const e of D.entries){
    if(!P(e.proj)) continue;
    const t=e.added&&localDate(e.added)===e.date?e.added:dayMs(e.date);
    if(e.kind==="meeting"){
      add(t,A.log,"Meeting: "+e.title,[MTYPES[e.mtype]||"",arr(e.people).join(", "),e.proj].filter(Boolean).map(esc).join(" · "),href(A.log,{find:e.title.slice(0,40),pick:"meetings"}));
      for(const a of arr(e.actions)) if(a&&a.done&&a.doneAt) add(a.doneAt,A.log,"Action done: "+a.text,esc(e.title));
    }else add(t,A.log,logKind(e.kind).name+": "+firstLine(e.text,140),esc(e.proj||""),href(A.log,{find:firstLine(e.text,40)}));
  }
  for(const x of D.tasks){
    if(!P(x.proj)) continue;
    const l=href(A.tasks,{find:x.title.slice(0,40),pick:x.done?"done":"all"});
    add(x.added,A.tasks,"Task added: "+x.title,esc(x.proj||""),l);
    if(x.done&&x.doneAt) add(x.doneAt,A.tasks,"Task done: "+x.title,esc(x.proj||""),l);
  }
  for(const s of D.saved){
    if(m&&!T(s.title,s.topic)) continue;
    add(s.saved,A.radar,"Saved to read: "+s.title,[firstAuthor(s.authors),s.venue,(s.date||"").slice(0,4)].filter(Boolean).map(esc).join(" · "),s.doi?"https://doi.org/"+encodeURI(s.doi):href(A.radar,{pick:"saved"}));
  }
  for(const i of D.ideas){
    if(m&&!T(i.title,i.notes,arr(i.tags).join(" "))) continue;
    add(i.created,A.ideas,"New idea: "+i.title,"",href(A.ideas,{find:i.title.slice(0,40),pick:i.stage}));
    if(i.updated&&i.updated-(i.created||0)>6e4&&i.stage!=="spark") add(i.updated,A.ideas,`Idea in ${(IDEA_STAGES.find(s=>s.id===i.stage)||{}).name||i.stage}: ${i.title}`,"",href(A.ideas,{find:i.title.slice(0,40),pick:i.stage}));
  }
  for(const p of D.plans){ if(m&&!T(p.name,p.purpose,p.desc)) continue; add(p.updated,A.plans,`Script plan ${PLAN_STATUS[p.status]?PLAN_STATUS[p.status].toLowerCase():""}: ${p.name}`,esc(p.purpose||""),href(A.plans,{find:p.name.slice(0,40)})) }
  for(const i of D.deadlines){ if(m&&!T(i.title,i.notes)) continue; if(i.done) add(i.updated,A.deadlines,"Deadline done: "+i.title,esc(dlKind(i.kind).name)); add(i.added,A.deadlines,"Deadline added: "+i.title,esc(longDate(i.date))) }
  return out.sort((a,b)=>b.t-a.t);
}
function actRowsHTML(list){return list.map(x=>`<div class="row" style="--cc:${cc(x.app)}"><span class="bar"></span><div class="main"><div class="t">${x.link?`<a href="${esc(x.link)}">${esc(clip(x.title,160))}</a>`:esc(clip(x.title,160))}</div><div class="m"><span class="app">${esc(x.app.name)}</span><span>${esc(ago(x.t))}</span>${x.meta?`<span>${x.meta}</span>`:""}</div></div></div>`).join("")}

/* ---------------- TODAY ---------------- */
function renderToday(){
  const M=D, now=Date.now(), t=todayStr(), st=settings(), mine=st.mine;
  const wantAct=x=>!mine||isMe(x.a.owner);
  /* needs attention */
  const att=[];
  for(const i of M.deadlines) if(!i.done&&dlWhen(i)<now) att.push({t:dlWhen(i),h:dlRow(i,now)});
  for(const x of M.actions) if(!x.a.done&&actDue(x.a)==="overdue"&&wantAct(x)) att.push({t:dayMs(x.a.due),h:actRow(x)});
  for(const x of M.tasks) if(taskOverdue(x)) att.push({t:dayMs(x.due),h:taskRow(x)});
  att.sort((a,b)=>a.t-b.t);
  /* next 14 days */
  const end=now+14*DAY, endD=localDate(end), ag=[];
  for(const i of M.deadlines){const w=dlWhen(i); if(!i.done&&w>=now&&w<end) ag.push({d:i.date,t:w,h:dlRow(i,now)})}
  for(const x of M.actions) if(!x.a.done&&x.a.due&&x.a.due>=t&&x.a.due<=endD&&wantAct(x)) ag.push({d:x.a.due,t:dayMs(x.a.due)-1,h:actRow(x)});
  for(const x of M.tasks) if(!x.done&&x.due&&x.due>=t&&x.due<=endD) ag.push({d:x.due,t:dayMs(x.due)-2,h:taskRow(x)});
  ag.sort((a,b)=>a.t-b.t);
  const days=[...new Set(ag.map(x=>x.d))];
  const tomorrow=localDate(now+DAY);
  const agHTML=days.map(d=>`<div class="day"><div class="dayh ${d===t?"today":""}"><span>${d===t?"Today":d===tomorrow?"Tomorrow":esc(longDate(d))}</span></div><div class="rows">${ag.filter(x=>x.d===d).map(x=>x.h).join("")}</div></div>`).join("");
  /* tasks */
  const open=M.tasks.filter(x=>!x.done);
  const todayTasks=open.filter(x=>taskToday(x)&&!taskOverdue(x)).sort(byUrgency);
  const overdueN=open.filter(taskOverdue).length;
  const doneToday=M.tasks.filter(x=>doneOn(x)===t);
  const urgentN=open.filter(x=>taskUrgency(x).s>=35).length;
  const suggested=open.filter(x=>!taskToday(x)&&taskUrgency(x).s>=35).sort(byUrgency).slice(0,3);
  const totalToday=todayTasks.length+overdueN+doneToday.length;
  /* literature */
  const unseen=[...M.unseen].sort((a,b)=>(b.date||"").localeCompare(a.date||"")||(b.found||0)-(a.found||0));
  const toRead=M.saved.filter(s=>!s.read);
  const A_=M.author, lastSnap=M.snaps.length>1?M.snaps[M.snaps.length-2]:null, dC=A_&&lastSnap?(A_.cites||0)-(lastSnap.cites||0):0;
  const gained=M.cworks.filter(w=>w.prev!=null&&w.cites>w.prev).sort((a,b)=>(b.cites-b.prev)-(a.cites-a.prev)).slice(0,3);
  /* in progress */
  const doing=M.ideas.filter(i=>i.stage==="doing").sort((a,b)=>(b.updated||0)-(a.updated||0));
  const exploring=M.ideas.filter(i=>i.stage==="explore").length;
  const building=M.plans.filter(p=>p.status==="building"), planning=M.plans.filter(p=>p.status==="planning");
  const pinned=M.entries.filter(e=>e.pin).sort((a,b)=>(b.date||"").localeCompare(a.date||"")).slice(0,4);
  /* tiles */
  const end7=localDate(now+7*DAY);
  const next7=M.deadlines.filter(i=>!i.done&&dlWhen(i)>=now&&dlWhen(i)<now+7*DAY).length
    +M.actions.filter(x=>!x.a.done&&x.a.due&&x.a.due>=t&&x.a.due<=end7&&wantAct(x)).length
    +open.filter(x=>x.due&&x.due>=t&&x.due<=end7).length;
  const tile=(n,label,op,col,txt)=>`<button class="tile ${!n&&!txt?"zero":""}" data-op="${op}" style="${col&&n?`--tc:${col}`:""}"><b>${txt||n}</b><span>${label}</span></button>`;
  const ss=SYNC()?SYNC().status():null;
  let syncTile;
  if(SRV.ok){
    const bs=backupSummary(), pendingBk=bs.changed.length+bs.never.length;
    syncTile=tile(pendingBk,pendingBk?"not backed up":bs.ok.length?"all backed up":"nothing to back up","goto-backup",bs.err.length?"var(--red)":"var(--gold)",!bs.ok.length&&!pendingBk?"-":pendingBk?String(pendingBk):"✓");
  }else if(ss&&ss.configured){
    syncTile=ss.state==="error"?tile(1,"sync failed","goto-backup","var(--red)","!")
      :ss.state==="offline"?tile(1,"offline, will sync later","goto-backup","var(--gold)","…")
      :ss.pending?tile(ss.pending,ss.busy?"syncing":"waiting to sync","goto-backup","var(--gold)")
      :tile(0,ss.last?"synced "+ago(ss.last):"not synced yet","goto-backup","",ss.last?"✓":"-");
  }else syncTile=tile(0,"set up sync","goto-backup","","-");
  const tiles=`<div class="tiles">
    ${tile(att.length,"need attention","goto-attn","var(--red)")}
    ${tile(next7,"due in 7 days","goto-agenda","var(--gold)")}
    ${tile(todayTasks.length+overdueN,"tasks for today","goto-tasks","var(--green)")}
    ${tile(urgentN,"urgent tasks","goto-tasks","var(--accent)")}
    ${tile(unseen.length,"new in radar","goto-lit","var(--teal)")}
    ${syncTile}
  </div>`;
  const mineToggle=`<button class="lk" data-op="toggle-mine" style="background:none">${mine?"My actions":"Everyone's actions"}</button>`;
  const taskBody=[
    totalToday?`<div class="prog" style="margin:0 0 6px"><div class="track"><div class="fill" style="width:${(doneToday.length/totalToday*100).toFixed(1)}%"></div></div><div class="plab"><span>${doneToday.length} of ${totalToday} done today</span>${overdueN?`<span class="over">${overdueN} overdue, under Needs attention</span>`:""}</div></div>`:"",
    todayTasks.length?`<div class="rows">${todayTasks.map(x=>taskRow(x)).join("")}</div>`:"",
    suggested.length?`<h3>Suggested for today</h3><div class="rows">${suggested.map(x=>taskRow(x,{plan:true})).join("")}</div>`:"",
    doneToday.length?`<p class="muted" style="font-size:.82rem;margin:8px 0 0">Done today: ${doneToday.slice(0,6).map(x=>esc(x.title)).join(", ")}${doneToday.length>6?` and ${doneToday.length-6} more`:""}.</p>`:""
  ].join("")||empty(M.tasks.length?`Nothing planned for today. Plan a task in <a href="${esc(href(A.tasks,{pick:"upcoming"}))}">Tasks</a> or add one with +.`:`Add your tasks with + or in <a href="${esc(href(A.tasks))}">Tasks</a>. Give them a priority and a due date and the most urgent rise to the top.`);
  const litBody=[
    M.topics.length?`<h3>Radar${unseen.length?`, ${unseen.length} new`:""}</h3>
      <div class="m muted" style="font-size:.8rem;margin-bottom:4px">${M.radarRun?`Checked ${esc(ago(M.radarRun))}`:"Not checked yet"}${M.radarRun&&Date.now()-M.radarRun>7*DAY?` · <a href="${esc(href(A.radar))}" style="color:var(--accent)">check again</a>`:""}</div>
      <div class="rows">${unseen.slice(0,5).map(workRow).join("")||empty("Nothing new with your current filters.")}</div>${unseen.length>5?`<a class="more" href="${esc(href(A.radar))}">${unseen.length-5} more in the radar</a>`:""}`:"",
    M.saved.length?`<h3>Reading list</h3><div class="kv"><span><b>${toRead.length}</b> to read</span><span><b>${M.saved.length}</b> saved</span></div>
      ${toRead.length?`<div class="rows" style="margin-top:6px">${toRead.slice(0,3).map(savedRow).join("")}</div>`:""}${toRead.length>3?`<a class="more" href="${esc(href(A.radar,{pick:"saved"}))}">${toRead.length-3} more to read</a>`:""}`:"",
    A_?`<h3>Citations</h3><div class="kv"><span><b>${(A_.cites||0).toLocaleString("en-GB")}</b> citations${dC>0?` <span class="ok">+${dC}</span>`:""}</span><span>h-index <b>${A_.h||0}</b></span><span><b>${A_.works||0}</b> works</span><span>${M.citeRun?"updated "+esc(ago(M.citeRun)):""}</span></div>
      ${gained.length?`<div class="rows" style="margin-top:6px">${gained.map(w=>evRow(A.citations,w.title,`<span class="ok">+${w.cites-w.prev}</span><span>${w.cites} total</span>${w.year?`<span>${w.year}</span>`:""}`,w.doi?"https://doi.org/"+encodeURI(w.doi):href(A.citations))).join("")}</div>`:""}`:""
  ].join("")||empty(`Set up topics in the <a href="${esc(href(A.radar))}">literature radar</a> to see new papers here.`);
  const progBody=[
    doing.length?`<h3>Ideas you're doing${exploring?`, ${exploring} being explored`:""}</h3><div class="rows">${doing.slice(0,6).map(i=>`<div class="row" style="--cc:var(--violet)"><span class="bar"></span><div class="main"><div class="t"><a href="${esc(href(A.ideas,{find:i.title.slice(0,40),pick:"doing"}))}">${esc(i.title)}</a></div><div class="m"><span class="app">${esc((IDEA_CATS.find(c=>c.id===i.cat)||{}).name||"")}</span>${arr(i.tags).length?`<span>${esc(i.tags.map(x=>"#"+x).join(" "))}</span>`:""}</div></div><div class="side"><button class="txtbtn" data-op="idea-move" data-id="${esc(i.id)}" data-to="done" ${disabled(A.ideas)}>Done</button></div></div>`).join("")}</div>`:"",
    building.length||planning.length?`<h3>Script plans</h3><div class="rows">${[...building,...planning].slice(0,6).map(p=>{const op=arr(p.checks).filter(c=>!c.done).length;return evRow(A.plans,p.name,`<span class="app">${esc(PLAN_STATUS[p.status]||p.status)}</span>${p.purpose?`<span>${esc(clip(p.purpose,70))}</span>`:""}${op?`<span class="soon">${plural(op,"open check")}</span>`:""}`,href(A.plans,{find:p.name.slice(0,40)}))}).join("")}</div>`:"",
    pinned.length?`<h3>Pinned in the log</h3><div class="rows">${pinned.map(logRow).join("")}</div>`:""
  ].join("")||empty("Ideas you move to Doing and script plans you're building show up here.");
  const recent=activity(now-7*DAY);
  const actBody=recent.length?`<div class="rows">${actRowsHTML(recent.slice(0,10))}</div>${recent.length>10?`<button class="more" data-op="digest">${recent.length-10} more, see the digest</button>`:""}`:empty("Nothing recorded in the last 7 days.");

  const empties=!M.entries.length&&!M.tasks.length&&!M.deadlines.length&&!M.ideas.length&&!M.topics.length&&!M.saved.length;
  const welcome=empties&&SRC.mode==="auto"&&SRV.http?`<div class="infobox"><b>Welcome to {{APP_NAME}}.</b> Add a task with +, or open the <a href="${esc(href(A.tasks))}">Tasks</a>, <a href="${esc(href(A.log))}">Lab notebook</a> and <a href="${esc(href(A.radar))}">Literature radar</a>. ${ss&&ss.configured?"Sync is on: data from your other devices appears here after the first sync.":`Already using {{APP_NAME}} on another device? <button class="linkbtn" data-op="sync-setup" style="color:var(--accent)">Turn on sync</button> to bring your data here.`}</div>`:"";
  $("#v-today").innerHTML=tiles+welcome+
  `<div class="masonry">
    ${card("Needs attention",att.length?`<div class="rows">${att.map(x=>x.h).join("")}</div>`:empty("Nothing overdue."),{id:"s-attn",right:mineToggle})}
    ${card("Today's tasks",taskBody,{id:"s-tasks",right:`<a class="lk" href="${esc(href(A.tasks))}">Tasks</a>`})}
    ${card("Next 14 days",agHTML||empty("Nothing due in the next two weeks."),{id:"s-agenda"})}
    ${card("Literature",litBody,{id:"s-lit",right:`<a class="lk" href="${esc(href(A.radar))}">Radar</a>`})}
    ${card("In progress",progBody)}
    ${card("Last 7 days",actBody,{right:`<button class="lk" data-op="digest" style="background:none">Digest</button>`})}
  </div>`;
}

/* ---------------- PROJECTS ---------------- */
function projectList(){
  const map=new Map(), extra=obj(settings().projects);
  const add=(p,t)=>{p=String(p||"").trim();if(!p)return;const k=p.toLowerCase();let o=map.get(k);if(!o){o={name:p,key:k,n:0,last:0};map.set(k,o)}o.n++;if((t||0)>o.last)o.last=t||0};
  D.entries.forEach(e=>add(e.proj,e.updated||e.added||0));
  D.tasks.forEach(x=>add(x.proj,x.updated||x.added||0));
  for(const [k,v] of Object.entries(extra)) if(!map.has(k)) map.set(k,{name:obj(v).name||k,key:k,n:0,last:0,manual:true});
  return [...map.values()].sort((a,b)=>b.last-a.last||a.name.localeCompare(b.name));
}
function matcher(name){
  const k=String(name).trim().toLowerCase(), kw=arr(obj(obj(settings().projects)[k]).kw).map(x=>String(x).toLowerCase()).filter(Boolean);
  const names=[k,...kw], terms=names.filter(x=>x.length>=3);
  return {name,kw,
    proj:p=>{p=String(p||"").trim().toLowerCase();return !!p&&names.includes(p)},
    text:(...s)=>{const h=s.filter(Boolean).join(" ").toLowerCase();return terms.some(x=>h.includes(x))}};
}
function projectData(name){
  const m=matcher(name);
  const entries=D.entries.filter(e=>m.proj(e.proj)).sort((a,b)=>(b.date||"").localeCompare(a.date||"")||(b.added||0)-(a.added||0));
  const tasks=D.tasks.filter(x=>m.proj(x.proj));
  const P={m,entries,
    logs:entries.filter(e=>e.kind!=="meeting"),
    meetings:entries.filter(e=>e.kind==="meeting"),
    actions:D.actions.filter(x=>m.proj(x.m.proj)&&!x.a.done).sort((a,b)=>(a.a.due||"9").localeCompare(b.a.due||"9")),
    tasks:tasks.filter(x=>!x.done).sort(byUrgency),
    tasksDone:tasks.filter(x=>x.done).sort((a,b)=>(b.doneAt||0)-(a.doneAt||0)),
    deadlines:D.deadlines.filter(i=>!i.done&&m.text(i.title,i.notes)).sort((a,b)=>dlWhen(a)-dlWhen(b)),
    ideas:D.ideas.filter(i=>i.stage!=="done"&&m.text(i.title,i.notes,arr(i.tags).join(" "))),
    plans:D.plans.filter(p=>m.text(p.name,p.purpose,p.desc)),
    saved:D.saved.filter(s=>m.text(s.title,s.topic)).sort((a,b)=>(b.saved||0)-(a.saved||0)),
    topics:D.topics.filter(tp=>m.text(tp.q)),
    schemes:D.schemes.filter(s=>m.text(s.name))
  };
  P.last=Math.max(0,...entries.map(e=>e.updated||e.added||0),...tasks.map(x=>x.updated||x.added||0));
  return P;
}

let IDX=null, IDXGEN=-1, QF="";
function buildIndex(){
  const out=[], add=(app,title,sub,text,link,extra)=>out.push({app,title:String(title||""),sub:sub||"",hay:(title+" "+text).toLowerCase(),link:link||"",extra:extra||null});
  for(const e of D.entries){
    if(e.kind==="meeting") add(A.log,e.title,`Meeting · ${shortDate(e.date)}${arr(e.people).length?" · "+arr(e.people).join(", "):""}${e.proj?" · "+e.proj:""}`,[e.text,e.decisions,arr(e.people).join(" "),e.proj,MTYPES[e.mtype]].join(" "),href(A.log,{find:e.title.slice(0,40),pick:"meetings"}));
    else add(A.log,firstLine(e.text,120),`${logKind(e.kind).name} · ${shortDate(e.date)}${e.proj?" · "+e.proj:""}`,[e.text,e.proj].join(" "),href(A.log,{find:firstLine(e.text,40)}));
  }
  for(const x of D.actions) add(A.log,x.a.text,`Action${x.a.done?" (done)":""} · ${x.a.owner||"Me"}${x.a.due?" · due "+shortDate(x.a.due):""} · ${x.m.title}`,[x.a.owner,x.m.title].join(" "),href(A.log,{find:x.a.text.slice(0,40),pick:"actions"}));
  for(const i of D.ideas) add(A.ideas,i.title,`Idea · ${(IDEA_STAGES.find(s=>s.id===i.stage)||{}).name||""} · ${(IDEA_CATS.find(c=>c.id===i.cat)||{}).name||""}`,[i.notes,arr(i.tags).join(" ")].join(" "),href(A.ideas,{find:i.title.slice(0,40),pick:i.stage}));
  for(const p of D.plans) add(A.plans,p.name,`Script plan · ${PLAN_STATUS[p.status]||""}${p.purpose?" · "+clip(p.purpose,80):""}`,[p.purpose,p.desc,p.deps,arr(p.fns).map(f=>f.name).join(" ")].join(" "),href(A.plans,{find:p.name.slice(0,40)}));
  for(const x of D.tasks) add(A.tasks,x.title,`Task${x.done?" (done)":""} · ${(TPRIO[x.prio]||TPRIO.medium).n} priority${x.due?" · due "+shortDate(x.due):""}${x.proj?" · "+x.proj:""}`,[x.notes,x.proj,arr(x.subs).map(s=>s&&s.text).join(" ")].join(" "),href(A.tasks,{find:x.title.slice(0,40),pick:x.done?"done":"all"}));
  for(const i of D.deadlines) add(A.deadlines,i.title,`${dlKind(i.kind).name} · ${longDate(i.date)}${i.done?" · done":""}`,[i.notes,i.url].join(" "),href(A.deadlines,{find:i.title.slice(0,40),pick:i.done?"done":""}));
  for(const s of D.saved) add(A.radar,s.title,`Reading list${s.read?"":" (to read)"}${s.venue?" · "+s.venue:""}${s.date?" · "+s.date.slice(0,4):""}`,[s.authors,s.venue,s.doi,s.topic].join(" "),s.doi?"https://doi.org/"+encodeURI(s.doi):href(A.radar,{pick:"saved"}),{doi:s.doi});
  for(const w of D.works){const tp=(D.topics.find(t=>t.id===w.topic)||{}).q||""; add(A.radar,w.title,`Radar${w.seen?"":" (new)"} · ${tp}${w.date?" · "+w.date:""}`,[w.authors,w.venue,w.doi,tp,w.abs].join(" "),w.doi?"https://doi.org/"+encodeURI(w.doi):href(A.radar),{work:w})}
  for(const w of D.cworks) add(A.citations,w.title,`Your work · ${w.cites||0} citations${w.year?" · "+w.year:""}`,[w.venue,w.doi].join(" "),w.doi?"https://doi.org/"+encodeURI(w.doi):href(A.citations),{doi:w.doi});
  for(const s of D.schemes) add(A.schemes,s.name,`Mechanism scheme · edited ${ago(s.updated)}`,"","",{scheme:s});
  return out;
}
function renderSearch(){
  if(IDXGEN!==GEN){IDX=buildIndex();IDXGEN=GEN}
  const q=$("#q").value.trim().toLowerCase(), toks=q.split(/\s+/).filter(Boolean);
  const hits=toks.length?IDX.filter(r=>toks.every(t=>r.hay.includes(t))):[];
  const byApp=new Map(); hits.forEach(r=>byApp.set(r.app,(byApp.get(r.app)||0)+1));
  if(QF&&!byApp.has(APPS.find(a=>a.suite.id+"/"+a.id===QF))) QF="";
  $("#qChips").innerHTML=toks.length&&hits.length?[`<button class="chip" data-op="qf" data-f="" aria-pressed="${!QF}">All<span class="c">${hits.length}</span></button>`]
    .concat([...byApp.entries()].map(([a,n])=>`<button class="chip" data-op="qf" data-f="${esc(a.suite.id+"/"+a.id)}" aria-pressed="${QF===a.suite.id+"/"+a.id}" style="--cc:${cc(a)}"><span class="dot"></span>${esc(a.name)}<span class="c">${n}</span></button>`)).join(""):"";
  if(!toks.length){
    $("#qOut").innerHTML=`<div class="infobox">Searches your tasks, the research log (entries, meetings and actions), ideas, script plans, deadlines, radar results, the reading list, your cited works and schemes. Tap a result to open that app filtered to it.</div>`;
    return;
  }
  const scored=hits.filter(r=>!QF||r.app.suite.id+"/"+r.app.id===QF)
    .map(r=>({r,s:(r.title.toLowerCase().includes(q)?3:0)+toks.filter(t=>r.title.toLowerCase().includes(t)).length}))
    .sort((a,b)=>b.s-a.s).slice(0,80).map(x=>x.r);
  $("#qOut").innerHTML=scored.length?`<div class="card"><div class="rows">${scored.map(searchRow).join("")}</div>${hits.length>80?`<p class="muted" style="font-size:.82rem">Showing the best 80 of ${hits.length}.</p>`:""}</div>`:empty("Nothing matches.");
}
function searchRow(r){
  const x=r.extra||{}, side=[];
  if(x.doi) side.push(`<button class="ibtn" data-op="copy" data-text="${esc(x.doi)}" aria-label="Copy DOI" title="Copy DOI">⧉</button>`);
  if(x.work&&!x.work.seen) side.push(`<button class="txtbtn" data-op="radar-save" data-id="${esc(x.work.id)}" data-topic="${esc(x.work.topic)}" ${canWrite(A.radar)?"":"disabled"}>Save</button>`);
  const ext=/^https?:/.test(r.link);
  const title=x.scheme?`<button class="txtbtn" style="padding:0;min-height:0;color:var(--ink);text-align:left" data-op="scheme" data-id="${esc(x.scheme.id)}">${esc(r.title)}</button>`
    :r.link?`<a href="${esc(r.link)}" ${ext?'target="_blank" rel="noopener"':""}>${esc(r.title)}</a>`:esc(r.title);
  return `<div class="row" style="--cc:${cc(r.app)}"><span class="bar"></span><div class="main"><div class="t">${title}</div><div class="m"><span class="app">${esc(r.app.name)}</span><span>${esc(r.sub)}</span></div></div>${side.length?`<div class="side">${side.join("")}</div>`:""}</div>`;
}

function appStat(a){
  const now=Date.now(), M=D;
  switch(a.suite.id+"/"+a.id){
    case "lab-notebook/log":{const o=M.actions.filter(x=>!x.a.done).length;return `${plural(M.entries.length-M.meetings.length,"entry","entries")}, ${plural(M.meetings.length,"meeting")}${o?`, ${o} open actions`:""}`}
    case "lab-notebook/tasks":{const o=M.tasks.filter(x=>!x.done);return `${o.length} open, ${o.filter(taskToday).length} for today`}
    case "lab-notebook/ideas":return `${plural(M.ideas.length,"idea")}, ${M.ideas.filter(i=>i.stage==="doing").length} doing`;
    case "lab-notebook/plans":return `${plural(M.plans.length,"plan")}, ${M.plans.filter(p=>p.status==="building").length} building`;
    case "lab-notebook/deadlines":{const o=M.deadlines.filter(i=>!i.done&&dlWhen(i)>=now).sort((x,y)=>dlWhen(x)-dlWhen(y));return o.length?`${o.length} upcoming, next in ${dlCountdown(o[0],now).t}`:"Nothing upcoming"}
    case "literature-hub/radar":return M.topics.length?`${M.unseen.length} new, ${plural(M.topics.length,"topic")}, ${M.saved.filter(s=>!s.read).length} to read`:"No topics yet";
    case "literature-hub/citations":return M.author?`${(M.author.cites||0).toLocaleString("en-GB")} citations, h ${M.author.h||0}`:"Not set up";
    case "structure-studio/viewer":return `<span id="recentCount">Recent structures on this device</span>`;
    case "paper-kit/schemes":return `${plural(M.schemes.length,"scheme")}`;
    default:return esc(a.blurb||"");
  }
}
