const HEALTH={}; let healthBusy=false;
async function loadHealth(){
  if(healthBusy||!SRV.ok) return; healthBusy=true;
  try{
    await Promise.all(DATA_APPS.map(async a=>{
      const f=SRV.latest(a); if(!f){HEALTH[a.file]=null;return}
      try{const p=await SRV.read(f.file);HEALTH[a.file]={file:f.file,date:f.date,mtime:f.mtime,bytes:f.bytes,count:COUNT[a.file](obj(p&&p.json))}}catch(_){HEALTH[a.file]={file:f.file,date:f.date,mtime:f.mtime,bytes:f.bytes,count:null}}
    }));
  }finally{healthBusy=false}
  if(VIEW==="backup") renderBackup();
}
function syncCard(){
  const S=SYNC();
  if(!S) return card("Sync between your devices",empty("suite-sync.js is missing next to this page, so sync is not available."),{cls:"span2"});
  const ss=S.status();
  if(!ss.configured) return card("Sync between your devices",`<p style="margin:0 0 8px">Off. {{APP_NAME}} keeps your data in this browser only. Turn on sync to have the same tasks, notes, papers and schemes on your Mac and your iPhone: each device keeps a copy and they meet in a <b>private</b> GitHub repository that only you can read.</p>
    <div class="btnrow"><button class="btn primary" data-op="sync-setup">Set up sync</button></div>
    <p class="muted" style="font-size:.82rem;margin:10px 0 0">You need a private repository for the data (it can be empty) and a GitHub token that can change only that repository. The set-up explains both.</p>`,{cls:"span2",id:"s-sync"});
  const dot=ss.state==="error"?`<span class="over">●</span>`:ss.state==="offline"||ss.pending?`<span class="soon">●</span>`:`<span class="ok">●</span>`;
  const line=ss.busy?"Syncing...":ss.state==="error"?`Last sync failed: ${esc(ss.error)}`:ss.state==="offline"?esc(ss.error||"Offline"):
    ss.pending?`${plural(ss.pending,"change")} waiting to sync`:ss.last?`In sync. Last sync ${esc(ago(ss.last))}${ss.pulled||ss.pushed?` (${ss.pushed} sent, ${ss.pulled} received)`:""}.`:"Not synced yet.";
  const conf=S.conflicts();
  const nameOf=k=>{const a=DATA_APPS.find(x=>owned(x,k));return a?a.name:k==="suite.me"?"Your names":k};
  const confHTML=conf.length?`<h3>Versions replaced by a sync</h3><p class="muted" style="font-size:.82rem;margin:0 0 6px">When the same app changed on two devices before they synced, the newer edit was kept. The other version is here in case you need it.</p>
    <div class="rows">${conf.map(c=>`<div class="row" style="--cc:var(--gold)"><span class="bar"></span><div class="main"><div class="t">${esc(nameOf(c.key))}</div><div class="m"><span>version from ${esc(c.from)}</span>${c.t?`<span>edited ${esc(fmtWhen(c.t))}</span>`:""}<span>replaced ${esc(ago(c.at))}</span><span>${size(c.size*2)}</span></div></div>
      <div class="side"><button class="txtbtn" data-op="sync-restore" data-i="${c.i}">Restore</button><button class="txtbtn" data-op="sync-drop" data-i="${c.i}">Dismiss</button></div></div>`).join("")}</div>`:"";
  return card("Sync between your devices",`<p style="margin:0 0 4px">${dot} ${line}</p>
    <div class="kv" style="margin:6px 0 12px"><span>Repository <b>${esc(ss.repo)}</b></span><span>This device <b>${esc(ss.device)}</b></span>${ss.auto?"<span>Automatic</span>":"<span class=\"soon\">Automatic sync off</span>"}</div>
    <div class="btnrow"><button class="btn primary" data-op="sync-now" ${ss.busy?"disabled":""}>Sync now</button><button class="btn" data-op="sync-settings">Settings</button><a class="btn ghost" href="https://github.com/${esc(ss.repo)}/commits" target="_blank" rel="noopener">History on GitHub</a></div>
    <p class="muted" style="font-size:.82rem;margin:10px 0 0">Changes sync a few seconds after you make them, when you open {{APP_NAME}} and every few minutes while it is open. Every sync is a commit in the repository, so its history is also a complete backup.</p>${confHTML}`,{cls:"span2",id:"s-sync"});
}
function renderBackup(){
  const bs=backupSummary(), lastB=+LS.get("controlcenter.lastBundle")||0, last=+LS.get("controlcenter.lastAll")||0;
  const st=settings();
  const suitesWithData=SUITES.filter(s=>!s.hidden&&s.apps.some(a=>a.file));
  const onCount=suitesWithData.filter(s=>suiteState(s.id).on).length;
  const fileCard=card("Back up to a file",`<div class="kv" style="margin:0 0 12px"><span>Last download ${esc(ago(lastB))}</span>${SRV.ok?`<span>Last full backup to the server ${esc(ago(last))}</span>`:""}</div>
    <div class="btnrow"><button class="btn primary" data-op="bundle" ${STORAGE_OK&&SRV.http?"":"disabled"}>Download everything as one file</button>${SRV.ok?`<button class="btn" data-op="backup-all" ${STORAGE_OK&&SRC.mode==="auto"?"":"disabled"}>Back up all apps to the server</button>`:""}<button class="btn" data-op="restore-open">Restore…</button></div>
    <p class="muted" style="font-size:.82rem;margin:10px 0 0">One JSON file with every app. On an iPhone, choose <b>Save to Files</b> and pick iCloud Drive; on a Mac it goes to Downloads (move it to iCloud Drive if you like). Restore it here, on this or any other device. Your GitHub token and OpenAlex key are never written into it.</p>`,{cls:"span2"});
  const auto=SRV.ok?card("Automatic backups to the server",`<div class="bkgrid">
      <label class="sw"><span>Back up changes while the control center is open<small>Every 2 minutes and when you leave the page, only apps that changed.</small></span><input type="checkbox" role="switch" data-op="auto" ${st.auto?"checked":""}></label>
      <label class="sw"><span>Automatic backups inside every suite<small>${onCount} of ${suitesWithData.length} suites have it on.</small></span><input type="checkbox" role="switch" data-op="auto-suites" ${onCount===suitesWithData.length?"checked":""}></label>
    </div>`):"";
  const total=LS.keys().reduce((n,k)=>n+bytesOfKey(k),0), quota=5*1048576;
  const loose=LS.keys().filter(k=>!ownedByAny(k)&&!isPrivate(k));
  const big=DATA_APPS.map(a=>({a,b:bytesOf(a)})).filter(x=>x.b).sort((x,y)=>y.b-x.b).slice(0,4);
  const storage=card("Storage on this device",`<div class="meter"><div style="width:${Math.min(100,total/quota*100).toFixed(1)}%"></div></div>
    <div class="kv"><span><b>${size(total)}</b> of about 5 MB that browsers usually allow per site</span></div>
    ${big.length?`<div class="kv" style="margin-top:6px">${big.map(x=>`<span>${esc(x.a.name)} <b>${size(x.b)}</b></span>`).join("")}</div>`:""}
    <p class="note" id="persistLine" style="font-size:.8rem;margin:8px 0 0;color:var(--muted)">${plural(loose.length,"other key")} (reminders, suite settings, open tabs) go into the single-file download. Recent structures in the viewer are kept in a separate database, only on this device.</p>`);
  const S=SYNC(), ss=S?S.status():null, pend=new Set(ss&&ss.configured?S.pendingKeys():[]);
  const groups=SUITES.filter(s=>s.apps.some(a=>a.file)).map(s=>{
    const rows=s.apps.filter(a=>a.file).map(a=>{
      const ks=keysOf(a), live=ks.length?COUNT[a.file](snapshot(a).json):0;
      let pill;
      if(!ks.length) pill=["none","Empty"];
      else if(SRV.ok){const k=bkState(a);pill={ok:["ok","Saved"],changed:["chg","Changed"],never:["chg","Not backed up"],err:["err","Failed"],none:["none","Empty"]}[k.k]}
      else if(ss&&ss.configured) pill=ks.some(k=>pend.has(k))?["chg","Waiting to sync"]:["ok","Synced"];
      else pill=["none","This device only"];
      const bits=ks.length?[`${unitOf(a,live)}, ${size(bytesOf(a))}`]:[];
      return `<div class="bkapp" style="--cc:${cc(a)}"><div class="main"><b>${esc(a.name)}</b> <span class="state ${pill[0]}">${pill[1]}</span><div class="m">${bits.join(" · ")||"Nothing stored on this device"}</div></div>
        ${SRC.mode==="file"||(SRV.ok&&SRV.filesOf(a).length)?`<button class="txtbtn" data-op="restore-open" data-files="${esc(a.file)}">Restore</button>`:""}</div>`;
    }).join("");
    return `<h3>${esc(s.title)}</h3><div class="bkgrid">${rows}</div>`;
  }).join("");
  const appsCard=card("Apps on this device",groups,{cls:"span2"});
  $("#v-backup").innerHTML=`<div class="grid two">${syncCard()}${fileCard}${auto}${storage}${appsCard}</div>`;
}

/* ---------------- sync: set up and settings ---------------- */
function openSyncSetup(){
  const S=SYNC(); if(!S){toast("Sync is not available here");return}
  let choice=null, info=null;
  openSheet(`<h2 id="dlgTitle">Sync between your devices</h2>
    <p class="note">Each device keeps its own copy of your data and they meet in a private GitHub repository. Do this once on every device (Mac, iPhone, iPad), with the same repository and token.</p>
    <ol class="note" style="margin:0;padding-left:20px;display:flex;flex-direction:column;gap:6px">
      <li>A <b>private</b> repository on GitHub for the data. It can be empty; {{APP_NAME}} creates a <code>data</code> folder in it.</li>
      <li>A token: on GitHub, Settings › Developer settings › Fine-grained tokens › <a href="https://github.com/settings/personal-access-tokens/new" target="_blank" rel="noopener" style="color:var(--accent2)">Generate new token</a>. Repository access: <b>only</b> the data repository. Permissions: <b>Contents, read and write</b>. Pick an expiry you are happy with (you can make a new one later).</li>
    </ol>
    <label>Data repository<input id="syRepo" value="{{SYNC_REPO}}" placeholder="owner/name" autocomplete="off" autocapitalize="off" spellcheck="false"></label>
    <label>Token<input id="syTok" type="password" placeholder="github_pat_..." autocomplete="off" autocapitalize="off" spellcheck="false"></label>
    <label>Name of this device<input id="syDev" value="${esc(S.defaultDevice())}" maxlength="40" autocomplete="off"></label>
    <div id="syChoice"></div>
    <p class="note">The token is kept only on this device and is never synced or written into backup files. Anyone who can use this browser could read it, so use a token limited to the data repository.</p>
    <p class="hint" id="sheetHint"></p>
    <div class="sbar"><button type="button" class="btn ghost" data-close>Cancel</button><button type="submit" class="btn primary" id="syGo">Check and connect</button></div>`,async()=>{
    const go=$("#syGo"), repo=val("syRepo"), tok=$("#syTok").value.trim(), dev=val("syDev");
    hint(""); go.disabled=true; go.innerHTML=`<span class="spin"></span>${info?"Connecting":"Checking"}`;
    try{
      if(!info||info.repo.toLowerCase()!==(S.cleanRepo(repo)||"").toLowerCase()){
        info=await S.inspect(repo,tok);
        if(!info.private){hint("That repository is public, so anyone could read your notes. Make it private on GitHub (Settings › General › Danger zone › Change visibility) and try again.");info=null;return}
        if(info.remoteKeys&&info.localKeys){
          $("#syChoice").innerHTML=`<h4>Both sides already have data</h4><div class="picklist" style="max-height:none">
            <label class="pick"><input type="radio" name="syPref" value="remote" checked><div><b>Use the data in GitHub on this device</b><div class="m">Right for a second device. Where both have the same app, this device takes the GitHub copy; this device's version is kept under Versions replaced by a sync.</div></div></label>
            <label class="pick"><input type="radio" name="syPref" value="local"><div><b>Keep this device's data</b><div class="m">This device's apps replace the GitHub copy where both have them; the GitHub version stays in the repository history and under Versions replaced.</div></div></label></div>`;
          go.textContent="Connect"; return;
        }
      }
      choice=(sheet.querySelector('input[name="syPref"]:checked')||{}).value||(info.remoteKeys?"remote":"local");
      const st=await S.connect({repo:info.repo,token:tok,device:dev,prefer:choice});
      dlg.close();
      await refresh(false);
      toast(st.state==="ok"?`Sync is on: ${st.pushed} sent, ${st.pulled} received`:st.error||"Sync is on, but the first sync failed");
    }catch(e){hint(e&&e.message?e.message:String(e))}
    finally{if(go.isConnected){go.disabled=false;if(!/Connect$/.test(go.textContent))go.textContent=info&&$("#syChoice").innerHTML?"Connect":"Check and connect"}}
  });
  const r=$("#syRepo"); if(r&&!r.value) r.focus(); else { const tk=$("#syTok"); if(tk) tk.focus(); }
}
function openSyncSettings(){
  const S=SYNC(); if(!S) return; const c=S.config(); if(!c){openSyncSetup();return}
  openSheet(`<h2 id="dlgTitle">Sync settings</h2>
    <div class="kv"><span>Repository <b>${esc(c.repo)}</b></span><span>Folder <b>${esc(c.dir)}</b></span>${c.since?`<span>Connected ${esc(fmtWhen(c.since))}</span>`:""}</div>
    <label>Name of this device<input id="syDev" value="${esc(c.device)}" maxlength="40" autocomplete="off"></label>
    <label class="sw"><span>Sync automatically<small>When off, sync only runs when you tap Sync now.</small></span><input type="checkbox" role="switch" id="syAuto" ${c.auto?"checked":""}></label>
    <p class="note">To use a new token (they expire), turn sync off here and set it up again with the same repository; nothing is lost.</p>
    <div class="sbar"><button type="button" class="btn danger" id="syOff">Turn sync off</button><button type="submit" class="btn primary">Save</button></div>`,()=>{
    S.update({device:val("syDev")||c.device,auto:$("#syAuto").checked}); dlg.close(); render(); toast("Saved");
  });
  $("#syOff").addEventListener("click",()=>{
    if(!confirm("Turn sync off on this device? Your data stays here and in the repository; the token is removed from this device.")) return;
    S.disconnect(); dlg.close(); render(); toast("Sync is off on this device");
  });
}

function renderCap(kind,pre){

    box.innerHTML=`<div class="kinds" id="capKinds">${LOG_KINDS.map(k=>`<button type="button" data-k="${k.id}" style="--cc:var(${k.c})" aria-pressed="${k.id===CAP.logKind}">${k.name}</button>`).join("")}</div>
      <label>Entry<textarea id="cText" placeholder="What happened, what you found, what you decided. #tags and \`code\` work as in the log.">${esc(pre.text||"")}</textarea></label>
      <div class="f2"><label>Project<input id="cProj" list="dlProjects" value="${esc(pre.proj??D.lastProj)}" autocomplete="off"></label><label>Date<input id="cDate" type="date" value="${esc(pre.date||todayStr())}"></label></div>
      <label class="check"><input type="checkbox" id="cPin"> Pin this entry</label>
`;
    $("#capKinds").addEventListener("click",e=>{const b=e.target.closest("[data-k]");if(!b)return;CAP.logKind=b.dataset.k;$$("#capKinds [data-k]").forEach(x=>x.setAttribute("aria-pressed",x.dataset.k===CAP.logKind))});
    const t=$("#cText"); t.focus(); t.setSelectionRange(t.value.length,t.value.length);
  }else if(kind==="idea"){
    box.innerHTML=`<label>Idea<input id="iTitle" maxlength="200" value="${esc(pre.title||"")}" placeholder="One line"></label>
      <div class="f2"><label>Category<select id="iCat">${IDEA_CATS.map(c=>`<option value="${c.id}" ${c.id===(pre.cat||"research")?"selected":""}>${c.name}</option>`).join("")}</select></label><label>Tags<input id="iTags" value="${esc(pre.tags||"")}" placeholder="comma separated"></label></div>
      <label>Notes<textarea id="iNotes">${esc(pre.notes||"")}</textarea></label>`;
    $("#iTitle").focus();
  }else if(kind==="deadline"){
    CAP.dlKind=pre.kind||"grant";
    box.innerHTML=`<label>What is due<input id="dTitle" value="${esc(pre.title||"")}" placeholder="ERC Starting Grant, abstract for ..."></label>
      <div class="kinds" id="dlKinds">${DL_KINDS.map(k=>`<button type="button" data-k="${k.id}" style="--cc:var(${k.c})" aria-pressed="${k.id===CAP.dlKind}">${k.name}</button>`).join("")}</div>
      <div class="f2"><label>Date<input id="dDate" type="date" value="${esc(pre.date||"")}"></label><label>Time (optional)<input id="dTime" type="time" value="${esc(pre.time||"")}"></label></div>
      <label class="check"><input type="checkbox" id="dYearly"> Repeats every year</label>
      <label>Link<input id="dUrl" type="url" inputmode="url" value="${esc(pre.url||"")}" placeholder="https://"></label>
      <label>Notes<textarea id="dNotes">${esc(pre.notes||"")}</textarea></label>`;
    $("#dlKinds").addEventListener("click",e=>{const b=e.target.closest("[data-k]");if(!b)return;CAP.dlKind=b.dataset.k;$$("#dlKinds [data-k]").forEach(x=>x.setAttribute("aria-pressed",x.dataset.k===CAP.dlKind))});
    $("#dTitle").focus();
  }else if(kind==="paper"){
    CAP.hits=[];
    box.innerHTML=`<div class="f2" style="grid-template-columns:1fr auto;align-items:end"><label>DOI or words from the title<input id="pQ" placeholder="10.1021/acscatal..., or PETase mechanism QM/MM" autocapitalize="off" value="${esc(pre.q||"")}"></label><button type="button" class="btn" id="pLook">Look up</button></div>
      <div id="pHits" style="display:flex;flex-direction:column;gap:6px"></div>
      <label>Title<input id="pTitle"></label>
      <label>Authors<input id="pAuthors" placeholder="Family, G.; Family, G."></label>
      <div class="f3"><label>Journal<input id="pVenue"></label><label>Year<input id="pYear" inputmode="numeric"></label><label>DOI<input id="pDoi" class="mono" autocapitalize="off"></label></div>
      <p class="note">Goes to the reading list in the literature radar.</p>`;
    const TYPES={"posted-content":"Preprint","proceedings-article":"Conference paper","book-chapter":"Book chapter","book":"Book","monograph":"Book","dissertation":"Thesis","report":"Report","dataset":"Dataset"};
    const st={q:"",total:0,busy:false};
    const shortAu=a=>{const l=String(a||"").split(";").map(x=>x.trim()).filter(Boolean);return l.length>3?l.slice(0,3).join("; ")+" et al.":l.join("; ")};
    const have=doi=>!!doi&&D.saved.some(p=>(p.doi||"").toLowerCase()===doi);
    const card=(h,i)=>{
      const meta=[h.venue,h.year,TYPES[h.type]&&TYPES[h.type]!==h.venue?TYPES[h.type]:""].filter(Boolean).join(", ");
      const foot=[h.doi?`<span class="mono">${esc(h.doi)}</span>`:"",h.cites!=null?`cited ${h.cites.toLocaleString("en-GB")} times`:"",have(h.doi)?`<span class="have">already in your reading list</span>`:""].filter(Boolean).join(" · ");
      return `<button type="button" class="res hit" data-hit="${i}"><b>${esc(h.title)}</b>${h.authors?`<small>${esc(shortAu(h.authors))}</small>`:""}${meta?`<small>${esc(meta)}</small>`:""}${foot?`<small>${foot}</small>`:""}</button>`;
    };
    const showHits=note=>{
      const n=CAP.hits.length, all=Math.max(st.total,n);
      $("#pHits").innerHTML=`<small class="hithead">${all>n?`${n} of ${all.toLocaleString("en-GB")} matches`:`${n} match${n===1?"":"es"}`} in Crossref. Tap the right one to fill in the details.</small>`
        +CAP.hits.map(card).join("")+(note||"")
        +(all>n&&n<CR_MAX?`<button type="button" class="btn" id="pMore">Show ${Math.min(CR_ROWS,all-n)} more</button>`:"");
    };
    const look=async more=>{
      if(st.busy) return;
      const q=more?st.q:val("pQ"); if(!q){hint("Type a DOI or words from the title");return}
      st.busy=true; hint("");
      if(more){const b=$("#pMore");if(b){b.disabled=true;b.textContent="Loading more..."}}
      else{CAP.hits=[];st.q=q;st.total=0;$("#pHits").innerHTML=`<div class="res"><span class="spin"></span>Searching Crossref...</div>`}
      try{
        const doi=normDoi(q);
        if(!more&&validDoi(doi)){
          let h=null;
          try{h=await crossrefDoi(doi)}catch(e){if(!/HTTP 404/.test(e.message))throw e}
          if(h&&h.title){fillPaper(h);$("#pHits").innerHTML=`<div class="res">Found <span class="mono">${esc(h.doi||doi)}</span>. Check the fields below.</div>`;return}
        }
        const r=await crossrefSearch(q,CAP.hits.length);
        const seen=new Set(CAP.hits.map(h=>h.doi||h.title));
        CAP.hits=CAP.hits.concat(r.hits.filter(h=>!seen.has(h.doi||h.title))); st.total=r.total;
        if(!CAP.hits.length){$("#pHits").innerHTML=`<div class="res">Nothing in Crossref matches "${esc(q)}". Try fewer or different words, or fill in the fields by hand.</div>`;return}
        showHits();
      }catch(e){
        const msg=`<div class="res over">${esc(e.message)}</div>`;
        if(more&&CAP.hits.length) showHits(msg); else $("#pHits").innerHTML=msg;
      }finally{st.busy=false}
    };
    $("#pLook").addEventListener("click",()=>look(false));
    $("#pQ").addEventListener("keydown",e=>{if(e.key==="Enter"){e.preventDefault();look(false)}});
    $("#pHits").addEventListener("click",async e=>{
      if(e.target.closest("#pMore")){look(true);return}
      if(e.target.closest("#pBack")){showHits();return}
      const b=e.target.closest("[data-hit]");if(!b)return;
      const h=CAP.hits[+b.dataset.hit]; if(!h) return;
      fillPaper(h);
      $("#pHits").innerHTML=`<div class="res">Loaded. Check the fields below. <button type="button" class="linkbtn" id="pBack">Back to the matches</button></div>`;
      /* the full record names the preprint server, which a search result leaves out */
      if(h.doi&&h.type==="posted-content"){try{const f=await crossrefDoi(h.doi);if(f.venue&&val("pVenue")===h.venue)$("#pVenue").value=f.venue}catch(_){}}
    });
    $("#pQ").focus();
    if(pre.q) look(false);
  }
}
function fillPaper(h){
  $("#pTitle").value=h.title||""; $("#pAuthors").value=h.authors||""; $("#pVenue").value=h.venue||""; $("#pYear").value=h.year||""; $("#pDoi").value=h.doi||"";
  const dup=h.doi&&D.saved.find(p=>(p.doi||"").toLowerCase()===h.doi.toLowerCase());
  hint(dup?`Already saved as "${dup.title}".`:"");
}
async function submitCapture(){
  const k=CAP.kind; let ok=false;
  if(k==="task"){
    const title=val("tTitle"); if(!title){hint("What is the task?");return}
    ok=await OPS.addTask({title,proj:val("tProj"),prio:val("tPrio"),plan:val("tPlan"),due:val("tDue"),notes:val("tNotes")});
  }else if(k==="log"){
    const text=$("#cText").value.trim(); if(!text){hint("Write something first.");return}
    ok=await OPS.addLog({text,kind:CAP.logKind,proj:val("cProj"),date:val("cDate")||todayStr(),pin:$("#cPin").checked});
  }else if(k==="idea"){
    const title=val("iTitle"); if(!title){hint("Give the idea a title.");return}
    ok=await OPS.addIdea({title,cat:val("iCat"),notes:val("iNotes"),tags:val("iTags").split(",").map(t=>t.trim().replace(/^#/,"")).filter(Boolean)});
  }else if(k==="deadline"){
    const title=val("dTitle"); if(!title){hint("What is the deadline for?");return}
    if(!val("dDate")){hint("Pick a date.");return}
    const url=val("dUrl"); if(url&&!safeUrl(url)){hint("Links should start with http:// or https://");return}
    ok=await OPS.addDeadline({title,kind:CAP.dlKind,date:val("dDate"),time:val("dTime"),yearly:$("#dYearly").checked,url,notes:val("dNotes")});
  }else if(k==="paper"){
    const title=val("pTitle").replace(/\s+/g," "), doi=normDoi(val("pDoi"));
    if(!title){hint("Add a title, or look one up.");return}
    if(doi&&!validDoi(doi)){hint("That doesn't look like a DOI.");return}
    ok=await OPS.addPaper({title,doi,authors:val("pAuthors"),venue:val("pVenue"),year:val("pYear")});
  }
  if(ok&&dlg.open) dlg.close();
}

/* ---------------- digest ---------------- */
function digestMD(days,proj){
  const now=Date.now(), since=now-days*DAY, sinceD=localDate(since), m=proj?matcher(proj):null, P=m?m.proj:()=>true, T=m?m.text:()=>true;
  const L=[`# ${proj?proj+": ":""}research digest`,"",`${longDate(sinceD)} to ${longDate(todayStr())}`,""];
  const oneLine=s=>String(s||"").replace(/\s*\n+\s*/g," ").trim();
  const logs=D.entries.filter(e=>e.kind!=="meeting"&&e.date>=sinceD&&P(e.proj)).sort((a,b)=>a.date.localeCompare(b.date)||(a.added||0)-(b.added||0));
  if(logs.length){L.push("## Research log","");logs.forEach(e=>L.push(`- ${e.date}, **${logKind(e.kind).name}**${!proj&&e.proj?` (${e.proj})`:""}: ${oneLine(e.text)}`));L.push("")}
  const mts=D.meetings.filter(e=>e.date>=sinceD&&P(e.proj)).sort((a,b)=>a.date.localeCompare(b.date));
  if(mts.length){L.push("## Meetings","");mts.forEach(x=>{
    L.push(`### ${x.title}, ${x.date}`); if(arr(x.people).length) L.push(`*${x.mtype==="seminar"?"Speaker":"People"}: ${x.people.join(", ")}*`);
    if(x.decisions) L.push("",`Decisions: ${oneLine(x.decisions)}`);
    if(arr(x.actions).length){L.push("");x.actions.forEach(a=>L.push(`- [${a.done?"x":" "}] ${a.text}${a.owner?` (${a.owner})`:""}${a.due?`, due ${a.due}`:""}`))}
    L.push("");
  })}
  const tdone=D.tasks.filter(x=>x.done&&(x.doneAt||0)>=since&&P(x.proj)).sort((a,b)=>(a.doneAt||0)-(b.doneAt||0));
  if(tdone.length){L.push("## Tasks done","");tdone.forEach(x=>L.push(`- [x] ${x.title}${!proj&&x.proj?` (${x.proj})`:""}, ${localDate(x.doneAt)}`));L.push("")}
  const topen=D.tasks.filter(x=>!x.done&&P(x.proj)).sort(byUrgency);
  if(topen.length){L.push("## Open tasks","");topen.forEach(x=>L.push(`- [ ] ${x.title}${!proj&&x.proj?` (${x.proj})`:""}${x.due?`, due ${x.due}`:""}${x.prio==="high"?", high priority":""}`));L.push("")}
  const acts=D.actions.filter(x=>!x.a.done&&P(x.m.proj)).sort((a,b)=>(a.a.due||"9").localeCompare(b.a.due||"9"));
  if(acts.length){L.push("## Open actions","");acts.forEach(x=>L.push(`- [ ] ${x.a.text}${x.a.owner?` (${x.a.owner})`:""}${x.a.due?`, due ${x.a.due}`:""}. From ${x.m.title}, ${x.m.date}`));L.push("")}
  const dls=D.deadlines.filter(i=>!i.done&&dlWhen(i)>=now&&dlWhen(i)<now+30*DAY&&T(i.title,i.notes)).sort((a,b)=>dlWhen(a)-dlWhen(b));
  if(dls.length){L.push("## Deadlines in the next 30 days","");dls.forEach(i=>L.push(`- ${i.date}${i.time?" "+i.time:""}: ${i.title} (${dlKind(i.kind).name.toLowerCase()})`));L.push("")}
  const pps=D.saved.filter(p=>(p.saved||0)>=since&&(!m||T(p.title,p.topic)));
  if(pps.length){L.push("## Papers added to the reading list","");pps.forEach(p=>L.push(`- ${p.authors||"Unknown"} (${(p.date||"").slice(0,4)||"n.d."}). ${p.title}.${p.venue?" "+p.venue+".":""}${p.doi?" https://doi.org/"+p.doi:""}`));L.push("")}
  const ids=D.ideas.filter(i=>(i.updated||i.created||0)>=since&&T(i.title,i.notes,arr(i.tags).join(" ")));
  if(ids.length){L.push("## Ideas","");ids.forEach(i=>L.push(`- ${i.title} (${((IDEA_STAGES.find(s=>s.id===i.stage)||{}).name||"").toLowerCase()})`));L.push("")}
  const pls=D.plans.filter(p=>(p.updated||0)>=since&&T(p.name,p.purpose,p.desc));
  if(pls.length){L.push("## Script plans","");pls.forEach(p=>L.push(`- ${p.name} (${(PLAN_STATUS[p.status]||"").toLowerCase()})${p.purpose?": "+p.purpose:""}`));L.push("")}
  if(L.length<=4) L.push("Nothing recorded in this period.","");
  return L.join("\n").replace(/\n{3,}/g,"\n\n");
}

async function readBackupFiles(files){
  const out={payloads:{},rest:null,idb:null,names:[],bad:[]};
  const addP=(p,name)=>{
    const a=DATA_APPS.find(x=>x.suite.id===p.suite&&x.file===p.app); if(!a) return;
    const k=a.suite.id+"/"+a.file, prev=out.payloads[k];
    if(!prev||String(p.saved||"")>String(prev.saved||"")) out.payloads[k]={...p,__name:name};
  };
  for(const f of files){
    let j=null; try{j=JSON.parse(await f.text())}catch(_){}
    if(j&&j.format==="suite-bundle"){arr(j.apps).forEach(p=>p&&p.format==="suite-backup"&&addP(p,f.name));if(j.rest)out.rest=obj(j.rest);if(j.idb&&arr(j.idb.structviewer).length)out.idb=j.idb.structviewer;out.names.push(f.name)}
    else if(j&&j.format==="suite-backup"){addP(j,f.name);out.names.push(f.name)}
    else out.bad.push(f.name);
  }
  return out;
}

}

async function doRestore(){
  const picks=$$("[data-rf]:checked",sheet).map(i=>({a:DATA_APPS.find(x=>x.file===i.dataset.rf),name:i.dataset.name,key:i.dataset.key})).filter(x=>x.a);
  const restOn=!!($("#rsRest")&&$("#rsRest").checked), idbOn=!!($("#rsIdb")&&$("#rsIdb").checked);
  if(!picks.length&&!restOn&&!idbOn){hint("Tick at least one app.");return}
  const go=$("#rsGo"); go.disabled=true; go.innerHTML=`<span class="spin"></span>Restoring`;
  try{
    const docs=[];
    for(const p of picks){
      let doc=null;
      if(RST.src==="server"){try{SRV.cache.delete(p.name);doc=await SRV.read(p.name)}catch(_){}}
      else doc=RST.file.payloads[p.key];
      if(!doc||doc.format!=="suite-backup"||doc.app!==p.a.file){hint(`Could not read the backup of ${p.a.name}.`);return}
      docs.push({a:p.a,doc});
    }
    const names=docs.map(d=>d.a.name);
    if(!confirm(`Replace the current data${names.length?` of ${names.length<=3?names.join(", "):names.length+" apps"}`:""} with the backup?${SRV.ok?"\n\nThe current data is saved on the server first, as pre-restore files.":"\n\nThe server is not running, so the current data can't be saved first. Download everything first if you might need it."}`)) return;
    if(SRV.ok){
      const failed=[];
      for(const {a} of docs){const p=payloadOf(a);if(!p)continue;try{await SRV.save(a,p,"pre-restore")}catch(_){failed.push(a.name)}}
      if(failed.length&&!confirm(`The current data of ${failed.join(", ")} could not be saved first. Restore anyway?`)) return;
    }
    try{
      for(const {a,doc} of docs){
        for(const k of keysOf(a)) LS.del(k);
        for(const [k,v] of Object.entries(obj(doc.json))) if(owned(a,k)) LS.set(k,JSON.stringify(v));
        for(const [k,v] of Object.entries(obj(doc.text))) if(owned(a,k)) LS.set(k,String(v));
      }
      if(restOn&&RST.file&&RST.file.rest) for(const [k,v] of Object.entries(RST.file.rest)) if(!ownedByAny(k)&&!isPrivate(k)&&typeof v==="string") LS.set(k,v);
    }catch(_){toast("Restore stopped: storage is full or blocked");return}
    if(idbOn&&RST.file&&RST.file.idb){try{await IDB.put(RST.file.idb)}catch(_){toast("Recent structures could not be restored")}}
    dlg.close();
    SRC.mode="auto"; SRC.files={}; SRC.names=[];
    await refresh(true);
    toast(`Restored ${plural(docs.length,"app")}${restOn?" and settings":""}${idbOn?" and structures":""}`);
  }finally{go.disabled=false;go.textContent="Restore selected"}
}

/* ---------------- one-file download ---------------- */
async function openBundle(){
  const meta=await IDB.meta(), total=meta.reduce((n,x)=>n+(x.size||0),0);
  const apps=DATA_APPS.filter(a=>keysOf(a).length), loose=LS.keys().filter(k=>!ownedByAny(k)&&!isPrivate(k));
  openSheet(`<h2 id="dlgTitle">Download everything</h2>
    <p class="note">One JSON file with ${plural(apps.length,"app")} and ${plural(loose.length,"other key")} (backup reminders, suite settings). On an iPhone choose <b>Save to Files</b> (iCloud Drive). Restore it here, on this or another device, with Restore, From a file. Your GitHub token and OpenAlex key are not included.</p>
    ${meta.length?`<label class="check"><input type="checkbox" id="bnIdb"> Include ${plural(meta.length,"recent structure")} from the viewer (${size(total)})</label>`:""}
    <div class="sbar"><button type="button" class="btn ghost" data-close>Cancel</button><button type="submit" class="btn primary">Download</button></div>`,async()=>{
    const withIdb=!!($("#bnIdb")&&$("#bnIdb").checked);
    const b={format:"suite-bundle",version:1,saved:new Date().toISOString(),origin:location.origin,apps:apps.map(payloadOf).filter(Boolean),rest:{}};
    for(const k of loose) b.rest[k]=LS.get(k);
    if(withIdb) b.idb={structviewer:await IDB.all()};
    if(saveFile(`{{APP_SHORT}}-backup-${todayStr()}.json`,JSON.stringify(b))){
      const now=String(Date.now());
      for(const a of apps) if(a.reminder){try{LS.set(a.reminder+".lastBackup",now);LS.set(a.reminder+".backupSnooze","0")}catch(_){}}
      try{LS.set("controlcenter.lastBundle",now)}catch(_){}
      dlg.close(); toast("Saved to Downloads"); render();
    }
  });
}

/* ---------------- backing up to the server ---------------- */
const AUTO={busy:false,again:false,timer:null};
function autoSoon(ms){if(settings().auto&&SRV.ok){clearTimeout(AUTO.timer);AUTO.timer=setTimeout(()=>sweep(false,true),ms||4000)}}
async function sweep(force,quiet){
  if(SRC.mode!=="auto"||!STORAGE_OK) return;
  if(AUTO.busy){AUTO.again=true;return}
  AUTO.busy=true; let n=0,bad=0;
  const btn=$('[data-op="backup-all"]'); if(btn&&force){btn.disabled=true;btn.innerHTML=`<span class="spin"></span>Backing up`}
  try{
    if(SRV.ok!==true) await SRV.ping();
    if(!SRV.ok){if(force&&!quiet)toast("Backup server not found");return}
    for(const a of DATA_APPS){
      const fp=fingerprint(a), rec=obj(suiteState(a.suite.id).apps[a.file]);
      if(!force&&rec.fp===fp) continue;
      try{
        const p=payloadOf(a), file=p?await SRV.save(a,p,""):null;
        setSuiteState(a.suite.id,s=>{s.apps[a.file]={fp,at:file?Date.now():rec.at,file:file||rec.file,err:""}});
        if(file){n++;if(a.reminder){try{LS.set(a.reminder+".lastBackup",String(Date.now()));LS.set(a.reminder+".backupSnooze","0")}catch(_){}}}
      }catch(e){bad++;setSuiteState(a.suite.id,s=>{s.apps[a.file]={...rec,err:String(e&&e.message||e)}})}
    }
    if(force&&!bad){try{LS.set("controlcenter.lastAll",String(Date.now()))}catch(_){}}
    if(n) await SRV.listAll();
    if(force&&!quiet) toast(bad?`${plural(bad,"backup")} failed`:n?`Saved ${plural(n,"file")}`:"Nothing to back up yet");
  }finally{
    AUTO.busy=false;
    if(D){renderChrome();if(VIEW==="backup"){renderBackup();if(n)loadHealth()}}
    if(AUTO.again){AUTO.again=false;autoSoon(1500)}
  }
}

/* =====================================================================
   Wiring
   ===================================================================== */
async function refresh(full){
  if(full){
    SRV.cache.clear();
    await SRV.ping();
    if(SRV.ok) await SRV.listAll();
  }
  await loadData();
  render();
  if(full&&VIEW==="backup") loadHealth();
}
$("#nav").addEventListener("click",e=>{const b=e.target.closest("[data-v]");if(b)show(b.dataset.v)});
$("#nav").addEventListener("keydown",e=>{
  const bs=$$("#nav [data-v]"), i=bs.indexOf(document.activeElement); if(i<0) return;
  const step={ArrowRight:1,ArrowDown:1,ArrowLeft:-1,ArrowUp:-1}[e.key]; if(!step) return;
  e.preventDefault(); const n=bs[(i+step+bs.length)%bs.length]; n.focus(); show(n.dataset.v);
});
window.addEventListener("hashchange",()=>{const v=location.hash.slice(1);if(VIEWS[v]&&v!==VIEW)show(v)});
$("#fab").addEventListener("click",()=>openCapture(VIEW==="projects"?"task":undefined,VIEW==="projects"?{proj:(projectList().find(p=>p.key===UI.get("proj",""))||{}).name}:undefined));
$("#srcBtn").addEventListener("click",openSource);
$("#setBtn").addEventListener("click",openSettings);
$("#refreshBtn").addEventListener("click",async()=>{const b=$("#refreshBtn");b.disabled=true;try{await refresh(true);toast("Up to date")}finally{b.disabled=false}});
let _qt=null;
$("#q").addEventListener("input",()=>{clearTimeout(_qt);_qt=setTimeout(renderSearch,120)});
$("#q").addEventListener("keydown",e=>{if(e.key==="Enter"){const a=$("#qOut a[href]");if(a){e.preventDefault();a.click()}}});

const scrollToId=id=>{const el=document.getElementById(id);if(el)el.scrollIntoView({behavior:"smooth",block:"start"})};
document.addEventListener("click",e=>{
  const b=e.target.closest("[data-op]"); if(!b||b.disabled) return;
  if(b.matches('input[type="checkbox"]')) return;           // handled on change
  const op=b.dataset.op, id=b.dataset.id;
  switch(op){
    case "goto-attn": scrollToId("s-attn"); break;
    case "goto-agenda": scrollToId("s-agenda"); break;
    case "goto-tasks": scrollToId("s-tasks"); break;
    case "goto-lit": scrollToId("s-lit"); break;
    case "goto-backup": show("backup"); break;
    case "toggle-mine": if(canWrite(A.settings)){saveSettings({mine:!settings().mine});render()}else toast("Settings are showing a backup"); break;
    case "dl-done": OPS.tickDeadline(id); break;
    case "task-plan": OPS.planTask(id,b.dataset.day||todayStr()); break;
    case "idea-move": OPS.moveIdea(id,b.dataset.to); break;
    case "radar-save": OPS.radarSave(id,b.dataset.topic); break;
    case "radar-seen": OPS.radarSeen(id,b.dataset.topic); break;
    case "sync-setup": openSyncSetup(); break;
    case "sync-settings": openSyncSettings(); break;
    case "sync-now": if(SYNC()){b.disabled=true;b.innerHTML=`<span class="spin"></span>Syncing`;SYNC().syncNow().then(st=>{toast(st.state==="ok"?(st.pulled||st.pushed?`Synced: ${st.pushed} sent, ${st.pulled} received`:"Already in sync"):st.error||"Sync failed");render()})} break;
    case "sync-restore": if(SYNC()&&confirm("Bring back this version? It replaces the current data of that app on every device after the next sync.")){if(SYNC().restoreConflict(+b.dataset.i)){toast("Restored");refresh(false)}} break;
    case "sync-drop": if(SYNC()){SYNC().dropConflict(+b.dataset.i);render()} break;
    case "digest": openDigest(b.dataset.proj||""); break;
    case "cap": openCapture(b.dataset.kind,{proj:b.dataset.proj||""}); break;
    case "proj": UI.set("proj",b.dataset.key); renderProjects(); break;
    case "proj-new": openProjectSheet(null); break;
    case "proj-kw": openProjectSheet(b.dataset.key); break;
    case "qf": QF=b.dataset.f||""; renderSearch(); break;
    case "copy": copyText(b.dataset.text); break;
    case "scheme": OPS.openScheme(id); break;
    case "backup-all": sweep(true); break;
    case "bundle": openBundle(); break;
    case "restore-open": openRestore((b.dataset.files||"").split(",").filter(Boolean)); break;
    case "mode": setMode(b.dataset.mode); break;
    case "pick-files": pickFiles(files=>viewFiles(files)); break;
  }
});
document.addEventListener("change",e=>{
  const t=e.target.closest("[data-op]"); if(!t) return;
  const op=t.dataset.op;
  if(op==="act-done") OPS.toggleAction(t.dataset.mid,t.dataset.aid,t.checked);
  else if(op==="task-done") OPS.toggleTask(t.dataset.id,t.checked);
  else if(op==="auto"){
    if(!canWrite(A.settings)){t.checked=!t.checked;toast("Settings are showing a backup");return}
    saveSettings({auto:t.checked}); toast(t.checked?"Backing up changes while this page is open":"Automatic backups here are off");
    if(t.checked) sweep(false,true);
  }else if(op==="auto-suites"){
    for(const s of SUITES) if(!s.hidden&&s.apps.some(a=>a.file)) setSuiteState(s.id,st=>{st.on=t.checked});
    toast(t.checked?"Automatic backups on in every suite":"Automatic backups off in every suite");
    renderBackup();
  }
});

/* stay current when a suite changes data in another tab or window */
let _st=null;
window.addEventListener("storage",e=>{
  if(SRC.mode!=="auto") return;
  if(e.key&&(e.key.startsWith("controlcenter.ui"))) return;
  clearTimeout(_st); _st=setTimeout(()=>{if(!dlg.open)refresh(false);else loadData()},400);
  if(e.key==null||ownedByAny(e.key)) autoSoon(4000);
});
document.addEventListener("visibilitychange",()=>{
  if(document.hidden){if(settings().auto&&SRV.ok){clearTimeout(AUTO.timer);sweep(false,true)}}
  else if(!dlg.open) refresh(false);
});
window.addEventListener("pageshow",e=>{if(e.persisted)refresh(false)});
/* data that came in from another device, and sync state changes */
window.addEventListener("suite-sync-applied",()=>{if(!dlg.open)refresh(false);else loadData()});
let _sy=null;
if(window.SuiteSync) window.SuiteSync.onStatus(()=>{clearTimeout(_sy);_sy=setTimeout(()=>{if(D&&!dlg.open&&(VIEW==="today"||VIEW==="backup"||VIEW==="apps"))render();else if(D)renderChrome()},150)});
setInterval(()=>{if(!document.hidden&&!dlg.open&&D)render()},60000);
setInterval(()=>{if(settings().auto&&SRV.ok)sweep(false,true)},120000);

(async function boot(){
  const start=location.hash.slice(1);
  VIEW=VIEWS[start]?start:(UI.get("view","today")in VIEWS?UI.get("view","today"):"today");
  for(const k in VIEWS) $("#v-"+k).hidden=k!==VIEW;
  $$("#nav button").forEach(b=>b.dataset.v===VIEW?b.setAttribute("aria-current","page"):b.removeAttribute("aria-current"));
  $("#v-"+VIEW).insertAdjacentHTML("afterbegin",`<div class="empty" id="loading"><span class="spin"></span>Reading your apps…</div>`);
  await Promise.all([SRV.ping(),probeSuites()]);
  if(SRV.ok) await SRV.listAll();
  await loadData();
  const l=$("#loading"); if(l) l.remove();
  show(VIEW,true);
  if(settings().auto&&SRV.ok) setTimeout(()=>sweep(false,true),1500);
  if("serviceWorker" in navigator&&window.isSecureContext&&location.protocol.startsWith("http")){
    navigator.serviceWorker.register("suite-sw.js").catch(()=>{});
  }
})();
