<style>
:root{
  color-scheme:dark;
  --bg:var(--t-bg,#000000);--ink:var(--t-ink,#F2F2F4);--muted:var(--t-muted,#9D9DA5);--line:var(--t-faint,#28282E);--accent:var(--t-accent,#EBA8E4);

}
*,*::before,*::after{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{height:100%}
body{
  margin:0;height:100%;height:100dvh;display:grid;grid-template-rows:minmax(0,1fr) auto;
  padding-top:env(safe-area-inset-top,0px);
  background:var(--t-bg,#000) linear-gradient(var(--t-head,#5A4360),var(--t-head,#5A4360)) top/100% env(safe-area-inset-top,0px) no-repeat;
  color:var(--ink);font-family:var(--font);
}
.stage{position:relative;min-height:0;min-width:0}
/* inactive frames stay laid out (visibility, not display) so 3D canvases keep their size */
.stage iframe{position:absolute;inset:0;width:100%;height:100%;border:0;background:var(--t-bg,#000);visibility:hidden;pointer-events:none}
.stage iframe.on{visibility:visible;pointer-events:auto}
nav{display:flex;gap:2px;background:var(--t-bg,#000);border-top:1px solid var(--line);
  padding:6px 6px calc(6px + env(safe-area-inset-bottom,0px))}
nav button{flex:1 1 0;min-width:0;min-height:58px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;
  background:none;border:0;color:var(--muted);font:inherit;font-size:.74rem;cursor:pointer;padding:2px}
nav .ic{width:100%;max-width:56px;height:30px;border-radius:999px;display:grid;place-items:center}
nav svg{width:22px;height:22px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
nav .lb{max-width:100%;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
nav button[aria-current="page"]{color:var(--ink);font-weight:500}
nav button[aria-current="page"] .ic{background:var(--grad);color:var(--t-on-grad,#17161C)}
nav button:focus-visible{outline:2px solid var(--accent);outline-offset:-2px;border-radius:12px}
@media (prefers-reduced-motion:no-preference){nav .ic{transition:background-color .15s}}
nav .util .ic{position:relative}
nav .util[data-state="ok"] .ic::after,nav .util[data-state="err"] .ic::after{content:"";position:absolute;top:3px;right:12px;width:8px;height:8px;border-radius:50%;background:var(--t-green,#7DCB9C);box-shadow:0 0 0 2px var(--t-bg,#000)}
nav .util[data-state="err"] .ic::after{background:var(--t-danger,#EF5A50)}
dialog{border:0;padding:0;background:var(--t-raised,#1D1D22);color:var(--ink);width:100%;max-width:560px;margin:auto auto 0;border-radius:20px 20px 0 0;max-height:92vh;font-family:var(--font)}
@media (min-width:600px){dialog{margin:auto;border-radius:20px}}
dialog::backdrop{background:var(--t-backdrop,rgba(0,0,0,.6))}
.sheet{padding:20px 20px calc(20px + env(safe-area-inset-bottom,0px));display:flex;flex-direction:column;gap:14px}
.sheet h2{margin:0;font-size:1.15rem;font-weight:700}
.sheet p{margin:0}
.sheet .note{font-size:.85rem;color:var(--muted);line-height:1.45}
.sheet .warn{font-size:.85rem;color:var(--t-gold,#E6C170);background:var(--t-pinbg,#2A2413);border-radius:12px;padding:10px 12px;line-height:1.45}
.sheet .warn code,.sheet .note code{font-family:"Roboto Mono",ui-monospace,Menlo,monospace;font-size:.8rem}
.sw{display:flex;align-items:center;justify-content:space-between;gap:12px;background:var(--t-surface,#131316);border-radius:14px;padding:12px 14px;min-height:56px;cursor:pointer}
.sw input{appearance:none;width:46px;height:28px;border-radius:999px;background:var(--t-edge,#3B3B43);position:relative;flex:0 0 auto;cursor:pointer;margin:0}
.sw input::after{content:"";position:absolute;top:3px;left:3px;width:22px;height:22px;border-radius:50%;background:var(--t-knob,#F2F2F4);transition:left .15s}
.sw input:checked{background:var(--grad)}
.sw input:checked::after{left:21px;background:var(--t-on-grad,#17161C)}
.sw input:disabled{opacity:.4}
.bk-list{display:flex;flex-direction:column;gap:6px}
.bk-row{background:var(--t-surface,#131316);border-radius:12px;padding:10px 12px}
.bk-row b{display:block;font-weight:500}
.bk-row span{display:block;font-size:.8rem;color:var(--muted);overflow-wrap:anywhere}
.bk-row span.err{color:var(--t-danger,#EF5A50)}
.bk-bar{display:flex;gap:8px;flex-wrap:wrap}
.bk-btn{border:0;border-radius:12px;padding:12px 16px;min-height:48px;background:var(--t-surface,#131316);color:var(--ink);font:inherit;cursor:pointer}
.bk-btn.primary{background:var(--grad);color:var(--t-on-grad,#17161C);font-weight:700}
.bk-btn:disabled{opacity:.45;cursor:default}
.bk-sel{background:var(--t-field,#0F0F12);border:1.5px solid var(--t-line,#2E2E35);border-radius:12px;padding:12px;min-height:48px;color:var(--ink);font:inherit;flex:1;min-width:0}
.bk-files{display:flex;flex-direction:column;gap:6px;max-height:36vh;overflow-y:auto}
.bk-files button{text-align:left;border:0;background:var(--t-surface,#131316);color:var(--ink);border-radius:12px;padding:10px 12px;font:inherit;cursor:pointer}
.bk-files button small{display:block;color:var(--muted);font-size:.78rem}
.sheet h3{margin:6px 0 -4px;font-size:.85rem;font-weight:500;color:var(--accent)}
.bk-toast{position:fixed;left:50%;bottom:calc(96px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--t-raised2,#26262C);color:var(--ink);padding:10px 16px;border-radius:12px;font-size:.9rem;opacity:0;pointer-events:none;transition:opacity .2s;max-width:90vw;text-align:center;z-index:10}
.bk-toast.show{opacity:1}
@media (min-width:900px){
  body{grid-template-rows:minmax(0,1fr);grid-template-columns:auto minmax(0,1fr)}
  nav{order:-1;flex-direction:column;justify-content:flex-start;gap:10px;width:96px;border-top:0;border-right:1px solid var(--line);
    padding:18px 6px calc(18px + env(safe-area-inset-bottom,0px))}
  nav button{flex:none}
}
</style>

lex-wrap:wrap;margin-top:4px}\n.wacts .ibtn{min-width:40px;min-height:40px;font-size:.95rem}\n.wacts .txt{font-size:.84rem;padding:0 10px;color:var(--accent);min-height:40px}\n.status{font-size:.85rem;color:var(--muted);margin:0 2px 10px;display:flex;align-items:center;gap:6px}\n.spin{display:inline-block;width:14px;height:14px;border:2px solid var(--muted);border-top-color:var(--accent);border-radius:50%;animation:sp .7s linear infinite}\n@keyframes sp{to{transform:rotate(360deg)}}\n.tchip{position:relative}\n.tchip .x{margin-left:6px;opacity:.6}\n/* ---- Theme: dark with pink-to-blue accents ---- */\n:root{\n  --bg:var(--t-bg,#000000);--surface:var(--t-surface,#131316);--raised:var(--t-raised,#1D1D22);--ink:var(--t-ink,#F2F2F4);--muted:var(--t-muted,#9D9DA5);--faint:var(--t-faint,#28282E);\n  --accent:var(--t-accent,#EBA8E4);--accent2:var(--t-accent2,#A7CBF4);\n  --grad:linear-gradient(90deg,var(--t-grad1,#F0A8DC) 0%,var(--t-grad2,#C9B6EF) 50%,var(--t-grad3,#A6CCF5) 100%);\n  --danger:var(--t-danger,#EF5A50);--star:var(--t-accent,#EBA8E4);--pinbg:var(--t-pinbg,#2A2413);\n  --font:Roboto,\"Google Sans\",system-ui,-apple-system,\"Segoe UI\",sans-serif;\n  --mono:\"Roboto Mono\",\"Droid Sans Mono\",ui-monospace,Menlo,Consolas,monospace;\n}\nbody{background-color:var(--t-bg,#000);background-image:linear-gradient(172deg,var(--t-head,#5A4360) 0%,var(--t-head2,#352C3F) 90px,var(--t-head3,#15121A) 210px,var(--t-bg,#000) 320px);background-repeat:no-repeat;background-size:100% 340px}\nh1{font-weight:500;font-size:1.85rem;letter-spacing:0}\nh1 .n{font-size:1rem}\n.search{background:var(--t-field,#0E0E11);border:1.5px solid var(--t-line,#2E2E35);border-radius:999px}\n.search:focus{border-color:var(--t-focus,#9C8BC0);outline:none}\n.chip{background:var(--t-bg,#000);border:1.5px solid var(--t-edge,#3B3B43);color:var(--ink)}\n.chip[aria-pressed=\"true\"]{background:var(--grad);border-color:transparent;color:var(--t-on-grad,#17161C);font-weight:500}\n.chip.add{color:var(--accent) :wrap;gap:6px}\n.seg button{padding:9px 13px;border-radius:999px;background:var(--t-field,#0F0F12);color:var(--muted);min-height:40px}\n.fnote{font-size:.78rem;color:var(--muted);margin:-4px 2px 0}\n.capnote{display:block;color:var(--gold);margin-top:2px}\n\u003c/style>\n\u003c/head>\n\u003cbody>\n\u003cdiv class=\"wrap\">\n  \u003cheader>\n    \u003ch1>Radar\u003cspan class=\"n\" id=\"total\">\u003c/span>\u003c/h1>\n    \u003cdiv class=\"hbtns\">\n      \u003cbutton class=\"ibtn\" id=\"refreshBtn\" aria-label=\"Refresh\">⟳\u003c/button>\n      \u003cbutton class=\"ibtn\" id=\"moreBtn\" aria-label=\"More options\" aria-expanded=\"false\">⋮\u003c/button>\n      \u003cdiv class=\"menu\" id=\"menu\" role=\"menu\">\n        \u003cbutton role=\"menuitem\" id=\"markBtn\">Mark all as seen\u003c/button>\n        \u003cbutton role=\"menuitem\" id=\"bibBtn\">Export reading list (BibTeX)\u003c/button>\n        \u003cbutton role=\"menuitem\" id=\"copyListBtn\">Copy reading list as text\u003c/button>\n        \u003cbutton role=\"menuitem\" id=\"windowBtn\">Search filters\u003c/button>\n        \u003cbutton role=\"menuitem\" id=\"testBtn\">Test the connection\u003c/button>\n        \u003cbutton role=\"menuitem\" id=\"clearBtn\">Clear cached results\u003c/button>\n        \u003cbutton role=\"menuitem\" id=\"exportBtn\">Export backup\u003c/button>\n        \u003cbutton role=\"menuitem\" id=\"importBtn\">Import backup\u003c/button>\n        \u003cbutton role=\"menuitem\" id=\"mailBtn\">Set contact email\u003c/button>\n        \u003cbutton role=\"menuitem\" id=\"oaKeyBtn\">Set OpenAlex API key\u003c/button>\n      \u003c/div>\n      \u003cinput type=\"file\" id=\"importFile\" accept=\"application/json,.json\" hidden>\n    \u003c/div>\n  \u003c/header>\n\n  \u003cdiv class=\"topicbar\">\n    \u003clabel class=\"sr\" for=\"newTopic\">New topic\u003c/label>\n    \u003cinput id=\"newTopic\" placeholder=\"Topic, e.g. PETase OR MHETase\" autocapitalize=\"off\">\n    \u003cbutton class=\"btn primary\" id=\"addTopic\" style=\"min-height:48px;border-radius:12px;padding:12px 16px\">Add\u003c/button>\n  \u003c/div>\n  \u003cdiv class=\"chips\" id=\"chips\">\u003c/div>\n  \u003cbutton class=\"fbar\" id=\"filterBar\" type=\"button\" aria-haspopup=\"dialog\">\u003c/button>\n  \u003cp class=\"status\" id=\"status\">\u003c/p>\n  \u003cmain class=\"list\" id=\"list\">\u003c/main>\n  \u003cp class=\"sync\" id=\"sync\">\u003c/p>\n\u003c/div>\n\n\u003cdialog id=\"fDlg\" aria-labelledby=\"fTitle\">\n  \u003cdiv class=\"sheet\">\n    \u003ch2 id=\"fTitle\">Search filters\u003c/h2>\n    \u003cp class=\"fnote\" style=\"margin:-4px 0 0\">Applied to every topic when the radar asks OpenAlex, and to what the list shows.\u003c/p>\n    \u003ch4>Publication date\u003c/h4>\n    \u003cdiv class=\"seg\" id=\"fMode\">\u003cbutton type=\"button\" data-v=\"days\">Last days\u003c/button>\u003cbutton type=\"button\" data-v=\"range\">Between dates\u003c/button>\u003c/div>\n    \u003clabel id=\"fDaysL\">Days back\u003cinput type=\"number\" id=\"fDays\" min=\"1\" max=\"3650\" inputmode=\"numeric\">\u003c/label>\n    \u003cdiv class=\"row\" id=\"fRangeL\">\u003clabel>From\u003cinput type=\"date\" id=\"fFrom\">\u003c/label>\u003clabel>To (empty for today)\u003cinput type=\"date\" id=\"fTo\">\u003c/label>\u003c/div>\n    \u003ch4>Type\u003c/h4>\n    \u003cdiv class=\"seg\" id=\"fTypes\">\u003cbutton type=\"button\" data-v=\"article\">Articles\u003c/button>\u003cbutton type=\"button\" data-v=\"review\">Reviews\u003c/button>\u003cbutton type=\"button\" data-v=\"preprint\">Preprints\u003c/button>\u003cbutton type=\"button\" data-v=\"book-chapter\">Book chapters\u003c/button>\u003c/div>\n    \u003cp class=\"fnote\">None selected means every type.\u003c/p>\n    \u003ch4>Only papers that are\u003c/h4>\n    \u003clabel class=\"check\">\u003cinput type=\"checkbox\" id=\"fOA\">Open access\u003c/label>\n    \u003clabel class=\"check\">\u003cinput type=\"checkbox\" id=\"fAbs\">Listed with an abstract\u003c/label>\n    \u003clabel class=\"check\">\u003cinput type=\"checkbox\" id=\"fEn\">In English\u003c/label>\n    \u003clabel>Cited at least this many times\u003cinput type=\"number\" id=\"fCites\" min=\"0\" inputmode=\"numeric\" placeholder=\"0\">\u003c/label>\n    \u003ch4>Results\u003c/h4>\n    \u003cdiv class=\"row\">\n      \u003clabel>Order\u003cselect id=\"fSort\">\u003coption value=\"date\">Newest first\u003c/option>\u003coption value=\"cites\">Most cited first\u003c/option>\u003c/select>\u003c/label>\n      \u003clabel>Per topic, up to\u003cselect id=\"fMax\">\u003coption>25\u003c/option>\u003coption>50\u003c/option>\u003coption>100\u003c/option>\u003coption>200\u003c/option>\u003coption>500\u003c/option>\u003c/select>\u003c/label>\n    \u003c/div>\n    \u003cp class=\"fnote\">Topics accept OR, AND and NOT, e.g. \u003ci>PETase NOT review\u003c/i>. The radar keeps up to 1,500 results; the oldest ones you have seen are dropped first.\u003c/p>\n    \u003cp class=\"hint\" id=\"fHint\">\u003c/p>\n    \u003cdiv class=\"sbar\">\n      \u003cbutton class=\"btn ghost\" type=\"button\" id=\"fReset\">Reset\u003c/button>\n      \u003cdiv style=\"display:flex;gap:8px\">\u003cbutton class=\"btn ghost\" type=\"button\" data-close>Cancel\u003c/button>\u003cbutton class=\"btn primary\" type=\"button\" id=\"fApply\">Apply and check\u003c/button>\u003c/div>\n    \u003c/div>\n  \u003c/div>\n\u003c/dialog>\n\n\u003cdiv class=\"toast\" id=\"toast\" role=\"status\" aria-live=\"polite\">\u003c/div>\n\u003cscript>\nconst $=s=>document.querySelector(s);\nconst uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,7);\nconst esc=s=>String(s??\"\").replace(/[&\u003c>\"']/g,m=>({\"&\":\"&amp;\",\"\u003c\":\"&lt;\",\">\":\"&gt;\",'\"':\"&quot;\",\"'\":\"&#39;\"}[m]));\nconst num=v=>{const n=parseFloat(v);return isFinite(n)?n:null};\nconst stamp=()=>new Date().toISOString().slice(0,10);\nlet _tt=null;\nfunction toast(t){const el=$(\"#toast\");el.textContent=t;el.classList.add(\"show\");clearTimeout(_tt);_tt=setTimeout(()=>el.classList.remove(\"show\"),2400)}\nasync function copyText(t,msg){\n  try{await navigator.clipboard.writeText(t);toast(msg||\"Copied\")}\n  catch(_){const a=document.createElement(\"textarea\");a.value=t;document.body.appendChild(a);a.select();\n    try{document.execCommand(\"copy\");toast(msg||\"Copied\")}catch(__){toast(\"Copy not available\")}a.remove()}\n}\nfunction storageWorks(){try{const k=\"__probe\"+Math.random();localStorage.setItem(k,\"1\");localStorage.removeItem(k);return true}catch(_){return false}}\nfunction saveFile(filename,data){\n  try{\n    const ext=(filename.split(\".\").pop()||\"\").toLowerCase();\n    const type={json:\"application/json\",csv:\"text/csv\",md:\"text/markdown\",py:\"text/x-python\",sh:\"text/x-shellscript\",png:\"image/png\"}[ext]||\"text/plain\";\n    const blob=data instanceof Blob?data:new Blob([data],{type:type+\";charset=utf-8\"});\n    const url=URL.createObjectURL(blob);\n    const a=document.createElement(\"a\");a.href=url;a.download=filename;a.style.display=\"none\";\n    document.body.appendChild(a);a.click();a.remove();\n    setTimeout(()=>URL.revokeObjectURL(url),10000);\n    toast(\"Saved to Downloads\");if(/\\.json$/i.test(filename)&&window.__markBackup)window.__markBackup();\n  }catch(_){toast(\"Couldn't save the file\")}\n}\nfunction setupMenu(){\n  const menu=$(\"#menu\"),btn=$(\"#moreBtn\");\n  const close=()=>{menu.classList.remove(\"open\");btn.setAttribute(\"aria-expanded\",\"false\")};\n  btn.addEventListener(\"click\",e=>{e.stopPropagation();btn.setAttribute(\"aria-expanded\",menu.classList.toggle(\"open\"))});\n  document.addEventListener(\"click\",e=>{if(!e.target.closest(\"#menu\"))close()});\n  menu.addEventListener(\"click\",close);\n  document.querySelectorAll(\"[data-close]\").forEach(b=>b.addEventListener(\"click\",()=>b.closest(\"dialog\").close()));\n  document.querySelectorAll(\"dialog\").forEach(d=>d.addEventListener(\"click\",e=>{if(e.target===d)d.close()}));\n}\n// Store: kept in this browser's local storage only.\nfunction makeStore(lsKey,docName,listKeys,onChange){\n  const S={data:null};\n  try{const r=localStorage.getItem(lsKey);S.data=r?JSON.parse(r):null}catch(_){}\n  if(!S.data||typeof S.data!==\"object\") S.data={};\n  listKeys.forEach(k=>{if(!Array.isArray(S.data[k]))S.data[k]=[]});\n  S.saveLocal=()=>{try{localStorage.setItem(lsKey,JSON.stringify(S.data))}catch(_){toast(\"Couldn't save. Storage is full or blocked; export a backup.\")}};\n  S.persist=()=>S.saveLocal();\n  S.connect=()=>{\n    $(\"#sync\").textContent=storageWorks()?(localStorage.getItem(\"sync.github\")?\"Saved on this device and synced to your other devices.\":\"Saved on this device. Turn on sync in the control center, or export a backup now and then.\"):\"Storage is blocked here, so changes will be lost when you close this page.\";\n  };\n  return S;\n}\n\n// ---- network helpers (self-hosted: real internet access) ----\nconst MAILTO=()=>{try{return localStorage.getItem(\"net.mailto\")||\"\"}catch(_){return \"\"}};\n/* OpenAlex has asked for a free API key on every request since February 2026; it is set in the menu\n   here or in the control center's Settings, and shared by every app on this address */\nconst OAKEY=()=>{try{return (localStorage.getItem(\"net.openalexKey\")||\"\").trim()}catch(_){return \"\"}};\nconst isOA=url=>/^https:\\/\\/api\\.openalex\\.org\\//.test(url);\nfunction withMail(url){\n  const m=MAILTO(), k=isOA(url)?OAKEY():\"\", add=(u,p)=>u+(u.includes(\"?\")?\"&\":\"?\")+p;\n  if(m) url=add(url,\"mailto=\"+encodeURIComponent(m));\n  if(k) url=add(url,\"api_key=\"+encodeURIComponent(k));\n  return url;\n}\nasync function getJSON(url,opts){\n  const c=new AbortController(); const t=setTimeout(()=>c.abort(),20000);\n  try{\n    const r=await fetch(withMail(url),{signal:c.signal,headers:{Accept:\"application/json\"},...(opts||{})});\n    if(!r.ok) throw {code:r.status,message:\"HTTP \"+r.status,oa:isOA(url)};\n    return await r.json();\n  }catch(e){\n    if(e&&e.name===\"AbortError\") throw {code:\"timeout\",message:\"The request timed out\"};\n    if(e&&e.code) throw e;\n    throw {code:\"offline\",message:\"No connection, or the service refused the request\"};\n  }finally{clearTimeout(t)}\n}\nasync function getText(url){\n  const c=new AbortController(); const t=setTimeout(()=>c.abort(),30000);\n  try{\n    const r=await fetch(url,{signal:c.signal});\n    if(!r.ok) throw {code:r.status,message:\"HTTP \"+r.status};\n    return await r.text();\n  }catch(e){\n    if(e&&e.name===\"AbortError\") throw {code:\"timeout\",message:\"The request timed out\"};\n    if(e&&e.code) throw e;\n    throw {code:\"offline\",message:\"No connection, or the service refused the request\"};\n  }finally{clearTimeout(t)}\n}\nconst netErr=e=>{\n  if(e&&e.oa&&!OAKEY()&&(e.code===401||e.code===403||e.code===429)) return \"OpenAlex now asks for a free API key. Get one at openalex.org/settings/api, then add it with the menu (⋮), Set OpenAlex API key.\";\n  if(e&&e.oa&&(e.code===401||e.code===403)) return \"OpenAlex did not accept your API key. Check it with the menu (⋮), Set OpenAlex API key.\";\n  if(e&&e.oa&&e.code===429) return \"OpenAlex's daily allowance for your key is used up. Try again tomorrow.\";\n  return e&&e.code===\"offline\"?\"No connection. Check you are online and try again.\":e&&e.code===\"timeout\"?\"The service did not answer in time.\":e&&e.code===404?\"Not found.\":\"Request failed (\"+((e&&e.message)||\"unknown\")+\").\";\n};\n\n(function(){\n  const store=makeStore(\"litradar.v1\",\"radar\",[\"topics\",\"works\",\"saved\"],render);\n  const D=()=>store.data;\n  if(!D().days) D().days=45;\n  if(!D().lastRun) D().lastRun=0;\n  let filter=\"all\", busy=false;\n  const FDEF={mode:\"days\",days:45,from:\"\",to:\"\",types:[],oa:false,abs:false,en:false,minCites:0,sort:\"date\",max:100};\n  if(!D().filters||typeof D().filters!==\"object\") D().filters={...FDEF,days:D().days| hite-space:nowrap;display:inline-flex;align-items:center;gap:6px}\n.chip .c{opacity:.7}\n.chip .dot{width:8px;height:8px;border-radius:50%;background:var(--cc)}\n.chip[aria-pressed=\"true\"]{background:var(--ink);color:var(--bg)}\n.bar{display:flex;justify-content:space-between;align-items:center;margin:14px 2px 8px;color:var(--muted);font-size:.85rem;gap:8px}\n.bar select{background:transparent;border:0;color:var(--muted);padding:6px 0;min-height:40px;max-width:60%}\n.list{display:flex;flex-direction:column;gap:8px}\n.card{background:var(--surface);border-radius:14px;padding:14px 10px 8px 16px}\n.card h3{font-size:1rem;font-weight:500;margin:0;overflow-wrap:anywhere}\n.top{display:flex;justify-content:space-between;gap:10px;align-items:flex-start}\n.tags{display:flex;flex-wrap:wrap;gap:4px 12px;margin-top:4px;font-size:.82rem;color:var(--muted)}\n.pill{flex:0 0 auto;font-size:.75rem;font-weight:700;padding:3px 10px;border-radius:999px;color:var(--cc);background:color-mix(in srgb,var(--cc) 16%,transparent)}\n.note{font-size:.88rem;color:var(--muted);margin-top:6px;white-space:pre-wrap;overflow-wrap:anywhere}\n.acts{display:flex;justify-content:flex-end;margin-top:2px;flex-wrap:wrap}\n.acts .ibtn{min-width:40px;min-height:40px;font-size:.95rem}\n.acts .txt{font-size:.85rem;padding:0 10px;color:var(--accent)}\n.star-on{color:var(--gold)}\n.empty{color:var(--muted);text-align:center;padding:48px 16px}\n.fab{position:fixed;right:20px;bottom:calc(20px + env(safe-area-inset-bottom,0px));width:60px;height:60px;border-radius:18px;background:var(--accent);color:var(--t-on-accent,#14161B);font-size:1.8rem;box-shadow:0 6px 18px var(--t-shadow,rgba(0,0,0,.45));z-index:4}\ndialog{border:0;padding:0;background:var(--raised);color:var(--ink);width:100%;max-width:560px;margin:auto auto 0;border-radius:20px 20px 0 0;max-height:92vh}\n@media (min-width:600px){dialog{margin:auto;border-radius:20px}}\ndialog::backdrop{background:var(--t-backdrop,rgba(0,0,0,.6))}\n.sheet{padding:20px 20px calc(20px + env(safe-area-inset-bottom,0px));display:flex;flex-direction:column;gap:12px}\n.sheet h2{margin:0;font-size:1.15rem;font-weight:700}\n.sheet h4{margin:6px 0 -4px;font-size:.8rem;font-weight:500;color:var(--accent)}\n.sheet label{display:flex;flex-direction:column;gap:6px;font-size:.85rem;color:var(--muted);min-width:0}\n.sheet input,.sheet select,.sheet textarea{background:var(--surface);border:0;border-radius:12px;padding:12px;color:var(--ink);min-height:48px;width:100%;min-width:0}\n.sheet textarea{min-height:90px;resize:vertical}\n.mono{font-family:var(--mono)!important;font-size:.88rem!important}\n.row{display:grid;grid-template-columns:1fr 1fr;gap:10px}\n.row3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px}\n.check{flex-direction:row!important;align-items:center;gap:10px!important;color:var(--ink)!important;font-size:1rem!important}\n.check input{min-height:auto!important;width:20px!important;height:20px;accent-color:var(--accent)}\n.hint{font-size:.8rem;color:var(--danger);min-height:1em;margin:0}\n.sbar{display:flex;justify-content:space-between;gap:8px;margin-top:4px}\n.btn{border-radius:12px;padding:12px 16px;min-height:48px}\n.btn.primary{background:var(--accent);color:var(--t-on-accent,#14161B);font-weight:700}\n.btn.ghost{color:var(--muted)}\n.btn.danger{color:var(--danger)}\n.toast{position:fixed;left:50%;bottom:calc(96px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--raised);padding:10px 16px;border-radius:12px;font-size:.9rem;opacity:0;pointer-events:none;transition:opacity .2s;max-width:90vw;text-align:center;z-index:6}\n.toast.show{opacity:1}\n.sync{font-size:.8rem;color:var(--muted);text-align:center;margin-top:24px}\n.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}\n.hidden{display:none!important}\n.setup{background:var(--surface);border-radius:16px;padding:16px;margin-bottom:14px}\n.setup input{width:100%;background:var(--t-field,#0E0E11);border:1.5px solid var(--t-line,#2E2E35);border-radius:12px;padding:12px;min-height:48px;color:var(--ink);margin-bottom:8px}\n.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;margin-bottom:14px}\n.stat{background:var(--surface);border-radius:12px;padding:12px 6px;text-align:center}\n.stat b{display:block;font-size:1.35rem;font-weight:700;font-variant-numeric:tabular-nums}\n.stat span{font-size:.72rem;color:var(--muted)}\n.stat .up{font-size:.72rem;color:var(--green)}\n.panel{background:var(--surface);border-radius:16px;padding:14px;margin-bottom:14px}\n.panel h2{font-size:.8rem;font-weight:700;letter-spacing:.04em;text-transform:uppercase;color:var(--muted);margin:0 0 10px}\nsvg{display:block;width:100%;height:auto}\n.work{background:var(--surface);border-radius:14px;padding:12px 14px}\n.work h3{font-size:.96rem;font-weight:500;margin:0;overflow-wrap:anywhere}\n.work .vn{font-size:.8rem;color:var(--muted);margin-top:3px;display:flex;flex-wrap:wrap;gap:4px 10px}\n.work .cc{float:right;margin-left:10px;font-weight:700;font-variant-numeric:tabular-nums}\n.work .cc small{display:block;font-size:.7rem;font-weight:400;color:var(--green);text-align:right}\n.spin{display:inline-block;width:14px;height:14px;border:2px solid var(--muted);border-top-color:var(--accent);border-radius:50%;animation:sp .7s linear infinite;vertical-align:-2px;margin-right:6px}\n@keyframes sp{to{transform:rotate(360deg)}}\n.res{background:var(--t-field,#0E0E11);border-radius:12px;padding:12px;margin-bottom:6px;display:block;width:100%;text-align:left}\n.res b{font-weight:500}\n.res span{display:block;font-size:.8rem;color:var(--muted);margin-top:2px}\n.res[data-a]{cursor:pointer;color:inherit;font:inherit;border:1.5px solid var(--faint)}\n.res[data-a]:hover,.res[data-a]:focus-visible{border-color:var(--muted)}\n.hithead{font-size:.82rem;color:var(--muted);margin:0 0 8px}\n.morehits{width:100%;margin-top:2px}\n/* ---- Theme: dark with pink-to-blue accents ---- */\n:root{\n  --bg:var(--t-bg,#000000);--surface:var(--t-surface,#131316);--raised:var(--t-raised,#1D1D22);--ink:var(--t-ink,#F2F2F4);--muted:var(--t-muted,#9D9DA5);--faint:var(--t-faint,#28282E);\n  --accent:var(--t-accent,#EBA8E4);--accent2:var(--t-accent2,#A7CBF4);\n  --grad:linear-gradient(90deg,var(--t-grad1,#F0A8DC) 0%,var(--t-grad2,#C9B6EF) 50%,var(--t-grad3,#A6CCF5) 100%);\n  --danger:var(--t-danger,#EF5A50);--star:var(--t-accent,#EBA8E4);--pinbg:var(--t-pinbg,#2A2413);\n  --font:Roboto,\"Google Sans\",system-ui,-apple-system,\"Segoe UI\",sans-serif;\n  --mono:\"Roboto Mono\",\"Droid Sans Mono\",ui-monospace,Menlo,Consolas,monospace;\n}\nbody{background-color:var(--t-bg,#000);background-image:linear-gradient(172deg,var(--t-head,#5A4360) 0%,var(--t-head2,#352C3F) 90px,var(--t-head3,#15121A) 210px,var(--t-bg,#000) 320px);background-repeat:no-repeat;background-size:100% 340px}\nh1{font-weight:500;font-size:1.85rem;letter-spacing:0}\nh1 .n{font-size:1rem}\n.search{background:var(--t-field,#0E0E11);border:1.5px solid var(--t-line,#2E2E35);border-radius:999px}\n.search:focus{border-color:var(--t-focus,#9C8BC0);outline:none}\n.chip{background:var(--t-bg,#000);border:1.5px solid var(--t-edge,#3B3B43);color:var(--ink)}\n.chip[aria-pressed=\"true\"]{background:var(--grad);border-color:transparent;color:var(--t-on-grad,#17161C);font-weight:500}\n.chip.add{color:var(--accent)}\n.tab[aria-selected=\"true\"]::after{background:var(--grad)}\n.btn.primary,.add{background:var(--grad)!important;color:var(--t-on-grad,#17161C)!important}\n.fab{background:var(--t-fab,#17171C);border:1px solid var(--t-edge,#3A3A42);color:var(--t-fab-ink,#D9B9EE);box-shadow:0 8px 22px var(--t-shadow,rgba(0,0,0,.7))}\n.star-on{color:var(--star)!important}\n.card:has(.star-on),.paper:has(.star-on),.entry:has(.star-on){background:var(--pinbg)}\n.menu{background:var(--raised);border:1px solid var(--t-line,#2E2E35)}\ndialog{background:var(--raised)}\n.sheet input,.sheet select,.sheet textarea,.dlg input,.dlg textarea,.dlg select{background:var(--t-field,#0F0F12)}\n.toast{background:var(--t-raised2,#26262C);color:var(--ink)}\n.doi{color:var(--accent2)}\n.sync{color:var(--t-dim,#6F6F77)}\n.seg button[aria-pressed=\"true\"]{background:var(--grad);color:var(--t-on-grad,#17161C)}\n.topbar{background:linear-gradient(172deg,var(--t-head,#5A4360) 0%,var(--t-headbar,#2A2432) 100%)}\n.toolbar{background:var(--t-bg,#000)}\n.bk.hidden{display:none!important}\n.bk{display:flex;align-items:center;gap:8px;background:var(--pinbg,var(--t-pinbg,#2A2413));border-radius:14px;padding:10px 8px 10px 14px;margin:0 0 14px}\n.bk .bkt{flex:1;min-width:0;font-size:.9rem;line-height:1.3}\n.bk .bkt b{display:block;font-weight:500}\n.bk .bkt span{color:var(--muted);font-size:.8rem}\n.bk .bkgo{background:var(--grad);color:var(--t-on-grad,#17161C);border-radius:999px;padding:10px 14px;min-height:44px;font-weight:500;white-space:nowrap}\n.bk .bkno{color:var(--muted);padding:10px 8px;min-height:44px}\n\u003c/style>\n\u003c/head>\n\u003cbody>\n\u003cdiv class=\"wrap\">\n  \u003cheader>\n    \u003ch1 id=\"h1\">Citations\u003c/h1>\n    \u003cdiv class=\"hbtns\">\n      \u003cbutton class=\"ibtn\" id=\"refreshBtn\" aria-label=\"Refresh\">⟳\u003c/button>\n      \u003cbutton class=\"ibtn\" id=\"moreBtn\" aria-label=\"More options\" aria-expanded=\"false\">⋮\u003c/button>\n      \u003cdiv class=\"menu\" id=\"menu\" role=\"menu\">\n        \u003cbutton role=\"menuitem\" id=\"changeBtn\">Change author\u003c/button>\n        \u003cbutton role=\"menuitem\" id=\"csvBtn\">Export CSV\u003c/button>\n        \u003cbutton role=\"menuitem\" id=\"exportBtn\">Export backup\u003c/button>\n        \u003cbutton role=\"menuitem\" id=\"importBtn\">Import backup\u003c/button>\n        \u003cbutton role=\"menuitem\" id=\"mailBtn\">Set contact email\u003c/button>\n        \u003cbutton role=\"menuitem\" id=\"oaKeyBtn\">Set OpenAlex API key\u003c/button>\n      \u003c/div>\n      \u003cinput type=\"file\" id=\"importFile\" accept=\"application/json,.json\" hidden>\n    \u003c/div>\n  \u003c/header>\n  \u003cdiv id=\"body\">\u003c/div>\n  \u003cp class=\"sync\" id=\"sync\">\u003c/p>\n\u003c/div>\n\u003cdiv class=\"toast\" id=\"toast\" role=\"status\" aria-live=\"polite\">\u003c/div>\n\u003cscript>\nconst $=s=>document.querySelector(s);\nconst uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,7);\nconst esc=s=>String(s??\"\").replace(/[&\u003c>\"']/g,m=>({\"&\":\"&amp;\",\"\u003c\":\"&lt;\",\">\":\"&gt;\",'\"':\"&quot;\",\"'\":\"&#39;\"}[m]));\nconst num=v=>{const n=parseFloat(v);return isFinite(n)?n:null};\nconst stamp=()=>new Date().toISOString().slice(0,10);\nlet _tt=null;\nfunction toast(t){const el=$(\"#toast\");el.textContent=t;el.classList.add(\"show\");clearTimeout(_tt);_tt=setTimeout(()=>el.classList.remove(\"show\"),2400)}\nasync function copyText(t,msg){\n  try{await navigator.clipboard.writeText(t);toast(msg||\"Copied\")}\n  catch(_){const a=document.createElement(\"textarea\");a.value=t;document.body.appendChild(a);a.select();\n    try{document.execCommand(\"copy\");toast(msg||\"Copied\")}catch(__){toast(\"Copy not available\")}a.remove()}\n}\nfunction storageWorks(){try{const k=\"__probe\"+Math.random();localStorage.setItem(k,\"1\");localStorage.removeItem(k);return true}catch(_){return false}}\nfunction saveFile(filename,data){\n  try{\n    const ext=(filename.split(\".\").pop()||\"\").toLowerCase();\n    const type={json:\"application/json\",csv:\"text/csv\",md:\"text/markdown\",py:\"text/x-python\",sh:\"text/x-shellscript\",png:\"image/png\"}[ext]||\"text/plain\";\n    const blob=data instanceof Blob?data:new Blob([data],{type:type+\";charset=utf-8\"});\n    const url=URL.createObjectURL(blob);\n    const a=document.createElement(\"a\");a.href=url;a.download=filename;a.style.display=\"none\";\n    document.body.appendChild(a);a.click();a.remove();\n    setTimeout(()=>URL.revokeObjectURL(url),10000);\n    toast(\"Saved to Downloads\");if(/\\.json$/i.test(filename)&&window.__markBackup)window.__markBackup();\n  }catch(_){toast(\"Couldn't save the file\")}\n}\nfunction setupMenu(){\n  const menu=$(\"#menu\"),btn=$(\"#moreBtn\");\n  const close=()=>{menu.classList.remove(\"open\");btn.setAttribute(\"aria-expanded\",\"false\")};\n  btn.addEventListener(\"click\",e=>{e.stopPropagation();btn.setAttribute(\"aria-expanded\",menu.classList.toggle(\"open\"))});\n  document.addEventListener(\"click\",e=>{if(!e.target.closest(\"#menu\"))close()});\n  menu.addEventListener(\"click\",close);\n  document.querySelectorAll(\"[data-close]\").forEach(b=>b.addEventListener(\"click\",()=>b.closest(\"dialog\").close()));\n  document.querySelectorAll(\"dialog\").forEach(d=>d.addEventListener(\"click\",e=>{if(e.target===d)d.close()}));\n}\n// Store: kept in this browser's local storage only.\nfunction makeStore(lsKey,docName,listKeys,onChange){\n  const S={data:null};\n  try{const r=localStorage.getItem(lsKey);S.data=r?JSON.parse(r):null}catch(_){}\n  if(!S.data||typeof S.data!==\"object\") S.data={};\n  listKeys.forEach(k=>{if(!Array.isArray(S.data[k]))S.data[k]=[]});\n  S.saveLocal=()=>{try{localStorage.setItem(lsKey,JSON.stringify(S.data))}catch(_){toast(\"Couldn't save. Storage is full or blocked; export a backup.\")}};\n  S.persist=()=>S.saveLocal();\n  S.connect=()=>{\n    $(\"#sync\").textContent=storageWorks()?(localStorage.getItem(\"sync.github\")?\"Saved on this device and synced to your other devices.\":\"Saved on this device. Turn on sync in the control center, or export a backup now and then.\"):\"Storage is blocked here, so changes will be lost when you close this page.\";\n  };\n  return S;\n}\n\n// ---- network helpers (self-hosted: real internet access) ----\nconst MAILTO=()=>{try{return localStorage.getItem(\"net.mailto\")||\"\"}catch(_){return \"\"}};\n/* OpenAlex has asked for a free API key on every request since February 2026; it is set in the menu\n   here or in the control center's Settings, and shared by every app on this address */\nconst OAKEY=()=>{try{return (localStorage.getItem(\"net.openalexKey\")||\"\").trim()}catch(_){return \"\"}};\nconst isOA=url=>/^https:\\/\\/api\\.openalex\\.org\\//.test(url);\nfunction withMail(url){\n  const m=MAILTO(), k=isOA(url)?OAKEY():\"\", add=(u,p)=>u+(u.includes(\"?\")?\"&\":\"?\")+p;\n  if(m) url=add(url,\"mailto=\"+encodeURIComponent(m));\n  if(k) url=add(url,\"api_key=\"+encodeURIComponent(k));\n  return url;\n}\nasync function getJSON(url,opts){\n  const c=new AbortController(); const t=setTimeout(()=>c.abort(),20000);\n  try{\n    const r=await fetch(withMail(url),{signal:c.signal,headers:{Accept:\"application/json\"},...(opts||{})});\n    if(!r.ok) throw {code:r.status,message:\"HTTP \"+r.status,oa:isOA(url)};\n    return await r.json();\n  }catch(e){\n    if(e&&e.name===\"AbortError\") throw {code:\"timeout\",message:\"The request timed out\"};\n    if(e&&e.code) throw e;\n    throw {code:\"offline\",message:\"No connection, or the service refused the request\"};\n  }finally{clearTimeout(t)}\n}\nasync function getText(url){\n  const c=new AbortController(); const t=setTimeout(()=>c.abort(),30000);\n  try{\n    const r=await fetch(url,{signal:c.signal});\n    if(!r.ok) throw {code:r.status,message:\"HTTP \"+r.status};\n    return await r.text();\n  }catch(e){\n    if(e&&e.name===\"AbortError\") throw {code:\"timeout\",message:\"The request timed out\"};\n    if(e&&e.code) throw e;\n    throw {code:\"offline\",message:\"No connection, or the service refused the request\"};\n  }finally{clearTimeout(t)}\n}\nconst netErr=e=>{\n  if(e&&e.oa&&!OAKEY()&&(e.code===401||e.code===403||e.code===429)) return \"OpenAlex now asks for a free API key. Get one at openalex.org/settings/api, then add it with the menu (⋮), Set OpenAlex API key.\";\n  if(e&&e.oa&&(e.code===401||e.code===403)) return \"OpenAlex did not accept your API key. Check it with the menu (⋮), Set OpenAlex API key.\";\n  if(e&&e.oa&&e.code===429) return \"OpenAlex's daily allowance for your key is used up. Try again tomorrow.\";\n  return e&&e.code===\"offline\"?\"No connection. Check you are online and try again.\":e&&e.code===\"timeout\"?\"The service did not answer in time.\":e&&e.code===404?\"Not found.\":\"Request failed (\"+((e&&e.message)||\"unknown\")+\").\";\n};\n\n(function(){\n  const store=makeStore(\"citedash.v1\",\"citations\",[\"works\",\"snaps\"],render);\n  const D=()=>store.data;\n  let busy=false, results=null, rq=\"\", rtotal=0, rbusy=false;\n\n  const fmt=n=>(n||0).toLocaleString(\"en-GB\");\n  const PER=10;\n  async function searchAuthors(q,page){\n    const r=await getJSON(`https://api.openalex.org/authors?per-page=${PER}&page=${page||1}&search=${encodeURIComponent(q)}`);\n    return {total:+((r.meta||{}).count)||0,items:(r.results||[]).map(a=>({id:(a.id||\"\").split(\"/\").pop(),name:a.display_name,\n      inst:((a.last_known_institutions||[])[0]||{}).display_name||((a.last_known_institution||{}).display_name)||\"\",\n      works:a.works_count||0,cites:a.cited_by_count||0,orcid:(a.orcid||\"\").replace(/^https?:\\/\\/orcid\\.org\\//,\"\"),\n      topics:(a.topics||[]).slice(0,2).map(t=>t&&t.display_name).filter(Boolean)}))};\n  }\n  function showAuthors(note){\n    const n=results.length, all=Math.max(rtotal,n);\n    $(\"#results\").innerHTML=`\u003cp class=\"hithead\">${all>n?`${n} of ${fmt(all)} people`:`${n} ${n===1?\"person\":\"people\"}`} in OpenAlex match \"${esc(rq)}\". Pick the profile with your papers; the numbers help.\u003c/p>`\n      +results.map((a,i)=>`\u003cbutton class=\"res\" data-a=\"${i}\">\u003cb>${esc(a.name)}\u003c/b>\u003cspan>${esc(a.inst||\"No institution listed\")}. ${fmt(a.works)} works, ${fmt(a.cites)} citations${a.orcid?\", ORCID \"+esc(a.orcid):\"\"}${a.topics.length?\". \"+esc(a.topics.join(\", \")):\"\"}\u003c/span>\u003c/button>`).join(\"\")\n      +(note||\"\")+(all>n&&n\u003c100?`\u003cbutton class=\"btn ghost morehits\" id=\"moreAuthors\">Show ${Math.min(PER,all-n)} more\u003c/button>`:\"\");\n  }\n  async function findAuthors(more){\n    if(rbusy) return;\n    const q=more?rq:$(\"#q\").value.trim(); if(!q){toast(\"Type a name\");return}\n    rbusy=true;\n    if(more){const b=$(\"#moreAuthors\");if(b){b.disabled=true;b.innerHTML=`\u003cspan class=\"spin\">\u003c/span>Loading more...`}}\n    else{rq=q;results=[];rtotal=0;$(\"#results\").innerHTML=`\u003cdiv class=\"res\">\u003cspan class=\"spin\">\u003c/span>Searching OpenAlex...\u003c/div>`}\n    try{\n      const r=await searchAuthors(q,Math.floor(results.length/PER)+1);\n      const have=new Set(results.map(a=>a.id));\n      results=results.concat(r.items.filter(a=>!have.has(a.id))); rtotal=r.total;\n      if(!results.length){$(\"#results\").innerHTML=`\u003cdiv class=\"res\">Nobody found. Try another spelling, or your name as it appears on your papers.\u003c/div>`;return}\n      showAuthors();\n    }catch(err){\n      const msg=`\u003cdiv class=\"res\" style=\"color:var(--danger)\">${esc(netErr(err))}\u003c/div>`;\n      if(more&&results.length) showAuthors(msg); else $(\"#results\").innerHTML=msg;\n    }finally{rbusy=false}\n  }\n  async function pull(){\n    if(busy||!D().author) return;\n    busy=true; render();\n    try{\n      const a=await getJSON(`https://api.openalex.org/authors/${encodeURIComponent(D().author.id)}`);\n      D().author={...D().author,name:a.display_name,works:a.works_count,cites:a.cited_by_count,\n        h:(a.summary_stats||{}).h_index||0,i10:(a.summary_stats||{}).i10_index||0,\n        byYear:(a.counts_by_year||[]).map(y=>({year:y.year,cites:y.cited_by_count,works:y.works_count}))};\n      const w=await getJSON(`https://api.openalex.org/works?per-page=100&sort=cited_by_count:desc&filter=author.id:${encodeURIComponent(D().author.id)}&select=id,doi,title,publication_year,type,primary_location,cited_by_count`);\n      const prev={}; D().works.forEach(x=>prev[x.id]=x.cites);\n      D().works=(w.results||[]).map(x=>({id:(x.id||\"\").split(\"/\").pop(),title:(x.title||\"Untitled\").replace(/\\s+/g,\" \"),\n        doi:(x.doi||\"\").replace(/^https?:\\/\\/doi\\.org\\//,\"\"),year:x.publication_year||\"\",\n        venue:(x.primary_location&&x.primary_location.source&&x.primary_location.source.display_name)||\"\",\n        cites:x.cited_by_count||0,prev:prev[(x.id||\"\").split(\"/\").pop()]??null}));\n      const today=new Date().toISOString().slice(0,10);\n      D().snaps=(D().snaps||[]).filter(s=>s.date!==today);\n      D().snaps.push({date:today,cites:D().author.cites,works:D().author.works,h:D().author.h});\n      D().snaps=D().snaps.slice(-60);\n      D().lastRun=Date.now();\n      store.persist(); toast(\"Updated\");\n    }catch(e){toast(netErr(e))}\n    busy=false; render();\n  }\n\n  function barChart(data,key,label){\n    if(!data.length) return \"\";\n    const w=320,h=120,pad=18,max=Math.max(...data.map(d=>d[key]),1);\n    const bw=(w-pad*2)/data.length;\n    const bars=data.map((d,i)=>{\n      const bh=Math.max(1,(d[key]/max)*(h-pad*2));\n      return `\u003crect x=\"${(pad+i*bw+bw*0.15).toFixed(1)}\" y=\"${(h-pad-bh).toFixed(1)}\" width=\"${(bw*0.7).toFixed(1)}\" height=\"${bh.toFixed(1)}\" rx=\"2\" fill=\"url(#g)\">\u003c/rect>`;\n    }).join(\"\");\n    const labs=data.map((d,i)=>(data.length\u003c=8||i%2===0)?`\u003ctext x=\"${(pad+i*bw+bw/2).toFixed(1)}\" y=\"${h-5}\" font-size=\"8\" style=\"fill:var(--t-muted,#9D9DA5)\" text-anchor=\"middle\">${String(d.year).slice(2)}\u003c/text>`:\"\").join(\"\");\n    return `\u003csvg viewBox=\"0 0 ${w} ${h}\" role=\"img\" aria-label=\"${label}\">\n      \u003cdefs>\u003clinearGradient id=\"g\" x1=\"0\" y1=\"1\" x2=\"0\" y2=\"0\">\u003cstop offset=\"0\" style=\"stop-color:var(--t-grad3,#A6CCF5)\"/>\u003cstop offset=\"1\" style=\"stop-color:var(--t-grad1,#F0A8DC)\"/>\u003c/linearGradient>\u003c/defs>\n      \u003ctext x=\"${pad}\" y=\"10\" font-size=\"8\" style=\"fill:var(--t-muted,#9D9DA5)\">${max}\u003c/text>${bars}${labs}\u003c/svg>`;\n  }\n\n  function render(){\n    const A=D().author;\n    document.getElementById(\"h1\").textContent=A?\"Citations\":\"Citations\";\n    if(!A){\n      $(\"#body\").innerHTML=`\u003cdiv class=\"setup\">\n        \u003cp style=\"margin:0 0 10px;color:var(--muted);font-size:.9rem\">Find yourself in OpenAlex, which indexes Crossref, PubMed and preprint servers. No account needed.\u003c/p>\n        \u003clabel class=\"sr\" for=\"q\">Author name\u003c/label>\n        \u003cinput id=\"q\" placeholder=\"Your name as it appears on your papers\" autocapitalize=\"words\">\n        \u003cbutton class=\"btn primary\" id=\"searchBtn\" style=\"width:100%;border-radius:12px;padding:12px;min-height:48px\">Search\u003c/button>\n        \u003cdiv id=\"results\" style=\"margin-top:10px\">\u003c/div>\u003c/div>`;\n      return;\n    }\n    const last=D().snaps&&D().snaps.length>1?D().snaps[D().snaps.length-2]:null;\n    const dC=last?A.cites-last.cites:0;\n    $(\"#body\").innerHTML=`\n      \u003cdiv class=\"stats\">\n        \u003cdiv class=\"stat\">\u003cb>${fmt(A.cites)}\u003c/b>\u003cspan>citations\u003c/span>${dC>0?`\u003cspan class=\"up\">+${fmt(dC)}\u003c/span>`:\"\"}\u003c/div>\n        \u003cdiv class=\"stat\">\u003cb>${fmt(A.works)}\u003c/b>\u003cspan>works\u003c/span>\u003c/div>\n        \u003cdiv class=\"stat\">\u003cb>${fmt(A.h)}\u003c/b>\u003cspan>h-index\u003c/span>\u003c/div>\n        \u003cdiv class=\"stat\">\u003cb>${fmt(A.i10)}\u003c/b>\u003cspan>i10\u003c/span>\u003c/div>\n      \u003c/div>\n      \u003cp class=\"sync\" style=\"margin:-6px 0 14px\">${esc(A.name)}${A.inst?\", \"+esc(A.inst):\"\"}. ${D().lastRun?\"Updated \"+new Date(D().lastRun).toLocaleDateString(\"en-GB\",{day:\"numeric\",month:\"short\",year:\"numeric\"}):\"Not updated yet\"}. ${busy?\"Checking...\":\"\"}\u003c/p>\n      \u003cdiv class=\"panel\">\u003ch2>Citations per year\u003c/h2>${barChart([...(A.byYear||[])].sort((a,b)=>a.year-b.year),\"cites\",\"Citations per year\")}\u003c/div>\n      \u003cdiv class=\"panel\">\u003ch2>Publications per year\u003c/h2>${barChart([...(A.byYear||[])].sort((a,b)=>a.year-b.year),\"works\",\"Publications per year\")}\u003c/div>\n      \u003cdiv class=\"bar\">\u003cspan>${D().works.length} works, most cited first\u003c/span>\u003cspan>\u003c/span>\u003c/div>\n      \u003cdiv class=\"list\">${D().works.map(w=>`\u003carticle class=\"work\">\n        \u003cspan class=\"cc\">${fmt(w.cites)}${w.prev!=null&&w.cites>w.prev?`\u003csmall>+${w.cites-w.prev}\u003c/small>`:\"\"}\u003c/span>\n        \u003ch3>${esc(w.title)}\u003c/h3>\n        \u003cdiv class=\"vn\">${w.venue?`\u003cspan>${esc(w.venue)}\u003c/span>`:\"\"}${w.year?`\u003cspan>${w.year}\u003c/span>`:\"\"}${w.doi?`\u003ca href=\"https://doi.org/${esc(w.doi)}\" target=\"_blank\" rel=\"noopener\" style=\"color:var(--accent2)\">DOI\u003c/a>`:\"\"}\u003c/div>\n      \u003c/article>`).join(\"\")||`\u003cdiv class=\"empty\">No works found yet. Tap ⟳.\u003c/div>`}\u003c/div>`;\n  }\n  $(\"#body\").addEventListener(\"click\",async e=>{\n    if(e.target.closest(\"#searchBtn\")){findAuthors(false);return}\n    if(e.target.closest(\"#moreAuthors\")){findAuthors(true);return}\n    const pick=e.target.closest(\"[data-a]\");\n    if(pick&&results){\n      const {topics,...a}=results[+pick.dataset.a];\n      D().author=a; D().works=[]; D().snaps=[]; store.persist(); render(); pull();\n    }\n  });\n  $(\"#body\").addEventListener(\"keydown\",e=>{if(e.key===\"Enter\"&&e.target.id===\"q\"){e.preventDefault();findAuthors(false)}});\n  $(\"#refreshBtn\").addEventListener(\"click\",pull);\n  $(\"#changeBtn\").addEventListener(\"click\",()=>{if(!confirm(\"Pick a different author? The citation history you have collected is kept.\"))return;D().author=null;store.persist();render()});\n  $(\"#csvBtn\").addEventListener(\"click\",()=>{\n    if(!D().works.length){toast(\"Nothing to export\");return}\n    const q=s=>`\"${String(s??\"\").replace(/\"/g,'\"\"')}\"`;\n    const rows=[[\"title\",\"year\",\"venue\",\"doi\",\"citations\"].join(\",\")].concat(D().works.map(w=>[w.title,w.year,w.venue,w.doi,w.cites].map(q).join(\",\")));\n    saveFile(`citations-${stamp()}.csv`,rows.join(\"\\n\"));\n  });\n  $(\"#exportBtn\").addEventListener(\"click\",()=>saveFile(`citations-${stamp()}.json`,JSON.stringify({version:1,exported:new Date().toISOString(),author:D().author,works:D().works,snaps:D().snaps},null,2)));\n  $(\"#importBtn\").addEventListener(\"click\",()=>$(\"#importFile\").click());\n  $(\"#importFile\").addEventListener(\"change\",async e=>{\n    const f=e.target.files[0]; if(!f) return;\n    try{const o=JSON.parse(await f.text()); if(!o.author) throw 0;\n      D().author=o.author; D().works=o.works||[]; D().snaps=o.snaps||[];\n      store.persist(); render(); toast(\"Imported\");\n    }catch(_){toast(\"Choose a .json backup exported from this dashboard\")}\n    e.target.value=\"\";\n  });\n  $(\"#mailBtn\").addEventListener(\"click\",()=>{\n    const cur=localStorage.getItem(\"net.mailto\")||\"\";\n    const v=prompt(\"Your email is sent to OpenAlex so they give faster, more reliable service. Optional.\",cur);\n    if(v!==null){try{localStorage.setItem(\"net.mailto\",v.trim())}catch(_){};toast(\"Saved\")}\n  });\n  $(\"#oaKeyBtn\").addEventListener(\"click\",()=>{\n    const v=prompt(\"OpenAlex asks for a free API key since February 2026. Sign in at openalex.org/settings/api, copy your key and paste it here. It stays on this device and is used by every app here (radar, citations, journal selector).\",OAKEY());\n    if(v!==null){try{v.trim()?localStorage.setItem(\"net.openalexKey\",v.trim()):localStorage.removeItem(\"net.openalexKey\")}catch(_){};toast(v.trim()?\"Key saved\":\"Key removed\")}\n  });\n  setupMenu(); render(); store.connect();\n  if(D().author&&Date.now()-(D().lastRun||0)>7*864e5) setTimeout(pull,600);\n})();\n\u003c/script>\n\u003cscript>window.__BACKUP={id:\"cite-dash\",key:\"citedash.v1\"};\u003c/script>\n\u003cscript>\n(function(){\n  const C=window.__BACKUP, LK=C.id+\".lastBackup\", SK=C.id+\".backupSnooze\", WEEK=7*864e5;\n  const get=k=>{try{return +localStorage.getItem(k)||0}catch(_){return 0}};\n  const set=(k,v)=>{try{localStorage.setItem(k,String(v))}catch(_){}};\n  function hasData(){\n    try{const v=JSON.parse(localStorage.getItem(C.key)||\"null\");if(!v)return false;\n      if(Array.isArray(v))return v.length>0;\n      return Object.values(v).some(x=>Array.isArray(x)&&x.length>0)}catch(_){return false}\n  }\n  const bar=document.createElement(\"div\");\n  bar.className=\"bk hidden\"; bar.setAttribute(\"role\",\"status\");\n  bar.innerHTML='\u003cdiv class=\"bkt\">\u003cb>\u003c/b>\u003cspan>Save a copy to Files or Downloads, or turn on sync in the control center.\u003c/span>\u003c/div>\u003cbutton class=\"bkno\" type=\"button\">Later\u003c/button>\u003cbutton class=\"bkgo\" type=\"button\">Back up now\u003c/button>';\n  const wrap=document.querySelector(\".wrap\"), head=wrap&&wrap.querySelector(\":scope > header\");\n  if(head) head.insertAdjacentElement(\"afterend\",bar); else if(wrap) wrap.prepend(bar);\n  function check(){\n    const now=Date.now(), last=get(LK), data=hasData();\n    // never backed up: start the 7-day clock from when data first appears\n    if(!last&&data&&!get(C.id+\".firstData\")) set(C.id+\".firstData\",now);\n    const ref=last||get(C.id+\".firstData\")||now;\n    const due=data&&now-ref>WEEK&&now>get(SK);\n    bar.classList.toggle(\"hidden\",!due);\n    if(due){\n      const days=last?Math.floor((now-last)/864e5):0;\n      bar.querySelector(\"b\").textContent=last?`Last backup ${days} days ago`:\"Not backed up yet\";\n    }\n  }\n  window.__markBackup=()=>{set(LK,Date.now());set(SK,0);check()};\n  bar.querySelector(\".bkgo\").addEventListener(\"click\",()=>{const b=document.getElementById(\"exportBtn\");if(b)b.click()});\n  bar.querySelector(\".bkno\").addEventListener(\"click\",()=>{set(SK,Date.now()+864e5);check()});\n  document.addEventListener(\"visibilitychange\",()=>{if(!document.hidden)check()});\n  window.addEventListener(\"storage\",check);\n  setInterval(check,36e5);\n  // first check after the app has loaded its data; recheck when data changes\n  setTimeout(check,300);\n  let t=null; document.addEventListener(\"click\",()=>{clearTimeout(t);t=setTimeout(check,600)},true);\n})();\n\u003c/script>\n\u003c/body>\n\u003c/html>\n"}];
(function(){
  const stage=document.getElementById("stage"), nav=document.getElementById("nav");
  const KEY="suite."+SUITE.id+".tab", frames={};
  function docFor(app){
    let doc=app.html;
    for(const k in SHARED){ const ph="/*__SHARED_"+k+"__*/"; if(doc.includes(ph)) doc=doc.replace(ph,()=>SHARED[k]); }
    return doc;
  }
  function frame(app){
    if(frames[app.id]) return frames[app.id];
    const f=document.createElement("iframe");
    f.title=app.label; f.setAttribute("allow","clipboard-read; clipboard-write; web-share");
    f.addEventListener("load",()=>{f.dataset.ready="1"},{once:true});
    f.srcdoc=docFor(app); stage.appendChild(f); frames[app.id]=f;
    return f;
  }
  function show(id){
    const app=APPS.find(a=>a.id===id)||APPS[0];
    frame(app);
    for(const k in frames) frames[k].classList.toggle("on",k===app.id);
    nav.querySelectorAll("button[data-id]").forEach(b=>{
      if(b.dataset.id===app.id) b.setAttribute("aria-current","page"); else b.removeAttribute("aria-current");
    });
    document.title=app.label+" - "+SUITE.title;
    try{localStorage.setItem(KEY,app.id)}catch(_){}
    if(location.hash!=="#"+app.id) history.replaceState(null,"","#"+app.id);
    return app;
  }
  // apps in the same suite can hand data to each other
  window.suiteHas=id=>APPS.some(a=>a.id===id);
  window.suiteReload=id=>{const f=frames[id]; if(!f) return; f.dataset.ready="";
    f.addEventListener("load",()=>{f.dataset.ready="1"},{once:true}); f.srcdoc=docFor(APPS.find(a=>a.id===id)); };
  window.suiteShow=id=>show(id);
  window.suiteSend=(id,msg)=>{
    const app=show(id), f=frames[app.id];
    const deliver=()=>{try{f.contentWindow.suiteReceive&&f.contentWindow.suiteReceive(msg)}catch(e){console.warn(e)}};
    if(f.dataset.ready) deliver(); else f.addEventListener("load",deliver,{once:true});
  };
  nav.addEventListener("click",e=>{
    const b=e.target.closest("button"); if(!b) return;
    if(b.dataset.act==="backup"){ window.suiteBackup&&window.suiteBackup.open(); return; }
    if(b.dataset.act==="home"){ location.href="control-center.html"; return; }
    const app=show(b.dataset.id); try{frames[app.id].contentWindow.focus()}catch(_){}
  });
  nav.addEventListener("keydown",e=>{
    const bs=[...nav.querySelectorAll("button[data-id]")], i=bs.indexOf(document.activeElement);
    if(i<0) return;
    const step={ArrowRight:1,ArrowDown:1,ArrowLeft:-1,ArrowUp:-1}[e.key];
    if(!step) return;
    e.preventDefault(); const n=bs[(i+step+bs.length)%bs.length]; n.focus(); show(n.dataset.id);
  });
  window.addEventListener("hashchange",()=>show(location.hash.slice(1)));
  let start=location.hash.slice(1);
  if(!APPS.some(a=>a.id===start)){ try{start=localStorage.getItem(KEY)||""}catch(_){start=""} }
  show(start);
  if("serviceWorker" in navigator&&window.isSecureContext&&location.protocol.startsWith("http")){
    window.addEventListener("load",()=>navigator.serviceWorker.register("suite-sw.js").catch(()=>{}));
  }
})();

<dialog id="bkDlg" aria-labelledby="bkTitle">
  <div class="sheet">
    <h2 id="bkTitle">Sync and backups</h2>
    <div class="bk-row"><b>Sync between your devices</b><span id="bkSyncLine">Checking...</span></div>

    <div class="bk-bar"><button class="bk-btn primary" id="bkDl" type="button">Download a backup file</button><a class="bk-btn" id="bkHub" href="control-center.html#backup" style="text-decoration:none;display:inline-flex;align-items:center">All backups</a><button class="bk-btn" id="bkClose" type="button">Close</button></div>
  </div>
</dialog>
<div class="bk-toast" id="bkToast" role="status" aria-live="polite"></div>
<script>
const BACKUP_APPS=[{"id": "radar", "file": "literature-radar", "label": "Radar", "keys": ["litradar.v1", "net.mailto"], "prefixes": [], "reminder": "lit-radar"}, {"id": "citations", "file": "citation-tracker", "label": "Citations", "keys": ["citedash.v1", "net.mailto"], "prefixes": [], "reminder": "cite-dash"}];
(function(){
  const $=s=>document.getElementById(s);
  const btn=document.querySelector('nav [data-act="backup"]'), dlg=$("bkDlg");
  const esc=s=>String(s??"").replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[m]));
  let tt=null;
  function toast(t){const el=$("bkToast");el.textContent=t;el.classList.add("show");clearTimeout(tt);tt=setTimeout(()=>el.classList.remove("show"),2600)}
  const S=()=>window.SuiteSync||null;

  /* ---------- what each app keeps ---------- */
  function owned(app,k){return app.keys.includes(k)||app.prefixes.some(p=>k.startsWith(p))}
  function keysOf(app){const out=[];try{for(let i=0;i<localStorage.length;i++){const k=localStorage.key(i);if(k!=null&&owned(app,k))out.push(k)}}catch(_){}return out.sort()}
  function payload(app){
    const json={}, text={};
    for(const k of keysOf(app)){const v=localStorage.getItem(k);if(v==null)continue;try{json[k]=JSON.parse(v)}catch(_){text[k]=v}}
    if(!Object.keys(json).length&&!Object.keys(text).length) return null;
    return {format:"suite-backup",version:1,suite:SUITE.id,suiteTitle:SUITE.title,app:app.file,label:app.label,saved:new Date().toISOString(),json,text};
  }
  const bytes=app=>keysOf(app).reduce((n,k)=>n+(k.length+(localStorage.getItem(k)||"").length)*2,0);
  const size=b=>b<1024?b+" B":b<1048576?(b/1024).toFixed(b<10240?1:0)+" KB":(b/1048576).toFixed(1)+" MB";
  const ago=t=>{if(!t)return "never";const s=(Date.now()-t)/1000;if(s<60)return "just now";if(s<3600)return Math.floor(s/60)+" min ago";if(s<86400)return Math.floor(s/3600)+" h ago";const d=Math.floor(s/86400);return d===1?"yesterday":d+" days ago"};
  const localDate=()=>{const d=new Date();d.setMinutes(d.getMinutes()-d.getTimezoneOffset());return d.toISOString().slice(0,10)};

  /* ---------- panel ---------- */
  function paint(){
    const sync=S(), st=sync?sync.status():{configured:false};
    btn.dataset.state=!st.configured?"":st.state==="error"?"err":st.state==="ok"||st.state==="idle"?"ok":"";
    if(!dlg.open) return;
    let line, bar="";
    if(!sync) line="Sync is not available on this page.";
    else if(!st.configured){
      line="Off. Turn it on in the control center to keep your Mac and iPhone in step through a private GitHub repository.";
      bar=`<a class="bk-btn primary" href="control-center.html#backup" style="text-decoration:none;display:inline-flex;align-items:center">Set up sync</a>`;
    }else{
      const pend=st.pending?`, ${st.pending} change${st.pending>1?"s":""} waiting`:"";
      line=st.busy?"Syncing...":st.state==="error"?`Last try failed: ${esc(st.error)}`:st.state==="offline"?esc(st.error||"Offline"):
        `${st.last?"Synced "+ago(st.last):"Not synced yet"} with ${esc(st.repo)} as ${esc(st.device)}${pend}${st.auto?"":" (automatic sync off)"}`;
      bar=`<button class="bk-btn primary" id="bkSyncNow" type="button" ${st.busy?"disabled":""}>Sync now</button>`;
    }
    $("bkSyncLine").innerHTML=line; $("bkSyncBar").innerHTML=bar; $("bkSyncBar").hidden=!bar;
    const pend=new Set(sync&&st.configured?sync.pendingKeys():[]);
    $("bkList").innerHTML=BACKUP_APPS.map(a=>{
      const ks=keysOf(a);
      const state=!ks.length?"Nothing stored yet":!st.configured?`${size(bytes(a))}, not synced`
        :ks.some(k=>pend.has(k))?`${size(bytes(a))}, changes waiting to sync`:`${size(bytes(a))}, in sync`;
      return `<div class="bk-row"><b>${esc(a.label)}</b><span>${esc(state)}</span></div>`;
    }).join("");
  }
  function open(){dlg.showModal();paint()}
  $("bkClose").addEventListener("click",()=>dlg.close());
  dlg.addEventListener("click",e=>{if(e.target===dlg)dlg.close()});
  $("bkSyncBar").addEventListener("click",async e=>{
    if(!e.target.closest("#bkSyncNow")) return;
    const st=await S().syncNow();
    toast(st.state==="ok"?(st.pulled||st.pushed?`Synced: ${st.pushed} sent, ${st.pulled} received`:"Already in sync"):st.error||"Sync failed");
    paint();
  });
  $("bkDl").addEventListener("click",()=>{
    const apps=BACKUP_APPS.map(payload).filter(Boolean);
    if(!apps.length){toast("Nothing stored yet");return}
    const b={format:"suite-bundle",version:1,saved:new Date().toISOString(),origin:location.origin,suite:SUITE.id,apps,rest:{}};
    const blob=new Blob([JSON.stringify(b)],{type:"application/json"}), url=URL.createObjectURL(blob), a=document.createElement("a");
    a.href=url; a.download=`${SUITE.id}-backup-${localDate()}.json`; a.style.display="none"; document.body.appendChild(a); a.click(); a.remove();
    setTimeout(()=>URL.revokeObjectURL(url),15000);
    const now=String(Date.now());
    for(const ap of BACKUP_APPS) if(ap.reminder){try{localStorage.setItem(ap.reminder+".lastBackup",now);localStorage.setItem(ap.reminder+".backupSnooze","0")}catch(_){}}
    toast("Backup file saved");
  });
  window.suiteBackup={open};
  if(S()) S().onStatus(paint);
  else window.addEventListener("load",()=>{if(S())S().onStatus(paint);paint()});
  paint();
})();
</script>

<script>
/* Suite live sync, added by patch_suites.py for control-center.html.
   1. When an app's stored data changes outside that app (the control center, this suite in another
      tab, or a sibling app), the app's frame is reloaded so it never saves an older copy over it.
   2. control-center.html can open an app filtered to one item: suite.html?find=TEXT&pick=VIEW#app,
      and a structure in the viewer: structure-studio.html?load=pdb:5XJH#viewer (or af:ACCESSION)
   3. The Backup sheet gets a link to the control center. */
(function(){
  const SYNC={"radar": {"keys": ["litradar.v1"], "prefixes": []}, "citations": {"keys": ["citedash.v1"], "prefixes": []}};
  const SEARCH={};
  const PICKS={"radar": {"saved": "#chips [data-f=\"saved\"]", "new": "#chips [data-f=\"new\"]"}};
  const stage=document.getElementById("stage");
  if(!stage||typeof APPS==="undefined") return;
  const labelOf=id=>{const a=APPS.find(x=>x.id===id);return a?a.label:null};
  const idOf=f=>{const a=APPS.find(x=>x.label===f.title);return a?a.id:null};
  const frameOf=id=>{const l=labelOf(id);return l?[...stage.querySelectorAll("iframe")].find(f=>f.title===l)||null:null};
  const owns=(id,k)=>{const s=SYNC[id];return !!s&&(s.keys.includes(k)||s.prefixes.some(p=>k.startsWith(p)))};
  function say(t){const el=document.getElementById("bkToast");if(!el)return;el.textContent=t;el.classList.add("show");
    clearTimeout(say.t);say.t=setTimeout(()=>el.classList.remove("show"),2600)}

  /* what each frame wrote recently (as hashes), so an app's own saves are never taken for outside
     changes, even when it saves several times before the browser reports the first one */
  const mine={};
  const fnv=s=>{if(s==null)return "-";let h=0x811c9dc5;for(let i=0;i<s.length;i++){h^=s.charCodeAt(i);h=Math.imul(h,0x01000193)>>>0}return h.toString(36)+"."+s.length};
  function note(k,v,app){
    const list=mine[k]||(mine[k]=[]), now=Date.now();
    list.push({h:fnv(v),app,t:now});
    while(list.length>40||(list.length&&now-list[0].t>120000)) list.shift();
  }
  function hook(f){
    let w; try{w=f.contentWindow}catch(_){return}
    if(!w) return;
    try{
      const P=w.Storage.prototype; if(P.__suiteHook) return;
      const set=P.setItem, rem=P.removeItem, id=idOf(f);
      P.setItem=function(k,v){set.call(this,k,v);try{if(this===w.localStorage)note(String(k),String(v),id)}catch(_){}};
      P.removeItem=function(k){rem.call(this,k);try{if(this===w.localStorage)note(String(k),null,id)}catch(_){}};
      Object.defineProperty(P,"__suiteHook",{value:true});
    }catch(_){}
  }
  function watch(f){if(f.__suiteWatch)return;f.__suiteWatch=true;hook(f);f.addEventListener("load",()=>hook(f))}
  stage.querySelectorAll("iframe").forEach(watch);
  new MutationObserver(ms=>ms.forEach(m=>m.addedNodes.forEach(n=>{if(n.tagName==="IFRAME")watch(n)}))).observe(stage,{childList:true});

  const pending=new Set(); let timer=null;
  function busy(f){
    try{
      const d=f.contentDocument; if(!d) return false;
      if(d.querySelector("dialog[open]")) return true;
      if(!f.classList.contains("on")||document.hidden) return false;
      const ae=d.activeElement;
      return !!ae&&/^(INPUT|TEXTAREA|SELECT)$/.test(ae.tagName)&&!/^(search|checkbox|radio|button|file|range)$/.test(ae.type||"");
    }catch(_){return false}
  }
  function flush(){
    for(const id of [...pending]){
      const f=frameOf(id);
      if(!f){pending.delete(id);continue}
      if(f.dataset.ready!=="1"||busy(f)) continue;
      pending.delete(id);
      const seen=f.classList.contains("on")&&!document.hidden;
      window.suiteReload(id);
      if(seen) say(labelOf(id)+" updated with changes made elsewhere");
    }
    if(pending.size&&!timer) timer=setInterval(()=>{flush();if(!pending.size){clearInterval(timer);timer=null}},1500);
  }
  window.addEventListener("storage",e=>{
    try{if(e.storageArea&&e.storageArea!==localStorage)return}catch(_){}
    const k=e.key, list=k==null?null:mine[k];
    let writer=null;
    if(list){const h=fnv(e.newValue);for(let i=list.length-1;i>=0;i--)if(list[i].h===h){writer=list[i].app;break}}
    if(k!=null&&!writer) delete mine[k];
    for(const id in SYNC){
      if(k!=null&&!owns(id,k)) continue;
      if(writer===id) continue;
      pending.add(id);
    }
    if(pending.size) setTimeout(flush,50);
  });
  document.addEventListener("visibilitychange",()=>{if(!document.hidden&&pending.size)flush()});
  /* data that arrived from another device through suite-sync.js */
  window.addEventListener("suite-sync-applied",e=>{
    const keys=(e.detail&&e.detail.keys)||[];
    for(const id in SYNC) if(keys.some(k=>owns(id,k))) pending.add(id);
    if(pending.size) setTimeout(flush,50);
  });

  /* hand-off from the control center: open this app filtered to one item */
  const qs=new URLSearchParams(location.search), find=qs.get("find"), pick=qs.get("pick"), load=qs.get("load");
  if(load){
    history.replaceState(null,"",location.pathname+location.hash);
    const m=/^(pdb|af|pubchem):(.+)$/i.exec(load);
    if(m&&window.suiteHas&&window.suiteHas("viewer")) window.suiteSend("viewer",{type:"fetch",src:m[1].toLowerCase(),id:m[2]});
  }else if(find!=null||pick){
    history.replaceState(null,"",location.pathname+location.hash);
    const id=location.hash.slice(1), f=frameOf(id);
    const apply=()=>{try{
      const d=f.contentDocument; if(!d) return;
      const sel=pick&&PICKS[id]&&PICKS[id][pick];
      if(sel){const b=d.querySelector(sel);if(b&&!(id==="deadlines"&&!/^show/i.test(b.textContent.trim())))b.click()}
      const box=find!=null?d.getElementById(SEARCH[id]||"search"):null;
      if(box){box.value=find;box.dispatchEvent(new Event("input",{bubbles:true}))}
    }catch(_){}};
    if(f){if(f.dataset.ready==="1")setTimeout(apply,150);else f.addEventListener("load",()=>setTimeout(apply,150),{once:true})}
  }

  /* a way back to the control center from the Backup sheet */
  const bar=document.querySelector("#bkDlg .bk-bar");
  if(bar&&!document.getElementById("bkHub")){
    const a=document.createElement("a");a.id="bkHub";a.className="bk-btn";a.href="control-center.html";a.textContent="Control center";
    a.style.cssText="text-decoration:none;display:inline-flex;align-items:center";bar.appendChild(a);
  }
})();
</script>
<!-- suite-live-sync:end -->
</body>
