<style>
:root{
  color-scheme:dark;
  --bg:var(--t-bg,#000000);--ink:var(--t-ink,#F2F2F4);--muted:var(--t-muted,#9D9DA5);--line:var(--t-faint,#28282E);--accent:var(--t-accent,#EBA8E4);
  --grad:linear-gradient(90deg,var(--t-grad1,#F0A8DC) 0%,var(--t-grad2,#C9B6EF) 50%,var(--t-grad3,#A6CCF5) 100%);
  --font:Roboto,"Google Sans",system-ui,-apple-system,"Segoe UI",sans-serif;
}
*,*::before,*::after{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{height:100%}
body{
  margin:0;height:100%;height:100dvh;display:grid;grid-template-rows:minmax(0,1fr) auto;
  padding-top:env(safe-area-inset-top,0px);
  background:var(--t-bg,#000) linear-gradient(var(--t-head,#5A4360),var(--t-head,#5A4360)) top/100% env(safe-area-inset-top,0px) no-repeat;
  color:var(--ink);font-family:var(--font);
}
.stage{position:relative;min-height:0;min-width:0}
/* inactive frames stay laid out (visibility, not display) so 3D canvases keep their size */
.stage iframe{position:absolute;inset:0;width:100%;height:100%;border:0;background:var(--t-bg,#000);visibility:hidden;pointer-events:none}
.stage iframe.on{visibility:visible;pointer-events:auto}
nav{display:flex;gap:2px;background:var(--t-bg,#000);border-top:1px solid var(--line);
  padding:6px 6px calc(6px + env(safe-area-inset-bottom,0px))}
nav button{flex:1 1 0;min-width:0;min-height:58px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;
  background:none;border:0;color:var(--muted);font:inherit;font-size:.74rem;cursor:pointer;padding:2px}
nav .ic{width:100%;max-width:56px;height:30px;border-radius:999px;display:grid;place-items:center}
nav svg{width:22px;height:22px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
nav .lb{max-width:100%;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
nav button[aria-current="page"]{color:var(--ink);font-weight:500}
nav button[aria-current="page"] .ic{background:var(--grad);color:var(--t-on-grad,#17161C)}
nav button:focus-visible{outline:2px solid var(--accent);outline-offset:-2px;border-radius:12px}
@media (prefers-reduced-motion:no-preference){nav .ic{transition:background-color .15s}}
nav .util .ic{position:relative}
nav .util[data-state="ok"] .ic::after,nav .util[data-state="err"] .ic::after{content:"";position:absolute;top:3px;right:12px;width:8px;height:8px;border-radius:50%;background:var(--t-green,#7DCB9C);box-shadow:0 0 0 2px var(--t-bg,#000)}
nav .util[data-state="err"] .ic::after{background:var(--t-danger,#EF5A50)}
dialog{border:0;padding:0;background:var(--t-raised,#1D1D22);color:var(--ink);width:100%;max-width:560px;margin:auto auto 0;border-radius:20px 20px 0 0;max-height:92vh;font-family:var(--font)}
@media (min-width:600px){dialog{margin:auto;border-radius:20px}}
dialog::backdrop{background:var(--t-backdrop,rgba(0,0,0,.6))}
.sheet{padding:20px 20px calc(20px + env(safe-area-inset-bottom,0px));display:flex;flex-direction:column;gap:14px}
.sheet h2{margin:0;font-size:1.15rem;font-weight:700}
.sheet p{margin:0}
.sheet .note{font-size:.85rem;color:var(--muted);line-height:1.45}
.sheet .warn{font-size:.85rem;color:var(--t-gold,#E6C170);background:var(--t-pinbg,#2A2413);border-radius:12px;padding:10px 12px;line-height:1.45}
.sheet .warn code,.sheet .note code{font-family:"Roboto Mono",ui-monospace,Menlo,monospace;font-size:.8rem}
.sw{display:flex;align-items:center;justify-content:space-between;gap:12px;background:var(--t-surface,#131316);border-radius:14px;padding:12px 14px;min-height:56px;cursor:pointer}
.sw input{appearance:none;width:46px;height:28px;border-radius:999px;background:var(--t-edge,#3B3B43);position:relative;flex:0 0 auto;cursor:pointer;margin:0}
.sw input::after{content:"";position:absolute;top:3px;left:3px;width:22px;height:22px;border-radius:50%;background:var(--t-knob,#F2F2F4);transition:left .15s}
.sw input:checked{background:var(--grad)}
.sw input:checked::after{left:21px;background:var(--t-on-grad,#17161C)}
.sw input:disabled{opacity:.4}
.bk-list{display:flex;flex-direction:column;gap:6px}
.bk-row{background:var(--t-surface,#131316);border-radius:12px;padding:10px 12px}
.bk-row b{display:block;font-weight:500}
.bk-row span{display:block;font-size:.8rem;color:var(--muted);overflow-wrap:anywhere}
.bk-row span.err{color:var(--t-danger,#EF5A50)}
.bk-bar{display:flex;gap:8px;flex-wrap:wrap}
.bk-btn{border:0;border-radius:12px;padding:12px 16px;min-height:48px;background:var(--t-surface,#131316);color:var(--ink);font:inherit;cursor:pointer}
.bk-btn.primary{background:var(--grad);color:var(--t-on-grad,#17161C);font-weight:700}
.bk-btn:disabled{opacity:.45;cursor:default}
.bk-sel{background:var(--t-field,#0F0F12);border:1.5px solid var(--t-line,#2E2E35);border-radius:12px;padding:12px;min-height:48px;color:var(--ink);font:inherit;flex:1;min-width:0}
.bk-files{display:flex;flex-direction:column;gap:6px;max-height:36vh;overflow-y:auto}
.bk-files button{text-align:left;border:0;background:var(--t-surface,#131316);color:var(--ink);border-radius:12px;padding:10px 12px;font:inherit;cursor:pointer}
.bk-files button small{display:block;color:var(--muted);font-size:.78rem}
.sheet h3{margin:6px 0 -4px;font-size:.85rem;font-weight:500;color:var(--accent)}
.bk-toast{position:fixed;left:50%;bottom:calc(96px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--t-raised2,#26262C);color:var(--ink);padding:10px 16px;border-radius:12px;font-size:.9rem;opacity:0;pointer-events:none;transition:opacity .2s;max-width:90vw;text-align:center;z-index:10}
.bk-toast.show{opacity:1}
@media (min-width:900px){
  body{grid-template-rows:minmax(0,1fr);grid-template-columns:auto minmax(0,1fr)}
  nav{order:-1;flex-direction:column;justify-content:flex-start;gap:10px;width:96px;border-top:0;border-right:1px solid var(--line);
    padding:18px 6px calc(18px + env(safe-area-inset-bottom,0px))}
  nav button{flex:none}
}
</style>
</head>

  <button type="button" class="util" data-act="backup" aria-haspopup="dialog"><span class="ic"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 3v11"/><path d="M8 10l4 4 4-4"/><path d="M4 15v3a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2v-3"/></svg></span><span class="lb">Backup</span></button>
</nav>
<script>
const SUITE={"id": "lab-notebook", "title": "Lab notebook"};
const SHARED={};
const APPS=[{"id": "log", "label": "Log", "html": "\u003c!doctype html>\n\u003chtml lang=\"en\">\n\u003chead>\n\u003cmeta charset=\"utf-8\">\n\u003cscript src=\"suite-theme.js\" data-suite-theme>\u003c/script>\n\u003cmeta name=\"viewport\" content=\"width=device-width, initial-scale=1, viewport-fit=cover, interactive-widget=resizes-content\">\n\u003cmeta name=\"theme-color\" content=\"#5A4360\">\n\u003cmeta name=\"color-scheme\" content=\"dark\">\n\u003ctitle>Research log\u003c/title>\n\u003cstyle>\n:root{\n  color-scheme:dark;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);\n  --bg:var(--t-bg,#14161B);--surface:var(--t-surface,#1C1F26);--raised:var(--t-raised,#242832);--ink:var(--t-ink,#E7E9EE);--muted:var(--t-muted,#8B919E);--faint:var(--t-faint,#2C303A);\n  --accent:var(--t-accent,#9DB2FF);--danger:var(--t-red,#F28B82);--gold:var(--t-gold,#E6C170);--green:var(--t-green,#7DCB9C);--violet:var(--t-violet,#C3A6F0);--pink:var(--t-pink,#EE93AF);--teal:var(--t-teal,#8CC3CC);\n  --font:\"Manrope\",system-ui,Roboto,\"Segoe UI\",sans-serif;\n  --mono:\"JetBrains Mono\",ui-monospace,\"Roboto Mono\",Menlo,Consolas,monospace;\n}\nhtml{height:100%;scroll-padding-top:env(safe-area-inset-top,0px)}\n*,*::before,*::after{box-sizing:border-box;-webkit-tap-highlight-color:transparent}\nbody{margin:0;min-height:100%;background:var(--bg);color:var(--ink);font-family:var(--font);font-size:16px;line-height:1.45}\nbutton,input,select,textarea{font:inherit;color:inherit}\nbutton{cursor:pointer;background:none;border:0}\n:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:6px}\n.wrap{max-width:760px;margin:0 auto;padding:16px 16px calc(110px + env(safe-area-inset-bottom,0px))}\nheader{display:flex;align-items:center;justify-content:space-between;gap:8px;margin:4px 0 16px}\nh1{font-size:1.5rem;font-weight:700;margin:0;letter-spacing:-.01em}\nh1 .n{font-weight:400;color:var(--muted);font-size:1rem;margin-left:6px}\n.hbtns{display:flex;gap:4px;positi r(--muted);margin-top:6px;white-space:pre-wrap;overflow-wrap:anywhere}\n.acts{display:flex;justify-content:flex-end;margin-top:2px;flex-wrap:wrap}\n.acts .ibtn{min-width:40px;min-height:40px;font-size:.95rem}\n.acts .txt{font-size:.85rem;padding:0 10px;color:var(--accent)}\n.star-on{color:var(--gold)}\n.empty{color:var(--muted);text-align:center;padding:48px 16px}\n.fab{position:fixed;right:20px;bottom:calc(20px + env(safe-area-inset-bottom,0px));width:60px;height:60px;border-radius:18px;background:var(--accent);color:var(--t-on-accent,#14161B);font-size:1.8rem;box-shadow:0 6px 18px var(--t-shadow,rgba(0,0,0,.45));z-index:4}\ndialog{border:0;padding:0;background:var(--raised);color:var(--ink);width:100%;max-width:560px;margin:auto auto 0;border-radius:20px 20px 0 0;max-height:92vh}\n@media (min-width:600px){dialog{margin:auto;border-radius:20px}}\ndialog::backdrop{background:var(--t-backdrop,rgba(0,0,0,.6))}\n.sheet{padding:20px 20px calc(20px + env(safe-area-inset-bottom,0px));display:flex;flex-direction:column;gap:12px}\n.sheet h2{margin:0;font-size:1.15rem;font-weight:700}\n.sheet h4{margin:6px 0 -4px;font-size:.8rem;font-weight:500;color:var(--accent)}\n.sheet label{display:flex;flex-direction:column;gap:6px;font-size:.85rem;color:var(--muted);min-width:0}\n.sheet input,.sheet select,.sheet textarea{background:var(--surface);border:0;border-radius:12px;padding:12px;color:var(--ink);min-height:48px;width:100%;min-width:0}\n.sheet textarea{min-height:90px;resize:vertical}\n.mono{font-family:var(--mono)!important;font-size:.88rem!important}\n.row{display:grid;grid-template-columns:1fr 1fr;gap:10px}\n.row3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px}\n.check{flex-direction:row!important;align-items:center;gap:10px!important;color:var(--ink)!important;font-size:1rem!important}\n.check input{min-height:auto!important;width:20px!important;height:20px;accent-color:var(--accent)}\n.hint{font-size:.8rem;color:var(--danger);min-height:1em;margin:0}\n.sbar{display:flex;justify-content:space-between;gap:8px;margin-top:4px}\n.btn{border-radius:12px;padding:12px 16px;min-height:48px}\n.btn.primary{background:var(--accent);color:var(--t-on-accent,#14161B);font-weight:700}\n.btn.ghost{color:var(--muted)}\n.btn.danger{color:var(--danger)}\n.toast{position:fixed;left:50%;bottom:calc(96px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--raised);padding:10px 16px;border-radius:12px;font-size:.9rem;opacity:0;pointer-events:none;transition:opacity .2s;max-width:90vw;text-align:center;z-index:6}\n.toast.show{opacity:1}\n.sync{font-size:.8rem;color:var(--muted);text-align:center;margin-top:24px}\n.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}\n.hidden{display:none!important}\n.tabs{display:grid;grid-template-columns:repeat(3,1fr);border-bottom:1px solid var(--faint);margin:0 0 12px}\n.tab{padding:12px 4px;color:var(--muted);font-weight:500;position:relative;min-height:48px}\n.tab .c{font-size:.78rem;opacity:.8;margin-left:4px}\n.tab[aria-selected=\"true\"]{color:var(--ink)}\n.tab[aria-selected=\"true\"]::after{content:\"\";position:absolute;left:25%;right:25%;bottom:-1px;height:2px;background:var(--accent);border-radius:2px}\n.day{margin-top:20px}\n.day:first-child{margin-top:4px}\n.dayhead{font-size:.85rem;font-weight:700;color:var(--muted);margin:0 2px 8px;display:flex;justify-content:space-between}\n.entry{background:var(--surface);border-radius:14px;padding:12px 10px 6px 16px;box-shadow:inset 3px 0 0 var(--cc)}\n.entry .body{white-space:pre-wrap;overflow-wrap:anywhere}\n.entry code,.mtg code{font-family:var(--mono);font-size:.85em;background:var(--bg);padding:1px 5px;border-radius:5px}\n.entry .meta{display:flex;flex-wrap:wrap;gap:4px 10px;align-items:center;margin-top:6px;font-size:.8rem;color:var(--muted)}\n.entry .kind{color:var(--cc);font-weight:700}\n.entry .proj{color:var(--accent)}\n.mtitle{font-weight:700;font-size:1.02rem;overflow-wrap:anywhere}\n.people{font-size:.82rem;color:var(--muted);margin-top:2px}\n.msec{margin-top:10px}\n.msec > span{display:block;font-size:.72rem;font-weight:700;letter-spacing:.04em;text-transform:uppercase;color:var(--muted);margin-bottom:3px}\n.msec .txt{white-space:pre-wrap;overflow-wrap:anywhere;font-size:.95rem}\n.more{color:var(--accent);font-size:.85rem;padding:4px 0;min-height:32px}\n.clamp{display:-webkit-box;-webkit-line-clamp:4;-webkit-box-orient:vertical;overflow:hidden}\n.act{display:flex;align-items:flex-start;gap:10px;padding:6px 0}\n.act input{width:22px;height:22px;margin-top:1px;accent-color:var(--accent);flex:0 0 auto}\n.act .at{flex:1;min-width:0;overflow-wrap:anywhere}\n.act .am{display:flex;flex-wrap:wrap;gap:2px 10px;font-size:.78rem;color:var(--muted);margin-top:1px}\n.act.done .at > div:first-child{text-decoration:line-through;color:var(--muted)}\n.overdue{color:var(--danger)!important}\n.soon{color:var(--gold)!important}\n.kinds{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}\n.kinds button{padding:11px 4px;border-radius:12px;background:var(--surface);color:var(--cc);font-weight:500;font-size:.9rem}\n.kinds button[aria-pressed=\"true\"]{background:color-mix(in srgb,var(--cc) 22%,var(--surface));outline:1px solid var(--cc)}\n.filters2{display:flex;gap:8px;margin-top:10px}\n.filters2 select{flex:1;background:var(--surface);border:0;border-radius:12px;padding:10px 12px;min-height:44px;color:var(--ink);min-width:0}\n#fText{min-height:150px}\n.arow{background:var(--surface);border-radius:12px;padding:8px;display:flex;flex-direction:column;gap:6px}\n.arow .l2{display:grid;grid-template-columns:1fr 1fr 44px 44px;gap:6px;align-items:center}\n.arow input[type=\"text\"],.arow input[type=\"date\"]{min-height:44px!important;padding:10px!important;background:var(--bg)!important}\n.arow input[type=\"checkbox\"]{width:22px;height:22px;justify-self:center;accent-color:var(--accent)}\n.arow .x{color:var(--danger);min-height:44px}\n.carry{background:color-mix(in srgb,var(--gold) 10%,var(--surface));border-radius:12px;padding:10px 12px}\n.carry > b{display:block;font-size:.8rem;color:var(--gold);margin-bottom:4px}\n.group{margin-top:18px}\n.group:first-child{margin-top:4px}\n.ghead{font-size:.85rem;font-weight:700;margin:0 2px 8px;display:flex;justify-content:space-between;color:var(--muted)}\n.acard{background:var(--surface);border-radius:14px;padding:6px 12px}\n.acard .src{color:var(--accent);cursor:pointer}\n.linkbtn{color:var(--accent);min-height:40px;padding:0 4px;font-size:.9rem}\n/* ---- Theme: dark with pink-to-blue accents ---- */\n:root{\n  --bg:var(--t-bg,#000000);--surface:var(--t-surface,#131316);--raised:var(--t-raised,#1D1D22);--ink:var(--t-ink,#F2F2F4);--muted:var(--t-muted,#9D9DA5);--faint:var(--t-faint,#28282E);\n  --accent:var(--t-accent,#EBA8E4);--accent2:var(--t-accent2,#A7CBF4);\n  --grad:linear-gradient(90deg,var(--t-grad1,#F0A8DC) 0%,var(--t-grad2,#C9B6EF) 50%,var(--t-grad3,#A6CCF5) 100%);\n  --danger:var(--t-danger,#EF5A50);--star:var(--t-accent,#EBA8E4);--pinbg:var(--t-pinbg,#2A2413);\n  --font:Roboto,\"Google Sans\",system-ui,-apple-system,\"Segoe UI\",sans-serif;\n  --mono:\"Roboto Mono\",\"Droid Sans Mono\",ui-monospace,Menlo,Consolas,monospace;\n}\nbody{background-color:var(--t-bg,#000);background-image:linear-gradient(172deg,var(--t-head,#5A4360) 0%,var(--t-head2,#352C3F) 90px,var(--t-head3,#15121A) 210px,var(--t-bg,#000) 320px);background-repeat:no-repeat;background-size:100% 340px}\nh1{font-weight:500;font-size:1.85rem;letter-spacing:0}\nh1 .n{font-size:1rem}\n.search{background:var(--t-field,#0E0E11);border:1.5px solid var(--t-line,#2E2E35);border-radius:999px}\n.search:focus{border-color:var(--t-focus,#9C8BC0);outline:none}\n.chip{background:var(--t-bg,#000);border:1.5px solid var(--t-edge,#3B3B43);color:var(--ink)}\n.chip[aria-pressed=\"true\"]{background:var(--grad);border-color:transparent;color:var(--t-on-grad,#17161C);font-weight:500}\n.chip.add{color:var(--accent)}\n.tab[aria-selected=\"true\"]::after arkdown\u003c/button>\n        \u003cbutton role=\"menuitem\" id=\"exportBtn\">Export backup\u003c/button>\n        \u003cbutton role=\"menuitem\" id=\"importBtn\">Import backup\u003c/button>\n      \u003c/div>\n      \u003cinput type=\"file\" id=\"importFile\" accept=\"application/json,.json\" hidden>\n    \u003c/div>\n  \u003c/header>\n\n  \u003cnav class=\"tabs\" role=\"tablist\" id=\"tabs\">\u003c/nav>\n\n  \u003clabel class=\"sr\" for=\"search\">Search\u003c/label>\n  \u003cinput class=\"search\" id=\"search\" type=\"search\" placeholder=\"Search entries, meetings, people, #tags\">\n\n  \u003cdiv id=\"logFilters\">\n    \u003cdiv class=\"chips\" id=\"chips\">\u003c/div>\n    \u003cdiv class=\"filters2\">\n      \u003clabel class=\"sr\" for=\"kindF\">Entry type\u003c/label>\u003cselect id=\"kindF\">\u003c/select>\n      \u003clabel class=\"sr\" for=\"rangeF\">Time range\u003c/label>\n      \u003cselect id=\"rangeF\">\u003coption value=\"\">Any time\u003c/option>\u003coption value=\"7\">Last 7 days\u003c/option>\u003coption value=\"30\">Last 30 days\u003c/option>\u003coption value=\"90\">Last 3 months\u003c/option>\u003coption value=\"365\">Last year\u003c/option>\u003c/select>\n    \u003c/div>\n  \u003c/div>\n  \u003cdiv id=\"actFilters\" class=\"hidden\">\n    \u003cdiv class=\"chips\" id=\"ownerChips\">\u003c/div>\n  \u003c/div>\n\n  \u003cdiv class=\"bar\">\u003cspan id=\"count\">\u003c/span>\u003cbutton class=\"linkbtn hidden\" id=\"showDone\">\u003c/button>\u003c/div>\n  \u003cmain id=\"list\">\u003c/main>\n  \u003cp class=\"sync\" id=\"sync\">\u003c/p>\n\u003c/div>\n\u003cbutton class=\"fab\" id=\"fab\" aria-label=\"New entry\">+\u003c/button>\n\u003cdatalist id=\"dlProj\">\u003c/datalist>\n\u003cdatalist id=\"dlPeople\">\u003c/datalist>\n\u003cdatalist id=\"dlTitles\">\u003c/datalist>\n\n\u003c!-- quick entry -->\n\u003cdialog id=\"dlg\">\n  \u003cform class=\"sheet\" id=\"form\" autocomplete=\"off\" novalidate>\n    \u003ch2 id=\"dTitle\">New entry\u003c/h2>\n    \u003cdiv class=\"kinds\" id=\"kinds\">\u003c/div>\n    \u003clabel>What happened\u003ctextarea id=\"fText\" maxlength=\"6000\" placeholder=\"Tried a larger QM region; barrier dropped 3 kcal/mol. Use #tags and `code`.\">\u003c/textarea>\u003c/label>\n    \u003cdiv class=\"row\">\n      \u003clabel>Project\u003cinput id=\"fProj\" list=\"dlProj\" maxlength=\"60\">\u003c/label>\n      \u003clabel>Date\u003cinput id=\"fDate\" type=\"date\">\u003c/label>\n    \u003c/div>\n    \u003clabel class=\"check\">\u003cinput type=\"checkbox\" id=\"fPin\"> Pin as important\u003c/label>\n    \u003cp class=\"hint\" id=\"hint\">\u003c/p>\n    \u003cdiv class=\"sbar\">\n      \u003cbutton type=\"button\" class=\"btn danger\" id=\"delBtn\">Delete\u003c/button>\n      \u003cspan style=\"display:flex;gap:6px;margin-left:auto\">\n        \u003cbutton type=\"button\" class=\"btn ghost\" data-close>Cancel\u003c/button>\n        \u003cbutton type=\"submit\" class=\"btn primary\">Save\u003c/button>\n      \u003c/span>\n    \u003c/div>\n  \u003c/form>\n\u003c/dialog>\n\n\u003c!-- meeting -->\n\u003cdialog id=\"mdlg\">\n  \u003cform class=\"sheet\" id=\"mform\" autocomplete=\"off\" novalidate>\n    \u003ch2 id=\"mTitle\">New meeting\u003c/h2>\n    \u003clabel>Title\u003cinput id=\"mName\" list=\"dlTitles\" maxlength=\"120\" placeholder=\"Weekly group meeting\">\u003c/label>\n    \u003cdiv class=\"row\">\n      \u003clabel>Type\u003cselect id=\"mType\">\u003c/select>\u003c/label>\n      \u003clabel>Date\u003cinput id=\"mDate\" type=\"date\">\u003c/label>\n    \u003c/div>\n    \u003clabel>\u003cspan id=\"mPeopleLabel\">People\u003c/span>\u003cinput id=\"mPeople\" list=\"dlPeople\" maxlength=\"400\" placeholder=\"Comma separated\">\u003c/label>\n    \u003clabel>Project\u003cinput id=\"mProj\" list=\"dlProj\" maxlength=\"60\">\u003c/label>\n    \u003cdiv id=\"mCarry\">\u003c/div>\n    \u003clabel>Notes\u003ctextarea id=\"mNotes\" maxlength=\"12000\" placeholder=\"Discussion, results shown, ;el.textContent=t;el.classList.add(\"show\");clearTimeout(_tt);_tt=setTimeout(()=>el.classList.remove(\"show\"),2400)}\nasync function copyText(t,msg){\n  try{await navigator.clipboard.writeText(t);toast(msg||\"Copied\")}\n  catch(_){const a=document.createElement(\"textarea\");a.value=t;document.body.appendChild(a);a.select();\n    try{document.execCommand(\"copy\");toast(msg||\"Copied\")}catch(__){toast(\"Copy not available\")}a.remove()}\n}\nfunction storageWorks(){try{const k=\"__probe\"+Math.random();localStorage.setItem(k,\"1\");localStorage.removeItem(k);return true}catch(_){return false}}\nfunction saveFile(filename,data){\n  try{\n    const ext=(filename.split(\".\").pop()||\"\").toLowerCase();\n    const type={json:\"application/json\",csv:\"text/csv\",md:\"text/markdown\",py:\"text/x-python\",sh:\"text/x-shellscript\",png:\"image/png\"}[ext]||\"text/plain\";\n    const blob=data instanceof Blob?data:new Blob([data],{type:type+\";charset=utf-8\"});\n    const url=URL.createObjectURL(blob);\n    const a=document.createElement(\"a\");a.href=url;a.download=filename;a.style.display=\"none\";\n    document.body.appendChild(a);a.click();a.remove();\n    setTimeout(()=>URL.revokeObjectURL(url),10000);\n    toast(\"Saved to Downloads\");if(/\\.json$/i.test(filename)&&window.__markBackup)window.__markBackup();\n  }catch(_){toast(\"Couldn't save the file\")}\n}\nfunction setupMenu(){\n  const menu=$(\"#menu\"),btn=$(\"#moreBtn\");\n  const close=()=>{menu.classList.remove(\"open\");btn.setAttribute(\"aria-expanded\",\"false\")};\n  btn.addEventListener(\"click\",e=>{e.stopPropagation();btn.setAttribute(\"aria-expanded\",menu.classList.toggle(\"open\"))});\n  document.addEventListener(\"click\",e=>{if(!e.target.closest(\"#menu\"))close()});\n  menu.addEventListener(\"click\",close);\n  document.querySelectorAll(\"[data-close]\").forEach(b=>b.addEventListener(\"click\",()=>b.closest(\"dialog\").close()));\n  document.querySelectorAll(\"dialog\").forEach(d=>d.addEventListener(\"click\",e=>{if(e.target===d)d.close()}));\n}\n// Store: kept in this browser's local storage only.\nfunction makeStore(lsKey,docName,listKeys,onChange){\n  const S={data:null};\n  try{const r=localStorage.getItem(lsKey);S.data=r?JSON.parse(r):null}catch(_){}\n  if(!S.data||typeof S.data!==\"object\") S.data={};\n  listKeys.forEach(k=>{if(!Array.isArray(S.data[k]))S.data[k]=[]});\n  S.saveLocal=()=>{try{localStorage.setItem(lsKey,JSON.stringify(S.data))}catch(_){toast(\"Couldn't save. Storage is full or blocked; export a backup.\")}};\n  S.persist=()=>S.saveLocal();\n  S.connect=()=>{\n    $(\"#sync\").textContent=storageWorks()?(localStorage.getItem(\"sync.github\")?\"Saved on this device and synced to your other devices.\":\"Saved on this device. Turn on sync in the control center, or export a backup now and then.\"):\"Storage is blocked here, so changes will be lost when you close this page.\";\n  };\n  return S;\n}\n\n(function(){\n  const KINDS=[\n    {id:\"note\",name:\"Note\",c:\"--muted\"},{id:\"result\",name:\"Result\",c:\"--green\"},{id:\"problem\",name:\"Problem\",c:\"--danger\"},\n    {id:\"fix\",name:\"Fix\",c:\"--teal\"},{id:\"decision\",name:\"Decision\",c:\"--gold\"},{id:\"idea\",name:\"Idea\",c:\"--violet\"}\n  ];\n  const MEETING={id:\"meeting\",name:\"Meeting\",c:\"--accent\"};\n  const MTYPES=[[\"group\",\"Group meeting\"],[\"supervision\",\"Supervision\"],[\"collab\",\"Collaboration\"],[\"seminar\",\"Seminar or talk\"],[\"oneone\",\"One-to-one\"],[\"other\",\"Other\"]];\n  let tab=\"log\",proj=\"\",kind=\"\",range=\"\",query=\"\",editing=null,fKind=\"note\",ownerF=\"me\",showDone=false;\n  let mEditing=null,mActs=[],mCarryIds=[];\n  const store=makeStore(\"researchlog.v1\",\"log\",[\"entries\"],render);\n  const D=()=>store.data;\n  const allKinds=[...KINDS,MEETING];\n  const kc=k=>`var(${(allKinds.find(x=>x.id===k)||KINDS[0]).c})`;\n  const kn=k=>(allKinds.find(x=>x.id===k)||KINDS[0]).name;\n  const mtn=t=>(MTYPES.find(x=>x[0]===t)||MTYPES[MTYPES.length-1])[1];\n  const isM=e=>e.kind===\"meeting\";\n  const fmt=t=>esc(t).replace(/`([^`\\n]+)`/g,\"\u003ccode>$1\u003c/code>\").replace(/(^|\\s)#([\\w\\-/.]+)/g,'$1\u003cspan style=\"color:var(--accent)\">#$2\u003c/span>');\n  function localDate(ms){const d=new Date(ms);d.setMinutes(d.getMinutes()-d.getTimezoneOffset());return d.toISOString().slice(0,10)}\n  const localToday=()=>localDate(Date.now());\n  const shortDate=d=>new Date(d+\"T12:00\").toLocaleDateString(\"en-GB\",{day:\"numeric\",month:\"short\"});\n  const dayLabel=d=>{\n    if(d===localToday()) return \"Today\"; if(d===localDate(Date.now()-864e5)) return \"Yesterday\";\n    return new Date(d+\"T12:00\").toLocaleDateString(\"en-GB\",{weekday:\"short\",day:\"numeric\",month:\"short\",year:\"numeric\"});\n  };\n  /* \"me\" in action owners: blank, me/myself/eu/yo, or a name set in the control center (stored as suite.me) */\n  const MY_NAMES=(()=>{try{return (localStorage.getItem(\"suite.me\")||\"\").split(/[,;]/).map(s=>s.trim().toLowerCase()).filter(Boolean)}catch(_){return []}})();\n  const isMe=o=>!o||/^(me|myself|eu|yo)$/i.test(o.trim())||MY_NAMES.includes(o.trim().toLowerCase());\n  function dueState(a){\n    if(a.done||!a.due) return \"\";\n    const t=localToday(); if(a.due\u003ct) return \"overdue\";\n    const soon=localDate(Date.now()+3*864e5); return a.due\u003c=soon?\"soon\":\"\";\n  }\n  const dueLabel=a=>{if(!a.due)return\"\";const s=dueState(a);return s===\"overdue\"?`overdue, ${shortDate(a.due)}`:(a.due===localToday()?\"due today\":`due ${shortDate(a.due)}`)};\n  const allActions=()=>D().entries.filter(isM).flatMap(m=>(m.actions||[]).map(a=>({a,m})));\n\n  $(\"#kindF\").innerHTML=`\u003coption value=\"\">All types\u003c/option>`+allKinds.map(k=>`\u003coption value=\"${k.id}\">${k.name}${k.id===\"meeting\"?\"s\":\"\"}\u003c/option>`).join(\"\");\n  $(\"#mType\").innerHTML=MTYPES.map(t=>`\u003coption value=\"${t[0]}\">${t[1]}\u003c/option>`).join(\"\");\n\n  // ---------- filtering ----------\n  function haystack(e){\n    return isM(e)?[e.title,mtn(e.mtype),(e.people||[]).join(\" \"),e.text,e.decisions,(e.actions||[]).map(a=>a.text+\" \"+(a.owner||\"\")).join(\" \"),e.proj].join(\" \")\n      :(e.text+\" \"+(e.proj||\"\")+\" \"+kn(e.kind));\n  }\n  function visible(e){\n    if(tab===\"meetings\"&&!isM(e)) return false;\n    if(proj===\"__pin\"){ if(!e.pin) return false; }\n    else if(proj&&e.proj!==proj) return false;\n    if(tab===\"log\"&&kind&&e.kind!==kind) return false;\n    if(range){const lim=localDate(Date.now()-range*864e5); if(e.date\u003clim) return false}\n    if(!query) return true;\n    return haystack(e).toLowerCase().includes(query);\n  }\n\n  // ---------- rendering ----------\n  function renderTabs(){\n    const open=allActions().filter(x=>!x.a.done).length;\n    const nm=D().entries.filter(isM).length;\n    $(\"#tabs\").innerHTML=[[\"log\",\"Log\",D().entries.length],[\"meetings\",\"Meetings\",nm],[\"actions\",\"Actions\",open]]\n      .map(([id,n,c])=>`\u003cbutton class=\"tab\" role=\"tab\" data-tab=\"${id}\" aria-selected=\"${tab===id}\">${n}${c?`\u003cspan class=\"c\">${c}\u003c/span>`:\"\"}\u003c/button>`).join(\"\");\n  }\n  function refreshLists(){\n    const E=D().entries;\n    const projects=[...new Set(E.map(e=>e.proj).filter(Boolean))].sort((a,b)=>a.localeCompare(b));\n    $(\"#dlProj\").innerHTML=projects.map(p=>`\u003coption>${esc(p)}\u003c/option>`).join(\"\");\n    const people=new Set(); E.filter(isM).forEach(m=>{(m.people||[]).forEach(p=>people.add(p));(m.actions||[]).forEach(a=>{if(a.owner)people.add(a.owner)})});\n    people.add(\"Me\");\n    $(\"#dlPeople\").innerHTML=[...people].sort((a,b)=>a.localeCompare(b)).map(p=>`\u003coption>${esc(p)}\u003c/option>`).join(\"\");\n    $(\"#dlTitles\").innerHTML=[...new Set(E.filter(isM).map(m=>m.title))].sort().map(t=>`\u003coption>${esc(t)}\u003c/option>`).join(\"\");\n    return projects;\n  }\n  function render(){\n    const projects=refreshLists();\n    if >${dayLabel(d)}\u003c/span>\u003cspan>${es.length}\u003c/span>\u003c/div>\n        \u003cdiv class=\"list\">${es.map(e=>isM(e)?meetingCard(e):entryCard(e)).join(\"\")}\u003c/div>\u003c/section>`;\n    }).join(\"\");\n  }\n  function pinEdit(e){\n    return `\u003cspan style=\"margin-left:auto;display:flex\">\n      ${isM(e)?`\u003cbutton class=\"ibtn\" data-act=\"follow\" aria-label=\"Follow-up meeting\" title=\"Follow-up meeting\" style=\"min-width:40px;min-height:40px\">↻\u003c/button>`:\"\"}\n      \u003cbutton class=\"ibtn ${e.pin?\"star-on\":\"\"}\" data-act=\"pin\" aria-label=\"${e.pin?\"Unpin\":\"Pin\"}\" style=\"min-width:40px;min-height:40px\">${e.pin?\"📌\":\"⚲\"}\u003c/button>\n      \u003cbutton class=\"ibtn\" data-act=\"edit\" aria-label=\"Edit\" style=\"min-width:40px;min-height:40px\">✎\u003c/button>\u003c/span>`;\n  }\n  function entryCard(e){\n    return `\u003carticle class=\"entry\" data-id=\"${e.id}\" style=\"--cc:${kc(e.kind)}\">\n      \u003cdiv class=\"body\">${fmt(e.text)}\u003c/div>\n      \u003cdiv class=\"meta\">\u003cspan class=\"kind\">${kn(e.kind)}\u003c/span>${e.proj?`\u003cspan class=\"proj\">${esc(e.proj)}\u003c/span>`:\"\"}${pinEdit(e)}\u003c/div>\n    \u003c/article>`;\n  }\n  function actionRow(a,m,showSrc){\n    const st=dueState(a);\n    return `\u003clabel class=\"act ${a.done?\"done\":\"\"}\">\u003cinput type=\"checkbox\" data-aid=\"${a.id}\" data-mid=\"${m.id}\" ${a.done?\"checked\":\"\"} aria-label=\"Done\">\n      \u003cdiv class=\"at\">\u003cdiv>${fmt(a.text)}\u003c/div>\u003cdiv class=\"am\">${a.owner?`\u003cspan>${esc(a.owner)}\u003c/span>`:\"\"}${a.due?`\u003cspan class=\"${st}\">${dueLabel(a)}\u003c/span>`:\"\"}\n      ${showSrc?`\u003cspan class=\"src\" data-open=\"${m.id}\">${esc(m.title)}, ${shortDate(m.date)}\u003c/span>`:\"\"}\u003c/div>\u003c/div>\u003c/label>`;\n  }\n  function meetingCard(m){\n    const long=(m.text||\"\").length>320||(m.text||\"\").split(\"\\n\").length>5;\n    const acts=m.actions||[], open=acts.filter(a=>!a.done).length;\n    return `\u003carticle class=\"entry mtg\" data-id=\"${m.id}\" style=\"--cc:${kc(\"meeting\")}\">\n      \u003cdiv class=\"mtitle\">${esc(m.title)}\u003c/div>\n      ${(m.people||[]).length?`\u003cdiv class=\"people\">${m.mtype===\"seminar\"?\"Speaker: \":\"\"}${esc(m.people.join(\", \"))}\u003c/div>`:\"\"}\n      ${m.text?`\u003cdiv class=\"msec\">\u003cspan>Notes\u003c/span>\u003cdiv class=\"txt ${long?\"clamp\":\"\"}\">${fmt(m.text)}\u003c/div>${long?`\u003cbutton class=\"more\" data-act=\"more\">Show more\u003c/button>`:\"\"}\u003c/div>`:\"\"}\n      ${m.decisions?`\u003cdiv class=\"msec\">\u003cspan>Decisions\u003c/span>\u003cdiv class=\"txt\">${fmt(m.decisions)}\u003c/div>\u003c/div>`:\"\"}\n      ${acts.length?`\u003cdiv class=\"msec\">\u003cspan>Actions${open?` (${open} open)`:\"\"}\u003c/span>${acts.map(a=>actionRow(a,m,false)).join(\"\")}\u003c/div>`:\"\"}\n      \u003cdiv class=\"meta\">\u003cspan class=\"kind\">${esc(mtn(m.mtype))}\u003c/span>${m.proj?`\u003cspan class=\"proj\">${esc(m.proj)}\u003c/span>`:\"\"}${pinEdit(m)}\u003c/div>\n    \u003c/article>`;\n  }\n  function renderActions(){\n    const all=allActions();\n    const owners=[...new Set(all.map(x=>x.a.owner).filter(o=>o&&!isMe(o)))].sort((a,b)=>a.localeCompare(b));\n    if(ownerF!==\"me\"&&ownerF!==\"\"&&!owners.includes(ownerF)) ownerF=\"me\";\n    const cnt=f=>all.filter(x=>!x.a.done&&f(x)).length;\n    $(\"#ownerChips\").innerHTML=[`\u003cbutton class=\"chip\" data-o=\"me\" aria-pressed=\"${ownerF===\"me\"}\">Mine\u003cspan class=\"c\">${cnt(x=>isMe(x.a.owner))}\u003c/span>\u003c/button>`,\n      `\u003cbutton class=\"chip\" data-o=\"\" aria-pressed=\"${ownerF===\"\"}\">Everyone\u003cspan class=\"c\">${cnt(()=>true)}\u003c/span>\u003c/button>`]\n      .concat(owners.map(o=>`\u003cbutton class=\"chip\" data-o=\"${esc(o)}\" aria-pressed=\"${ownerF===o}\">${esc(o)}\u003cspan class=\"c\">${cnt(x=>x.a.owner===o)}\u003c/span>\u003c/button>`)).join(\"\");\n    let vis=all.filter(x=>ownerF===\"me\"?isMe(x.a.owner):ownerF?x.a.owner===ownerF:true)\n      .filter(x=>!query||(x.a.text+\" \"+(x.a.owner||\"\")+\" \"+x.m.title).toLowerCase().includes(query));\n    const openL=vis.filter(x=>!x.a.done), doneL=vis.filter(x=>x.a.done);\n    $(\"#showDone\").textContent=doneL.length?(showDone?\"Hide done\":`Show done (${doneL.length})`):\"\";\n    $(\"#count\").textContent=`${openL.length} open`;\n    const groups=[\n      [\"Overdue\",openL.filter(x=>dueState(x.a)===\"overdue\")],\n      [\"Due in the next 3 days\",openL.filter(x=>dueState(x.a)===\"soon\")],\n      [\"Later\",openL.filter(x=>x.a.due&&!dueState(x.a))],\n      [\"No date\",openL.filter(x=>!x.a.due)]\n    ];\n    if(showDone) groups.push([\"Done\",doneL]);\n    const sortD=l=>l.sort((p,q)=>(p.a.due||\"9\").localeCompare(q.a.due||\"9\")||q.m.date.localeCompare(p.m.date));\n    const html=groups.filter(g=>g[1].length).map(([n,l])=>`\u003csection class=\"group\">\u003cdiv class=\"ghead\">\u003cspan>${n}\u003c/span>\u003cspan>${l.length}\u003c/span>\u003c/div>\n      \u003cdiv class=\"acard\">${sortD(l).map(x=>actionRow(x.a,x.m,true)).join(\"\")}\u003c/div>\u003c/section>`).join(\"\");\n    $(\"#list\").innerHTML=html||`\u003cdiv class=\"empty\">${all.length?\"Nothing open here. Nice.\":\"Action items from your meeting notes will collect here.\"}\u003c/div>`;\n  }\n\n  // ---------- tabs and filters ----------\n  $(\"#tabs\").addEventListener(\"click\",e=>{const b=e.target.closest(\"[data-tab]\");if(!b)return;tab=b.dataset.tab;if(tab!==\"log\")kind=\"\";$(\"#kindF\").value=kind;render();window.scrollTo(0,0)});\n  $(\"#search\").addEventListener(\"input\",e=>{query=e.target.value.trim().toLowerCase();render()});\n  $(\"#chips\").addEventListener(\"click\",e=>{const b=e.target.closest(\"[data-f]\");if(!b)return;proj=b.dataset.f;render()});\n  $(\"#ownerChips\").addEventListener(\"click\",e=>{const b=e.target.closest(\"[data-o]\");if(!b)return;ownerF=b.dataset.o;render()});\n  $(\"#showDone\").addEventListener(\"click\",()=>{showDone=!showDone;render()});\n  $(\"#kindF\").addEventListener(\"change\",e=>{kind=e.target.value;render()});\n  $(\"#rangeF\").addEventListener(\"change\",e=>{range=num(e.target.value)||\"\";render()});\n\n  // ---------- list actions ----------\n  $(\"#list\").addEventListener(\"change\",ev=>{\n    const cb=ev.target.closest(\"[data-aid]\"); if(!cb) return;\n    const m=D().entries.find(x=>x.id===cb.dataset.mid); const a=m&&(m.actions||[]).find(x=>x.id===cb.dataset.aid); if(!a) return;\n    a.done=cb.checked; a.doneAt=cb.checked?Date.now():null; m.updated=Date.now(); store.persist();\n    setTimeout(render,cb.checked?350:0);\n  });\n  $(\"#list\").addEventListener(\"click\",ev=>{\n    const src=ev.target.closest(\"[data-open]\");\n    if(src){ev.preventDefault();openMeeting(src.dataset.open);return}\n    const b=ev.target.closest(\"[data-act]\"); if(!b) return;\n    const card=b.closest(\".entry\"); const e=card&&D().entries.find(x=>x.id===card.dataset.id); if(!e) return;\n    const a=b.dataset.act;\n    if(a===\"pin\"){e.pin=!e.pin;e.updated=Date.now();store.persist();render()}\n    else if(a===\"edit\") isM(e)?openMeeting(e.id):openEdit(e.id);\n    else if(a===\"follow\") openMeeting(null,e);\n    else if(a===\"more\"){const t=card.querySelector(\".clamp\");if(t){t.classList.remove(\"clamp\");b.remove()}}\n  });\n\n  // ---------- add ----------\n  const pick=$(\"#pick\");\n  $(\"#fab\").addEventListener(\"click\",()=>{if(tab===\"log\")pick.showModal();else openMeeting()});\n  $(\"#pickEntry\").addEventListener(\"click\",()=>{pick.close();openEdit()});\n  $(\"#pickMeeting\").addEventListener(\"click\",()=>{pick.close();openMeeting()});\n\n  // ---------- log entry sheet ----------\n  const dlg=$(\"#dlg\");\n  function renderKinds(){$(\"#kinds\").innerHTML=KINDS.map(k=>`\u003cbutton type=\"button\" data-k=\"${k.id}\" style=\"--cc:var(${k.c})\" aria-pressed=\"${fKind===k.id}\">${k.name}\u003c/button>`).join(\"\")}\   actions.forEach(a=>{if(a.done&&!a.doneAt)a.doneAt=Date.now();if(!a.done)a.doneAt=null});\n    const data={kind:\"meeting\",title,mtype:$(\"#mType\").value,date:$(\"#mDate\").value||localToday(),\n      people:$(\"#mPeople\").value.split(\",\").map(s=>s.trim()).filter(Boolean),proj:$(\"#mProj\").value.trim(),\n      text:$(\"#mNotes\").value.trim(),decisions:$(\"#mDec\").value.trim(),actions,pin:$(\"#mPin\").checked,updated:Date.now()};\n    const m=mEditing?D().entries.find(x=>x.id===mEditing):null;\n    if(m) Object.assign(m,data); else D().entries.push({id:uid(),added:Date.now(),...data});\n    if(data.proj) D().lastProj=data.proj;\n    store.persist(); render(); mdlg.close(); toast(m?\"Saved\":\"Meeting saved\");\n  });\n  $(\"#mDel\").addEventListener(\"click\",()=>{\n    const m=D().entries.find(x=>x.id===mEditing); if(!m) return;\n    const n=(m.actions||[]).filter(a=>!a.done).length;\n    if(!confirm(`Delete \"${m.title}\"?${n?` Its ${n} open action item${n===1?\"\":\"s\"} will be deleted too.`:\"\"}`)) return;\n    D().entries=D().entries.filter(x=>x.id!==mEditing); store.persist(); render(); mdlg.close(); toast(\"Deleted\");\n  });\n\n  // ---------- export ----------\n  function mdMeeting(m,out){\n    out.push(`### ${m.title} (${mtn(m.mtype)})`);\n    if((m.people||[]).length) out.push(`*${m.mtype===\"seminar\"?\"Speaker\":\"People\"}: ${m.people.join(\", \")}*`);\n    if(m.proj&&!proj) out.push(`*Project: ${m.proj}*`);\n    out.push(\"\");\n    if(m.text) out.push(m.text,\"\");\n    if(m.decisions) out.push(\"**Decisions**\",\"\",m.decisions,\"\");\n    if((m.actions||[]).length){out.push(\"**Actions**\",\"\");m.actions.forEach(a=>out.push(`- [${a.done?\"x\":\" \"}] ${a.text}${a.owner?` (${a.owner})`:\"\"}${a.due?`, due ${a.due}`:\"\"}`));out.push(\"\")}\n  }\n  $(\"#mdBtn\").addEventListener(\"click\",()=>{\n    if(tab===\"actions\"){\n      const open=allActions().filter(x=>!x.a.done).sort((p,q)=>(p.a.due||\"9\").localeCompare(q.a.due||\"9\"));\n n\u003c/script>\n\u003cscript>window.__BACKUP={id:\"research-log\",key:\"researchlog.v1\"};\u003c/script>\n\u003cscript>\n(function(){\n  const C=window.__BACKUP, LK=C.id+\".lastBackup\", SK=C.id+\".backupSnooze\", WEEK=7*864e5;\n  const get=k=>{try{return +localStorage.getItem(k)||0}catch(_){return 0}};\n  const set=(k,v)=>{try{localStorage.setItem(k,String(v))}catch(_){}};\n  function hasData(){\n    try{const v=JSON.parse(localStorage.getItem(C.key)||\"null\");if(!v)return false;\n      if(Array.isArray(v))return v.length>0;\n      return Object.values(v).some(x=>Array.isArray(x)&&x.length>0)}catch(_){return false}\n  }\n  const bar=document.createElement(\"div\");\n  bar.className=\"bk hidden\"; bar.setAttribute(\"role\",\"status\");\n  bar.innerHTML='\u003cdiv class=\"bkt\">\u003cb>\u003c/b>\u003cspan>Save a copy to Files or Downloads, or turn on sync in the control center.\u003c/span>\u003c/div>\u003cbutton class=\"bkno\" type=\"button\">Later\u003c/button>\u003cbutton class=\"bkgo\" type=\"button\">Back up now\u003c/button>';\n  const wrap=document.querySelector(\".wrap\"), head=wrap&&wrap.querySelector(\":scope > header\");\n  if(head) head.insertAdjacentElement(\"afterend\",bar); else if(wrap) wrap.prepend(bar);\n  function check(){\n    const now=Date.now(), last=get(LK), data=hasData();\n    // never backed up: start the 7-day clock from when data first appears\n    if(!last&&data&&!get(C.id+\".firstData\")) set(C.id+\".firstData\",now);\n    const ref=last||get(C.id+\".firstData\")||now;\n    const due=data&&now-ref>WEEK&&now>get(SK);\n    bar.classList.toggle(\"hidden\",!due);\n    if(due){\n      const days=last?Math.floor((now-last)/864e5):0;\n      bar.querySelector(\"b\").textContent=last?`Last backup ${days} days ago`:\"Not backed up yet\";\n    }\n  }\n  window.__markBackup=()=>{set(LK,Date.now());set(SK,0);check()};\n  bar.querySelector(\".bkgo\").addEventListener(\"click\",()=>{const b=document.getElementById(\"exportBtn\");if(b)b.click()});\n  bar.querySelector(\".bkno\").addEventListener(\"click\",()=>{set(SK,Date.now()+864e5);check()});\n  document.addEventListener(\"visibilitychange\",()=>{if(!document.hidden)check()});\n  window.addEventListener(\"storage\",check);\n  setInterval(check,36e5);\n  // first check after the app has loaded its data; recheck when data changes\n  setTimeout(check,300);\n  let t=null; document.addEventListener(\"click\",()=>{clearTimeout(t);t=setTimeout(check,600)},true);\n})();\n\u003c/script>\n\u003c/body>\n\u003c/html>\n"}, {"id": "tasks", "label": "Tasks", "html": "\u003c!doctype html>\n\u003chtml lang=\"en\">\n\u003chead>\n\u003cmeta charset=\"utf-8\">\n\u003cscript src=\"suite-theme.js\" data-suite-theme>\u003c/script>\n\u003cmeta name=\"viewport\" content=\"width=device-width, initial-scale=1, viewport-fit=cover, interactive-widget=resizes-content\">\n\u003cmeta name=\"theme-color\" content=\"#5A4360\">\n\u003cmeta name=\"color-scheme\" content=\"dark\">\n\u003ctitle>Tasks\u003c/title>\n\u003c!-- Tasks app for QTask: written in the style of the CompChemKit apps (A. R. V. Pinto, MIT), with the\n     priority-plus-due-date ranking first designed for Bancada. -->\n\u003cstyle>\n:root{\n  color-scheme:dark;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);\n  --bg:var(--t-bg,#14161B);--surface:var(--t-surface,#1C1F26);--raised:var(--t-raised,#242832);--ink:var(--t-ink,#E7E9EE);--muted:var(--t-muted,#8B919E);--faint:var(--t-faint,#2C303A);\n  --accent:var(--t-accent,#9DB2FF);--danger:var(--t-red,#F28B82);--gold:var(--t-gold,#E6C170);--green:var(--t-green,#7DCB9C);--violet:var(--t-violet,#C3A6F0);--pink:var(--t-pink,#EE93AF);--teal:var(--t-teal,#8CC3CC);\n  --font:\"Manrope\",system-ui,Roboto,\"Segoe UI\",sans-serif;\n  --mono:\"JetBrains Mono\",ui-monospace,\"Roboto Mono\",Menlo,Consolas,monospace;\n}\nhtml{height:100%;scroll-padding-top:env(safe-area-inset-top,0px)}\n*,*::before,*::after{box-sizing:border-box;-webkit-tap-highlight-color:transparent}\nbody{marg ".backupSnooze\", WEEK=7*864e5;\n  const get=k=>{try{return +localStorage.getItem(k)||0}catch(_){return 0}};\n  const set=(k,v)=>{try{localStorage.setItem(k,String(v))}catch(_){}};\n  function hasData(){\n    try{const v=JSON.parse(localStorage.getItem(C.key)||\"null\");if(!v)return false;\n      if(Array.isArray(v))return v.length>0;\n      return Object.values(v).some(x=>Array.isArray(x)&&x.length>0)}catch(_){return false}\n  }\n  const bar=document.createElement(\"div\");\n  bar.className=\"bk hidden\"; bar.setAttribute(\"role\",\"status\");\n  bar.innerHTML='\u003cdiv class=\"bkt\">\u003cb>\u003c/b>\u003cspan>Save a copy to Files or Downloads, or turn on sync in the control center.\u003c/span>\u003c/div>\u003cbutton class=\"bkno\" type=\"button\">Later\u003c/button>\u003cbutton class=\"bkgo\" type=\"button\">Back up now\u003c/button>';\n  const wrap=document.querySelector(\".wrap\"), head=wrap&&wrap.querySelector(\":scope > header\");\n  if(head) head.insertAdjacentElement(\"afterend\",bar); else if(wrap) wrap.prepend(bar);\n  function check(){\n    const now=Date.now(), last=get(LK), data=hasData();\n    // never backed up: start the 7-day clock from when data first appears\n    if(!last&&data&&!get(C.id+\".firstData\")) set(C.id+\".firstData\",now);\n    const ref=last||get(C.id+\".firstData\")||now;\n    const due=data&&now-ref>WEEK&&now>get(SK);\n    bar.classList.toggle(\"hidden\",!due);\n    if(due){\n      const days=last?Math.floor((now-last)/864e5):0;\n      bar.querySelector(\"b\").textContent=last?`Last backup ${days} days ago`:\"Not backed up yet\";\n    }\n  }\n  window.__markBackup=()=>{set(LK,Date.now());set(SK,0);check()};\n  bar.querySelector(\".bkgo\").addEventListener(\"click\",()=>{const b=document.getElementById(\"exportBtn\");if(b)b.click()});\n  bar.querySelector(\".bkno\").addEventListener(\"click\",()=>{set(SK,Date.now()+864e5);check()});\n  document.addEventListener(\"visibilitychange\",()=>{if(!document.hidden)check()});\n  window.addE lor:var(--muted)}\n.catpick{width:48px;height:48px;border-radius:50%;background:var(--surface);display:grid;place-items:center;flex:0 0 auto}\n.catpick span{width:12px;height:12px;border-radius:50%;background:var(--cc)}\n.add{width:48px;height:48px;border-radius:50%;background:var(--accent);color:var(--t-on-accent,#14161B);font-size:1.5rem;font-weight:500;flex:0 0 auto}\n\n/* sheets */\ndialog{border:0;padding:0;background:var(--raised);color:var(--ink);width:100%;max-width:560px;margin:auto auto 0;border-radius:20px 20px 0 0;max-height:90vh}\n@media (min-width:600px){dialog{margin:auto;border-radius:20px}}\ndialog::backdrop{background:var(--t-backdrop,rgba(0,0,0,.6))}\n.sheet{padding:20px 20px calc(20px + env(safe-area-inset-bottom,0px));display:flex;flex-direction:column;gap:14px}\n.sheet h2{margin:0;font-size:1.15rem;font-weight:700}\n.sheet label{display:flex;flex-direction:column;gap:6px;font-size:.85rem;color:var(--muted)}\n.sheet input,.sheet textarea,.sheet select{background:var(--surface);border:0;border-radius:12px;padding:12px;color:var(--ink);min-height:48px}\n.sheet textarea{min-height:110px;resize:vertical}\n.row{display:grid;grid-template-columns:1fr 1fr;gap:10px}\n.check{flex-direction:row!important;align-items:center;gap:10px!important;color:var(--ink)!important;font-size:1rem!important}\n.check input{min-height:auto;width:20px;height:20px;accent-color:var(--accent)}\n.sbar{display:flex;justify-content:space-between;gap:8px;margin-top:4px}\n.btn{border-radius:12px;padding:12px 16px;min-height:48px}\n.btn.primary{background:var(--accent);color:var(--t-on-accent,#14161B);font-weight:700}\n.btn.ghost{color:var(--muted)}\n.btn.danger{color:var(--t-red,#F28B82)}\n.catlist{display:grid;grid-template-columns:1fr 1fr;gap:6px}\n.catlist button{display:flex;align-items:center;gap:10px;padding:14px;border-radius:12px;background:var(--surface);text-align:left}\n.catlist button[aria-pressed=\"true\"]{outline:2px solid var(--accent)}\n.catlist .dot{width:10px;height:10px;border-radius:50%}\n\n.toast{position:fixed;left:50%;bottom:calc(var(--bar) + env(safe-area-inset-bottom,0px) + 12px);transform:translateX(-50%);background:var(--raised);color:var(--ink);padding:10px 16px;border-radius:12px;font-size:.9rem;opacity:0;pointer-events:none;transition:opacity .2s;max-width:90vw;text-align:center;z-index:6}\n.toast.show{opacity:1}\n.sync{font-size:.8rem;color:var(--muted);text-align:center;margin-top:24px}\n.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}\n/* ---- Theme: dark with pink-to-blue accents ---- */\n:root{\n  --bg:var(--t-bg,#000000);--surface:var(--t-surface,#131316);--raised:var(--t-raised,#1D1D22);--ink:var(--t-ink,#F2F2F4);--muted:var(--t-muted,#9D9DA5);--faint:var(--t-faint,#28282E);\n  --accent:var(--t-accent,#EBA8E4);--accent2:var(--t-accent2,#A7CBF4);\n  --grad:linear-gradient(90deg,var(--t-grad1,#F0A8DC) 0%,var(--t-grad2,#C9B6EF) 50%,var(--t-grad3,#A6CCF5) 100%);\n  --danger:var(--t-danger,#EF5A50);--star:var(--t-accent,#EBA8E4);--pinbg:var(--t-pinbg,#2A2413);\n  --font:Roboto,\"Google Sans\",system-ui,-apple-system,\"Segoe UI\",sans-serif;\n  --mono:\"Roboto Mono\",\"Droid Sans Mono\",ui-monospace,Menlo,Consolas,monospace;\n}\nbody{background-color:var(--t-bg,#000);background-image:linear-gradient(172deg,var(--t-head,#5A4360) 0%,var(--t-head2,#352C3F) 90px,var(--t-head3,#15121A) 210px,var(--t-bg,#000) 320px);background-repeat:no-repeat;background-size:100% 340px}\nh1{font-weight:500;font-size:1.85rem;letter-spacing:0}\nh1 .n{font-size:1rem}\n.search{background:var(--t-field,#0E0E11);border:1.5px solid var(--t-line,#2E2E35);border-radius:999px}\n.search:focus{border-color:var(--t-focus,#9C8BC0);outline:none}\n.chip{background:var(--t-bg,#000);border:1.5px solid var(--t-edge,#3B3B43);color:var(--ink)}\n.chip[aria-pressed=\"true\"]{background:var(--grad);border-color:transparent;color:var(--t-on-grad,#17161C);font-weight:500}\n.chip.add{color:var(--accent)}\n.tab[aria-selected=\"true\"]::after{background:var(--grad)}\n.btn.primary,.add{background:var(--grad)!important;color:var(--t-on-grad,#17161C)!important}\n.fab{background:var(--t-fab,#17171C);border:1px solid var(--t-edge,#3A3A42);color:var(--t-fab-ink,#D9B9EE);box-shadow:0 8px 22px var(--t-shadow,rgba(0,0,0,.7))}\n.star-on{color:var(--star)!important}\n.card:has(.star-on),.paper:has(.star-on),.entry:has(.star-on){background:var(--pinbg)}\n.menu{background:var(--raised);border:1px solid var(--t-line,#2E2E35)}\ndialog{background:var(--raised)}\n.sheet input,.sheet select,.sheet textarea,.dlg input,.dlg textarea,.dlg select{background:var(--t-field,#0F0F12)}\n.toast{background:var(--t-raised2,#26262C);color:var(--ink)}\n.doi{color:var(--accent2)}\n.sync{color:var(--t-dim,#6F6F77)}\n.seg button[aria-pressed=\"true\"]{background:var(--grad);color:var(--t-on-grad,#17161C)}\n.topbar{background:linear-gradient(172deg,var(--t-head,#5A4360) 0%,var(--t-headbar,#2A2432) 100%)}\n.toolbar{background:var(--t-bg,#000)}\n.bk.hidden{display:none!important}\n.bk{display:flex;align-items:center;gap:8px;background:var(--pinbg,var(--t-pinbg,#2A2413));border-radius:14px;padding:10px 8px 10px 14px;margin:0 0 14px}\n.bk .bkt{flex:1;min-width:0;font-size:.9rem;line-height:1.3}\n.bk .bkt b{display:block;font-weight:500}\n.bk .bkt span{color:var(--muted);font-size:.8rem}\n.bk .bkgo{background:var(--grad);color:var(--t-on-grad,#17161C);border-radius:999px;padding:10px 14px;min-height:44px;font-weight:500;white-space:nowrap}\n.bk .bkno{color:var(--muted);padding:10px 8px;min-height:44px}\n\u003c/style>\n\u003c/head>\n\u003cbody>\n\u003cdiv class=\"wrap\">\n  \u003cheader>\n    \u003ch1>Ideas\u003c/h1>\n    \u003cdiv class=\"hbtns\">\n      \u003cbutton class=\"ibtn\" id=\"spark\" aria-label=\"Pick a random spark\" title=\"Surprise me\">✦\u003c/button>\n      \u003cbutton class=\"ibtn\" id=\"moreBtn\" aria-label=\"More options\" aria-expanded=\"false\">⋮\u003c/button>\n      \u003cdiv class=\"menu\" id=\"menu\" role=\"menu\">\n        \u003cbutton role=\"menuitem\" id=\"exportBtn\">Export backup\u003c/button>\n        \u003cbutton role=\"menuitem\" id=\"importBtn\">Import backup\u003c/button>\n      \u003c/div>\n      \u003cinput type=\"file\" id=\"importFile\" accept=\"application/json,.json\" hidden>\n    \u003c/div>\n  \u003c/header>\n\n  \u003clabel class=\"sr\" for=\"search\">Search ideas\u003c/label>\n  \u003cinput class=\"search\" id=\"search\" type=\"search\" placeholder=\"Search\">\n  \u003cdiv class=\"chips\" id=\"chips\">\u003c/div>\n\n  \u003cnav class=\"tabs\" id=\"tabs\" role=\"tablist\">\u003c/nav>\n  \u003cmain class=\"board\" id=\"board\">\u003c/main>\n  \u003cp class=\"sync\" id=\"sync\">\u003c/p>\n\u003c/div>\n\n\u003cdiv class=\"capture\">\n  \u003cform id=\"capture\" autocomplete=\"off\">\n    \u003cbutton type=\"button\" class=\"catpick\" id=\"catpick\" aria-label=\"Choose category\">\u003cspan>\u003c/span>\u003c/button>\n    \u003clabel class=\"sr\" for=\"qTitle\">New idea\u003c/label>\n    \u003cinput id=\"qTitle\" placeholder=\"New idea\" maxlength=\"200\" enterkeyhint=\"done\">\n    \u003cbutton class=\"add\" type=\"submit\" aria-label=\"Add idea\">+\u003c/button>\n  \u003c/form>\n\u003c/div>\n\n\u003cdialog id=\"catDlg\">\n  \u003cdiv class=\"sheet\">\n    \u003ch2>Category\u003c/h2>\n    \u003cdiv class=\"catlist\" id=\"catlist\">\u003c/div>\n  \u003c/div>\n\u003c/dialog>\n\n\u003cdialog id=\"dlg\">\n  \u003cform class=\"sheet\" id=\"editForm\">\n    \u003ch2>Edit idea\u003c/h2>\n    \u003clabel>Title\u003cinput id=\"eTitle\" required maxlength=\"200\">\u003c/label>\n    \u003clabel>Notes\u003ctextarea id=\"eNotes\" placeholder=\"Why it matters, first step, links\">\u003c/textarea>\u003c/label>\n    \u003cdiv class=\"row\">\n      \u003clabel>Category\u003cselect id=\"eCat\">\u003c/select>\u003c/label>\n      \u003clabel>Stage\u003cselect id=\"eStage\">\u003c/select>\u003c/label>\n    \u003c/div>\n    \u003clabel>Tags\u003cinput id=\"eTags\" placeholder=\"Comma separated\">\u003c/label>\n    \u003clabel class=\"check\">\u003cinput type=\"checkbox\" id=\"eStar\"> Favourite\u003c/label>\n    \u003cdiv class=\"sbar\">\n      \u003cbutton type=\"button\" class=\"btn danger\" id=\"delBtn\">Delete\u003c/button>\n      \u003cspan style=\"display:flex;gap:6px\">\n        \u003cbutton type=\"button\" class=\"btn ghost\" id=\"cancelBtn\">Cancel\u003c/button>\n        \u003cbutton type=\"submit\" class=\"btn primary\">Save\u003c/button>\n      \u003c/span>\n    \u003c/div>\n  \u003c/form>\n\u003c/dialog>\n\n\u003cdiv class=\"toast\" id=\"toast\" role=\"status\" aria-live=\"polite\">\u003c/div>\n\n\u003cscript>\n(function(){\n  function offlineSave(filename,data){\n    try{\n      const ext=(filename.split(\".\").pop()||\"\").toLowerCase();\n      const type={json:\"application/json\",csv:\"text/csv\",md:\"text/markdown\",png:\"image/png\"}[ext]||\"text/plain\";\n      const blob=data instanceof Blob?data:new Blob([data],{type:type+\";charset=utf-8\"});\n      const url=URL.createObjectURL(blob);\n      const a=document.createElement(\"a\");a.href=url;a.download=filename;a.style.display=\"none\";\n      document.body.appendChild(a);a.click();a.remove();\n      setTimeout(()=>URL.revokeObjectURL(url),10000);\n      toast(\"Saved to Downloads\");if(/\\.json$/i.test(filename)&&window.__markBackup)window.__markBackup();\n    }catch(_){toast(\"Couldn't save the file\")}\n  }\n  function storageWorks(){try{const k=\"__probe\"+Math.random();localStorage.setItem(k,\"1\");localStorage.removeItem(k);return true}catch(_){return false}}\n  const STORAGE_MSG=()=>storageWorks()?(localStorage.getItem(\"sync.github\")?\"Saved on this device and synced to your other devices.\":\"Saved on this device. Turn on sync in the control center, or export a backup now and then.\"):\"Storage is blocked here, so changes will be lost when you close this page.\";\n  const STAGES=[\n    {id:\"spark\",name:\"Sparks\"},{id:\"explore\",name:\"Exploring\"},\n    {id:\"doing\",name:\"Doing\"},{id:\"done\",name:\"Done\"}\n  ];\n  const CATS=[\n    {id:\"research\",name:\"Research\"},{id:\"grants\",name:\"Grants\"},{id:\"teaching\",name:\"Teaching\"},\n    {id:\"outdoors\",name:\"Outdoors\"},{id:\"minerals\",name:\"Minerals\"},{id:\"home\",name:\"Home\"},{id:\"other\",name:\"Other\"}\n  ];\n  const LS_KEY=\"ideaboard.v1\";\n  let ideas=[], filterCat=null, query=\"\", editingId=null, activeStage=\"spark\", newCat=\"research\";\n\n  const $=s=>document.querySelector(s);\n  const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,7);\n  const cc=c=>`var(--c-${c||\"other\"})`;\n  const esc=s=>String(s).replace(/[&\u003c>\"']/g,m=>({\"&\":\"&amp;\",\"\u003c\":\"&lt;\",\">\":\"&gt;\",'\"':\"&quot;\",\"'\":\"&#39;\"}[m]));\n\n  $(\"#eCat\").innerHTML=CATS.map(c=>`\u003coption value=\"${c.id}\">${c.name}\u003c/option>`).join(\"\");\n  $(\"#eStage\").innerHTML=STAGES.map(s=>`\u003coption value=\"${s.id}\">${s.name}\u003c/option>`).join(\"\");\n\n  // toast\n  let tt=null;\n  function toast(t){const el=$(\"#toast\");el.textContent=t;el.classList.add(\"show\");clearTimeout(tt);tt=setTimeout(()=>el.classList.remove(\"show\"),2600)}\n\n  // storage\n  function loadLocal(){try{const r=localStorage.getItem(LS_KEY);return r?JSON.parse(r):null}catch(e){return null}}\n  function saveLocal(){try{localStorage.setItem(LS_KEY,JSON.stringify(ideas))}catch(e){toast(\"Couldn\\'t save. Storage is full or blocked; export a backup.\")}}\n  function persist(){saveLocal()}\n\n  // render\n  function visible(i){\n    if(filterCat&&i.cat!==filterCat) return false;\n    if(!query) return true;\n    return (i.title+\" \"+(i.notes||\"\")+\" \"+(i.tags||[]).join(\" \")).toLowerCase().includes(query);\n  }\n  function renderCatPick(){$(\"#catpick\").style.setProperty(\"--cc\",cc(newCat));$(\"#catpick\").setAttribute(\"aria-label\",\"Category: \"+CATS.find(c=>c.id===newCat).name)}\n  function renderChips(){\n    $(\"#chips\").innerHTML=[`\u003cbutton class=\"chip\" data-cat=\"\" aria-pressed=\"${!filterCat}\">All\u003c/button>`]\n      .concat(CATS.map(c=>`\u003cbutton class=\"chip\" data-cat=\"${c.id}\" aria-pressed=\"${filterCat===c.id}\">\u003cspan class=\"dot\" style=\"background:${cc(c.id)}\">\u003c/span>${c.name}\u003c/button>`)).join(\"\");\n  }\n  function renderTabs(){\n    $(\"#tabs\").innerHTML=STAGES.map(s=>{\n      const n=ideas.filter(i=>i.stage===s.id&&visible(i)).length;\n      return `\u003cbutton class=\"tab\" role=\"tab\" data-stage=\"${s.id}\" aria-selected=\"${activeStage===s.id}\">${s.name}\u003cspan class=\"n\">${n}\u003c/span>\u003c/button>`;\n    }).join(\"\");\n  }\n  function cardHTML(i){\n    const si=STAGES.findIndex(s=>s.id===i.stage);\n    const tags=(i.tags||[]).length?`\u003cdiv class=\"tags\">${i.tags.map(t=>\"#\"+esc(t)).join(\" \")}\u003c/div>`:\"\";\n    return `\u003carticle class=\"card\" draggable=\"true\" data-id=\"${i.id}\" style=\"--cc:${cc(i.cat)}\">\n      \u003ch3>\u003cspan class=\"dot\" aria-hidden=\"true\">\u003c/span>${esc(i.title)}\u003c/h3>\n      ${i.notes?`\u003cp>${esc(i.notes.length>160?i.notes.slice(0,160)+\"...\":i.notes)}\u003c/p>`:\"\"}\n      ${tags}\n      \u003cdiv class=\"cardbar\">\n        \u003cbutton class=\"ibtn ${i.star?\"star-on\":\"\"}\" data-act=\"star\" aria-label=\"${i.star?\"Remove favourite\":\"Mark favourite\"}\">${i.star?\"★\":\"☆\"}\u003c/button>\n        \u003cbutton class=\"ibtn\" data-act=\"left\" aria-label=\"Move back\" ${si\u003c=0?\"disabled\":\"\"}>‹\u003c/button>\n        \u003cbutton class=\"ibtn\" data-act=\"right\" aria-label=\"Move forward\" ${si>=STAGES.length-1?\"disabled\":\"\"}>›\u003c/button>\n      \u003c/div>\n    \u003c/article>`;\n  }\n  function render(){\n    renderChips(); renderTabs(); renderCatPick();\n    const sorted=[...ideas].sort((a,b)=>(b.star?1:0)-(a.star?1:0)||b.updated-a.updated);\n    $(\"#board\").innerHTML=STAGES.map(s=>{\n      const list=sorted.filter(i=>i.stage===s.id&&visible(i));\n      const emptyMsg=!ideas.length&&s.id===\"spark\"?\"Add your first idea below.\":(query||filterCat?\"Nothing matches.\":\"Empty\");\n      return `\u003csection class=\"col ${activeStage===s.id?\"active\":\"\"}\" data-stage=\"${s.id}\" aria-label=\"${s.name}\">\n        \u003ch2>${s.name}\u003cspan>${list.length}\u003c/span>\u003c/h2>\n        \u003cdiv class=\"cards\">${list.length?list.map(cardHTML).join(\"\"):`\u003cdiv class=\"empty\">${emptyMsg}\u003c/div>`}\u003c/div>\n      \u003c/section>`;\n    }).join(\"\");\n  }\n\n  // actions\n  function update(id,patch){\n    const i=ideas.find(x=>x.id===id); if(!i) return;\n    Object.assign(i,patch,{updated:Date.now()}); persist(); render();\n  }\n  function move(id,dir){\n    const i=ideas.find(x=>x.id===id); if(!i) return;\n    const si=STAGES.findIndex(s=>s.id===i.stage)+dir;\n    if(si\u003c0||si>=STAGES.length) return;\n    update(id,{stage:STAGES[si].id}); toast(\"Moved to \"+STAGES[si].name);\n  }\n\n  $(\"#capture\").addEventListener(\"submit\",e=>{\n    e.preventDefault();\n    const t=$(\"#qTitle\").value.trim(); if(!t) return;\n    const now=Date.now();\n    ideas.push({id:uid(),title:t,notes:\"\",cat:newCat,stage:\"spark\",tags:[],star:false,created:now,updated:now});\n    $(\"#qTitle\").value=\"\"; activeStage=\"spark\"; persist(); render(); toast(\"Added to Sparks\");\n  });\n\n  // category picker for new ideas\n  const catDlg=$(\"#catDlg\");\n  $(\"#catpick\").addEventListener(\"click\",()=>{\n    $(\"#catlist\").innerHTML=CATS.map(c=>`\u003cbutton data-cat=\"${c.id}\" aria-pressed=\"${newCat===c.id}\">\u003cspan class=\"dot\" style=\"background:${cc(c.id)}\">\u003c/span>${c.name}\u003c/button>`).join(\"\");\n    catDlg.showModal();\n  });\n  $(\"#catlist\").addEventListener(\"click\",e=>{const b=e.target.closest(\"[data-cat]\");if(!b)return;newCat=b.dataset.cat;renderCatPick();catDlg.close();$(\"#qTitle\").focus()});\n  catDlg.addEventListener(\"click\",e=>{if(e.target===catDlg)catDlg.close()});\n\n  $(\"#search\").addEventListener(\"input\",e=>{query=e.target.value.trim().toLowerCase();render()});\n  $(\"#chips\").addEventListener(\"click\",e=>{const b=e.target.closest(\".chip\");if(!b)return;filterCat=b.dataset.cat||null;render()});\n  $(\"#tabs\").addEventListener(\"click\",e=>{const b=e.target.closest(\".tab\");if(!b)return;activeStage=b.dataset.stage;render()});\n\n  $(\"#board\").addEventListener(\"click\",e=>{\n    const card=e.target.closest(\".card\"); if(!card) return;\n    const id=card.dataset.id; const btn=e.target.closest(\"[data-act]\");\n    if(!btn){openEdit(id);return}\n    const a=btn.dataset.act;\n    if(a===\"left\") move(id,-1);\n    else if(a===\"right\") move(id,1);\n    else if(a===\"star\"){const i=ideas.find(x=>x.id===id);update(id,{star:!i.star})}\n  });\n\n  // swipe between stages on phone\n  let sx=0, sy=0, st=0;\n  $(\"#board\").addEventListener(\"touchstart\",e=>{const t=e.touches[0];sx=t.clientX;sy=t.clientY;st=Date.now()},{passive:true});\n  $(\"#board\").addEventListener(\"touchend\",e=>{\n    if(window.innerWidth>=900) return;\n    const t=e.changedTouches[0]; const dx=t.clientX-sx, dy=t.clientY-sy;\n    if(Math.abs(dx)\u003c60||Math.abs(dx)\u003cMath.abs(dy)*1.5||Date.now()-st>600) return;\n    const si=STAGES.findIndex(s=>s.id===activeStage)+(dx\u003c0?1:-1);\n    if(si>=0&&si\u003cSTAGES.length){activeStage=STAGES[si].id;render()}\n  },{passive:true});\n\n  // drag and drop (wide screens)\n  let dragId=null;\n  $(\"#board\").addEventListener(\"dragstart\",e=>{const c=e.target.closest(\".card\");if(!c)return;dragId=c.dataset.id;c.classList.add(\"dragging\");try{e.dataTransfer.setData(\"text/plain\",dragId)}catch(_){}});\n  $(\"#board\").addEventListener(\"dragend\",e=>{const c=e.target.closest(\".card\");if(c)c.classList.remove(\"dragging\");document.querySelectorAll(\".col.over\").forEach(x=>x.classList.remove(\"over\"))});\n  $(\"#board\").addEventListener(\"dragover\",e=>{const col=e.target.closest(\".col\");if(!col||!dragId)return;e.preventDefault();document.querySelectorAll(\".col.over\").forEach(x=>{if(x!==col)x.classList.remove(\"over\")});col.classList.add(\"over\")});\n  $(\"#board\").addEventListener(\"drop\",e=>{const col=e.target.closest(\".col\");if(!col||!dragId)return;e.preventDefault();update(dragId,{stage:col.dataset.stage});dragId=null});\n\n  // edit sheet\n  const dlg=$(\"#dlg\");\n  function openEdit(id){\n    const i=ideas.find(x=>x.id===id); if(!i) return;\n    editingId=id;\n    $(\"#eTitle\").value=i.title; $(\"#eNotes\").value=i.notes||\"\"; $(\"#eCat\").value=i.cat;\n    $(\"#eStage\").value=i.stage; $(\"#eTags\").value=(i.tags||[]).join(\", \"); $(\"#eStar\").checked=!!i.star;\n    dlg.showModal();\n  }\n  $(\"#editForm\").addEventListener(\"submit\",e=>{\n    e.preventDefault(); if(!editingId) return;\n    const title=$(\"#eTitle\").value.trim(); if(!title){$(\"#eTitle\").focus();return}\n    const stage=$(\"#eStage\").value;\n    update(editingId,{title,notes:$(\"#eNotes\").value.trim(),cat:$(\"#eCat\").value,stage,\n      tags:$(\"#eTags\").value.split(\",\").map(t=>t.trim().replace(/^#/,\"\")).filter(Boolean).slice(0,12),star:$(\"#eStar\").checked});\n    dlg.close(); editingId=null;\n  });\n  $(\"#cancelBtn\").addEventListener(\"click\",()=>{dlg.close();editingId=null});\n  dlg.addEventListener(\"click\",e=>{if(e.target===dlg){dlg.close();editingId=null}});\n  $(\"#delBtn\").addEventListener(\"click\",()=>{\n    if(!editingId) return;\n    const i=ideas.find(x=>x.id===editingId);\n    if(!confirm(`Delete \"${i.title}\"?`)) return;\n    ideas=ideas.filter(x=>x.id!==editingId); persist(); render(); dlg.close(); editingId=null; toast(\"Deleted\");\n  });\n\n  // surprise me\n  $(\"#spark\").addEventListener(\"click\",()=>{\n    const pool=ideas.filter(i=>i.stage===\"spark\");\n    if(!pool.length){toast(\"No sparks yet\");return}\n    filterCat=null;query=\"\";$(\"#search\").value=\"\";activeStage=\"spark\";render();\n    const pick=pool[Math.floor(Math.
