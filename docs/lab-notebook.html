ding:0 16px}\n.field{display:flex;flex-direction:column;gap:6px;font-size:.85rem;color:var(--muted);margin-bottom:12px}\n.field input,.field select,.field textarea{background:var(--surface);border:0;border-radius:12px;padding:12px;color:var(--ink);min-height:48px;width:100%}\n.field textarea{min-height:110px;resize:vertical}\n.item{background:var(--surface);border-radius:14px;padding:12px 8px 6px 14px}\n.item .t{font-weight:500;overflow-wrap:anywhere}\n.item .t code,.code-inline{font-family:var(--mono);font-size:.88em}\n.item .d{font-size:.85rem;color:var(--muted);margin-top:3px;white-space:pre-wrap;overflow-wrap:anywhere}\n.item .m{display:flex;flex-wrap:wrap;gap:4px 10px;font-size:.78rem;color:var(--muted);margin-top:4px}\n.item .acts .ibtn{min-width:38px;min-height:38px}\n.num{display:inline-grid;place-items:center;width:24px;height:24px;border-radius:50%;background:var(--faint);font-size:.78rem;margin-right:8px;flex:0 0 auto}\n.stepline{display:flex;align-items:flex-start}\n.chk{display:flex;align-items:flex-start;gap:10px}\n.chk input{width:22px;height:22px;margin-top:1px;accent-color:var(--accent);flex:0 0 auto}\n.chk.done .t{text-decoration:line-through;color:var(--muted)}\n.addrow{margin-top:10px}\n.addrow .btn{width:100%;background:var(--surface);color:var(--accent)}\n.sectionhelp{font-size:.85rem;color:var(--muted);margin:0 2px 10px}\npre.code{font-family:var(--mono);font-size:.78rem;line-height:1.5;background:var(--surface);border-radius:14px;padding:14px;overflow-x:auto;white-space:pre;margin:10px 0 0;color:var(--ink)}\n.warns{display:flex;flex-direction:column;gap:6px;margin-bottom:10px}\n.warns div{background:color-mix(in srgb,var(--gold) 12%,var(--surface));color:var(--gold);border-radius:10px;padding:8px 12px;font-size:.85rem}\n.warns .ok{background:color-mix(in srgb,var(--green) 12%,var(--surface));color:var(--green)}\n.codebar{display:flex;gap:8px;flex-wrap:wrap}\n.codebar .btn{flex:1;background:var(--surface)}\n.codebar .btn.primary{background:var(--accent)}\n/* ---- Theme: dark with pink-to-blue accents ---- */\n:root{\n  --bg:var(--t-bg,#000000);--surface:var(--t-surface,#131316);--raised:var(--t-raised,#1D1D22);--ink:var(--t-ink,#F2F2F4);--muted:var(--t-muted,#9D9DA5);--faint:var(--t-faint,#28282E);\n  --accent:var(--t-accent,#EBA8E4);--accent2:var(--t-accent2,#A7CBF4);\n  --grad:linear-gradient(90deg,var(--t-grad1,#F0A8DC) 0%,var(--t-grad2,#C9B6EF) 50%,var(--t-grad3,#A6CCF5) 100%);\n  --danger:var(--t-danger,#EF5A50);--star:var(--t-accent,#EBA8E4);--pinbg:var(--t-pinbg,#2A2413);\n  --font:Roboto,\"Google Sans\",system-ui,-apple-system,\"Segoe UI\",sans-serif;\n  --mono:\"Roboto Mono\",\"Droid Sans Mono\",ui-monospace,Menlo,Consolas,monospace;\n}\nbody{background-color:var(--t-bg,#000);background-image:linear-gradient(172deg,var(--t-head,#5A4360) 0%,var(--t-head2,#352C3F) 90px,var(--t-head3,#15121A) 210px,var(--t-bg,#000) 320px);background-repeat:no-repeat;background-size:100% 340px}\nh1{font-weight:500;font-size:1.85rem;letter-spacing:0}\nh1 .n{font-size:1rem}\n.search{background:var(--t-field,#0E0E11);border:1.5px solid var(--t-line,#2E2E35);border-radius:999px}\n.search:focus{border-color:var(--t-focus,#9C8BC0);outline:none}\n.chip{background:var(--t-bg,#000);border:1.5px solid var(--t-edge,#3B3B43);color:var(--ink)}\n.chip[aria-pressed=\"true\"]{background:var(--grad);border-color:transparent;color:var(--t-on-grad,#17161C);font-weight:500}\n.chip.add{color:var(--accent)}\n.tab[aria-selected=\"true\"]::after{background:var(--grad)}\n.btn.primary,.add{background:var(--grad)!important;color:var(--t-on-grad,#17161C)!important}\n.fab{background:var(--t-fab,#17171C);border:1px solid var(--t-edge,#3A3A42);color:var(--t-fab-ink,#D9B9EE);box-shadow:0 8px 22px var(--t-shadow,rgba(0,0,0,.7))}\n.star-on{color:var(--star)!important}\n.card:has(.star-on),.paper:has(.star-on),.entry:has(.star-on){background:var(--pinbg)}\n.menu{background:var(--raised);border:1px solid var(--t-line,#2E2E35)}\ndialog{background:var(--raised)}\n.sheet input,.sheet select,.sheet textarea,.dlg input,.dlg textarea,.dlg select{background:var(--t-field,#0F0F12)}\n.toast{background:var(--t-raised2,#26262C);color:var(--ink)}\n.doi{color:var(--accent2)}\n.sync{color:var(--t-dim,#6F6F77)}\n.seg button[aria-pressed=\"true\"]{background:var(--grad);color:var(--t-on-grad,#17161C)}\n.topbar{background:linear-gradient(172deg,var(--t-head,#5A4360) 0%,var(--t-headbar,#2A2432) 100%)}\n.toolbar{background:var(--t-bg,#000)}\n.bk.hidden{display:none!important}\n.bk{display:flex;align-items:center;gap:8px;background:var(--pinbg,var(--t-pinbg,#2A2413));border-radius:14px;padding:10px 8px 10px 14px;margin:0 0 14px}\n.bk .bkt{flex:1;min-width:0;font-size:.9rem;line-height:1.3}\n.bk .bkt b{display:block;font-weight:500}\n.bk .bkt span{color:var(--muted);font-size:.8rem}\n.bk .bkgo{background:var(--grad);color:var(--t-on-grad,#17161C);border-radius:999px;padding:10px 14px;min-height:44px;font-weight:500;white-space:nowrap}\n.bk .bkno{color:var(--muted);padding:10px 8px;min-height:44px}\n\u003c/style>\n\u003c/head>\n\u003cbody>\n\u003cdiv class=\"wrap\">\n  \u003c!-- HOME -->\n  \u003csection id=\"home\">\n    \u003cheader>\n      \u003ch1>Script plans\u003cspan class=\"n\" id=\"total\">\u003c/span>\u003c/h1>\n      \u003cdiv class=\"hbtns\">\n        \u003cbutton class=\"ibtn\" id=\"moreBtn\" aria-label=\"More options\" aria-expanded=\"false\">⋮\u003c/button>\n        \u003cdiv class=\"menu\" id=\"menu\" role=\"menu\">\n          \u003cbutton role=\"menuitem\" id=\"exportBtn\">Export backup\u003c/button>\n          \u003cbutton role=\"menuitem\" id=\"importBtn\">Import backup\u003c/button>\n        \u003c/div>\n        \u003cinput type=\"file\" id=\"importFile\" accept=\"application/json,.json\" hidden>\n      \u003c/div>\n    \u003c/header>\n    \u003clabel class=\"sr\" for=\"search\">Search plans\u003c/label>\n    \u003cinput class=\"search\" id=\"search\" type=\"search\" placeholder=\"Search plans\">\n    \u003cdiv class=\"chips\" id=\"chips\">\u003c/div>\n    \u003cdiv class=\"bar\">\u003cspan id=\"count\">\u003c/span>\u003cspan>\u003c/span>\u003c/div>\n    \u003cmain class=\"list plans\" id=\"plans\">\u003c/main>\n    \u003cp class=\"sync\" id=\"sync\">\u003c/p>\n  \u003c/section>\n\n  \u003c!-- PLAN -->\n  \u003csection id=\"plan\" class=\"hidden\">\n    \u003cheader>\n      \u003cbutton class=\"ibtn back\" id=\"backBtn\" aria-label=\"Back to plans\">‹\u003c/button>\n      \u003cdiv class=\"ptitle\">\u003cb id=\"pName\">\u003c/b>\u003cspan id=\"pSub\">\u003c/span>\u003c/div>\n      \u003cbutton class=\"ibtn\" id=\"dupPlan\" aria-label=\"Duplicate plan\">⎘\u003c/button>\n      \u003cbutton class=\"ibtn\" id=\"delPlan\" aria-label=\"Delete plan\" style=\"color:var(--danger)\">✕\u003c/button>\n    \u003c/header>\n    \u003cdiv class=\"secs\">\u003cdiv class=\"chips\" id=\"secs\">\u003c/div>\u003c/div>\n    \u003cdiv id=\"secBody\">\u003c/div>\n  \u003c/section>\n\u003c/div>\n\u003cbutton class=\"fab\" id=\"fab\" aria-label=\"New plan\">+\u003c/button>\n\n\u003cdialog id=\"dlg\">\n  \u003cform class=\"sheet\" id=\"form\" autocomplete=\"off\" novalidate>\n    \u003ch2 id=\"dTitle\">\u003c/h2>\n    \u003cdiv id=\"dFields\" style=\"display:flex;flex-direction:column;gap:12px\">\u003c/div>\n    \u003cp class=\"hint\" id=\"hint\">\u003c/p>\n    \u003cdiv class=\"sbar\">\n      \u003cbutton type=\"button\" class=\"btn danger\" id=\"delItem\">Delete\u003c/button>\n      \u003cspan style=\"display:flex;gap:6px;margin-left:auto\">\n        \u003cbutton type=\"button\" class=\"btn ghost\" data-close>Cancel\u003c/button>\n        \u003cbutton type=\"submit\" class=\"btn primary\">Save\u003c/button>\n      \u003c/span>\n    \u003c/div>\n  \u003c/form>\n\u003c/dialog>\n\n\u003cdiv class=\"toast\" id=\"toast\" role=\"status\" aria-live=\"polite\">\u003c/div>\n\u003cscript>\nconst $=s=>document.querySelector(s);\nconst uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,7);\nconst esc=s=>String(s??\"\").replace(/[&\u003c>\"']/g,m=>({\"&\":\"&amp;\",\"\u003c\":\"&lt;\",\">\":\"&gt;\",'\"':\"&quot;\",\"'\":\"&#39;\"}[m]));\nconst num=v=>{const n=parseFloat(v);return isFinite(n)?n:null};\nconst stamp=()=>new Date().toISOString().slice(0,10);\nlet _tt=null;\nfunction toast(t){const el=$(\"#toast\");el.textContent=t;el.classList.add(\"show\");clearTimeout(_tt);_tt=setTimeout(()=>el.classList.remove(\"show\"),2400)}\nasync function copyText(t,msg){\n  try{await navigator.clipboard.writeText(t);toast(msg||\"Copied\")}\n  catch(_){const a=document.createElement(\"textarea\");a.value=t;document.body.appendChild(a);a.select();\n    try{document.execCommand(\"copy\");toast(msg||\"Copied\")}catch(__){toast(\"Copy not available\")}a.remove()}\n}\nfunction storageWorks(){try{const k=\"__probe\"+Math.random();localStorage.setItem(k,\"1\");localStorage.removeItem(k);return true}catch(_){return false}}\nfunction saveFile(filename,data){\n  try{\n    const ext=(filename.split(\".\").pop()||\"\").toLowerCase();\n    const type={json:\"application/json\",csv:\"text/csv\",md:\"text/markdown\",py:\"text/x-python\",sh:\"text/x-shellscript\",png:\"image/png\"}[ext]||\"text/plain\";\n    const blob=data instanceof Blob?data:new Blob([data],{type:type+\";charset=utf-8\"});\n    const url=URL.createObjectURL(blob);\n    const a=document.createElement(\"a\");a.href=url;a.download=filename;a.style.display=\"none\";\n    document.body.appendChild(a);a.click();a.remove();\n    setTimeout(()=>URL.revokeObjectURL(url),10000);\n    toast(\"Saved to Downloads\");if(/\\.json$/i.test(filename)&&window.__markBackup)window.__markBackup();\n  }catch(_){toast(\"Couldn't save the file\")}\n}\nfunction setupMenu(){\n  const menu=$(\"#menu\"),btn=$(\"#moreBtn\");\n  const close=()=>{menu.classList.remove(\"open\");btn.setAttribute(\"aria-expanded\",\"false\")};\n  btn.addEventListener(\"click\",e=>{e.stopPropagation();btn.setAttribute(\"aria-expanded\",menu.classList.toggle(\"open\"))});\n  document.addEventListener(\"click\",e=>{if(!e.target.closest(\"#menu\"))close()});\n  menu.addEventListener(\"click\",close);\n  document.querySelectorAll(\"[data-close]\").forEach(b=>b.addEventListener(\"click\",()=>b.closest(\"dialog\").close()));\n  document.querySelectorAll(\"dialog\").forEach(d=>d.addEventListener(\"click\",e=>{if(e.target===d)d.close()}));\n}\n// Store: kept in this browser's local storage only.\nfunction makeStore(lsKey,docName,listKeys,onChange){\n  const S={data:null};\n  try{const r=localStorage.getItem(lsKey);S.data=r?JSON.parse(r):null}catch(_){}\n  if(!S.data||typeof S.data!==\"object\") S.data={};\n  listKeys.forEach(k=>{if(!Array.isArray(S.data[k]))S.data[k]=[]});\n  S.saveLocal=()=>{try{localStorage.setItem(lsKey,JSON.stringify(S.data))}catch(_){toast(\"Couldn't save. Storage is full or blocked; export a backup.\")}};\n  S.persist=()=>S.saveLocal();\n  S.connect=()=>{\n    $(\"#sync\").textContent=storageWorks()?(localStorage.getItem(\"sync.github\")?\"Saved on this device and synced to your other devices.\":\"Saved on this device. Turn on sync in the control center, or export a backup now and then.\"):\"Storage is blocked here, so changes will be lost when you close this page.\";\n  };\n  return S;\n}\n\n(function(){\n  const STATUS=[{id:\"planning\",name:\"Planning\"},{id:\"building\",name:\"Building\"},{id:\"done\",name:\"Done\"}];\n  const SECS=[\n    {id:\"overview\",name:\"Overview\"},{id:\"io\",name:\"Inputs & outputs\"},{id:\"opts\",name:\"Options\"},\n    {id:\"fns\",name:\"Functions\"},{id:\"flow\",name:\"Flow\"},{id:\"checks\",name:\"Checks & to-dos\"},{id:\"code\",name:\"Skeleton\"}\n  ];\n  const OPT_TYPES=[[\"str\",\"Text\"],[\"int\",\"Integer\"],[\"float\",\"Number\"],[\"path\",\"File path\"],[\"flag\",\"On/off flag\"],[\"choice\",\"One of a list\"],[\"list\",\"Several values\"]];\n  // item schemas\n  const SCHEMA={\n    io:{title:\"input or output\",fields:[\n      {k:\"dir\",label:\"Direction\",type:\"select\",opts:[[\"in\",\"Input\"],[\"out\",\"Output\"]]},\n      {k:\"name\",label:\"Name\",ph:\"Trajectory\",req:true},\n      {k:\"format\",label:\"Format\",ph:\"xtc, csv, pdb...\"},\n      {k:\"desc\",label:\"Description\",type:\"textarea\",ph:\"What it contains, where it comes from or goes\"}]},\n    opts:{title:\"option\",fields:[\n      {k:\"long\",label:\"Long name\",ph:\"input\",req:true,mono:true},\n      {k:\"short\",label:\"Short letter\",ph:\"i\",mono:true,max:1},\n      {k:\"type\",label:\"Type\",type:\"select\",opts:OPT_TYPES},\n      {k:\"choices\",label:\"Allowed values (comma separated, for 'One of a list')\",ph:\"fast, accurate\",mono:true},\n      {k:\"def\",label:\"Default\",ph:\"10\",mono:true},\n      {k:\"req\",label:\"Required\",type:\"check\"},\n      {k:\"help\",label:\"Help text\",ph:\"Input trajectory file\",req:true}]},\n    fns:{title:\"function\",fields:[\n      {k:\"name\",label:\"Name\",ph:\"load_trajectory\",req:true,mono:true},\n      {k:\"params\",label:\"Parameters\",ph:\"path, stride=1\",mono:true},\n      {k:\"returns\",label:\"Returns\",ph:\"numpy array of frames\"},\n      {k:\"desc\",label:\"What it does\",type:\"textarea\"}]},\n    flow:{title:\"step\",fields:[\n      {k:\"text\",label:\"Step\",ph:\"Read the trajectory and skip frames\",req:true,type:\"textarea\"},\n      {k:\"fn\",label:\"Uses function\",type:\"fnselect\"}]},\n    checks:{title:\"check or to-do\",fields:[\n      {k:\"kind\",label:\"Kind\",type:\"select\",opts:[[\"check\",\"Edge case / validation\"],[\"todo\",\"To-do\"]]},\n      {k:\"text\",label:\"Description\",ph:\"Input file exists and is not empty\",req:true,type:\"textarea\"}]}\n  };\n\n  let view=\"home\",planId=null,sec=\"overview\",query=\"\",statusF=\"\",editing=null,editingKind=null;\n  const store=makeStore(\"scriptplans.v1\",\"plans\",[\"plans\"],()=>render());\n  const D=()=>store.data;\n  const P=()=>D().plans.find(p=>p.id===planId);\n  const touch=p=>{p.updated=Date.now();store.persist()};\n  const newPlan=()=>({id:uid(),name:\"Untitled script\",lang:\"py\",status:\"planning\",purpose:\"\",desc:\"\",deps:\"\",io:[],opts:[],fns:[],flow:[],checks:[],added:Date.now(),updated:Date.now()});\n\n  // ---------- HOME ----------\n  function renderHome(){\n    const L=D().plans;\n    $(\"#total\").textContent=L.length||\"\";\n    $(\"#chips\").innerHTML=[`\u003cbutton class=\"chip\" data-f=\"\" aria-pressed=\"${!statusF}\">All\u003cspan class=\"c\">${L.length}\u003c/span>\u003c/button>`]\n      .concat(STATUS.map(s=>`\u003cbutton class=\"chip\" data-f=\"${s.id}\" aria-pressed=\"${statusF===s.id}\">${s.name}\u003cspan class=\"c\">${L.filter(p=>p.status===s.id).length}\u003c/span>\u003c/button>`)).join(\"\");\n    const vis=L.filter(p=>(!statusF||p.status===statusF)&&(!query||[p.name,p.purpose,p.desc,p.deps].join(\" \").toLowerCase().includes(query))).sort((a,b)=>b.updated-a.updated);\n    $(\"#count\").textContent=`${vis.length} plan${vis.length===1?\"\":\"s\"}`;\n    $(\"#plans\").innerHTML=vis.length?vis.map(p=>{\n      const done=p.checks.filter(c=>c.done).length;\n      return `\u003carticle class=\"card\" data-id=\"${p.id}\">\n        \u003cdiv class=\"top\">\u003ch3>${esc(p.name)}\u003c/h3>\u003cspan class=\"lang ${p.lang}\">${p.lang===\"py\"?\"Python\":\"Bash\"}\u003c/span>\u003c/div>\n        ${p.purpose?`\u003cdiv class=\"note\" style=\"margin-top:4px\">${esc(p.purpose)}\u003c/div>`:\"\"}\n        \u003cdiv class=\"tags\" style=\"margin:8px 0 6px\">\u003cspan>${STATUS.find(s=>s.id===p.status).name}\u003c/span>\u003cspan>${p.opts.length} options\u003c/span>\u003cspan>${p.fns.length} functions\u003c/span>\u003cspan>${p.flow.length} steps\u003c/span>${p.checks.length?`\u003cspan>${done}/${p.checks.length} checked\u003c/span>`:\"\"}\u003c/div>\n      \u003c/article>`}).join(\"\")\n      :`\u003cdiv class=\"empty\">${L.length?\"No plans match.\":\"Tap + to plan your first script. Sketch the options, functions and flow, then generate a skeleton.\"}\u003c/div>`;\n  }\n  $(\"#plans\").addEventListener(\"click\",e=>{const c=e.target.closest(\".card\");if(c)openPlan(c.dataset.id)});\n  $(\"#chips\").addEventListener(\"click\",e=>{const b=e.target.closest(\"[data-f]\");if(!b)return;statusF=b.dataset.f;renderHome()});\n  $(\"#search\").addEventListener(\"input\",e=>{query=e.target.value.trim().toLowerCase();renderHome()});\n  $(\"#fab\").addEventListener(\"click\",()=>{\n    if(view===\"home\"){const p=newPlan();D().plans.push(p);store.persist();openPlan(p.id);setTimeout(()=>{const n=$(\"#oName\");if(n){n.focus();n.select()}},50);return}\n    const s=SCHEMA[sec]; if(s) openItem(sec,null);\n  });\n\n  // ---------- PLAN ----------\n  function openPlan(id){planId=id;view=\"plan\";sec=\"overview\";render();window.scrollTo(0,0)}\n  $(\"#backBtn\").addEventListener(\"click\",()=>{view=\"home\";planId=null;render();window.scrollTo(0,0)});\n  $(\"#delPlan\").addEventListener(\"click\",()=>{\n    const p=P(); if(!p||!confirm(`Delete the plan \"${p.name}\"?`)) return;\n    D().plans=D().plans.filter(x=>x.id!==p.id); store.persist(); view=\"home\"; render(); toast(\"Plan deleted\");\n  });\n  $(\"#dupPlan\").addEventListener(\"click\",()=>{\n    const p=P(); if(!p) return;\n    const c=JSON.parse(JSON.stringify(p)); c.id=uid(); c.name=p.name+\" (copy)\"; c.added=c.updated=Date.now(); c.status=\"planning\";\n    [\"io\",\"opts\",\"fns\",\"flow\",\"checks\"].forEach(k=>c[k].forEach(i=>{const old=i.id;i.id=uid();if(k===\"fns\")c.flow.forEach(s=>{if(s.fn===old)s._nf=i.id})}));\n    c.flow.forEach(s=>{if(s._nf){s.fn=s._nf;delete s._nf}});\n    c.checks.forEach(x=>x.done=false);\n    D().plans.push(c); store.persist(); openPlan(c.id); toast(\"Plan duplicated\");\n  });\n  $(\"#secs\").addEventListener(\"click\",e=>{const b=e.target.closest(\"[data-s]\");if(!b)return;sec=b.dataset.s;renderPlan();b.scrollIntoView({inline:\"center\",block:\"nearest\",behavior:\"smooth\"})});\n\n  function renderPlan(){\n    const p=P(); if(!p){view=\"home\";render();return}\n    $(\"#pName\").textContent=p.name;\n    $(\"#pSub\").textContent=`${p.lang===\"py\"?\"Python\":\"Bash\"}, ${STATUS.find(s=>s.id===p.status).name.toLowerCase()}`;\n    const cnt={io:p.io.length,opts:p.opts.length,fns:p.fns.length,flow:p.flow.length,checks:p.checks.length};\n    $(\"#secs\").innerHTML=SECS.map(s=>`\u003cbutton class=\"chip\" data-s=\"${s.id}\" aria-pressed=\"${sec===s.id}\">${s.name}${cnt[s.id]?`\u003cspan class=\"c\">${cnt[s.id]}\u003c/span>`:\"\"}\u003c/button>`).join(\"\");\n    $(\"#fab\").classList.toggle(\"hidden\",!SCHEMA[sec]);\n    $(\"#fab\").setAttribute(\"aria-label\",SCHEMA[sec]?\"Add \"+SCHEMA[sec].title:\"\");\n    const B=$(\"#secBody\");\n    if(sec===\"overview\") B.innerHTML=overviewHTML(p);\n    else if(sec===\"code\") B.innerHTML=codeHTML(p);\n    else B.innerHTML=listHTML(p,sec);\n  }\n\n  function overviewHTML(p){\n    return `\u003clabel class=\"field\">Script name\u003cinput id=\"oName\" value=\"${esc(p.name)}\" maxlength=\"80\" class=\"mono\" autocapitalize=\"off\" spellcheck=\"false\">\u003c/label>\n      \u003cdiv class=\"row\">\n        \u003clabel class=\"field\">Language\u003cselect id=\"oLang\">\u003coption value=\"py\" ${p.lang===\"py\"?\"selected\":\"\"}>Python\u003c/option>\u003coption value=\"sh\" ${p.lang===\"sh\"?\"selected\":\"\"}>Bash\u003c/option>\u003c/select>\u003c/label>\n        \u003clabel class=\"field\">Status\u003cselect id=\"oStatus\">${STATUS.map(s=>`\u003coption value=\"${s.id}\" ${p.status===s.id?\"selected\":\"\"}>${s.name}\u003c/option>`).join(\"\")}\u003c/select>\u003c/label>\n      \u003c/div>\n      \u003clabel class=\"field\">Purpose, in one line\u003cinput id=\"oPurpose\" value=\"${esc(p.purpose)}\" maxlength=\"200\" placeholder=\"Compute per-residue contacts between enzyme and surface\">\u003c/label>\n      \u003clabel class=\"field\">Details\u003ctextarea id=\"oDesc\" maxlength=\"4000\" placeholder=\"Context, assumptions, where it fits in the pipeline\">${esc(p.desc)}\u003c/texta .short&&!/^[A-Za-z0-9]$/.test(d.short)){$(\"#hint\").textContent=\"Short name must be a single letter or digit.\";return}\n      if(d.short===\"h\"||d.long===\"help\"){$(\"#hint\").textContent=\"-h and --help are added automatically.\";return}\n      const clash=p.opts.find(o=>o.id!==editing&&(o.long===d.long||(d.short&&o.short===d.short)));\n      if(clash){$(\"#hint\").textContent=`Clashes with --${clash.long}.`;return}\n      if(d.type===\"choice\"&&!d.choices){$(\"#hint\").textContent=\"List the allowed values.\";return}\n    }\n    if(editingKind===\"fns\"){\n      d.name=d.name.replace(/\\(.*$/,\"\").trim();\n      if(!/^[A-Za-z_]\\w*$/.test(d.name)){$(\"#hint\").textContent=\"Use a valid function name: letters, digits and underscores.\";return}\n    }\n    const L=p[editingKind];\n    if(editing) Object.assign(L.find(x=>x.id===editing),d); else L.push({id:uid(),done:false,...d});\n    touch(p); dlg.close(); renderPlan();\n  });\n  $(\"#delItem\").addEventListener(\"click\",()=>{\n    const p=P(); if(!confirm(\"Delete this \"+SCHEMA[editingKind].title+\"?\")) return;\n    p[editingKind]=p[editingKind].filter(x=>x.id!==editing);\n    if(editingKind===\"fns\") p.flow.forEach(s=>{if(s.fn===editing)s.fn=\"\"});\n    touch(p); dlg.close(); renderPlan();\n  });\n\n  // ---------- code generation ----------\n  const pyIdent=s=>s.replace(/-/g,\"_\");\n  const shVar=s=>s.replace(/-/g,\"_\").toUpperCase();\n  const pyStr=s=>JSON.stringify(String(s));\n  const isNum=v=>/^-?\\d+(\\.\\d+)?([eE]-?\\d+)?$/.test(v);\n  function fileName(p){\n    let n=p.name.trim().replace(/\\s+/g,\"_\").replace(/[^\\w.-]/g,\"\");\n    if(!n) n=\"script\";\n    const ext=p.lang===\"py\"?\".py\":\".sh\";\n    return n.toLowerCase().endsWith(ext)?n:n.replace(/\\.(py|sh)$/i,\"\")+ext;\n  }\n  function wrap(text,width,prefix){\n    const out=[];\n    for(const para of String(text).split(/\\n/)){\n      let line=\"\";\n      for(const w of para.split(/\\s+/).filter(Boolean)){\n        if((line+\" \"+w).trim().length>width){out.push(prefix+line.trim());line=w}else line+=\" \"+w;\n      }\n      out.push(prefix+line.trim());\n    }\n    return out.map(l=>l.replace(/\\s+$/,\"\"));\n  }\n  function lint(p){\n    const w=[];\n    if(!p.purpose) w.push(\"Add a one-line purpose in Overview.\");\n    if(!p.flow.length) w.push(\"The flow is empty, so main() will have nothing to do.\");\n    p.fns.filter(f=>!p.flow.some(s=>s.fn===f.id)).forEach(f=>w.push(`${f.name}() isn't used in any flow step.`));\n    p.flow.forEach((s,i)=>{if(!s.fn)w.push(`Step ${i+1} has no function yet.`)});\n    const ins=p.io.filter(x=>x.dir===\"in\"), outs=p.io.filter(x=>x.dir===\"out\");\n    if(ins.length&&!p.opts.some(o=>o.type===\"path\"||/in|file|traj|top/i.test(o.long))) w.push(\"You have inputs but no option to pass a file path.\");\n    if(outs.length&&!p.opts.some(o=>/out|prefix|dir/i.test(o.long))) w.push(\"You have outputs but no option for where to write them.\");\n    p.opts.filter(o=>o.req&&o.def).forEach(o=>w.push(`--${o.long} is required, so its default will be ignored.`));\n    p.opts.filter(o=>o.type===\"int\"&&o.def&&!/^-?\\d+$/.test(o.def)).forEach(o=>w.push(`--${o.long} default \"${o.def}\" isn't an integer.`));\n    p.opts.filter(o=>o.type===\"float\"&&o.def&&!isNum(o.def)).forEach(o=>w.push(`--${o.long} default \"${o.def}\" isn't a number.`));\n    p.opts.filter(o=>o.type===\"choice\"&&o.def&&!o.choices.split(\",\").map(s=>s.trim()).includes(o.def)).forEach(o=>w.push(`--${o.long} default isn't one of its allowed values.`));\n    const openChecks=p.checks.filter(c=>!c.done).length;\n    if(openChecks) w.push(`${openChecks} check${openChecks===1?\"\":\"s\"} or to-do${openChecks===1?\"\":\"s\"} still open.`);\n    return w;\n  }\n  function genPy(p){\n    const L=[];\n    const doc=[p.name];\n    if(p.purpose) doc.push(\"\",...wrap(p.purpose,76,\"\"));\n    if(p.desc) doc.push(\"\",...wrap(p.desc,76,\"\"));\n    const ins=p.io.filter(x=>x.dir===\"in\"), outs=p.io.filter(x= if(e&&e.name===\"AbortError\") throw {code:\"timeout\",message:\"The request timed out\"};\n    if(e&&e.code) throw e;\n    throw {code:\"offline\",message:\"No connection, or the service refused the request\"};\n  }finally{clearTimeout(t)}\n}\nconst netErr=e=>e&&e.code===\"offline\"?\"No connection. Check you are online and try again.\":e&&e.code===\"timeout\"?\"The service did not answer in time.\":e&&e.code===404?\"Not found.\":\"Request failed (\"+((e&&e.message)||\"unknown\")+\").\";\n\n(function(){\n  const KINDS=[{id:\"grant\",name:\"Grant call\",c:\"--accent\"},{id:\"abstract\",name:\"Abstract\",c:\"--green\"},\n    {id:\"fellowship\",name:\"Fellowship\",c:\"--gold\"},{id:\"report\",name:\"Report\",c:\"--accent2\"},\n    {id:\"teaching\",name:\"Teaching\",c:\"--violet\"},{id:\"other\",name:\"Other\",c:\"--muted\"}];\n  const store=makeStore(\"deadlines.v1\",\"deadlines\",[\"items\"],render);\n  const D=()=>store.data;\n  let filter=\"\",query=\"\",editing=null,fKind=\"grant\",showDone=false;\n  const kc=k=>`var(${(KINDS.find(x=>x.id===k)||KINDS[5]).c})`;\n  const kn=k=>(KINDS.find(x=>x.id===k)||KINDS[5]).name;\n  const when=i=>new Date(i.date+\"T\"+(i.time||\"23:59\")).getTime();\n  const localToday=()=>{const d=new Date();d.setMinutes(d.getMinutes()-d.getTimezoneOffset());return d.toISOString().slice(0,10)};\n  function countdown(i){\n    const ms=when(i)-Date.now();\n    if(ms\u003c0) return {t:\"passed\",cls:\"over\"};\n    const d=Math.floor(ms/864e5), h=Math.floor(ms%864e5/36e5);\n    return {t:d>0?`${d} day${d===1?\"\":\"s\"}`:`${h} h`,cls:d\u003c=7?\"soon\":d\u003c=30?\"\":\"ok\"};\n  }\n  const fmtDate=i=>new Date(i.date+\"T12:00\").toLocaleDateString(\"en-GB\",{weekday:\"short\",day:\"numeric\",month:\"short\",year:\"numeric\"})+(i.time?`, ${i.time}`:\"\");\n\n  function render(){\n    const L=D().items;\n    $(\"#total\").textContent=L.filter(i=>!i.done).length||\"\";\n    $(\"#chips\").innerHTML=[`\u003cbutton class=\"chip\" data-f=\"\" aria-press k\",e=>{const b=e.target.closest(\"[data-k]\");if(!b)return;fKind=b.dataset.k;renderKinds()});\n  function openSheet(id){\n    editing=id||null; $(\"#hint\").textContent=\"\";\n    const i=id?D().items.find(x=>x.id===id):null;\n    $(\"#dTitle\").textContent=i?\"Edit deadline\":\"New deadline\";\n    fKind=i?i.kind:(filter||\"grant\"); renderKinds();\n    $(\"#fTitle\").value=i?.title||\"\"; $(\"#fDate\").value=i?.date||localToday(); $(\"#fTime\").value=i?.time||\"\";\n    $(\"#fYearly\").checked=!!i?.yearly; $(\"#fUrl\").value=i?.url||\"\"; $(\"#fNotes\").value=i?.notes||\"\";\n    $(\"#delBtn\").style.display=i?\"\":\"none\";\n    dlg.showModal(); if(!i) $(\"#fTitle\").focus();\n  }\n  $(\"#fab\").addEventListener(\"click\",()=>openSheet());\n  $(\"#form\").addEventListener(\"submit\",e=>{\n    e.preventDefault();\n    const title=$(\"#fTitle\").value.trim(); if(!title){$(\"#hint\").textContent=\"What is the deadline for?\";return}\n    if(!$(\"#fDate\").value){$(\"#hint\").textContent=\"Pick a date.\";return}\n    const data={title,kind:fKind,date:$(\"#fDate\").value,time:$(\"#fTime\").value,yearly:$(\"#fYearly\").checked,\n      url:$(\"#fUrl\").value.trim(),notes:$(\"#fNotes\").value.trim(),updated:Date.now()};\n    const i=editing?D().items.find(x=>x.id===editing):null;\n    if(i) Object.assign(i,data); else D().items.push({id:uid(),done:false,added:Date.now(),...data});\n    store.persist(); render(); dlg.close(); toast(i?\"Saved\":\"Deadline added\");\n  });\n  $(\"#delBtn\").addEventListener(\"click\",()=>{\n    if(!confirm(\"Delete this deadline?\")) return;\n    D().items=D().items.filter(x=>x.id!==editing); store.persist(); render(); dlg.close(); toast(\"Deleted\");\n  });\n\n  $(\"#icsBtn\").addEventListener(\"click\",()=>{\n    const open=D().items.filter(i=>!i.done);\n    if(!open.length){toast(\"Nothing to export\");return}\n    const pad=n=>String(n).padStart(2,\"0\");\n    const dt=i=>{const d=new Date(i.date+\"T\"+(i.time||\"09:00\"));return d.getUTCFullYear()+pad(d.getUTCMonth()+1)+pad(d.getUTCDate())+\"T\"+pad(d.getUTCHours())+pad(d.getUTCMinutes())+\"00Z\"};\n    const esc2=s=>String(s||\"\").replace(/([,;\\\\])/g,\"\\\\$1\").replace(/\\n/g,\"\\\\n\");\n    const L=[\"BEGIN:VCALENDAR\",\"VERSION:2.0\",\"PRODID:-//Deadlines//EN\"];\n    open.forEach(i=>{\n      L.push(\"BEGIN:VEVENT\",\"UID:\"+i.id+\"@deadlines\",\"DTSTAMP:\"+dt({date:localToday(),time:\"09:00\"}),\n        \"DTSTART:\"+dt(i),\"DTEND:\"+dt(i),\"SUMMARY:\"+esc2(kn(i.kind)+\": \"+i.title),\n        \"DESCRIPTION:\"+esc2([i.notes,i.url].filter(Boolean).join(\"\\n\")),\n        \"BEGIN:VALARM\",\"TRIGGER:-P7D\",\"ACTION:DISPLAY\",\"DESCRIPTION:\"+esc2(i.title),\"END:VALARM\",\"END:VEVENT\");\n    });\n    L.push(\"END:VCALENDAR\");\n    saveFile(`deadlines-${stamp()}.ics`,L.join(\"\\r\\n\"));\n  });\n  $(\"#exportBtn\").addEventListener(\"click\",()=>saveFile(`deadlines-${stamp()}.json`,JSON.stringify({version:1,exported:new Date().toISOString(),items:D().items},null,2)));\n  $(\"#importBtn\").addEventListener(\"click\",()=>$(\"#importFile\").click());\n  $(\"#importFile\").addEventListener(\"change\",async e=>{\n    const f=e.target.files[0]; if(!f) return;\n    try{const o=JSON.parse(await f.text()); if(!Array.isArray(o.items)) throw 0;\n      const ids=new Set(D().items.map(x=>x.id)); let n=0;\n      for(const x of o.items) if(x&&x.title&&x.date&&!ids.has(x.id)){D().items.push({...x,id:x.id||uid()});n++}\n      store.persist(); render(); toast(`Imported ${n}`);\n    }catch(_){toast(\"Choose a .json backup exported from this app\")}\n    e.target.value=\"\";\n  });\n  setupMenu(); render(); store.connect();\n  setInterval(render,36e5);\n})();\n\u003c/script>\n\u003cscript>window.__BACKUP={id:\"deadline-radar\",key:\"deadlines.v1\"};\u003c/script>\n\u003cscript>\n(function(){\n  const C=window.__BACKUP, LK=C.id+\".lastBackup\", SK=C.id+\".backupSnooze\", WEEK=7*864e5;\n  const get=k=>{try{return +localStorage.getItem(k)||0}catch(_){return 0}};\n  const set=(k,v)=>{try{localStorage.setItem(k,String(v))}catch(_){}};\n  function hasData(){\n    try{const v=JSON.parse(localStorage.getItem(C.key)||\"null\");if(!v)return false;\n      if(Array.isArray(v))return v.length>0;\n      return Object.values(v).some(x=>Array.isArray(x)&&x.length>0)}catch(_){return false}\n  }\n  const bar=document.createElement(\"div\");\n  bar.className=\"bk hidden\"; bar.setAttribute(\"role\",\"status\");\n  bar.innerHTML='\u003cdiv class=\"bkt\">\u003cb>\u003c/b>\u003cspan>Save a copy to Files or Downloads, or turn on sync in the control center.\u003c/span>\u003c/div>\u003cbutton class=\"bkno\" type=\"button\">Later\u003c/button>\u003cbutton class=\"bkgo\" type=\"button\">Back up now\u003c/button>';\n  const wrap=document.querySelector(\".wrap\"), head=wrap&&wrap.querySelector(\":scope > header\");\n  if(head) head.insertAdjacentElement(\"afterend\",bar); else if(wrap) wrap.prepend(bar);\n  function check(){\n    const now=Date.now(), last=get(LK), data=hasData();\n    // never backed up: start the 7-day clock from when data first appears\n    if(!last&&data&&!get(C.id+\".firstData\")) set(C.id+\".firstData\",now);\n    const ref=last||get(C.id+\".firstData\")||now;\n    const due=data&&now-ref>WEEK&&now>get(SK);\n    bar.classList.toggle(\"hidden\",!due);\n    if(due){\n      const days=last?Math.floor((now-last)/864e5):0;\n      bar.querySelector(\"b\").textContent=last?`Last backup ${days} days ago`:\"Not backed up yet\";\n    }\n  }\n  window.__markBackup=()=>{set(LK,Date.now());set(SK,0);check()};\n  bar.querySelector(\".bkgo\").addEventListener(\"click\",()=>{const b=document.getElementById(\"exportBtn\");if(b)b.click()});\n  bar.querySelector(\".bkno\").addEventListener(\"click\",()=>{set(SK,Date.now()+864e5);check()});\n  document.addEventListener(\"visibilitychange\",()=>{if(!document.hidden)check()});\n  window.addEventListener(\"storage\",check);\n  setInterval(check,36e5);\n  // first check after the app has loaded its (function(){
  const stage=document.getElementById("stage"), nav=document.getElementById("nav");
  const KEY="suite."+SUITE.id+".tab", frames={};
  function docFor(app){
    let doc=app.html;
    for(const k in SHARED){ const ph="/*__SHARED_"+k+"__*/"; if(doc.includes(ph)) doc=doc.replace(ph,()=>SHARED[k]); }
    return doc;
  }
  function frame(app){
    if(frames[app.id]) return frames[app.id];
    const f=document.createElement("iframe");
    f.title=app.label; f.setAttribute("allow","clipboard-read; clipboard-write; web-share");
    f.addEventListener("load",()=>{f.dataset.ready="1"},{once:true});
    f.srcdoc=docFor(app); stage.appendChild(f); frames[app.id]=f;
    return f;
  }
  function show(id){
    const app=APPS.find(a=>a.id===id)||APPS[0];
    frame(app);
    for(const k in frames) frames[k].classList.toggle("on",k===app.id);
    nav.querySelectorAll("button[data-id]").forEach(b=>{
      if(b.dataset.id===app.id) b.setAttribute("aria-current","page"); else b.removeAttribute("aria-current");
    });
    document.title=app.label+" - "+SUITE.title;
    try{localStorage.setItem(KEY,app.id)}catch(_){}
    if(location.hash!=="#"+app.id) history.replaceState(null,"","#"+app.id);
    return app;
  }
  // apps in the same suite can hand data to each other
  window.suiteHas=id=>APPS.some(a=>a.id===id);
  window.suiteReload=id=>{const f=frames[id]; if(!f) return; f.dataset.ready="";
    f.addEventListener("load",()=>{f.dataset.ready="1"},{once:true}); f.srcdoc=docFor(APPS.find(a=>a.id===id)); };
  window.suiteShow=id=>show(id);
  window.suiteSend=(id,msg)=>{
    const app=show(id), f=frames[app.id];
    const deliver=()=>{try{f.contentWindow.suiteReceive&&f.contentWindow.suiteReceive(msg)}catch(e){console.warn(e)}};
    if(f.dataset.ready) deliver(); else f.addEventListener("load",deliver,{once:true});
  };
  nav.addEventListener("click",e=>{
    const b=e.target.closest("button"); if(!b) return;
    if(b.dataset.act==="backup"){ window.suiteBackup&&window.suiteBackup.open(); return; }
    if(b.dataset.act==="home"){ location.href="control-center.html"; return; }
    const app=show(b.dataset.id); try{frames[app.id].contentWindow.focus()}catch(_){}
  });
  nav.addEventListener("keydown",e=>{
    const bs=[...nav.querySelectorAll("button[data-id]")], i=bs.indexOf(document.activeElement);
    if(i<0) return;
    const step={ArrowRight:1,ArrowDown:1,ArrowLeft:-1,ArrowUp:-1}[e.key];
    if(!step) return;
    e.preventDefault(); const n=bs[(i+step+bs.length)%bs.length]; n.focus(); show(n.dataset.id);
  });
  window.addEventListener("hashchange",()=>show(location.hash.slice(1)));
  let start=location.hash.slice(1);
  if(!APPS.some(a=>a.id===start)){ try{start=localStorage.getItem(KEY)||""}catch(_){start=""} }
  show(start);
  if("serviceWorker" in navigator&&window.isSecureContext&&location.protocol.startsWith("http")){
    window.addEventListener("load",()=>navigator.serviceWorker.register("suite-sw.js").catch(()=>{}));
  }
})();

  /* ---------- what each app keeps ---------- */
  function owned(app,k){return app.keys.includes(k)||app.prefixes.some(p=>k.startsWith(p))}
  function keysOf(app){const out=[];try{for(let i=0;i<localStorage.length;i++){const k=localStorage.key(i);if(k!=null&&owned(app,k))out.push(k)}}catch(_){}return out.sort()}
  function payload(app){
    const json={}, text={};
    for(const k of keysOf(app)){const v=localStorage.getItem(k);if(v==null)continue;try{json[k]=JSON.parse(v)}catch(_){text[k]=v}}
    if(!Object.keys(json).length&&!Object.keys(text).length) return null;
    return {format:"suite-backup",version:1,suite:SUITE.id,suiteTitle:SUITE.title,app:app.file,label:app.label,saved:new Date().toISOString(),json,text};
  }
  const bytes=app=>keysOf(app).reduce((n,k)=>n+(k.length+(localStorage.getItem(k)||"").length)*2,0);
  const size=b=>b<1024?b+" B":b<1048576?(b/1024).toFixed(b<10240?1:0)+" KB":(b/1048576).toFixed(1)+" MB";
  const ago=t=>{if(!t)return "never";const s=(Date.now()-t)/1000;if(s<60)return "just now";if(s<3600)return Math.floor(s/60)+" min ago";if(s<86400)return Math.floor(s/3600)+" h ago";const d=Math.floor(s/86400);return d===1?"yesterday":d+" days ago"};
  const localDate=()=>{const d=new Date();d.setMinutes(d.getMinutes()-d.getTimezoneOffset());return d.toISOString().slice(0,10)};

  /* ---------- panel ---------- */
  function paint(){
    const sync=S(), st=sync?sync.status():{configured:false};
    btn.dataset.state=!st.configured?"":st.state==="error"?"err":st.state==="ok"||st.state==="idle"?"ok":"";
    if(!dlg.open) return;
    let line, bar="";
    if(!sync) line="Sync is not available on this page.";
    else if(!st.configured){
      line="Off. Turn it on in the control center to keep your Mac and iPhone in step through a private GitHub repository.";
      bar=`<a class="bk-btn primary" href="control-center.html#backup" style="text-decoration:none;display:inline-flex;align-items:center">Set up sync</a>`;
    }else{
      const pend=st.pending?`, ${st.pending} change${st.pending>1?"s":""} waiting`:"";
      line=st.busy?"Syncing...":st.state==="error"?`Last try failed: ${esc(st.error)}`:st.state==="offline"?esc(st.error||"Offline"):
        `${st.last?"Synced "+ago(st.last):"Not synced yet"} with ${esc(st.repo)} as ${esc(st.device)}${pend}${st.auto?"":" (automatic sync off)"}`;
      bar=`<button class="bk-btn primary" id="bkSyncNow" type="button" ${st.busy?"disabled":""}>Sync now</button>`;
    }
    $("bkSyncLine").innerHTML=line; $("bkSyncBar").innerHTML=bar; $("bkSyncBar").hidden=!bar;
    const pend=new Set(sync&&st.configured?sync.pendingKeys():[]);
    $("bkList").innerHTML=BACKUP_APPS.map(a=>{
      const ks=keysOf(a);
      const state=!ks.length?"Nothing stored yet":!st.configured?`${size(bytes(a))}, not synced`
        :ks.some(k=>pend.has(k))?`${size(bytes(a))}, changes waiting to sync`:`${size(bytes(a))}, in sync`;
      return `<div class="bk-row"><b>${esc(a.label)}</b><span>${esc(state)}</span></div>`;
    }).join("");
  }
  function open(){dlg.showModal();paint()}
  $("bkClose").addEventListener("click",()=>dlg.close());
  dlg.addEventListener("click",e=>{if(e.target===dlg)dlg.close()});
  $("bkSyncBar").addEventListener("click",async e=>{
    if(!e.target.closest("#bkSyncNow")) return;
    const st=await S().syncNow();
    toast(st.state==="ok"?(st.pulled||st.pushed?`Synced: ${st.pushed} sent, ${st.pulled} received`:"Already in sync"):st.error||"Sync failed");
    paint();
  });
  $("bkDl").addEventListener("click",()=>{
    const apps=BACKUP_APPS.map(payload).filter(Boolean);
    if(!apps.length){toast("Nothing stored yet");return}
    const b={format:"suite-bundle",version:1,saved:new Date().toISOString(),origin:location.origin,suite:SUITE.id,apps,rest:{}};
    const blob=new Blob([JSON.stringify(b)],{type:"application/json"}), url=URL.createObjectURL(blob), a=document.createElement("a");
    a.href=url; a.download=`${SUITE.id}-backup-${localDate()}.json`; a.style.display="none"; document.body.appendChild(a); a.click(); a.remove();
    setTimeout(()=>URL.revokeObjectURL(url),15000);
    const now=String(Date.now());
    for(const ap of BACKUP_APPS) if(ap.reminder){try{localStorage.setItem(ap.reminder+".lastBackup",now);localStorage.setItem(ap.reminder+".backupSnooze","0")}catch(_){}}
    toast("Backup file saved");
  });
  window.suiteBackup={open};
  if(S()) S().onStatus(paint);
  else window.addEventListener("load",()=>{if(S())S().onStatus(paint);paint()});
  paint();
})();
</script>

<!-- suite-live-sync:begin v3 -->
<script>
/* Suite live sync, added by patch_suites.py for control-center.html.
   1. When an app's stored data changes outside that app (the control center, this suite in another
      tab, or a sibling app), the app's frame is reloaded so it never saves an older copy over it.
   2. control-center.html can open an app filtered to one item: suite.html?find=TEXT&pick=VIEW#app,
      and a structure in the viewer: structure-studio.html?load=pdb:5XJH#viewer (or af:ACCESSION)
   3. The Backup sheet gets a link to the control center. */
(function(){
  const SYNC={"log": {"keys": ["researchlog.v1"], "prefixes": []}, "tasks": {"keys": ["tasks.v1"], "prefixes": []}, "ideas": {"keys": ["ideaboard.v1"], "prefixes": []}, "plans": {"keys": ["scriptplans.v1"], "prefixes": []}, "deadlines": {"keys": ["deadlines.v1"], "prefixes": []}};
  const SEARCH={};
  const PICKS={"log": {"actions": "#tabs [data-tab=\"actions\"]", "meetings": "#tabs [data-tab=\"meetings\"]"}, "ideas": {"spark": "#tabs [data-stage=\"spark\"]", "explore": "#tabs [data-stage=\"explore\"]", "doing": "#tabs [data-stage=\"doing\"]", "done": "#tabs [data-stage=\"done\"]"}, "deadlines": {"done": "#showDone"}, "tasks": {"today": "#chips [data-f=\"today\"]", "upcoming": "#chips [data-f=\"upcoming\"]", "someday": "#chips [data-f=\"someday\"]", "all": "#chips [data-f=\"all\"]", "done": "#chips [data-f=\"done\"]"}};
  const stage=document.getElementById("stage");
  if(!stage||typeof APPS==="undefined") return;
  const labelOf=id=>{const a=APPS.find(x=>x.id===id);return a?a.label:null};
  const idOf=f=>{const a=APPS.find(x=>x.label===f.title);return a?a.id:null};
  const frameOf=id=>{const l=labelOf(id);return l?[...stage.querySelectorAll("iframe")].find(f=>f.title===l)||null:null};
  const owns=(id,k)=>{const s=SYNC[id];return !!s&&(s.keys.includes(k)||s.prefixes.some(p=>k.startsWith(p)))};
  function say(t){const el=document.getElementById("bkToast");if(!el)return;el.textContent=t;el.classList.add("show");
    clearTimeout(say.t);say.t=setTimeout(()=>el.classList.remove("show"),2600)}

  /* what each frame wrote recently (as hashes), so an app's own saves are never taken for outside
     changes, even when it saves several times before the browser reports the first one */
  const mine={};
  const fnv=s=>{if(s==null)return "-";let h=0x811c9dc5;for(let i=0;i<s.length;i++){h^=s.charCodeAt(i);h=Math.imul(h,0x01000193)>>>0}return h.toString(36)+"."+s.length};
  function note(k,v,app){
    const list=mine[k]||(mine[k]=[]), now=Date.now();
    list.push({h:fnv(v),app,t:now});
    while(list.length>40||(list.length&&now-list[0].t>120000)) list.shift();
  }
  function hook(f){
    let w; try{w=f.contentWindow}catch(_){return}
    if(!w) return;
    try{
      const P=w.Storage.prototype; if(P.__suiteHook) return;
      const set=P.setItem, rem=P.removeItem, id=idOf(f);
      P.setItem=function(k,v){set.call(this,k,v);try{if(this===w.localStorage)note(String(k),String(v),id)}catch(_){}};
      P.removeItem=function(k){rem.call(this,k);try{if(this===w.localStorage)note(String(k),null,id)}catch(_){}};
      Object.defineProperty(P,"__suiteHook",{value:true});
    }catch(_){}
  }
  function watch(f){if(f.__suiteWatch)return;f.__suiteWatch=true;hook(f);f.addEventListener("load",()=>hook(f))}
  stage.querySelectorAll("iframe").forEach(watch);
  new MutationObserver(ms=>ms.forEach(m=>m.addedNodes.forEach(n=>{if(n.tagName==="IFRAME")watch(n)}))).observe(stage,{childList:true});

  const pending=new Set(); let timer=null;
  function busy(f){
    try{
      const d=f.contentDocument; if(!d) return false;
      if(d.querySelector("dialog[open]")) return true;
      if(!f.classList.contains("on")||document.hidden) return false;
      const ae=d.activeElement;
      return !!ae&&/^(INPUT|TEXTAREA|SELECT)$/.test(ae.tagName)&&!/^(search|checkbox|radio|button|file|range)$/.test(ae.type||"");
    }catch(_){return false}
  }
  function flush(){
    for(const id of [...pending]){
      const f=frameOf(id);
      if(!f){pending.delete(id);continue}
      if(f.dataset.ready!=="1"||busy(f)) continue;
      pending.delete(id);
      const seen=f.classList.contains("on")&&!document.hidden;
      window.suiteReload(id);
      if(seen) say(labelOf(id)+" updated with changes made elsewhere");
    }
    if(pending.size&&!timer) timer=setInterval(()=>{flush();if(!pending.size){clearInterval(timer);timer=null}},1500);
  }
  window.addEventListener("storage",e=>{
    try{if(e.storageArea&&e.storageArea!==localStorage)return}catch(_){}
    const k=e.key, list=k==null?null:mine[k];
    let writer=null;
    if(list){const h=fnv(e.newValue);for(let i=list.length-1;i>=0;i--)if(list[i].h===h){writer=list[i].app;break}}
    if(k!=null&&!writer) delete mine[k];
    for(const id in SYNC){
      if(k!=null&&!owns(id,k)) continue;
      if(writer===id) continue;
      pending.add(id);
    }
    if(pending.size) setTimeout(flush,50);
  });
  document.addEventListener("visibilitychange",()=>{if(!document.hidden&&pending.size)flush()});
  /* data that arrived from another device through suite-sync.js */
  window.addEventListener("suite-sync-applied",e=>{
    const keys=(e.detail&&e.detail.keys)||[];
    for(const id in SYNC) if(keys.some(k=>owns(id,k))) pending.add(id);
    if(pending.size) setTimeout(flush,50);
  });

  /* hand-off from the control center: open this app filtered to one item */
  const qs=new URLSearchParams(location.search), find=qs.get("find"), pick=qs.get("pick"), load=qs.get("load");
  if(load){
    history.replaceState(null,"",location.pathname+location.hash);
    const m=/^(pdb|af|pubchem):(.+)$/i.exec(load);
    if(m&&window.suiteHas&&window.suiteHas("viewer")) window.suiteSend("viewer",{type:"fetch",src:m[1].toLowerCase(),id:m[2]});
  }else if(find!=null||pick){
    history.replaceState(null,"",location.pathname+location.hash);
    const id=location.hash.slice(1), f=frameOf(id);
    const apply=()=>{try{
      const d=f.contentDocument; if(!d) return;
      const sel=pick&&PICKS[id]&&PICKS[id][pick];
      if(sel){const b=d.querySelector(sel);if(b&&!(id==="deadlines"&&!/^show/i.test(b.textContent.trim())))b.click()}
      const box=find!=null?d.getElementById(SEARCH[id]||"search"):null;
      if(box){box.value=find;box.dispatchEvent(new Event("input",{bubbles:true}))}
    }catch(_){}};
    if(f){if(f.dataset.ready==="1")setTimeout(apply,150);else f.addEventListener("load",()=>setTimeout(apply,150),{once:true})}
  }

  /* a way back to the control center from the Backup sheet */
  const bar=document.querySelector("#bkDlg .bk-bar");
  if(bar&&!document.getElementById("bkHub")){
    const a=document.createElement("a");a.id="bkHub";a.className="bk-btn";a.href="control-center.html";a.textContent="Control center";
    a.style.cssText="text-decoration:none;display:inline-flex;align-items:center";bar.appendChild(a);
  }
})();
</script>
<!-- suite-live-sync:end -->
</body>
