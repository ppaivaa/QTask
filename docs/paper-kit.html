URL = \\\"https://naciscdn.org/naturalearth/110m/cultural/ne_110m_admin_0_countries.zip\\\"\\nworld = gpd.read_file(URL)\\n\\nsites = pd.DataFrame({\\\"site\\\": [\\\"Porto\\\", \\\"Girona\\\", \\\"Groningen\\\", \\\"Osaka\\\", \\\"Boston\\\"],\\n                      \\\"lon\\\": [-8.61, 2.82, 6.57, 135.50, -71.06], \\\"lat\\\": [41.15, 41.98, 53.22, 34.69, 42.36],\\n                      \\\"samples\\\": [40, 12, 18, 25, 9]})\\npts = gpd.GeoDataFrame(sites, geometry=gpd.points_from_xy(sites.lon, sites.lat), crs=\\\"EPSG:4326\\\")\\n\\nfig, ax = plt.subplots(figsize=(6.4, 3.4))\\nworld.plot(ax=ax, color=\\\"0.9\\\", edgecolor=\\\"white\\\", linewidth=0.3)\\npts.plot(ax=ax, markersize=pts.samples * 4, color=\\\"#D55E00\\\", alpha=0.8, edgecolor=\\\"k\\\", linewidth=0.4)\\nfor _, r in pts.iterrows():\\n    ax.annotate(r.site, (r.lon, r.lat), xytext=(4, 4), textcoords=\\\"offset points\\\", fontsize=7)\\nax.set_axis_off()\\nfig.tight_layout()\\nfig.savefig(\\\"scatter_geo.png\\\", dpi=600, bbox_inches=\\\"tight\\\")\\nplt.show()\\n\", \"uses\": [\"geopandas\", \"pandas\", \"matplotlib\"], \"file\": \"scatter_geo.py\", \"png\": \"scatter_geo.png\"}, \"parallel\": {\"code\": \"\\\"\\\"\\\"Parallel coordinates: many numeric variables at once, one line per item, coloured by group.\\\"\\\"\\\"\\nimport numpy as np\\nimport pandas as pd\\nimport matplotlib.pyplot as plt\\nfrom pandas.plotting import parallel_coordinates\\n\\nrng = np.random.default_rng(30)\\nn = 30\\ndf = pd.DataFrame({\\\"kcat\\\": rng.normal(5, 1.5, 2 * n), \\\"Km\\\": rng.normal(2, 0.6, 2 * n),\\n                   \\\"Tm\\\": rng.normal(60, 5, 2 * n), \\\"Yield\\\": rng.normal(40, 10, 2 * n)})\\ndf[\\\"group\\\"] = [\\\"designed\\\"] * n + [\\\"natural\\\"] * n\\ndf.loc[df.group == \\\"designed\\\", [\\\"kcat\\\", \\\"Tm\\\"]] += [2, 8]\\nscaled = df.copy()\\ncols = [\\\"kcat\\\", \\\"Km\\\", \\\"Tm\\\", \\\"Yield\\\"]\\nscaled[cols] = (df[cols] - df[cols].min()) / (df[cols].max() - df[cols].min())   # put axes on one scale\\n\\nfig, ax = plt.subplots(figsize=(5.0, 3.2))\\nparallel_coordinates(scaled, \\\"group\\\", cols=cols, color=[\\\"#0072B2\\\", \\\"#E69F00\\\"], alpha=0.5, linewidth=1, ax=ax)\\nax.set_ylabel(\\\"Scaled value (0 to 1)\\\")\\nax.grid(False)\\nax.legend(frameon=False, fontsize=8)\\nfig.tight_layout()\\nfig.savefig(\\\"parallel_coordinates.png\\\", dpi=600, bbox_inches=\\\"tight\\\")\\nplt.show()\\n\", \"uses\": [\"numpy\", \"pandas\", \"matplotlib\"], \"file\": \"parallel.py\", \"png\": \"parallel_coordinates.png\"}, \"wordcloud\": {\"code\": \"\\\"\\\"\\\"Word cloud: the most frequent words in a text. Good for a quick look, not for quantitative claims.\\nNeeds: pip install wordcloud\\\"\\\"\\\"\\nimport matplotlib.pyplot as plt\\nfrom wordcloud import WordCloud, STOPWORDS\\n\\ntext = \\\"\\\"\\\"Enzymatic depolymerisation of PET by PETase and MHETase. Molecular dynamics, QM/MM and free energy\\ncalculations reveal the acylation and deacylation steps, the role of the oxyanion hole, the catalytic triad\\nand substrate binding in the aromatic clamp. Thermostable variants improve activity on PET films and nanoparticles.\\\"\\\"\\\"\\n# replace with your abstracts, for example open(\\\"abstracts.txt\\\").read()\\n\\nwc = WordCloud(width=1600, height=900, background_color=\\\"white\\\", colormap=\\\"viridis\\\",\\n               stopwords=STOPWORDS | {\\\"role\\\", \\\"steps\\\"}, max_words=60, random_state=1).generate(text)\\nfig, ax = plt.subplots(figsize=(5.0, 2.9))\\nax.imshow(wc, interpolation=\\\"bilinear\\\")\\nax.axis(\\\"off\\\")\\nfig.tight_layout()\\nfig.savefig(\\\"wordcloud.png\\\", dpi=600, bbox_inches=\\\"tight\\\")\\nplt.show()\\n\", \"uses\": [\"matplotlib\", \"wordcloud\"], \"file\": \"wordcloud.py\", \"png\": \"wordcloud.png\"}};\n(function(){\n  const dlg=document.getElementById(\"codeDlg\"), pre=document.getElementById(\"codeText\"), flash=document.getElementById(\"codeFlash\");\n  let cur=null, ft=null;\n  const say=t=>{flash.textContent=t;clearTimeout(ft);ft=setTimeout(()=>flash.textContent=\"\",2200)};\n  function open(card){\n    const c=PLOT_CODE[card.dataset.id]; if(!c) return;\n    cur=c;\n    document.getElementById(\"codeTitle\").textContent=card.querySelector(\"h3\").textContent;\n    document.getElementById(\"codeDesc\").textContent=card.querySelector(\"p\").textContent;\n    document.getElementById(\"codeUses\").innerHTML=\"Uses \"+c.uses.map(m=>\"\u003ccode>\"+m+\"\u003c/code>\").join(\", \")+\". Saves \u003ccode>\"+c.png+\"\u003c/code> at 600 dpi and shows the figure.\";\n    pre.textContent=c.code; pre.scrollTop=0; flash.textContent=\"\";\n    dlg.showModal();\n  }\n  document.getElementById(\"grid\").addEventListener(\"click\",e=>{const card=e.target.closest(\".card\");if(card)open(card)});\n  document.getElementById(\"grid\").addEventListener(\"keydown\",e=>{if((e.key===\"Enter\"||e.key===\" \")&&e.target.classList.contains(\"card\")){e.preventDefault();open(e.target)}});\n  document.getElementById(\"codeClose\").addEventListener(\"click\",()=>dlg.close());\n  dlg.addEventListener(\"click\",e=>{if(e.target===dlg)dlg.close()});\n  document.getElementById(\"codeCopy\").addEventListener(\"click\",async()=>{\n    if(!cur) return;\n    try{await navigator.clipboard.writeText(cur.code);say(\"Copied\")}\n    catch(_){const r=document.createRange();r.selectNodeContents(pre);const s=getSelection();s.removeAllRanges();s.addRange(r);say(\"Selected, copy with Ctrl+C\")}\n  });\n  document.getElementById(\"codeSave\").addEventListener(\"click\",()=>{\n    if(!cur) return;\n    try{const url=URL.createObjectURL(new Blob([cur.code],{type:\"text/x-python;charset=utf-8\"}));\n      const a=document.createElement(\"a\");a.href=url;a.download=cur.file;document.body.appendChild(a);a.click();a.remove();\n      setTimeout(()=>URL.revokeObjectURL(url),10000);say(\"Saved to Downloads\")}catch(_){say(\"Download blocked, use Copy\")}\n  });\n})();\n\u003c/script>\n\u003c/body>\n\u003c/html>\n"}, {"id": "schemes", "label": "Schemes", "html": "\u003c!DOCTYPE html>\n\u003chtml lang=\"en\">\n\u003chead>\n\u003cmeta charset=\"utf-8\">\n\u003cscript src=\"suite-theme.js\" data-suite-theme>\u003c/script>\n\u003cmeta name=\"viewport\" content=\"width=device-width, initial-scale=1, viewport-fit=cover\">\n\u003ctitle>Mechanism scheme editor\u003c/title>\n\u003cmeta name=\"theme-color\" content=\"#5A4360\">\n\u003cmeta name=\"color-scheme\" content=\"dark\">\n\u003cstyle>\n:root{\n  color-scheme:dark;\n  --paper:var(--t-bg,#000000); --surface:var(--t-surface,#131316); --sunk:var(--t-field,#0F0F12); --ink:var(--t-ink,#F2F2F4); --muted:var(--t-muted,#9D9DA5); --line:var(--t-line,#2E2E35);\n  --accent:var(--t-accent,#EBA8E4); --accent-soft:var(--t-accent-soft,#35263A); --sel:#B15FC0; --bad:var(--t-danger,#EF5A50);\n  --sheet:#FFFFFF; --grid:#DDE3E1;\n  --grad:linear-gradient(90deg,var(--t-grad1,#F0A8DC) 0%,var(--t-grad2,#C9B6EF) 50%,var(--t-grad3,#A6CCF5) 100%);\n  --r:10px;\n  --sans:Roboto,\"Google Sans\",system-ui,-apple-system,\"Segoe UI\",sans-serif;\n  box-sizing:border-box;\n  padding-top:env(safe-area-inset-top,0px);\n  padding-bottom:env(safe-area-inset-bottom,0px);\n}\nhtml{scroll-padding-top:env(safe-area-inset-top,0px);height:100%}\n*,*::before,*::after{box-sizing:inherit}\nbody{margin:0;height:100%;background:var(--paper);color:var(--ink);font-family:var(--sans);font-size:15px;line-height:1.45;-webkit-font-smoothing:antialiased;display:flex;flex-direction:column}\nbutton,input,select,textarea{font:inherit;color:inherit}\n:focus-visible{outline:2px solid var(--accent);outline-offset:2px}\n\nheader{flex:none;display:flex;align-items:center;gap:.6rem;flex-wrap:wrap;padding:.6rem .8rem;border-bottom:1px solid var(--line);background:var(--paper)}\nheader h1{font-size:1.05rem;margin:0 .4rem 0 0;font-weight:600;white-space:nowrap}\n.grow{flex:1 1 auto}\nselect,input[type=text],input[type=number],textarea{background:var(--sunk);border:1px solid var(--line);border-radius:6px;padding:.35rem .5rem;min-height:2.2rem}\n.btn{display:inline-flex;align-items:center;justify-content:center;gap:.35rem;background:var(--surface);border:1px solid var(--line);border-radius:6px;padding:.3rem .65rem;min-height:2.2rem;cursor:pointer;font-weight:500;white-space:nowrap}\n.btn:hover{border-color:var(--accent)}\n.btn:disabled{opacity:.45;cursor:default}\n.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--surface)}\n.btn.danger{color:var(--bad)}\n.sync{font-size:.8rem;color:var(--muted)}\n\n.tools{flex:none;display:flex;gap:.3rem;padding:.45rem .8rem;border-bottom:1px solid var(--line);overflow-x:auto;background:var(--paper);scrollbar-width:thin}\n.tool{flex:none;display:flex;flex-direction:column;align-items:center;gap:.1rem;min-width:3.3rem;padding:.3rem .35rem;border:1px solid transparent;border-radius:var(--r);background:none;cursor:pointer;color:var(--muted);font-size:.72rem}\n.tool svg{width:22px;height:22px;stroke:var(--ink);fill:none;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}\n.tool[aria-pressed=\"true\"]{background:var(--surface);border-color:var(--accent);color:var(--ink)}\n.subbar{flex:none;display:flex;gap:.3rem;align-items:center;flex-wrap:wrap;padding:.4rem .8rem;border-bottom:1px solid var(--line);min-height:2.9rem;background:var(--sunk)}\n.subbar .opt{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:.2rem .7rem;cursor:pointer;min-height:2rem;font-size:.88rem}\n.subbar .opt[aria-pressed=\"true\"]{background:var(--accent-soft);border-color:var(--accent)}\n.subbar .hint{color:var(--muted);font-size:.85rem;margin-left:.3rem}\n.swatch{width:1.6rem;height:1.6rem;border-radius:50%;border:2px solid var(--surface);box-shadow:0 0 0 1px var(--line);cursor:pointer;padding:0}\n.swatch[aria-pressed=\"true\"]{box-shadow:0 0 0 2px var(--accent)}\n\n.work{flex:1 1 auto;display:flex;min-height:0}\n.canvas-wrap{flex:1 1 auto;overflow:auto;background:var(--paper);position:relative;min-height:320px}\n#stage{display:block;background:var(--sheet);margin:12px;box-shadow:0 0 0 1px var(--line);touch-action:none;user-select:none;-webkit-user-select:none}\n.side{flex:0 0 280px;border-left:1px solid var(--line);background:var(--surface);padding:.8rem;overflow-y:auto}\n.side h2{font-size:.95rem;margin:0 0 .6rem;font-weight:600}\n.side .field{margin-bottom:.7rem}\n.side label.f{display:block;font-size:.8rem;color:var(--muted);margin-bottom:.2rem}\n.side input[type=text],.side select,.side textarea{width:100%}\n.side p{margin:.2rem 0 .6rem;color:var(--muted);font-size:.88rem}\n.side kbd{font-family:inherit;font-size:.8rem;border:1px solid var(--line);border-bottom-width:2px;border-radius:4px;padding:0 .3rem;background:var(--sunk)}\n.row{display:flex;gap:.5rem;flex-wrap:wrap}\n.row>*{flex:1 1 90px}\n.zoom{position:sticky;left:12px;bottom:12px;display:inline-flex;gap:.3rem;margin:0 12px 12px}\n@media (max-width:820px){\n  .work{flex-direction:column}\n  .side{flex:none;border-left:0;border-top:1px solid var(--line);max-height:38vh}\n  .canvas-wrap{min-height:52vh}\n}\n.toast{position:fixed;left:50%;bottom:calc(1rem + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--paper);padding:.45rem .9rem;border-radius:6px;font-size:.9rem;opacity:0;pointer-events:none;transition:opacity .2s;z-index:50}\n.toast.show{opacity:1}\n@media (prefers-reduced-motion:reduce){.toast{transition:none}}\ndialog{border:1px solid var(--line);border-radius:12px;background:var(--surface);color:var(--ink);padding:1rem;width:min(420px,calc(100vw - 2rem))}\ndialog::backdrop{background:var(--t-backdrop,rgba(10,15,20,.45))}\ndialog h3{margin:0 0 .6rem;font-size:1rem}\n\n/* ---- Theme: dark with pink-to-blue accents (shared with research-log) ---- */\n/* The drawing sheet stays white with black ink so exports look like journal figures. */\nheader{background:linear-gradient(172deg,var(--t-head,#5A4360) 0%,var(--t-headbar,#2A2432) 100%);border-bottom-color:var(--t-line,#2E2E35)}\nheader h1{font-weight:500;font-size:1.15rem}\n.tools{background:var(--t-bg,#000)}\n.subbar{background:var(--t-field,#0B0B0D)}\nselect,input[type=text],input[type=number],textarea{border-radius:10px}\nselect:focus,input:focus,textarea:focus{border-color:var(--t-focus,#9C8BC0);outline:none}\n.btn{background:var(--t-bg,#000);border:1.5px solid var(--t-edge,#3B3B43);border-radius:10px}\n.btn:hover{border-color:var(--t-focus,#9C8BC0)}\n.btn.primary{background:var(--grad);border-color:transparent;color:var(--t-on-grad,#17161C)}\n.tool[aria-pressed=\"true\"]{background:var(--t-raised,#1D1D22);border-color:var(--t-focus,#9C8BC0)}\n.subbar .opt{background:var(--t-bg,#000);border:1.5px solid var(--t-edge,#3B3B43)}\n.subbar .opt[aria-pressed=\"true\"]{background:var(--grad);border-color:transparent;color:var(--t-on-grad,#17161C)}\n.side{background:var(--t-surface,#131316);border-left-color:var(--t-faint,#28282E)}\n.toast{background:var(--t-raised2,#26262C);color:var(--ink)}\ndialog{background:var(--t-raised,#1D1D22);border-color:var(--t-line,#2E2E35)}\ndialog::backdrop{background:var(--t-backdrop,rgba(0,0,0,.6))}\n.sync{color:var(--t-dim,#6F6F77)}\n\u003c/style>\n\u003c/head>\n\u003cbody>\n\u003cheader>\n  \u003ch1>Mechanism schemes\u003c/h1>\n  \u003cselect id=\"scheme-sel\" aria-label=\"Open scheme\" style=\"max-width:14rem\">\u003c/select>\n  \u003cbutton class=\"btn\" id=\"b-new\">New\u003c/button>\n  \u003cbutton class=\"btn\" id=\"b-rename\">Rename\u003c/button>\n  \u003cbutton class=\"btn\" id=\"b-dup\">Duplicate\u003c/button>\n  \u003cbutton class=\"btn danger\" id=\"b-del\">Delete\u003c/button>\n  \u003cspan class=\"sync\" id=\"sync\">\u003c/span>\n  \u003cspan class=\"grow\">\u003c/span>\n  \u003cbutton class=\"btn\" id=\"b-undo\" title=\"Undo (Ctrl+Z)\">Undo\u003c/button>\n  \u003cbutton class=\"btn\" id=\"b-redo\" title=\"Redo (Ctrl+Y)\">Redo\u003c/button>\n  \u003cbutton class=\"btn primary\" id=\"b-png\">PNG 600 dpi\u003c/button>\n  \u003cbutton class=\"btn\" id=\"b-svg\">SVG\u003c/button>\n\u003c/header>\n\n\u003cdiv class=\"tools\" role=\"toolbar\" aria-label=\"Drawing tools\" id=\"tools\">\u003c/div>\n\u003cdiv class=\"subbar\" id=\"subbar\">\u003c/div>\n\n\u003cdiv class=\"work\">\n  \u003cdiv class=\"canvas-wrap\" id=\"wrap\">\n    \u003csvg id=\"stage\" xmlns=\"http://www.w3.org/2000/svg\">\n      \u003cdefs>\n        \u003cpattern id=\"dots\" width=\"20\" height=\"20\" patternUnits=\"userSpaceOnUse\">\u003ccircle cx=\"1\" cy=\"1\" r=\"1\" fill=\"var(--grid)\"/>\u003c/pattern>\n      \u003c/defs>\n      \u003crect id=\"bg\" width=\"100%\" height=\"100%\" fill=\"url(#dots)\"/>\n      \u003cg id=\"content\">\u003c/g>\n      \u003cg id=\"overlay\">\u003c/g>\n    \u003c/svg>\n    \u003cdiv class=\"zoom\">\n      \u003cbutton class=\"btn\" id=\"z-out\" aria-label=\"Zoom out\">−\u003c/button>\n      \u003cbutton class=\"btn\" id=\"z-fit\" style=\"min-width:4rem\">100%\u003c/button>\n      \u003cbutton class=\"btn\" id=\"z-in\" aria-label=\"Zoom in\">+\u003c/button>\n    \u003c/div>\n  \u003c/div>\n  \u003caside class=\"side\" id=\"side\" aria-live=\"polite\">\u003c/aside>\n\u003c/div>\n\n\u003cdialog id=\"dlg\">\u003cform method=\"dialog\" id=\"dlg-form\">\u003ch3 id=\"dlg-title\">\u003c/h3>\u003cdiv class=\"field\">\u003cinput type=\"text\" id=\"dlg-in\" style=\"width:100%\">\u003c/div>\u003cp id=\"dlg-hint\" style=\"color:var(--muted);font-size:.85rem;margin:.3rem 0 .8rem\">\u003c/p>\u003cdiv class=\"row\" style=\"justify-content:flex-end\">\u003cbutton class=\"btn\" value=\"cancel\" style=\"flex:0 0 auto\">Cancel\u003c/button>\u003cbutton class=\"btn primary\" value=\"ok\" style=\"flex:0 0 auto\">OK\u003c/button>\u003c/div>\u003c/form>\u003c/dialog>\n\u003cdiv class=\"toast\" id=\"toast\" role=\"status\" aria-live=\"polite\">\u003c/div>\n\n\u003cscript>\n/* ================================================================\n   Helpers\n================================================================ */\nconst $=s=>document.querySelector(s);\nconst esc=s=>String(s??\"\").replace(/[&\u003c>\"']/g,c=>({\"&\":\"&amp;\",\"\u003c\":\"&lt;\",\">\":\"&gt;\",'\"':\"&quot;\",\"'\":\"&#39;\"}[c]));\nfunction toast(m){const t=$(\"#toast\");t.textContent=m;t.classList.add(\"show\");clearTimeout(toast._t);toast._t=setTimeout(()=>t.classList.remove(\"show\"),2200);}\nconst uid=()=>Math.random().toString(36).slice(2,9);\nconst dist=(a,b)=>Math.hypot(a.x-b.x,a.y-b.y);\nconst R2D=180/Math.PI;\nfunction ask(title,value=\"\",hint=\"\"){\n  return new Promise(res=>{\n    const d=$(\"#dlg\"); $(\"#dlg-title\").textContent=title; $(\"#dlg-in\").value=value; $(\"#dlg-hint\").textContent=hint;\n    d.onclose=()=>res(d.returnValue===\"ok\"?$(\"#dlg-in\").value:null);\n    d.returnValue=\"\"; d.showModal(); setTimeout(()=>{$(\"#dlg-in\").focus();$(\"#dlg-in\").select();},30);\n  });\n}\n\n/* ================================================================\n   Storage: this browser (keys start with \"mech.\")\n================================================================ */\nconst Store={\n  async get(k,fb){ try{ const r=localStorage.getItem(\"mech.\"+k); return r?JSON.parse(r):fb; }catch{ return fb; } },\n  async set(k,v){ try{localStorage.setItem(\"mech.\"+k,JSON.stringify(v));}catch(e){console.warn(\"local storage full or blocked\",e);} },\n  async del(k){ try{localStorage.removeItem(\"mech.\"+k);}catch{} }\n};\n\n/* ================================================================\n   Model\n================================================================ */\nconst L=40;                 // bond length\nconst FS=22;                // atom label font size\nconst FONT=\"Arial, Helvetica, sans-serif\";\nconst INK=\"#000000\";\nlet S=emptyScheme();\nfunction emptyScheme(){ return {atoms:[],bonds:[],arrows:[],rxns:[],texts:[],brackets:[]}; }\nconst A=id=>S.atoms.find(a=>a.id===id);\nconst Bd=id=>S.bonds.find(b=>b.id===id);\nconst bondsOf=id=>S.bonds.filter(b=>b.a===id||b.b===id);\nconst nbrs=id=>bondsOf(id).map(b=>A(b.a===id?b.b:b.a)).filter(Boolean);\nconst deg=id=>bondsOf(id).length;\nconst findBond=(x,y)=>S.bonds.find(b=>(b.a===x&&b.b===y)||(b.a===y&&b.b===x));\n\nlet hist=[],fut=[];\nfunction snap(){ hist.push(JSON.stringify(S)); if(hist.length>150) hist.shift(); fut=[]; updUndo(); }\nfunction undo(){ if(!hist.length) return; fut.push(JSON.stringify(S)); S=JSON.parse(hist.pop()); sel.clear(); changed(); }\nfunction redo(){ if(!fut.length) return; hist.push(JSON.stringify(S)); S=JSON.parse(fut.pop()); sel.clear(); changed(); }\nfunction updUndo(){ $(\"#b-undo\").disabled=!hist.length; $(\"#b-redo\").disabled=!fut.length; }\n\nfunction addAtom(x,y,label=\"\"){ const a={id:uid(),x,y,label,charge:\"\",lp:0,rad:false}; S.atoms.push(a); return a; }\nfunction addBond(a,b,order=1,style=\"plain\"){ if(a===b) return null; let e=findBond(a,b); if(e) return e; e={id:uid(),a,b,order,style}; S.bonds.push(e); return e; }\nfunction nearAtom(p,tol=12,skip){ let best=null,bd=tol; for(const a of S.atoms){ if(a.id===skip) continue; const d=dist(a,p); if(d\u003cbd){bd=d;best=a;} } return best; }\nfunction removeRefs(pred){ S.arrows=S.arrows.filter(r=>!(pred(r.from)||pred(r.to))); }\nfunction deleteAtom(id){ const bs=bondsOf(id).map(b=>b.id); S.bonds=S.bonds.filter(b=>b.a!==id&&b.b!==id); S.atoms=S.atoms.filter(a=>a.id!==id);\n  removeRefs(r=>r&&((r.t===\"atom\"||r.t===\"lp\")&&r.id===id || r.t===\"bond\"&&bs.includes(r.id))); }\nfunction deleteBond(id){ const b=Bd(id); S.bonds=S.bonds.filter(x=>x.id!==id); removeRefs(r=>r&&r.t===\"bond\"&&r.id===id);\n  if(b) [b.a,b.b].forEach(x=>{ const a=A(x); if(a&&!deg(x)&&!a.label&&!a.charge&&!a.lp&&!a.rad&&!S.arrows.some(r=>(r.from.id===x||r.to.id===x))) deleteAtom(x); }); }\n\n/* ================================================================\n   Geometry for labels and decorations\n================================================================ */\nfunction vlabel(a){ return a.label || (deg(a.id)===0 ? \"C\" : \"\"); }\nfunction textW(str,fs){ let w=0; for(const c of str){ if(/[0-9]/.test(c)) w+=.42*fs; else if(/[A-Z]/.test(c)) w+=.68*fs; else if(/[a-z]/.test(c)) w+=.5*fs; else w+=.55*fs; } return w; }\nfunction halfBox(a){ const l=vlabel(a); if(!l) return null; return {hw:textW(l,FS)/2+2, hh:FS*.52}; }\nfunction trimAt(a,ux,uy){ const hb=halfBox(a); if(!hb) return 0; const tx=Math.abs(ux)>1e-6?hb.hw/Math.abs(ux):1e9, ty=Math.abs(uy)>1e-6?hb.hh/Math.abs(uy):1e9; return Math.min(tx,ty)+1.5; }\nfunction angDiff(a,b){ let d=Math.abs(a-b)%(2*Math.PI); return d>Math.PI?2*Math.PI-d:d; }\nfunction decor(a){\n  const taken=nbrs(a.id).map(n=>Math.atan2(n.y-a.y,n.x-a.x));\n  const pick=pref=>{ let best=pref,bs=-1;\n    for(let k=0;k\u003c24;k++){ const t=k*Math.PI/12; const s=taken.length?Math.min(...taken.map(x=>angDiff(x,t))):Math.PI; const score=s-0.02*angDiff(t,pref); if(score>bs+1e-9){bs=score;best=t;} } taken.push(best); return best; };\n  const hb=halfBox(a); const rad=t=>{ if(!hb) return 11; const c=Math.abs(Math.cos(t)),s=Math.abs(Math.sin(t)); return Math.min(c>1e-6?hb.hw/c:1e9, s>1e-6?hb.hh/s:1e9)+6; };\n  const out={};\n  if(a.charge){ const t=pick(-Math.PI/4); const r=rad(t)+ (a.charge.length>1?5:2); out.charge={x:a.x+r*Math.cos(t),y:a.y+r*Math.sin(t),t}; }\n  out.lps=[]; const prefs=[-Math.PI/2,Math.PI/2,Math.PI,0];\n  for(let i=0;i\u003c(a.lp||0);i++){ const t=pick(prefs[i%4]); const r=rad(t)+1; out.lps.push({x:a.x+r*Math.cos(t),y:a.y+r*Math.sin(t),t}); }\n  if(a.rad){ const t=pick(-Math.PI/2); const r=rad(t); out.rad={x:a.x+r*Math.cos(t),y:a.y+r*Math.sin(t),t}; }\n  return out;\n}\n\n/* ================================================================\n   Rich text: x^{sup} x_{sub}, \\Delta, \\ddag, \\to ...\n================================================================ */\nconst MACROS={\"\\\\Delta\":\"Δ\",\"\\\\delta\":\"δ\",\"\\\\alpha\":\"α\",\"\\\\beta\":\"β\",\"\\\\gamma\":\"γ\",\"\\\\pi\":\"π\",\"\\\\sigma\":\"σ\",\"\\\\mu\":\"µ\",\"\\\\ddag\":\"‡\",\"\\\\dag\":\"†\",\"\\\\pm\":\"±\",\"\\\\to\":\"→\",\"\\\\deg\":\"°\",\"\\\\times\":\"×\",\"\\\\approx\":\"≈\",\"\\\\ne\":\"≠\",\"\\\\le\":\"≤\",\"\\\\ge\":\"≥\"};\nconst MKEYS=Object.keys(MACROS).sort((a,b)=>b.length-a.length);\nfunction macro(s){ return s.replace(/\\\\[A-Za-z]+/g,m=>{ for(const k of MKEYS){ if(m.startsWith(k)) return MACROS[k]+m.slice(k.length); } return m; }); }\nfunction rich(str,fs){\n  str=macro(String(str)); let out=\"\",i=0,base=0;\n  const seg=(txt,mode)=>{ if(!txt) return; const dy= mode===\"sup\"? -.38*fs : mode===\"sub\"? .3*fs : 0;\n    const shift=dy-base; base=dy; out+=`\u003ctspan${shift?` dy=\"${shift.toFixed(2)}\"`:\"\"}${mode?` font-size=\"${(fs*.68).toFixed(1)}\"`:\"\"}>${esc(txt)}\u003c/tspan>`; };\n  let buf=\"\";\n  while(i\u003cstr.length){ const c=str[i];\n    if((c===\"^\"||c===\"_\")&&i+1\u003cstr.length){ seg(buf,null); buf=\"\"; let t; if(str[i+1]===\"{\"){ const j=str.indexOf(\"}\",i+2); t=str.slice(i+2,j\u003c0?str.length:j); i=j\u003c0?str.length:j+1; } else { t=str[i+1]; i+=2; } seg(t,c===\"^\"?\"sup\":\"sub\"); }\n    else { buf+=c; i++; } }\n  seg(buf,null); if(base) out+=`\u003ctspan dy=\"${(-base).toFixed(2)}\">\u003c/tspan>`; return out;\n}\nfunction labelSpans(l){ // digits after letters become subscripts, + / - after a letter become superscripts\n  let out=\"\",base=0;\n  for(const m of l.match(/[0-9]+|[+\\-−]+|[^0-9+\\-−]+/g)||[]){\n    let mode=null; if(/^[0-9]+$/.test(m)) mode=\"sub\"; else if(/^[+\\-−]+$/.test(m)) mode=\"sup\";\n    const dy= mode===\"sub\"? .32*FS : mode===\"sup\"? -.4*FS : 0; const sh=dy-base; base=dy;\n    out+=`\u003ctspan${sh?` dy=\"${sh.toFixed(1)}\"`:\"\"}${mode?` font-size=\"${(FS*.68).toFixed(1)}\"`:\"\"}>${esc(m.replace(/-/g,\"−\"))}\u003c/tspan>`; }\n  if(base) out+=`\u003ctspan dy=\"${(-base).toFixed(1)}\">\u003c/tspan>`; return out;\n}\n\n/* ================================================================\n   Rendering\n================================================================ */\nconst f1=n=>(+n).toFixed(1);\nfunction lineSVG(x1,y1,x2,y2,extra=\"\"){ return `\u003cline x1=\"${f1(x1)}\" y1=\"${f1(y1)}\" x2=\"${f1(x2)}\" y2=\"${f1(y2)}\" stroke=\"${INK}\" stroke-width=\"1.7\" stroke-linecap=\"round\"${extra}/>`; }\nfunction bondSVG(b){\n  const a=A(b.a), c=A(b.b); if(!a||!c) return \"\";\n  let dx=c.x-a.x, dy=c.y-a.y; const len=Math.hypot(dx,dy)||1; const ux=dx/len, uy=dy/len, nx=-uy, ny=ux;\n  const t1=trimAt(a,ux,uy), t2=trimAt(c,-ux,-uy);\n  const x1=a.x+ux*t1,y1=a.y+uy*t1,x2=c.x-ux*t2,y2=c.y-uy*t2;\n  if(b.style===\"wedge\"){ const w=3.6; return `\u003cpolygon points=\"${f1(x1)},${f1(y1)} ${f1(x2+nx*w)},${f1(y2+ny*w)} ${f1(x2-nx*w)},${f1(y2-ny*w)}\" fill=\"${INK}\"/>`; }\n  if(b.style===\"hash\"){ let s=\"\"; const n=Math.max(4,Math.floor((len-t1-t2)/3.6)); for(let i=0;i\u003c=n;i++){ const f=i/n, w=.6+3.2*f, px=x1+(x2-x1)*f, py=y1+(y2-y1)*f; s+=`\u003cline x1=\"${f1(px+nx*w)}\" y1=\"${f1(py+ny*w)}\" x2=\"${f1(px-nx*w)}\" y2=\"${f1(py-ny*w)}\" stroke=\"${INK}\" stroke-width=\"1.3\"/>`; } return s; }\n  if(b.style===\"dash\") return lineSVG(x1,y1,x2,y2,` stroke-dasharray=\"4 3.2\"`);\n  if(b.style===\"bold\") return `\u003cline x1=\"${f1(x1)}\" y1=\"${f1(y1)}\" x2=\"${f1(x2)}\" y2=\"${f1(y2)}\" stroke=\"${INK}\" stroke-width=\"5\" stroke-linecap=\"butt\"/>`;\n  if(b.order===3){ const o=5; return lineSVG(x1,y1,x2,y2)+lineSVG(x1+nx*o,y1+ny*o,x2+nx*o,y2+ny*o)+lineSVG(x1-nx*o,y1-ny*o,x2-nx*o,y2-ny*o); }\n  if(b.order===2 || b.style===\"partial2\"){\n    const dash = b.style===\"partial2\" ? ` stroke-dasharray=\"4 3.2\"` : \"\";\n    // pick side\n    let side=0; const cross=p=>Math.sign((p.x-a.x)*uy*-1+(p.y-a.y)*ux);\n    nbrs(a.id).filter(p=>p.id!==c.id).forEach(p=>side+=cross(p)); nbrs(c.id).filter(p=>p.id!==a.id).forEach(p=>side+=cross(p));\n    if(b.side) side=b.side;\n    if(vlabel(a)||vlabel(c)||side===0){ if(!b.side){ const o=3.2; return lineSVG(x1+nx*o,y1+ny*o,x2+nx*o,y2+ny*o)+lineSVG(x1-nx*o,y1-ny*o,x2-nx*o,y2-ny*o,dash); } }\n    const s=Math.sign(side)||1, o=6.8, sh=.13*len;\n    const ix1=a.x+ux*Math.max(t1,sh)+nx*o*s, iy1=a.y+uy*Math.max(t1,sh)+ny*o*s, ix2=c.x-ux*Math.max(t2,sh)+nx*o*s, iy2=c.y-uy*Math.max(t2,sh)+ny*o*s;\n    return lineSVG(x1,y1,x2,y2)+lineSVG(ix1,iy1,ix2,iy2,dash);\n  }\n  return lineSVG(x1,y1,x2,y2);\n}\nfunction atomSVG(a){\n  let s=\"\"; const l=vlabel(a);\n  if(l) s+=`\u003ctext x=\"${f1(a.x)}\" y=\"${f1(a.y+FS*.36)}\" text-anchor=\"middle\" font-family=\"${FONT}\" font-size=\"${FS}\" fill=\"${INK}\">${labelSpans(l)}\u003c/text>`;\n  const d=decor(a);\n  if(d.charge){ const ch=a.charge.replace(\"-\",\"−\"); const circ=a.circ; \n    s+= circ ? `\u003ccircle cx=\"${f1(d.charge.x)}\" cy=\"${f1(d.charge.y)}\" r=\"6.5\" fill=\"none\" stroke=\"${INK}\" stroke-width=\"1.1\"/>\u003ctext x=\"${f1(d.charge.x)}\" y=\"${f1(d.charge.y+4.6)}\" text-anchor=\"middle\" font-family=\"${FONT}\" font-size=\"14\" fill=\"${INK}\">${esc(ch)}\u003c/text>`\n      : `\u003ctext x=\"${f1(d.charge.x)}\" y=\"${f1(d.charge.y+5.5)}\" text-anchor=\"middle\" font-family=\"${FONT}\" font-size=\"${ch.length>1?15:17}\" fill=\"${INK}\">${esc(ch)}\u003c/text>`; }\n  d.lps.forEach(p=>{ const px=-Math.sin(p.t)*2.9, py=Math.cos(p.t)*2.9; s+=`\u003ccircle cx=\"${f1(p.x+px)}\" cy=\"${f1(p.y+py)}\" r=\"1.75\" fill=\"${INK}\"/>\u003ccircle cx=\"${f1(p.x-px)}\" cy=\"${f1(p.y-py)}\" r=\"1.75\" fill=\"${INK}\"/>`; });\n  if(d.rad) s+=`\u003ccircle cx=\"${f1(d.rad.x)}\" cy=\"${f1(d.rad.y)}\" r=\"2\" fill=\"${INK}\"/>`;\n  return s;\n}\n/* curved arrows */\nfunction refPt(r,end){\n  if(!r) return null;\n  if(r.t===\"pt\") return {x:r.x,y:r.y,trim:0};\n  if(r.t===\"bond\"){ const b=Bd(r.id); if(!b) return null; const a=A(b.a),c=A(b.b); return {x:(a.x+c.x)/2,y:(a.y+c.y)/2,trim:end?7:5}; }\n  const a=A(r.id); if(!a) return null;\n  if(r.t===\"lp\"){ const d=decor(a); const p=d.lps[r.i]; if(p) return {x:p.x,y:p.y,trim:4}; }\n  const hb=halfBox(a); return {x:a.x,y:a.y,trim: hb? Math.max(hb.hw,hb.hh)+(end?4:1) : (end?10:5)};\n}\nfunction arrowGeom(ar){\n  const s=refPt(ar.from,false), e=refPt(ar.to,true); if(!s||!e) return null;\n  let dx=e.x-s.x, dy=e.y-s.y; const len=Math.hypot(dx,dy)||1; const nx=-dy/len, ny=dx/len;\n  const mx=(s.x+e.x)/2, my=(s.y+e.y)/2; const cx=mx+nx*ar.bend, cy=my+ny*ar.bend;\n  const toward=(p,q,t)=>{ const d=Math.hypot(q.x-p.x,q.y-p.y)||1; return {x:p.x+(q.x-p.x)/d*t,y:p.y+(q.y-p.y)/d*t}; };\n  const C={x:cx,y:cy}; const S0=toward(s,C,s.trim), E0=toward(e,C,e.trim);\n  return {s,e,S0,E0,C,nx,ny,mid:{x:.25*s.x+.5*cx+.25*e.x,y:.25*s.y+.5*cy+.25*e.y}};\n}\nfunction headSVG(tip,from,color,half,halfSide){\n  const d=Math.hypot(tip.x-from.x,tip.y-from.y)||1; const ux=(tip.x-from.x)/d, uy=(tip.y-from.y)/d, nx=-uy, ny=ux;\n  const Lh=10, W=4.2, bx=tip.x-ux*Lh, by=tip.y-uy*Lh, nb={x:tip.x-ux*Lh*.72,y:tip.y-uy*Lh*.72};\n  if(half){ const s=halfSide; return `\u003cpolygon points=\"${f1(tip.x)},${f1(tip.y)} ${f1(bx+nx*W*1.15*s)},${f1(by+ny*W*1.15*s)} ${f1(nb.x+nx*.4*s)},${f1(nb.y+ny*.4*s)}\" fill=\"${color}\"/>`; }\n  return `\u003cpolygon points=\"${f1(tip.x)},${f1(tip.y)} ${f1(bx+nx*W)},${f1(by+ny*W)} ${f1(nb.x)},${f1(nb.y)} ${f1(bx-nx*W)},${f1(by-ny*W)}\" fill=\"${color}\"/>`;\n}\nfunction curvedSVG(ar){\n  const g=arrowGeom(ar); if(!g) return \"\";\n  const {S0,E0,C}=g; const col=ar.color||INK;\n  const d=Math.hypot(E0.x-C.x,E0.y-C.y)||1; const back={x:E0.x+(C.x-E0.x)/d*7,y:E0.y+(C.y-E0.y)/d*7};\n  // barb on the convex side\n  const ux=(E0.x-C.x)/d, uy=(E0.y-C.y)/d; const pnx=-uy,pny=ux; const conv=(pnx*g.nx+pny*g.ny)*Math.sign(ar.bend||1)>0?1:-1;\n  return `\u003cpath d=\"M${f1(S0.x)},${f1(S0.y)} Q${f1(C.x)},${f1(C.y)} ${f1(back.x)},${f1(back.y)}\" fill=\"none\" stroke=\"${col}\" stroke-width=\"1.6\" stroke-linecap=\"round\"/>`+headSVG(E0,C,col,ar.head===\"half\",conv);\n}\nfunction rxnSVG(r){\n  const col=r.color||INK; let dx=r.x2-r.x1, dy=r.y2-r.y1; const len=Math.hypot(dx,dy)||1; const ux=dx/len, uy=dy/len, nx=uy, ny=-ux; // n points \"above\" for left-to-right\n  const P=(x,y)=>({x,y}); let s=\"\";\n  const ln=(a,b,ex=\"\")=>`\u003cline x1=\"${f1(a.x)}\" y1=\"${f1(a.y)}\" x2=\"${f1(b.x)}\" y2=\"${f1(b.y)}\" stroke=\"${col}\" stroke-width=\"1.7\"${ex}/>`;\n  const back=(p,t)=>P(p.x-ux*t,p.y-uy*t);\n  const s1=P(r.x1,r.y1), e1=P(r.x2,r.y2);\n  if(r.type===\"equil\"){ const o=3.2; const a1=P(s1.x+nx*o,s1.y+ny*o), a2=P(e1.x+nx*o,e1.y+ny*o), b1=P(s1.x-nx*o,s1.y-ny*o), b2=P(e1.x-nx*o,e1.y-ny*o);\n    s+=ln(a1,back(a2,4))+headSVG(a2,back(a2,10),col,true,1)+ln(b2,P(b1.x+ux*4,b1.y+uy*4))+headSVG(b1,P(b1.x+ux*10,b1.y+uy*10),col,true,1); }\n  else if(r.type===\"resonance\"){ s+=ln(P(s1.x+ux*6,s1.y+uy*6),back(e1,6))+headSVG(e1,back(e1,10),col)+headSVG(s1,P(s1.x+ux*10,s1.y+uy*10),col); }\n  else if(r.type===\"retro\"){ const o=3.4; s+=ln(P(s1.x+nx*o,s1.y+ny*o),P(e1.x-ux*6+nx*o,e1.y-uy*6+ny*o))+ln(P(s1.x-nx*o,s1.y-ny*o),P(e1.x-ux*6-nx*o,e1.y-uy*6-ny*o));\n    s+=`\u003cpolyline points=\"${f1(e1.x-ux*10+nx*8)},${f1(e1.y-uy*10+ny*8)} ${f1(e1.x)},${f1(e1.y)} ${f1(e1.x-ux*10-nx*8)},${f1(e1.y-uy*10-ny*8)}\" fill=\"none\" stroke=\"${col}\" stroke-width=\"1.7\" stroke-linejoin=\"miter\"/>`; }\n  else if(r.type===\"noreact\"){ const m=P((s1.x+e1.x)/2,(s1.y+e1.y)/2); s+=ln(s1,back(e1,6))+headSVG(e1,back(e1,10),col)+ln(P(m.x-7+nx*0,m.y-7),P(m.x+7,m.y+7))+ln(P(m.x-7,m.y+7),P(m.x+7,m.y-7)); }\n  else { s+=ln(s1,back(e1,6),r.type===\"dashed\"?` stroke-dasharray=\"6 4\"`:\"\")+headSVG(e1,back(e1,10),col); }\n  const mx=(r.x1+r.x2)/2, my=(r.y1+r.y2)/2;\n  if(r.above) s+=`\u003ctext x=\"${f1(mx+nx*10)}\" y=\"${f1(my+ny*10-3)}\" text-anchor=\"middle\" font-family=\"${FONT}\" font-size=\"16\" fill=\"${INK}\">${rich(r.above,16)}\u003c/text>`;\n  if(r.below) s+=`\u003ctext x=\"${f1(mx-nx*10)}\" y=\"${f1(my-ny*10+15)}\" text-anchor=\"middle\" font-family=\"${FONT}\" font-size=\"16\" fill=\"${INK}\">${rich(r.below,16)}\u003c/text>`;\n  return s;\n}\nfunction bracketSVG(k){\n  const x1=Math.min(k.x1,k.x2),x2=Math.max(k.x1,k.x2),y1=Math.min(k.y1,k.y2),y2=Math.max(k.y1,k.y2),t=8;\n  let s=`\u003cpath d=\"M${f1(x1+t)},${f1(y1)} H${f1(x1)} V${f1(y2)} H${f1(x1+t)} M${f1(x2-t)},${f1(y1)} H${f1(x2)} V${f1(y2)} H${f1(x2-t)}\" fill=\"none\" stroke=\"${INK}\" stroke-width=\"1.7\"/>`;\n  if(k.sup) s+=`\u003ctext x=\"${f1(x2+4)}\" y=\"${f1(y1+12)}\" font-family=\"${FONT}\" font-size=\"20\" fill=\"${INK}\">${rich(k.sup,20)}\u003c/text>`;\n  return s;\n}\nfunction textSVG(t){ const fs=t.size||18; const w=t.w||0;\n  return `\u003ctext x=\"${f1(t.x)}\" y=\"${f1(t.y)}\" text-anchor=\"${t.anchor||\"middle\"}\" font-family=\"${FONT}\" font-size=\"${fs}\" fill=\"${t.color||INK}\"${t.bold?' font-weight=\"bold\"':\"\"}${t.italic?' font-style=\"italic\"':\"\"}>${rich(t.text,fs)}\u003c/text>`; }\nfunction drawing(){\n  let s=`\u003cg>`;\n  S.brackets.forEach(k=>s+=bracketSVG(k));\n  S.bonds.forEach(b=>s+=bondSVG(b));\n  S.atoms.forEach(a=>s+=atomSVG(a));\n  S.rxns.forEach(r=>s+=rxnSVG(r));\n  S.texts.forEach(t=>s+=textSVG(t));\n  S.arrows.forEach(ar=>s+=curvedSVG(ar));\n  return s+`\u003c/g>`;\n}\n\n/* ================================================================\n   View, zoom\n================================================================ */\nconst W=2400, H=1500;\nlet zoom=1;\nconst stage=$(\"#stage\");\nfunction setZoom(z){ zoom=Math.min(3,Math.max(.3,z)); stage.setAttribute(\"width\",W*zoom); stage.setAttribute(\"height\",H*zoom); stage.setAttribute(\"viewBox\",`0 0 ${W} ${H}`); $(\"#z-fit\").textContent=Math.round(zoom*100)+\"%\"; }\nfunction world(e){ const pt=stage.createSVGPoint(); pt.x=e.clientX; pt.y=e.clientY; const m=stage.getScreenCTM().inverse(); const r=pt.matrixTransform(m); return {x:r.x,y:r.y}; }\n\n/* ================================================================\n   Tools\n================================================================ */\nconst ICON={\n  select:`\u003cpath d=\"M5 3l12 8-5 1.2L14.5 18l-2.2 1-2.6-5.7L6 17z\"/>`,\n  bond:`\u003cpath d=\"M4 18L12 6l8 12\"/>`,\n  atom:`\u003ctext x=\"12\" y=\"17\" text-anchor=\"middle\" font-size=\"15\" font-family=\"Arial\" stroke=\"none\" fill=\"currentColor\" style=\"fill:var(--ink)\">N\u003c/text>`,\n  ring:`\u003cpath d=\"M12 3l7.8 4.5v9L12 21l-7.8-4.5v-9z\"/>`,\n  charge:`\u003ccircle cx=\"12\" cy=\"12\" r=\"7.5\"/>\u003cpath d=\"M12 8.5v7M8.5 12h7\"/>`,\n  lp:`\u003ccircle cx=\"9\" cy=\"12\" r=\"1.6\" style=\"fill:var(--ink)\"/>\u003ccircle cx=\"15\" cy=\"12\" r=\"1.6\" style=\"fill:var(--ink)\"/>`,\n  radical:`\u003ccircle cx=\"12\" cy=\"12\" r=\"2.2\" style=\"fill:var(--ink)\"/>`,\n  arrow:`\u003cpath d=\"M5 17C6 8 15 5 19 10\"/>\u003cpath d=\"M19 10l-4.5-.6M19 10l-.7 4.4\"/>`,\n  rxn:`\u003cpath d=\"M3 12h17M15 7l5 5-5 5\"/>`,\n  bracket:`\u003cpath d=\"M8 4H5v16h3M16 4h3v16h-3\"/>`,\n  text:`\u003cpath d=\"M5 6h14M12 6v13\"/>`,\n  erase:`\u003cpath d=\"M4 16l8-8 6 6-5 5H8z\"/>\u003cpath d=\"M13 19h7\"/>`,\n};\nconst TOOLS=[[\"select\",\"Select\"],[\"bond\",\"Bond\"],[\"atom\",\"Atom\"],[\"ring\",\"Ring\"],[\"charge\",\"Charge\"],[\"lp\",\"Lone pair\"],[\"radical\",\"Radical\"],[\"arrow\",\"e⁻ arrow\"],[\"rxn\",\"Reaction\"],[\"bracket\",\"TS bracket\"],[\"text\",\"Text\"],[\"erase\",\"Erase\"]];\nlet tool=\"bond\";\nconst opt={bond:\"1\", element:\"O\", ring:\"6a\", charge:\"+\", head:\"full\", color:\"#C62828\", rxn:\"forward\"};\nconst COLORS=[\"#000000\",\"#C62828\",\"#1565C0\",\"#2E7D32\",\"#8E24AA\"];\nfunction renderTools(){\n  $(\"#tools\").innerHTML=TOOLS.map(([k,l])=>`\u003cbutton class=\"tool\" data-t=\"${k}\" aria-pressed=\"${k===tool}\" title=\"${l}\">\u003csvg viewBox=\"0 0 24 24\" aria-hidden=\"true\">${ICON[k]}\u003c/svg>${l}\u003c/button>`).join(\"\");\n  renderSub();\n}\nfunction optBtns(key,list){ return list.map(([v,l])=>`\u003cbutton class=\"opt\" data-k=\"${key}\" data-v=\"${v}\" aria-pressed=\"${opt[key]===v}\">${l}\u003c/button>`).join(\"\"); }\nfunction renderSub(){\n  const sb=$(\"#subbar\"); let h=\"\";\n  if(tool===\"select\") h=`\u003cspan class=\"hint\">Drag an atom to move it, a bond to move its molecule, or drag on empty space to box-select. Double-click an atom or text to edit it.\u003c/span>`;\n  if(tool===\"bond\") h=optBtns(\"bond\",[[\"1\",\"Single\"],[\"2\",\"Double\"],[\"3\",\"Triple\"],[\"wedge\",\"Wedge\"],[\"hash\",\"Hash\"],[\"dash\",\"Partial (TS)\"],[\"partial2\",\"Partial double\"],[\"bold\",\"Bold\"]])+`\u003cspan class=\"hint\">Click or drag from an atom. Click a bond to change it.\u003c/span>`;\n  if(tool===\"atom\") h=optBtns(\"element\",[\"C\",\"H\",\"N\",\"O\",\"S\",\"P\",\"F\",\"Cl\",\"Br\",\"OH\",\"NH\",\"NH2\",\"Me\",\"R\"].map(x=>[x,x]).concat([[\"custom\",\"Custom…\"]]))+`\u003cspan class=\"hint\">Tip: hover an atom and press C, N, O, S, H…\u003c/span>`;\n  if(tool===\"ring\") h=optBtns(\"ring\",[[\"6a\",\"Benzene\"],[\"6\",\"Cyclohexane\"],[\"5\",\"Cyclopentane\"],[\"4\",\"Cyclobutane\"],[\"3\",\"Cyclopropane\"]])+`\u003cspan class=\"hint\">Click empty space, an atom, or a bond to fuse.\u003c/span>`;\n  if(tool===\"charge\") h=optBtns(\"charge\",[[\"+\",\"+\"],[\"-\",\"−\"],[\"δ+\",\"δ+\"],[\"δ-\",\"δ−\"],[\"2+\",\"2+\"],[\"2-\",\"2−\"],[\"\",\"Clear\"]])+`\u003cspan class=\"hint\">Click an atom.\u003c/span>`;\n  if(tool===\"lp\") h=`\u003cspan class=\"hint\">Click an atom to add lone pairs (cycles 0 to 3).\u003c/span>`;\n  if(tool===\"radical\") h=`\u003cspan class=\"hint\">Click an atom to toggle a radical electron.\u003c/span>`;\n  if(tool===\"arrow\") h=optBtns(\"head\",[[\"full\",\"Electron pair\"],[\"half\",\"Single electron\"]])+`\u003cspan style=\"display:inline-flex;gap:.35rem;margin-left:.4rem\">${COLORS.map(c=>`\u003cbutton class=\"swatch\" data-c=\"${c}\" style=\"background:${c}\" aria-label=\"Arrow colour ${c}\" aria-pressed=\"${opt.color===c}\">\u003c/button>`).join(\"\")}\u003c/span>\u003cspan class=\"hint\">Click the source (lone pair, bond or atom), then the target (atom, bond or empty space).\u003c/span>`;\n  if(tool===\"rxn\") h=optBtns(\"rxn\",[[\"forward\",\"→\"],[\"equil\",\"⇌\"],[\"resonance\",\"↔\"],[\"retro\",\"⇒\"],[\"dashed\",\"Dashed\"],[\"noreact\",\"No reaction\"]])+`\u003cspan class=\"hint\">Drag to draw. Hold Shift for free angles.\u003c/span>`;\n  if(tool===\"bracket\") h=`\u003cspan class=\"hint\">Drag a box around a transition state. The ‡ can be edited in the side panel.\u003c/span>`;\n  if(tool===\"text\") h=`\u003cspan class=\"hint\">Click to place text. Supports x^{sup}, x_{sub}, \\\\Delta, \\\\ddag, \\\\alpha, \\\\to.\u003c/span>`;\n  if(tool===\"erase\") h=`\u003cspan class=\"hint\">Click anything to delete it.\u003c/span>`;\n  sb.innerHTML=h;\n}\n$(\"#tools\").addEventListener(\"click\",e=>{ const b=e.target.closest(\".tool\"); if(!b) return; setTool(b.dataset.t); });\nfunction setTool(t){ tool=t; pending=null; renderTools(); renderOverlay(); }\n$(\"#subbar\").addEventListener(\"click\",async e=>{\n  const sw=e.target.closest(\".swatch\"); if(sw){ opt.color=sw.dataset.c; renderSub(); return; }\n  const b=e.target.closest(\".opt\"); if(!b) return;\n  if(b.dataset.k===\"element\"&&b.dataset.v===\"custom\"){ const v=await ask(\"Atom label\",\"\",\"Any text: Ser160, Enz, OMe, R'. Digits become subscripts, + and − superscripts.\"); if(v==null) return; opt.element=\"custom:\"+v.trim(); renderSub(); toast(`Label \"${v.trim()}\" ready; click atoms to apply`); return; }\n  opt[b.dataset.k]=b.dataset.v; renderSub();\n});\n\n/* ================================================================\n   Selection and hit testing\n================================================================ */\nconst sel=new Set(); // \"a:id\", \"b:id\", \"e:id\" (curved), \"r:id\", \"t:id\", \"k:id\"\nlet pending=null, drag=null, hoverP=null, preview=null;\nfunction segDist(p,a,b){ const dx=b.x-a.x,dy=b.y-a.y; const l2=dx*dx+dy*dy||1; let t=((p.x-a.x)*dx+(p.y-a.y)*dy)/l2; t=Math.max(0,Math.min(1,t)); return Math.hypot(p.x-a.x-t*dx,p.y-a.y-t*dy); }\nfunction hitLP(p){ for(const a of S.atoms){ if(!a.lp) continue; const d=decor(a); for(let i=0;i\u003cd.lps.length;i++) if(dist(p,d.lps[i])\u003c7) return {t:\"lp\",id:a.id,i}; } return null; }\nfunction hitBond(p,tol=6){ let best=null,bd=tol; for(const b of S.bonds){ const a=A(b.a),c=A(b.b); if(!a||!c) continue; const d=segDist(p,a,c); if(d\u003cbd){bd=d;best=b;} } return best; }\nfunction hitCurved(p){ for(const ar of S.arrows){ const g=arrowGeom(ar); if(!g) continue; for(let i=0;i\u003c=24;i++){ const t=i/24, u=1-t; const q={x:u*u*g.S0.x+2*u*t*g.C.x+t*t*g.E0.x,y:u*u*g.S0.y+2*u*t*g.C.y+t*t*g.E0.y}; if(dist(p,q)\u003c7) return ar; } } return null; }\nfunction textBox(t){ const fs=t.size||18; const w=textW(macro(t.text).replace(/[\\^_{}]/g,\"\"),fs); const x0= t.anchor===\"start\"? t.x : t.x-w/2; return {x:x0,y:t.y-fs*.85,w,h:fs*1.1}; }\nfunction hitText(p){ return S.texts.find(t=>{ const b=textBox(t); return p.x>=b.x-4&&p.x\u003c=b.x+b.w+4&&p.y>=b.y-4&&p.y\u003c=b.y+b.h+4; }); }\nfunction hitRxn(p){ return S.rxns.find(r=>segDist(p,{x:r.x1,y:r.y1},{x:r.x2,y:r.y2})\u003c8 || (r.above||r.below)&&dist(p,{x:(r.x1+r.x2)/2,y:(r.y1+r.y2)/2})\u003c18); }\nfunction hitBracket(p){ return S.brackets.find(k=>{ const x1=Math.min(k.x1,k.x2),x2=Math.max(k.x1,k.x2),y1=Math.min(k.y1,k.y2),y2=Math.max(k.y1,k.y2);\n  return p.y>=y1-6&&p.y\u003c=y2+6&&(Math.abs(p.x-x1)\u003c8||Math.abs(p.x-x2)\u003c8) || Math.abs(p.y-y1)\u003c6&&(p.x-x1\u003c12&&p.x>=x1-4 || x2-p.x\u003c12&&p.x\u003c=x2+4) || Math.abs(p.y-y2)\u003c6&&(p.x-x1\u003c12&&p.x>=x1-4 || x2-p.x\u003c12&&p.x\u003c=x2+4); }); }\nfunction hitHandle(p){ for(const k of sel){ if(k[0]!==\"e\") continue; const ar=S.arrows.find(x=>x.id===k.slice(2)); if(!ar) continue; const g=arrowGeom(ar); if(g&&dist(p,g.mid)\u003c10) return ar; }\n  for(const k of sel){ if(k[0]!==\"r\") continue; const r=S.rxns.find(x=>x.id===k.slice(2)); if(!r) continue; if(dist(p,{x:r.x1,y:r.y1})\u003c9) return {rxn:r,end:1}; if(dist(p,{x:r.x2,y:r.y2})\u003c9) return {rxn:r,end:2}; }\n  return null; }\nfunction hitAny(p){\n  const ar=hitCurved(p); const a=nearAtom(p,11);\n  if(a) return (function(){
  const stage=document.getElementById("stage"), nav=document.getElementById("nav");
  const KEY="suite."+SUITE.id+".tab", frames={};
  function docFor(app){
    let doc=app.html;
    for(const k in SHARED){ const ph="/*__SHARED_"+k+"__*/"; if(doc.includes(ph)) doc=doc.replace(ph,()=>SHARED[k]); }
    return doc;
  }
  function frame(app){
    if(frames[app.id]) return frames[app.id];
    const f=document.createElement("iframe");
    f.title=app.label; f.setAttribute("allow","clipboard-read; clipboard-write; web-share");
    f.addEventListener("load",()=>{f.dataset.ready="1"},{once:true});
    f.srcdoc=docFor(app); stage.appendChild(f); frames[app.id]=f;
    return f;
  }
  function show(id){
    const app=APPS.find(a=>a.id===id)||APPS[0];
    frame(app);
    for(const k in frames) frames[k].classList.toggle("on",k===app.id);
    nav.querySelectorAll("button[data-id]").forEach(b=>{
      if(b.dataset.id===app.id) b.setAttribute("aria-current","page"); else b.removeAttribute("aria-current");
    });
    document.title=app.label+" - "+SUITE.title;
    try{localStorage.setItem(KEY,app.id)}catch(_){}

    return app;
  }

  window.suiteHas=id=>APPS.some(a=>a.id===id);
  window.suiteReload=id=>{const f=frames[id]; if(!f) return; f.dataset.ready="";
    f.addEventListener("load",()=>{f.dataset.ready="1"},{once:true}); f.srcdoc=docFor(APPS.find(a=>a.id===id)); };
  window.suiteShow=id=>show(id);
  window.suiteSend=(id,msg)=>{
    const app=show(id), f=frames[app.id];
    const deliver=()=>{try{f.contentWindow.suiteReceive&&f.contentWindow.suiteReceive(msg)}catch(e){console.warn(e)}};
    if(f.dataset.ready) deliver(); else f.addEventListener("load",deliver,{once:true});
  };
  nav.addEventListener("click",e=>{
    const b=e.target.closest("button"); if(!b) return;
    if(b.dataset.act==="backup"){ window.suiteBackup&&window.suiteBackup.open(); return; }
    if(b.dataset.act==="home"){ location.href="control-center.html"; return; }
    const app=show(b.dataset.id); try{frames[app.id].contentWindow.focus()}catch(_){}

    const bs=[...nav.querySelectorAll("button[data-id]")], i=bs.indexOf(document.activeElement);
    if(i<0) return;
    const step={ArrowRight:1,ArrowDown:1,ArrowLeft:-1,ArrowUp:-1}[e.key];

<script>

(function(){

    if(!Object.keys(json).length&&!Object.keys(text).length) return null;

  }

  const size=b=>b<1024?b+" B":b<1048576?(b/1024).toFixed(b<10240?1:0)+" KB":(b/1048576).toFixed(1)+" MB";
  const ago=t=>{if(!t)return "never";const s=(Date.now()-t)/1000;if(s<60)return "just now";if(s<3600)return Math.floor(s/60)+" min ago";if(s<86400)return Math.floor(s/3600)+" h ago";const d=Math.floor(s/86400);return d===1?"yesterday":d+" days ago"};

      if(!f.classList.contains("on")||document.hidden) return false;
      const ae=d.activeElement;
      return !!ae&&/^(INPUT|TEXTAREA|SELECT)$/.test(ae.tagName)&&!/^(search|checkbox|radio|button|file|range)$/.test(ae.type||"");
    }catch(_){return false}
  }
  function flush(){
    for(const id of [...pending]){
      const f=frameOf(id);
      if(!f){pending.delete(id);continue}
      if(f.dataset.ready!=="1"||busy(f)) continue;
      pending.delete(id);
      const seen=f.classList.contains("on")&&!document.hidden;
      window.suiteReload(id);
      if(seen) say(labelOf(id)+" updated with changes made elsewhere");
    }
    if(pending.size&&!timer) timer=setInterval(()=>{flush();if(!pending.size){clearInterval(timer);timer=null}},1500);
  }
  window.addEventListener("storage",e=>{
    try{if(e.storageArea&&e.storageArea!==localStorage)return}catch(_){}
    const k=e.key, list=k==null?null:mine[k];
    let writer=null;
    if(list){const h=fnv(e.newValue);for(let i=list.length-1;i>=0;i--)if(list[i].h===h){writer=list[i].app;break}}
    if(k!=null&&!writer) delete mine[k];
    for(const id in SYNC){
      if(k!=null&&!owns(id,k)) continue;
      if(writer===id) continue;
      pending.add(id);
    }
    if(pending.size) setTimeout(flush,50);
  });
  document.addEventListener("visibilitychange",()=>{if(!document.hidden&&pending.size)flush()});
  /* data that arrived from another device through suite-sync.js */
  window.addEventListener("suite-sync-applied",e=>{
    const keys=(e.detail&&e.detail.keys)||[];
    for(const id in SYNC) if(keys.some(k=>owns(id,k))) pending.add(id);
    if(pending.size) setTimeout(flush,50);
  });

  /* hand-off from the control center: open this app filtered to one item */
  const qs=new URLSearchParams(location.search), find=qs.get("find"), pick=qs.get("pick"), load=qs.get("load");
  if(load){
    history.replaceState(null,"",location.pathname+location.hash);
    const m=/^(pdb|af|pubchem):(.+)$/i.exec(load);
    if(m&&window.suiteHas&&window.suiteHas("viewer")) window.suiteSend("viewer",{type:"fetch",src:m[1].toLowerCase(),id:m[2]});
  }else if(find!=null||pick){
    history.replaceState(null,"",location.pathname+location.hash);
    const id=location.hash.slice(1), f=frameOf(id);
    const apply=()=>{try{
      const d=f.contentDocument; if(!d) return;
      const sel=pick&&PICKS[id]&&PICKS[id][pick];
      if(sel){const b=d.querySelector(sel);if(b&&!(id==="deadlines"&&!/^show/i.test(b.textContent.trim())))b.click()}
      const box=find!=null?d.getElementById(SEARCH[id]||"search"):null;
      if(box){box.value=find;box.dispatchEvent(new Event("input",{bubbles:true}))}
    }catch(_){}};
    if(f){if(f.dataset.ready==="1")setTimeout(apply,150);else f.addEventListener("load",()=>setTimeout(apply,150),{once:true})}
  }

  /* a way back to the control center from the Backup sheet */
  const bar=document.querySelector("#bkDlg .bk-bar");
  if(bar&&!document.getElementById("bkHub")){
    const a=document.createElement("a");a.id="bkHub";a.className="bk-btn";a.href="control-center.html";a.textContent="Control center";
    a.style.cssText="text-decoration:none;display:inline-flex;align-items:center";bar.appendChild(a);
  }
})();
</script>
<!-- suite-live-sync:end -->
</body>
</html>
