<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<script src="suite-theme.js" data-suite-theme></script>
<script src="suite-sync.js"></script>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, interactive-widget=resizes-content">
<meta name="theme-color" content="#5A4360">
<meta name="color-scheme" content="dark">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="QTask">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="manifest" href="app.webmanifest">

<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<title>Paper kit - QTask</title>
<style>
:root{
  color-scheme:dark;
  --bg:var(--t-bg,#000000);--ink:var(--t-ink,#F2F2F4);--muted:var(--t-muted,#9D9DA5);--line:var(--t-faint,#28282E);--accent:var(--t-accent,#EBA8E4);
  --grad:linear-gradient(90deg,var(--t-grad1,#F0A8DC) 0%,var(--t-grad2,#C9B6EF) 50%,var(--t-grad3,#A6CCF5) 100%);
  --font:Roboto,"Google Sans",system-ui,-apple-system,"Segoe UI",sans-serif;
}
*,*::before,*::after{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{height:100%}
body{
  margin:0;height:100%;height:100dvh;display:grid;grid-template-rows:minmax(0,1fr) auto;
  padding-top:env(safe-area-inset-top,0px);
  background:var(--t-bg,#000) linear-gradient(var(--t-head,#5A4360),var(--t-head,#5A4360)) top/100% env(safe-area-inset-top,0px) no-repeat;
  color:var(--ink);font-family:var(--font);
}
.stage{position:relative;min-height:0;min-width:0}
/* inactive frames stay laid out (visibility, not display) so 3D canvases keep their size */
.stage iframe{position:absolute;inset:0;width:100%;height:100%;border:0;background:var(--t-bg,#000);visibility:hidden;pointer-events:none}
.stage iframe.on{visibility:visible;pointer-events:auto}
nav{display:flex;gap:2px;background:var(--t-bg,#000);border-top:1px solid var(--line);
  padding:6px 6px calc(6px + env(safe-area-inset-bottom,0px))}
nav button{flex:1 1 0;min-width:0;min-height:58px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;
  background:none;border:0;color:var(--muted);font:inherit;font-size:.74rem;cursor:pointer;padding:2px}
nav .ic{width:100%;max-width:56px;height:30px;border-radius:999px;display:grid;place-items:center}
nav svg{width:22px;height:22px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
nav .lb{max-width:100%;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
nav button[aria-current="page"]{color:var(--ink);font-weight:500}
nav button[aria-current="page"] .ic{background:var(--grad);color:var(--t-on-grad,#17161C)}
nav button:focus-visible{outline:2px solid var(--accent);outline-offset:-2px;border-radius:12px}
@media (prefers-reduced-motion:no-preference){nav .ic{transition:background-color .15s}}
nav .util .ic{position:relative}
nav .util[data-state="ok"] .ic::after,nav .util[data-state="err"] .ic::after{content:"";position:absolute;top:3px;right:12px;width:8px;height:8px;border-radius:50%;background:var(--t-green,#7DCB9C);box-shadow:0 0 0 2px var(--t-bg,#000)}
nav .util[data-state="err"] .ic::after{background:var(--t-danger,#EF5A50)}
dialog{border:0;padding:0;background:var(--t-raised,#1D1D22);color:var(--ink);width:100%;max-width:560px;margin:auto auto 0;border-radius:20px 20px 0 0;max-height:92vh;font-family:var(--font)}
@media (min-width:600px){dialog{margin:auto;border-radius:20px}}
dialog::backdrop{background:var(--t-backdrop,rgba(0,0,0,.6))}
.sheet{padding:20px 20px calc(20px + env(safe-area-inset-bottom,0px));display:flex;flex-direction:column;gap:14px}
.sheet h2{margin:0;font-size:1.15rem;font-weight:700}
.sheet p{margin:0}
.sheet .note{font-size:.85rem;color:var(--muted);line-height:1.45}
.sheet .warn{font-size:.85rem;color:var(--t-gold,#E6C170);background:var(--t-pinbg,#2A2413);border-radius:12px;padding:10px 12px;line-height:1.45}
.sheet .warn code,.sheet .note code{font-family:"Roboto Mono",ui-monospace,Menlo,monospace;font-size:.8rem}
.sw{display:flex;align-items:center;justify-content:space-between;gap:12px;background:var(--t-surface,#131316);border-radius:14px;padding:12px 14px;min-height:56px;cursor:pointer}
.sw input{appearance:none;width:46px;height:28px;border-radius:999px;background:var(--t-edge,#3B3B43);position:relative;flex:0 0 auto;cursor:pointer;margin:0}
.sw input::after{content:"";position:absolute;top:3px;left:3px;width:22px;height:22px;border-radius:50%;background:var(--t-knob,#F2F2F4);transition:left .15s}
.sw input:checked{background:var(--grad)}
.sw input:checked::after{left:21px;background:var(--t-on-grad,#17161C)}
.sw input:disabled{opacity:.4}
.bk-list{display:flex;flex-direction:column;gap:6px}
.bk-row{background:var(--t-surface,#131316);border-radius:12px;padding:10px 12px}
.bk-row b{display:block;font-weight:500}
.bk-row span{display:block;font-size:.8rem;color:var(--muted);overflow-wrap:anywhere}
.bk-row span.err{color:var(--t-danger,#EF5A50)}
.bk-bar{display:flex;gap:8px;flex-wrap:wrap}
.bk-btn{border:0;border-radius:12px;padding:12px 16px;min-height:48px;background:var(--t-surface,#131316);color:var(--ink);font:inherit;cursor:pointer}
.bk-btn.primary{background:var(--grad);color:var(--t-on-grad,#17161C);font-weight:700}
.bk-btn:disabled{opacity:.45;cursor:default}
.bk-sel{background:var(--t-field,#0F0F12);border:1.5px solid var(--t-line,#2E2E35);border-radius:12px;padding:12px;min-height:48px;color:var(--ink);font:inherit;flex:1;min-width:0}
.bk-files{display:flex;flex-direction:column;gap:6px;max-height:36vh;overflow-y:auto}
.bk-files button{text-align:left;border:0;background:var(--t-surface,#131316);color:var(--ink);border-radius:12px;padding:10px 12px;font:inherit;cursor:pointer}
.bk-files button small{display:block;color:var(--muted);font-size:.78rem}
.sheet h3{margin:6px 0 -4px;font-size:.85rem;font-weight:500;color:var(--accent)}
.bk-toast{position:fixed;left:50%;bottom:calc(96px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--t-raised2,#26262C);color:var(--ink);padding:10px 16px;border-radius:12px;font-size:.9rem;opacity:0;pointer-events:none;transition:opacity .2s;max-width:90vw;text-align:center;z-index:10}
.bk-toast.show{opacity:1}
@media (min-width:900px){
  body{grid-template-rows:minmax(0,1fr);grid-template-columns:auto minmax(0,1fr)}
  nav{order:-1;flex-direction:column;justify-content:flex-start;gap:10px;width:96px;border-top:0;border-right:1px solid var(--line);
    padding:18px 6px calc(18px + env(safe-area-inset-bottom,0px))}
  nav button{flex:none}
}
</style>
</head>
<body>
<main class="stage" id="stage"></main>
<nav id="nav" aria-label="Paper kit apps">
  <button type="button" class="util home" data-act="home" title="Back to the control center"><span class="ic"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 11l9-7 9 7"/><path d="M5.5 9.5V20h13V9.5"/><path d="M10 20v-5.5h4V20"/></svg></span><span class="lb">Home</span></button>
  <button type="button" data-id="plots"><span class="ic"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 20V4"/><path d="M4 20h16"/><path d="M8 16v-4M12 16V8M16 16v-6"/></svg></span><span class="lb">Plot guide</span></button>
  <button type="button" data-id="schemes"><span class="ic"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 17c0-6 4-10 11-10"/><path d="M13 4l3 3-3 3"/><circle cx="5" cy="19" r="1.5"/></svg></span><span class="lb">Schemes</span></button>
  <button type="button" class="util" data-act="backup" aria-haspopup="dialog"><span class="ic"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 3v11"/><path d="M8 10l4 4 4-4"/><path d="M4 15v3a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2v-3"/></svg></span><span class="lb">Backup</span></button>
</nav>
<script>
const SUITE={"id": "paper-kit", "title": "Paper kit"};
const SHARED={};
const APPS=[{"id": "plots", "label": "Plot guide", "html": "\u003c!DOCTYPE html>\n\u003chtml lang=\"en\">\n\u003chead>\n\u003cmeta charset=\"UTF-8\">\n\u003cscript src=\"suite-theme.js\" data-suite-theme>\u003c/script>\n\u003cmeta name=\"viewport\" content=\"width=device-width, initial-scale=1, viewport-fit=cover\">\n\u003ctitle>Python plot guide\u003c/title>\n\u003cmeta name=\"theme-color\" content=\"#5A4360\">\n\u003cmeta name=\"color-scheme\" content=\"dark\">\n\u003cstyle>\n:root{\n  color-scheme:dark;\n  box-sizing:border-box;\n  padding-top:env(safe-area-inset-top,0px);\n  padding-bottom:env(safe-area-inset-bottom,0px);\n  --bg:var(--t-bg,#000000); --surface:var(--t-surface,#131316); --border:var(--t-line,#2E2E35);\n  --text:var(--t-ink,#F2F2F4); --muted:var(--t-muted,#9D9DA5); --accent:var(--t-accent,#EBA8E4); --accent-ink:var(--t-on-grad,#17161C);\n  --grad:linear-gradient(90deg,var(--t-grad1,#F0A8DC) 0%,var(--t-grad2,#C9B6EF) 50%,var(--t-grad3,#A6CCF5) 100%);\n  --c-distribution:var(--t-accent2,#A7CBF4); --c-relationship:var(--t-green,#7DCB9C); --c-comparison:var(--t-gold,#E6C170);\n  --c-composition:var(--t-violet,#C3A6F0); --c-trend:var(--t-pink,#EE93AF); --c-hierarchy:var(--t-blue,#9DB2FF);\n  --c-geospatial:var(--t-teal,#8CC3CC); --c-specialized:var(--t-accent,#EBA8E4);\n}\nhtml{scroll-padding-top:env(safe-area-inset-top,0px);}\n*{box-sizing:border-box;}\nbody{\n  margin:0; background:var(--bg) repeating-linear-gradient(0deg,var(--bg-line) 0 1px,transparent 1px 28px),\n  repeating-linear-gradient(90deg,var(--bg-line) 0 1px,transparent 1px 28px);\n  color:var(--text); font-family:\"Public Sans\",system-ui,sans-serif; line-height:1.5;\n}\nheader{max-width:920px; margin:0 auto; padding:48px 24px 20px;}\nh1{\n  font-family:\"Newsreader\",Georgia,serif; font-style:italic; font-weight:500;\n  font-size:clamp(30px,5vw,44px); margin:0 0 10px; letter-spacing:-0.01em; max-width:14ch;\n}\nheader p{color:var(--muted); font-size:16px; max-width:56ch; margin:0;}\n.controls{\n  position:sticky; top:env(safe-area-inset-top,0px); z-index:5; background:var(--bg);\n  border-bottom:1px solid var(--border); padding:14px 24px; margin-top:24px;\n}\n.controls-inner{max-width:920px; margin:0 auto;}\n#search{\n  width:100%; font:inherit; font-size:15px; padding:10px 14px; border:1px solid var(--border);\n  border-radius:3px; background:var(--surface); color:var(--text); margin-bottom:12px;\n}\n#search:focus{outline:2px solid var(--accent); outline-offset:1px;}\n.chips{display:flex; flex-wrap:wrap; gap:8px;}\n.chip{\n  font:inherit; font-size:13px; padding:6px 12px; border-radius:3px; border:1px solid var(--border);\n  background:var(--surface); color:var(--muted); cursor:pointer;\n}\n.chip.active{background:var(--accent); color:var(--accent-ink); border-color:var(--accent);}\n.chip:focus-visible{outline:2px solid var(--accent); outline-offset:1px;}\nmain{max-width:920px; margin:0 auto; padding:24px;}\n.grid{display:grid; grid-template-columns:repeat(auto-fill,minmax(240px,1fr)); gap:14px;}\n.card{\n  --accent-cat:var(--accent);\n  background:var(--surface); border:1px solid var(--border); border-left:3px solid var(--accent-cat);\n  border-radius:3px; padding:14px 16px;\n}\n.card[data-cat=\"distribution\"]{--accent-cat:var(--c-distribution);}\n.card[data-cat=\"relationship\"]{--accent-cat:var(--c-relationship);}\n.card[data-cat=\"comparison\"]{--accent-cat:var(--c-comparison);}\n.card[data-cat=\"composition\"]{--accent-cat:var(--c-composition);}\n.card[data-cat=\"trend\"]{--accent-cat:var(--c-trend);}\n.card[data-cat=\"hierarchy\"]{--accent-cat:var(--c-hierarchy);}\n.card[data-cat=\"geospatial\"]{--accent-cat:var(--c-geospatial);}\n.card[data-cat=\"specialized\"]{--accent-cat:var(--c-specialized);}\n.icon{width:48px; height:32px; color:var(--accent-cat); fill:currentColor; display:block; margin-bottom:8px;}\n.card h3{margin:0 0 4px; font-size:16px; font-weight:600;}\n.card p{margin:0 0 10px; font-size:13.5px; color:var(--muted);}\n.meta{display:flex; flex-wrap:wrap; gap:6px; align-items:center;}\n.tag{font-size:11.5px; padding:2px 8px; border-radius:20px; background:var(--bg); border:1px solid var(--border); color:var(--text);}\n.lib{font-size:11.5px; color:var(--muted); margin-left:auto;}\n.empty{display:none; color:var(--muted); padding:40px 0; text-align:center;}\nfooter{max-width:920px; margin:0 auto; padding:8px 24px 48px; color:var(--muted); font-size:12.5px;}\n\n/* ---- Theme: dark with pink-to-blue accents (shared with research-log) ---- */\nbody{background-color:var(--t-bg,#000);background-image:linear-gradient(172deg,var(--t-head,#5A4360) 0%,var(--t-head2,#352C3F) 90px,var(--t-head3,#15121A) 210px,var(--t-bg,#000) 320px);background-repeat:no-repeat;background-size:100% 340px}\nbody{font-family:Roboto,\"Google Sans\",system-ui,-apple-system,\"Segoe UI\",sans-serif}\nheader{padding:16px 24px 12px}\nh1{font-family:Roboto,\"Google Sans\",system-ui,-apple-system,\"Segoe UI\",sans-serif;font-style:normal;font-weight:500;font-size:1.85rem;margin:4px 0 4px;max-width:none}\n.controls{background:var(--t-bg,#000);border-bottom-color:var(--t-faint,#28282E)}\n#search{background:var(--t-field,#0E0E11);border:1.5px solid var(--t-line,#2E2E35);border-radius:999px}\n#search:focus{border-color:var(--t-focus,#9C8BC0);outline:none}\n.chip{background:var(--t-bg,#000);border:1.5px solid var(--t-edge,#3B3B43);color:var(--text);border-radius:999px}\n.chip.active{background:var(--grad);border-color:transparent;color:var(--t-on-grad,#17161C);font-weight:500}\n.card{border-color:var(--t-faint,#28282E);border-left-width:3px;border-radius:14px}\n.tag{background:var(--t-bg,#000);border-color:var(--t-edge,#3B3B43)}\n/* ---- example scripts ---- */\n.card{cursor:pointer}\n.card:hover{border-color:var(--accent-cat)}\n.card:focus-visible{outline:2px solid var(--accent);outline-offset:2px}\n#codeDlg{border:1px solid var(--border);border-radius:16px;background:var(--surface);color:var(--text);padding:0;width:min(860px,calc(100vw - 24px));max-height:90vh;max-height:90dvh}\n#codeDlg::backdrop{background:var(--t-backdrop,rgba(0,0,0,.6))}\n#codeDlg[open]{display:flex;flex-direction:column}\n.cd-head{display:flex;gap:12px;align-items:flex-start;justify-content:space-between;padding:16px 18px 4px}\n.cd-head h2{margin:0;font-size:1.15rem;font-weight:600}\n.cd-head p{margin:4px 0 0;color:var(--muted);font-size:.9rem}\n.cd-x{border:0;background:none;color:var(--muted);font-size:1.1rem;min-width:40px;min-height:40px;border-radius:10px;cursor:pointer}\n.cd-uses{margin:0;padding:4px 18px 10px;color:var(--muted);font-size:.82rem}\n.cd-uses code{font-family:\"Roboto Mono\",ui-monospace,Menlo,monospace;color:var(--text)}\n.cd-code{margin:0 18px;padding:12px 14px;background:var(--bg);border:1px solid var(--border);border-radius:10px;overflow:auto;flex:1;min-height:120px;\n  font:12.5px/1.5 \"Roboto Mono\",\"Droid Sans Mono\",ui-monospace,Menlo,Consolas,monospace;white-space:pre;tab-size:4}\n.cd-bar{display:flex;gap:8px;align-items:center;padding:12px 18px 16px;flex-wrap:wrap}\n.cd-btn{border:1.5px solid var(--t-edge,#3B3B43);background:var(--t-bg,#000);color:var(--text);border-radius:12px;padding:10px 16px;min-height:44px;font:inherit;cursor:pointer}\n.cd-btn.primary{background:var(--grad);border-color:transparent;color:var(--t-on-grad,#17161C);font-weight:500}\n.cd-flash{color:var(--muted);font-size:.85rem}\n\u003c/style>\n\u003c/head>\n\u003cbody>\n\n\u003csvg width=\"0\" height=\"0\" style=\"position:absolute\" aria-hidden=\"true\">\n\u003cdefs>\n\u003csymbol id=\"i-hist\" viewBox=\"0 0 48 32\">\u003crect x=\"2\" y=\"20\" width=\"5\" height=\"10\"/>\u003crect x=\"9\" y=\"14\" width=\"5\" height=\"16\"/>\u003crect x=\"16\" y=\"6\" width=\"5\" height=\"24\"/>\u003crect x=\"23\" y=\"10\" width=\"5\" height=\"20\"/>\u003crect x=\"30\" y=\"18\" width=\"5\" height=\"12\"/>\u003crect x=\"37\" y=\"24\" width=\"5\" height=\"6\"/>\u003c/symbol>\n\u003csymbol id=\"i-kde\" viewBox=\"0 0 48 32\">\u003cpath d=\"M2 egory.\u003c/p>\u003cdiv class=\"meta\">\u003cspan class=\"tag\">numeric by category\u003c/span>\u003cspan class=\"lib\">seaborn · matplotlib\u003c/span>\u003c/div>\u003c/div>\n\n\u003cdiv class=\"card\" data-cat=\"distribution\" data-search=\"violin plot distribution shape category seaborn\" data-id=\"violin\" tabindex=\"0\" role=\"button\" aria-haspopup=\"dialog\">\u003csvg class=\"icon\">\u003cuse href=\"#i-violin\">\u003c/use>\u003c/svg>\u003ch3>Violin plot\u003c/h3>\u003cp>A box plot with the full distribution shape mirrored around it, per category.\u003c/p>\u003cdiv class=\"meta\">\u003cspan class=\"tag\">numeric by category\u003c/span>\u003cspan class=\"lib\">seaborn\u003c/span>\u003c/div>\u003c/div>\n\n\u003cdiv class=\"card\" data-cat=\"distribution\" data-search=\"strip plot swarm plot individual points category small dataset seaborn\" data-id=\"swarm\" tabindex=\"0\" role=\"button\" aria-haspopup=\"dialog\">\u003csvg class=\"icon\">\u003cuse href=\"#i-strip\">\u003c/use>\u003c/svg>\u003ch3>Strip / swarm plot\u003c/h3>\u003cp>Every individual data point plotted by category, best for small to medium datasets.\u003c/p>\u003cdiv class=\"meta\">\u003cspan class=\"tag\">numeric by category\u003c/span>\u003cspan class=\"lib\">seaborn\u003c/span>\u003c/div>\u003c/div>\n\n\u003cdiv class=\"card\" data-cat=\"distribution\" data-search=\"ecdf empirical cumulative distribution function numeric statsmodels seaborn\" data-id=\"ecdf\" tabindex=\"0\" role=\"button\" aria-haspopup=\"dialog\">\u003csvg class=\"icon\">\u003cuse href=\"#i-ecdf\">\u003c/use>\u003c/svg>\u003ch3>ECDF plot\u003c/h3>\u003cp>The cumulative proportion of data falling below each value, no binning choices needed.\u003c/p>\u003cdiv class=\"meta\">\u003cspan class=\"tag\">1 numeric\u003c/span>\u003cspan class=\"lib\">seaborn · statsmodels\u003c/span>\u003c/div>\u003c/div>\n\n\u003cdiv class=\"card\" data-cat=\"relationship\" data-search=\"scatter plot two numeric variables correlation matplotlib seaborn\" data-id=\"scatter\" tabindex=\"0\" role=\"button\" aria-haspopup=\"dialog\">\u003csvg class=\"icon\">\u003cuse href=\"#i-scatter\">\u003c/use>\u003c/svg>\u003ch3>Scatter plot\u003c/h3>\u003cp>How two numeric variables relate to each other, point by point.\u003c/p>\u003cdiv class=\"meta\">\u003cspan class=\"tag\">2 numeric\u003c/span>\u003cspan class=\"lib\">matplotlib · seaborn\u003c/span>\u003c/div>\u003c/div>\n\n\u003cdiv class=\"card\" data-cat=\"relationship\" data-search=\"bubble chart three numeric variables size matplotlib plotly\" data-id=\"bubble\" tabindex=\"0\" role=\"button\" aria-haspopup=\"dialog\">\u003csvg class=\"icon\">\u003cuse href=\"#i-bubble\">\u003c/use>\u003c/svg>\u003ch3>Bubble chart\u003c/h3>\u003cp>A scatter plot with a third numeric variable mapped to point size.\u003c/p>\u003cdiv class=\"meta\">\u003cspan class=\"tag\">3 numeric\u003c/span>\u003cspan class=\"lib\">matplotlib · plotly\u003c/span>\u003c/div>\u003c/div>\n\n\u003cdiv class=\"card\" data-cat=\"relationship\" data-search=\"pair plot scatter matrix many numeric variables pairwise seaborn\" data-id=\"pairplot\" tabindex=\"0\" role=\"button\" aria-haspopup=\"dialog\">\u003csvg class=\"icon\">\u003cuse href=\"#i-pair\">\u003c/use>\u003c/svg>\u003ch3>Pair plot\u003c/h3>\u003cp>Every pairwise scatter plot between several numeric columns, laid out as a grid.\u003c/p>\u003cdiv class=\"meta\">\u003cspan class=\"tag\">3+ numeric\u003c/span>\u003cspan class=\"lib\">seaborn\u003c/span>\u003c/div>\u003c/div>\n\n\u003cdiv class=\"card\" data-cat=\"relationship\" data-search=\"heatmap correlation matrix numeric variables strength seaborn matplotlib\" data-id=\"heatmap\" tabindex=\"0\" role=\"button\" aria-haspopup=\"dialog\">\u003csvg class=\"icon\">\u003cuse href=\"#i-heat\">\u003c/use>\u003c/svg>\u003ch3>Heatmap / correlation matrix\u003c/h3>\u003cp>How strongly many numeric variables relate to one another, shown as a color grid.\u003c/p>\u003cdiv class=\"meta\">\u003cspan class=\"tag\">numeric matrix\u003c/span>\u003cspan class=\"lib\">seaborn\u003c/span>\u003c/div>\u003c/div>\n\n\u003cdiv class=\"card\" data-cat=\"relationship\" data-search=\"hexbin plot two numeric large dataset overlapping points matplotlib\" data-id=\"hexbin\" tabindex=\"0\" role=\"button\" aria-haspopup=\"dialog\">\u003csvg class=\"icon\">\u003cuse href=\"#i-hex\">\u003c/use>\u003c/svg>\u003ch3>Hexbin plot\u003c/h3>\u003cp>A scatter plot alternative for very large datasets where points would overlap heavily.\u003c/p>\u003cdiv class=\"meta\">\u003cspan class=\"tag\">2 numeric, large n\u003c/span>\u003cspan class=\"lib\">matplotlib\u003c/span>\u003c/div>\u003c/div>\n\n\u003cdiv class=\"card\" data-cat=\"relationship\" data-search=\"3d scatter plot three numeric variables matplotlib plotly\" data-id=\"scatter3d\" tabindex=\"0\" role=\"button\" aria-haspopup=\"dialog\">\u003csvg class=\"icon\">\u003cuse href=\"#i-3d\">\u003c/use>\u003c/svg>\u003ch3>3D scatter plot\u003c/h3>\u003cp>Relationships among three numeric variables, plotted in three dimensions.\u003c/p>\u003cdiv class=\"meta\">\u003cspan class=\"tag\">3 numeric\u003c/span>\u003cspan class=\"lib\">matplotlib · plotly\u003c/span>\u003c/div>\u003c/div>\n\n\u003cdiv class=\"card\" data-cat=\"comparison\" data-search=\"bar chart categorical numeric compare category matplotlib seaborn pandas\" data-id=\"bar\" tabindex=\"0\" role=\"button\" aria-haspopup=\"dialog\">\u003csvg class=\"icon\">\u003cuse href=\"#i-bar\">\u003c/use>\u003c/svg>\u003ch3>Bar chart\u003c/h3>\u003cp>Compares a numeric value across a set of categories.\u003c/p>\u003cdiv class=\"meta\">\u003cspan class=\"tag\">categorical + numeric\u003c/span>\u003cspan class=\"lib\">matplotlib · seaborn\u003c/span>\u003c/div>\u003c/div>\n\n\u003cdiv class=\"card\" data-cat=\"comparison\" data-search=\"grouped bar chart clustered two categorical numeric subgroups seaborn pandas\" data-id=\"grouped_bar\" tabindex=\"0\" role=\"button\" aria-haspopup=\"dialog\">\u003csvg class=\"icon\">\u003cuse href=\"#i-gbar\">\u003c/use>\u003c/svg>\u003ch3>Grouped bar chart\u003c/h3>\u003cp>Compares a numeric value across two categorical dimensions side by side.\u003c/p>\u003cdiv class=\"meta\">\u003cspan class=\"tag\">2 categorical + numeric\u003c/span>\u003cspan class=\"lib\">seaborn · pandas\u003c/span>\u003c/div>\u003c/div>\n\n\u003cdiv class=\"card\" data-cat=\"comparison\" data-search=\"radar chart spider chart multivariate compare several metrics matplotlib\" data-id=\"radar\" tabindex=\"0\" role=\"button\" aria-haspopup=\"dialog\">\u003csvg class=\"icon\">\u003cuse href=\"#i-radar\">\u003c/use>\u003c/svg>\u003ch3>Radar / spider chart\u003c/h3>\u003cp>Compares several numeric metrics for one or more items on a circular axis.\u003c/p>\u003cdiv class=\"meta\">\u003cspan class=\"tag\">multivariate\u003c/span>\u003cspan class=\"lib\">matplotlib\u003c/span>\u003c/div>\u003c/div>\n\n\u003cdiv class=\"card\" data-cat=\"comparison\" data-search=\"error bar plot uncertainty margin confidence interval matplotlib\" data-id=\"errorbar\" tabindex=\"0\" role=\"button\" aria-haspopup=\"dialog\">\u003csvg class=\"icon\">\u003cuse href=\"#i-err\">\u003c/use>\u003c/svg>\u003ch3>Error bar plot\u003c/h3>\u003cp>A value plotted with its uncertainty or confidence interval shown as a bar.\u003c/p>\u003cdiv class=\"meta\">\u003cspan class=\"tag\">numeric + uncertainty\u003c/span>\u003cspan class=\"lib\">matplotlib\u003c/span>\u003c/div>\u003c/div>\n\n\u003cdiv class=\"card\" data-cat=\"composition\" data-search=\"pie chart donut chart share of whole few categories matplotlib plotly\" data-id=\"donut\" tabindex=\"0\" role=\"button\" aria-haspopup=\"dialog\">\u003csvg class=\"icon\">\u003cuse href=\"#i-pie\">\u003c/use>\u003c/svg>\u003ch3>Pie / donut chart\u003c/h3>\u003cp>Share of a whole across a small number of categories, best kept to five or fewer.\u003c/p>\u003cdiv class=\"meta\">\u003cspan class=\"tag\">categorical (few)\u003c/span>\u003cspan class=\"lib\">matplotlib · plotly\u003c/span>\u003c/div>\u003c/div>\n\n\u003cdiv class=\"card\" data-cat=\"composition\" data-search=\"stacked bar chart composition parts categories pandas matplotlib\" data-id=\"stacked_bar\" tabindex=\"0\" role=\"button\" aria-haspopup=\"dialog\">\u003csvg class=\"icon\">\u003cuse href=\"#i-sbar\">\u003c/use>\u003c/svg>\u003ch3>Stacked bar chart\u003c/h3>\u003cp>Shows how a total breaks down into parts, compared across categories.\u003c/p>\u003cdiv class=\"meta\">\u003cspan class=\"tag\">categorical parts\u003c/span>\u003cspan class=\"lib\">pandas · matplotlib\u003c/span>\u003c/div>\u003c/div>\n\n\u003cdiv class=\"card\" data-cat=\"composition\" data-search=\"stacked area chart composition over time trend matplotlib plotly\" data-id=\"stacked_area\" tabindex=\"0\" role=\"button\" aria-haspopup=\"dialog\">\u003csvg class=\"icon\">\u003cuse href=\"#i-sarea\">\u003c/use>\u003c/svg>\u003ch3>Stacked area chart\u003c/h3>\u003cp>How the parts of a whole change over time.\u003c/p>\u003cdiv class=\"meta\">\u003cspan class=\"tag\">composition over time\u003c/span>\u003cspan class=\"lib\">matplotlib · plotly\u003c/span>\u003c/div>\u003c/div>\n\n\u003cdiv class=\"card\" data-cat=\"composition\" data-search=\"treemap nested hierarchical categories sized value plotly squarify\" data-id=\"treemap\" tabindex=\"0\" role=\"button\" aria-haspopup=\"dialog\">\u003csvg class=\"icon\">\u003cuse href=\"#i-tree\">\u003c/use>\u003c/svg>\u003ch3>Treemap\u003c/h3>\u003cp>Nested categories sized by value, good for hierarchies with many small groups.\u003c/p>\u003cdiv class=\"meta\">\u003cspan class=\"tag\">hierarchical parts\u003c/span>\u003cspan class=\"lib\">plotly · squarify\u003c/span>\u003c/div>\u003c/div>\n\n\u003cdiv class=\"card\" data-cat=\"composition\" data-search=\"waterfall chart sequential positive negative cumulative changes plotly\" data-id=\"waterfall\" tabindex=\"0\" role=\"button\" aria-haspopup=\"dialog\">\u003csvg class=\"icon\">\u003cuse href=\"#i-water\">\u003c/use>\u003c/svg>\u003ch3>Waterfall chart\u003c/h3>\u003cp>The cumulative effect of a sequence of positive and negative changes.\u003c/p>\u003cdiv class=\"meta\">\u003cspan class=\"tag\">sequential values\u003c/span>\u003cspan class=\"lib\">plotly · matplotlib\u003c/span>\u003c/div>\u003c/div>\n\n\u003cdiv class=\"card\" data-cat=\"trend\" data-search=\"line plot time series trend numeric ordered axis matplotlib pandas\" data-id=\"line\" tabindex=\"0\" role=\"button\" aria-haspopup=\"dialog\">\u003csvg class=\"icon\">\u003cuse href=\"#i-line\">\u003c/use>\u003c/svg>\u003ch3>Line plot\u003c/h3>\u003cp>The trend of a numeric value across an ordered axis, usually time.\u003c/p>\u003cdiv class=\"meta\">\u003cspan class=\"tag\">time series\u003c/span>\u003cspan class=\"lib\">matplotlib · pandas\u003c/span>\u003c/div>\u003c/div>\n\n\u003cdiv class=\"card\" data-cat=\"trend\" data-search=\"step plot discrete changes held constant time matplotlib\" data-id=\"step\" tabindex=\"0\" role=\"button\" aria-haspopup=\"dialog\">\u003csvg class=\"icon\">\u003cuse href=\"#i-step\">\u003c/use>\u003c/svg>\u003ch3>Step plot\u003c/h3>\u003cp>A value that changes at specific points and stays constant in between.\u003c/p>\u003cdiv class=\"meta\">\u003cspan class=\"tag\">time series\u003c/span>\u003cspan class=\"lib\">matplotlib\u003c/span>\u003c/div>\u003c/div>\n\n\u003cdiv class=\"card\" data-cat=\"trend\" data-search=\"candlestick chart ohlc open high low close financial stock price mplfinance plotly\" data-id=\"candlestick\" tabindex=\"0\" role=\"button\" aria-haspopup=\"dialog\">\u003csvg class=\"icon\">\u003cuse href=\"#i-candle\">\u003c/use>\u003c/svg>\u003ch3>Candlestick chart\u003c/h3>\u003cp>Open, high, low, and close price movement over time.\u003c/p>\u003cdiv class=\"meta\">\u003cspan class=\"tag\">financial (OHLC)\u003c/span>\u003cspan class=\"lib\">mplfinance · plotly\u003c/span>\u003c/div>\u003c/div>\n\n\u003cdiv class=\"card\" data-cat=\"hierarchy\" data-search=\"dendrogram hierarchical clustering nested grouping scipy seaborn\" data-id=\"dendrogram\" tabindex=\"0\" role=\"button\" aria-haspopup=\"dialog\">\u003csvg class=\"icon\">\u003cuse href=\"#i-dendro\">\u003c/use>\u003c/svg>\u003ch3>Dendrogram\u003c/h3>\u003cp>The nested grouping structure produced by hierarchical clustering.\u003c/p>\u003cdiv class=\"meta\">\u003cspan class=\"tag\">hierarchical\u003c/span>\u003cspan class=\"lib\">scipy · seaborn\u003c/span>\u003c/div>\u003c/div>\n\n\u003cdiv class=\"card\" data-cat=\"hierarchy\" data-search=\"network graph plot nodes edges connections relationships networkx\" data-id=\"network\" tabindex=\"0\" role=\"button\" aria-haspopup=\"dialog\">\u003csvg class=\"icon\">\u003cuse href=\"#i-net\">\u003c/use>\u003c/svg>\u003ch3>Network graph\u003c/h3>\u003cp>Connections and relationships between entities, as nodes and edges.\u003c/p>\u003cdiv class=\"meta\">\u003cspan class=\"tag\">network\u003c/span>\u003cspan class=\"lib\">networkx\u003c/span>\u003c/div>\u003c/div>\n\n\u003cdiv class=\"card\" data-cat=\"hierarchy\" data-search=\"sankey diagram flow between stages categories volume plotly\" data-id=\"sankey\" tabindex=\"0\" role=\"button\" aria-haspopup=\"dialog\">\u003csvg class=\"icon\">\u003cuse href=\"#i-sankey\">\u003c/use>\u003c/svg>\u003ch3>Sankey diagram\u003c/h3>\u003cp>The volume of flow moving between categories or stages.\u003c/p>\u003cdiv class=\"meta\">\u003cspan class=\"tag\">flow / network\u003c/span>\u003cspan class=\"lib\">plotly\u003c/span>\u003c/div>\u003c/div>\n\n\u003cdiv class=\"card\" data-cat=\"geospatial\" data-search=\"choropleth map geographic regions shaded value plotly geopandas\" data-id=\"choropleth\" tabindex=\"0\" role=\"button\" aria-haspopup=\"dialog\">\u003csvg class=\"icon\">\u003cuse href=\"#i-choro\">\u003c/use>\u003c/svg>\u003ch3>Choropleth map\u003c/h3>\u003cp>A numeric value shaded across geographic regions, like states or countries.\u003c/p>\u003cdiv class=\"meta\">\u003cspan class=\"tag\">geographic\u003c/span>\u003cspan class=\"lib\">plotly · geopandas\u003c/span>\u003c/div>\u003c/div>\n\n\u003cdiv class=\"card\" data-cat=\"geospatial\" data-search=\"scatter geo map individual locations points geopandas plotly\" data-id=\"scatter_geo\" tabindex=\"0\" role=\"button\" aria-haspopup=\"dialog\">\u003csvg class=\"icon\">\u003cuse href=\"#i-geoscatter\">\u003c/use>\u003c/svg>\u003ch3>Scatter geo map\u003c/h3>\u003cp>Individual locations plotted on a map, optionally sized or colored by value.\u003c/p>\u003cdiv class=\"meta\">\u003cspan class=\"tag\">geographic\u003c/span>\u003cspan class=\"lib\">plotly · geopandas\u003c/span>\u003c/div>\u003c/div>\n\n\u003cdiv class=\"card\" data-cat=\"specialized\" data-search=\"parallel coordinates multivariate mixed variables many observations pandas plotly\" data-id=\"parallel\" tabindex=\"0\" role=\"button\" aria-haspopup=\"dialog\">\u003csvg class=\"icon\">\u003cuse href=\"#i-parallel\">\u003c/use>\u003c/svg>\u003ch3>Parallel coordinates\u003c/h3>\u003cp>Compares many variables across many observations, each drawn as one line.\u003c/p>\u003cdiv class=\"meta\">\u003cspan class=\"tag\">multivariate\u003c/span>\u003cspan class=\"lib\">pandas · plotly\u003c/span>\u003c/div>\u003c/div>\n\n\u003cdiv class=\"card\" data-cat=\"specialized\" data-search=\"word cloud text frequency words size wordcloud library\" data-id=\"wordcloud\" tabindex=\"0\" role=\"button\" aria-haspopup=\"dialog\">\u003csvg class=\"icon\">\u003cuse href=\"#i-word\">\u003c/use>\u003c/svg>\u003ch3>Word cloud\u003c/h3>\u003cp>How often words appear in a body of text, shown by size.\u003c/p>\u003cdiv class=\"meta\">\u003cspan class=\"tag\">text\u003c/span>\u003cspan class=\"lib\">wordcloud\u003c/span>\u003c/div>\u003c/div>\n\n\u003c/div>\n\u003cp class=\"empty\" id=\"empty\">No plot types match that search.\u003c/p>\n\u003c/main>\n\n\u003cfooter>31 chart types. Every script runs as is with numpy, pandas, matplotlib, seaborn and scipy; a few also need networkx, squarify, wordcloud or geopandas (named in the script). Library labels on the cards also list alternatives.\u003c/footer>\n\n\u003cdialog id=\"codeDlg\" aria-labelledby=\"codeTitle\">\n  \u003cdiv class=\"cd-head\">\u003cdiv>\u003ch2 id=\"codeTitle\">\u003c/h2>\u003cp id=\"codeDesc\">\u003c/p>\u003c/div>\u003cbutton type=\"button\" class=\"cd-x\" id=\"codeClose\" aria-label=\"Close\">✕\u003c/button>\u003c/div>\n  \u003cp class=\"cd-uses\" id=\"codeUses\">\u003c/p>\n  \u003cpre class=\"cd-code\" id=\"codeText\" tabindex=\"0\">\u003c/pre>\n  \u003cdiv class=\"cd-bar\">\u003cbutton type=\"button\" class=\"cd-btn primary\" id=\"codeCopy\">Copy\u003c/button>\u003cbutton type=\"button\" class=\"cd-btn\" id=\"codeSave\">Download .py\u003c/button>\u003cspan class=\"cd-flash\" id=\"codeFlash\" role=\"status\" aria-live=\"polite\">\u003c/span>\u003c/div>\n\u003c/dialog>\n\u003cscript>\nconst chips = document.querySelectorAll('.chip');\nconst cards = document.querySelectorAll('.card');\nconst search = document.getElementById('search');\nconst empty = document.getElementById('empty');\nlet activeCat = 'all';\n\nfunction applyFilter(){\n  const q = search.value.trim().toLowerCase();\n  let visible = 0;\n  cards.forEach(c => {\n    const matchCat = activeCat === 'all' || c.dataset.cat === activeCat;\n    const matchSearch = !q || c.dataset.search.includes(q);\n    const show = matchCat && matchSearch;\n    c.style.display = show ? '' : 'none';\n    if(show) visible++;\n  });\n  empty.style.display = visible === 0 ? 'block' : 'none';\n}\n\nchips.forEach(chip => chip.addEventListener('click', () => {\n  chips.forEach(c => c.classList.remove('active'));\n  chip.classList.add('active');\n  activeCat = chip.dataset.cat;\n  applyFilter();\n}));\n\nsearch.addEventListener('input', applyFilter);\n\n/* ---- example scripts: tested with numpy 2, pandas 3, matplotlib 3.11, seaborn 0.13, scipy 1.18 ---- */\nconst PLOT_CODE={\"histogram\": {\"code\": \"\\\"\\\"\\\"Histogram: how one numeric variable is distributed (here, backbone RMSD along a trajectory).\\\"\\\"\\\"\\nimport numpy as np\\nimport matplotlib.pyplot as plt\\n\\nrng = np.random.default_rng(1)\\nrmsd = np.concatenate([rng.normal(1.6, 0.20, 4000), rng.normal(2.4, 0.25, 1500)])  # replace with your data (Å)\\n\\nfig, ax = plt.subplots(figsize=(4.5, 3.2))\\nax.hist(rmsd, bins=\\\"fd\\\", color=\\\"#4C72B0\\\", edgecolor=\\\"white\\\", linewidth=0.4)\\nax.axvline(np.median(rmsd), color=\\\"k\\\", linestyle=\\\"--\\\", linewidth=1, label=f\\\"median {np.median(rmsd):.2f} Å\\\")\\nax.set_xlabel(\\\"Backbone RMSD (Å)\\\")\\nax.set_ylabel(\\\"Frames\\\")\\nax.legend(frameon=False)\\nfig.tight_layout()\\nfig.savefig(\\\"histogram.png\\\", dpi=600, bbox_inches=\\\"tight\\\")\\nplt.show()\\n\", \"uses\": [\"numpy\", \"matplotlib\"], \"file\": \"histogram.py\", \"png\": \"histogram.png\"}, \"kde\": {\"code\": \"\\\"\\\"\\\"KDE / density plot: smoothed distributions, good for comparing shapes across groups.\\\"\\\"\\\"\\nimport numpy as np\\nimport pandas as pd\\nimport seaborn as sns\\nimport matplotlib.pyplot as plt\\n\\nrng = np.random.default_rng(2)\\ndf = pd.DataFrame({\\n    \\\"distance\\\": np.concatenate([rng.normal(3.1, 0.30, 3000), rng.normal(3.8, 0.50, 3000)]),  # Å\\n    \\\"system\\\": [\\\"wild type\\\"] * 3000 + [\\\"mutant\\\"] * 3000,\\n})\\n\\nfig, ax = plt.subplots(figsize=(4.5, 3.2))\\nsns.kdeplot(data=df, x=\\\"distance\\\", hue=\\\"system\\\", fill=True, common_norm=False, alpha=0.35, linewidth=1.2, ax=ax)\\nax.set_xlabel(\\\"Ser O$\\\\\\\\gamma$ to carbonyl C distance (Å)\\\")\\nax.set_ylabel(\\\"Density\\\")\\nfig.tight_layout()\\nfig.savefig(\\\"kde.png\\\", dpi=600, bbox_inches=\\\"tight\\\")\\nplt.show()\\n\", \"uses\": [\"numpy\", \"pandas\", \"seaborn\", \"matplotlib\"], \"file\": \"kde.py\", \"png\": \"kde.png\"}, \"box\": {\"code\": \"\\\"\\\"\\\"Box plot: median, quartiles and outliers of a numeric variable, split by category.\\\"\\\"\\\"\\nimport numpy as np\\nimport pandas as pd\\nimport seaborn as sns\\nimport matplotlib.pyplot as plt\\n\\nrng = np.random.default_rng(3)\\nvariants = [\\\"WT\\\", \\\"S160A\\\", \\\"W185H\\\", \\\"R280A\\\"]\\ndf = pd.DataFrame({\\n    \\\"variant\\\": np.repeat(variants, 40),\\n    \\\"dG\\\": np.concatenate([rng.normal(m, s, 40) for m, s in [(-8.1, 0.6), (-6.9, 0.8), (-8.7, 0.5), (-7.4, 0.9)]]),\\n})\\n\\nfig, ax = plt.subplots(figsize=(4.5, 3.2))\\nsns.boxplot(data=df, x=\\\"variant\\\", y=\\\"dG\\\", color=\\\"#8DA0CB\\\", width=0.55, fliersize=2, ax=ax)\\nax.set_xlabel(\\\"\\\")\\nax.set_ylabel(\\\"$\\\\\\\\Delta G_\\\\\\\\mathrm{bind}$ (kcal mol$^{-1}$)\\\")\\nfig.tight_layout()\\nfig.savefig(\\\"boxplot.png\\\", dpi=600, bbox_inches=\\\"tight\\\")\\nplt.show()\\n\", \"uses\": [\"numpy\", \"pandas\", \"seaborn\", \"matplotlib\"], \"file\": \"box.py\", \"png\": \"boxplot.png\"}, \"violin\": {\"code\": \"\\\"\\\"\\\"Violin plot: the full distribution shape per category, with quartiles inside.\\\"\\\"\\\"\\nimport numpy as np\\nimport pandas as pd\\nimport seaborn as sns\\nimport matplotlib.pyplot as plt\\n\\nrng = np.random.default_rng(4)\\ndf = pd.DataFrame({\\n    \\\"replica\\\": np.repeat([\\\"R1\\\", \\\"R2\\\", \\\"R3\\\"], 500),\\n    \\\"sasa\\\": np.concatenate([rng.gamma(9, 12, 500), rng.gamma(12, 10, 500), rng.gamma(7, 15, 500)]),  # Å^2\\n})\\n\\nfig, ax = plt.subplots(figsize=(4.5, 3.2))\\nsns.violinplot(data=df, x=\\\"replica\\\", y=\\\"sasa\\\", inner=\\\"quart\\\", cut=0, color=\\\"#A1D99B\\\", linewidth=1, ax=ax)\\nax.set_xlabel(\\\"\\\")\\nax.set_ylabel(\\\"Active-site SASA (Å$^2$)\\\")\\nfig.tight_layout()\\nfig.savefig(\\\"violin.png\\\", dpi=600, bbox_inches=\\\"tight\\\")\\nplt.show()\\n\", \"uses\": [\"numpy\", \"pandas\", \"seaborn\", \"matplotlib\"], \"file\": \"violin.py\", \"png\": \"violin.png\"}, \"swarm\": {\"code\": \"\\\"\\\"\\\"Strip / swarm plot: every measurement as a point, on top of a light box plot.\\\"\\\"\\\"\\nimport numpy as np\\nimport pandas as pd\\nimport seaborn as sns\\nimport matplotlib.pyplot as plt\\n\\nrng = np.random.default_rng(5)\\ndf = pd.DataFrame({\\n    \\\"variant\\\": np.repeat([\\\"WT\\\", \\\"M1\\\", \\\"M2\\\", \\\"M3\\\"], 12),\\n    \\\"kcat\\\": np.concatenate([rng.lognormal(np.log(m), 0.25, 12) for m in (2.0, 3.5, 1.2, 5.1)]),  # s^-1\\n})\\n\\nfig, ax = plt.subplots(figsize=(4.5, 3.2))\\nsns.boxplot(data=df, x=\\\"variant\\\", y=\\\"kcat\\\", color=\\\"0.9\\\", width=0.5, showfliers=False, ax=ax)\\nsns.swarmplot(data=df, x=\\\"variant\\\", y=\\\"kcat\\\", color=\\\"#D55E00\\\", size=4, ax=ax)\\nax.set_xlabel(\\\"\\\")\\nax.set_ylabel(\\\"$k_\\\\\\\\mathrm{cat}$ (s$^{-1}$)\\\")\\nfig.tight_layout()\\nfig.savefig(\\\"swarm.png\\\", dpi=600, bbox_inches=\\\"tight\\\")\\nplt.show()\\n\", \"uses\": [\"numpy\", \"pandas\", \"seaborn\", \"matplotlib\"], \"file\": \"swarm.py\", \"png\": \"swarm.png\"}, \"ecdf\": {\"code\": \"\\\"\\\"\\\"ECDF plot: the cumulative fraction of observations below each value; no binning choices.\\\"\\\"\\\"\\nimport numpy as np\\nimport pandas as pd\\nimport seaborn as sns\\nimport matplotlib.pyplot as plt\\n\\nrng = np.random.default_rng(6)\\ndf = pd.DataFrame({\\n    \\\"contact\\\": np.concatenate([rng.weibull(2.2, 2000) * 4 + 2, rng.weibull(1.6, 2000) * 5 + 2]),  # Å\\n    \\\"system\\\": [\\\"apo\\\"] * 2000 + [\\\"holo\\\"] * 2000,\\n})\\n\\nfig, ax = plt.subplots(figsize=(4.5, 3.2))\\nsns.ecdfplot(data=df, x=\\\"contact\\\", hue=\\\"system\\\", linewidth=1.5, ax=ax)\\nax.axhline(0.5, color=\\\"0.6\\\", linewidth=0.8, linestyle=\\\":\\\")\\nax.set_xlabel(\\\"Minimum contact distance (Å)\\\")\\nax.set_ylabel(\\\"Cumulative fraction\\\")\\nfig.tight_layout()\\nfig.savefig(\\\"ecdf.png\\\", dpi=600, bbox_inches=\\\"tight\\\")\\nplt.show()\\n\", \"uses\": [\"numpy\", \"pandas\", \"seaborn\", \"matplotlib\"], \"file\": \"ecdf.py\", \"png\": \"ecdf.png\"}, \"scatter\": {\"code\": \"\\\"\\\"\\\"Scatter plot: two numeric variables, here computed against experimental barriers with a fit.\\\"\\\"\\\"\\nimport numpy as np\\nimport matplotlib.pyplot as plt\\nfrom scipy import stats\\n\\nrng = np.random.default_rng(7)\\nexp = rng.uniform(12, 22, 25)                  # experimental barrier (kcal/mol)\\ncalc = 1.05 * exp - 0.4 + rng.normal(0, 0.9, 25)\\n\\nfit = stats.linregress(exp, calc)\\nmae = np.mean(np.abs(calc - exp))\\nfig, ax = plt.subplots(figsize=(3.6, 3.4))\\nax.scatter(exp, calc, s=22, color=\\\"#0072B2\\\", edgecolor=\\\"white\\\", linewidth=0.5, zorder=3)\\nlim = [min(exp.min(), calc.min()) - 1, max(exp.max(), calc.max()) + 1]\\nax.plot(lim, lim, color=\\\"0.6\\\", linewidth=0.8, linestyle=\\\"--\\\", label=\\\"y = x\\\")\\nax.plot(lim, fit.intercept + fit.slope * np.array(lim), color=\\\"#D55E00\\\", linewidth=1.2,\\n        label=f\\\"fit, R$^2$ = {fit.rvalue**2:.2f}, MAE = {mae:.1f}\\\")\\nax.set(xlim=lim, ylim=lim, aspect=\\\"equal\\\",\\n       xlabel=\\\"Experimental $\\\\\\\\Delta G^\\\\\\\\ddagger$ (kcal mol$^{-1}$)\\\", ylabel=\\\"Computed $\\\\\\\\Delta G^\\\\\\\\ddagger$ (kcal mol$^{-1}$)\\\")\\nax.legend(frameon=False, fontsize=8)\\nfig.tight_layout()\\nfig.savefig(\\\"scatter.png\\\", dpi=600, bbox_inches=\\\"tight\\\")\\nplt.show()\\n\", \"uses\": [\"numpy\", \"matplotlib\", \"scipy\"], \"file\": \"scatter.py\", \"png\": \"scatter.png\"}, \"bubble\": {\"code\": \"\\\"\\\"\\\"Bubble chart: a scatter plot whose marker size (and colour) carry a third and fourth variable.\\\"\\\"\\\"\\nimport numpy as np\\nimport matplotlib.pyplot as plt\\n\\nrng = np.random.default_rng(8)\\nlogp = rng.uniform(-1, 5, 40)\\npic50 = 4 + 0.6 * logp + rng.normal(0, 0.6, 40)\\nmw = rng.uniform(200, 600, 40)                 # g/mol, shown as bubble size\\ntpsa = rng.uniform(20, 140, 40)                # Å^2, shown as colour\\n\\nfig, ax = plt.subplots(figsize=(4.8, 3.4))\\nsc = ax.scatter(logp, pic50, s=(mw - 150) / 3, c=tpsa, cmap=\\\"viridis\\\", alpha=0.75, edgecolor=\\\"k\\\", linewidth=0.3)\\nfig.colorbar(sc, ax=ax, label=\\\"TPSA (Å$^2$)\\\")\\nfor m in (250, 400, 550):                      # size legend\\n    ax.scatter([], [], s=(m - 150) / 3, color=\\\"0.7\\\", edgecolor=\\\"k\\\", linewidth=0.3, label=f\\\"{m}\\\")\\nax.legend(title=\\\"MW (g mol$^{-1}$)\\\", frameon=False, fontsize=7, title_fontsize=7, loc=\\\"upper left\\\")\\nax.set_xlabel(\\\"log P\\\")\\nax.set_ylabel(\\\"pIC$_{50}$\\\")\\nfig.tight_layout()\\nfig.savefig(\\\"bubble.png\\\", dpi=600, bbox_inches=\\\"tight\\\")\\nplt.show()\\n\", \"uses\": [\"numpy\", \"matplotlib\"], \"file\": \"bubble.py\", \"png\": \"bubble.png\"}, \"pairplot\": {\"code\": \"\\\"\\\"\\\"Pair plot: every pairwise scatter of 3+ numeric variables, with distributions on the diagonal.\\\"\\\"\\\"\\nimport numpy as np\\nimport pandas as pd\\nimport seaborn as sns\\nimport matplotlib.pyplot as plt\\n\\nrng = np.random.default_rng(9)\\nn = 150\\ncls = rng.choice([\\\"active\\\", \\\"inactive\\\"], n)\\ndf = pd.DataFrame({\\n    \\\"MW\\\": rng.normal(380, 60, n) + (cls == \\\"active\\\") * 40,\\n    \\\"logP\\\": rng.normal(2.5, 1.0, n) + (cls == \\\"active\\\") * 0.8,\\n    \\\"HBD\\\": rng.poisson(2, n),\\n    \\\"TPSA\\\": rng.normal(80, 25, n),\\n    \\\"class\\\": cls,\\n})\\n\\ng = sns.pairplot(df, hue=\\\"class\\\", corner=True, plot_kws={\\\"s\\\": 12, \\\"alpha\\\": 0.7}, height=1.6)\\ng.savefig(\\\"pairplot.png\\\", dpi=600, bbox_inches=\\\"tight\\\")\\nplt.show()\\n\", \"uses\": [\"numpy\", \"pandas\", \"seaborn\", \"matplotlib\"], \"file\": \"pairplot.py\", \"png\": \"pairplot.png\"}, \"heatmap\": {\"code\": \"\\\"\\\"\\\"Heatmap / correlation matrix: a numeric matrix as colours, here Pearson correlations.\\\"\\\"\\\"\\nimport numpy as np\\nimport pandas as pd\\nimport seaborn as sns\\nimport matplotlib.pyplot as plt\\n\\nrng = np.random.default_rng(10)\\nbase = rng.normal(size=(200, 1))\\ndf = pd.DataFrame(np.hstack([base + rng.normal(0, s, (200, 1)) for s in (0.3, 0.6, 1.0, 2.0, 3.0)]),\\n                  columns=[\\\"E_int\\\", \\\"H-bonds\\\", \\\"SASA\\\", \\\"RMSF\\\", \\\"Dipole\\\"])\\n\\ncorr = df.corr()\\nmask = np.triu(np.ones_like(corr, dtype=bool), k=1)\\nfig, ax = plt.subplots(figsize=(4.2, 3.6))\\nsns.heatmap(corr, mask=mask, annot=True, fmt=\\\".2f\\\", cmap=\\\"RdBu_r\\\", vmin=-1, vmax=1, square=True,\\n            linewidths=0.5, cbar_kws={\\\"label\\\": \\\"Pearson r\\\", \\\"shrink\\\": 0.8}, ax=ax)\\nfig.tight_layout()\\nfig.savefig(\\\"heatmap.png\\\", dpi=600, bbox_inches=\\\"tight\\\")\\nplt.show()\\n\", \"uses\": [\"numpy\", \"pandas\", \"seaborn\", \"matplotlib\"], \"file\": \"heatmap.py\", \"png\": \"heatmap.png\"}, \"hexbin\": {\"code\": \"\\\"\\\"\\\"Hexbin plot: point density for two variables with many points, here backbone phi/psi angles.\\\"\\\"\\\"\\nimport numpy as np\\nimport matplotlib.pyplot as plt\\n\\nrng = np.random.default_rng(11)\\nphi = np.concatenate([rng.normal(-63, 12, 30000), rng.normal(-120, 20, 25000), rng.normal(60, 10, 3000)])\\npsi = np.concatenate([rng.normal(-43, 12, 30000), rng.normal(130, 20, 25000), rng.normal(40, 12, 3000)])\\n\\nfig, ax = plt.subplots(figsize=(4.0, 3.6))\\nhb = ax.hexbin(phi, psi, gridsize=60, extent=(-180, 180, -180, 180), bins=\\\"log\\\", cmap=\\\"magma_r\\\", mincnt=1)\\nfig.colorbar(hb, ax=ax, label=\\\"log$_{10}$(count)\\\")\\nax.set(xlim=(-180, 180), ylim=(-180, 180), xticks=range(-180, 181, 90), yticks=range(-180, 181, 90),\\n       xlabel=\\\"$\\\\\\\\phi$ (°)\\\", ylabel=\\\"$\\\\\\\\psi$ (°)\\\", aspect=\\\"equal\\\")\\nfig.tight_layout()\\nfig.savefig(\\\"hexbin.png\\\", dpi=600, bbox_inches=\\\"tight\\\")\\nplt.show()\\n\", \"uses\": [\"numpy\", \"matplotlib\"], \"file\": \"hexbin.py\", \"png\": \"hexbin.png\"}, \"scatter3d\": {\"code\": \"\\\"\\\"\\\"3D scatter plot: three numeric variables, here trajectory frames on the first three PCs.\\\"\\\"\\\"\\nimport numpy as np\\nimport matplotlib.pyplot as plt\\n\\nrng = np.random.default_rng(12)\\nt = np.linspace(0, 1, 800)                     # simulation time (fraction)\\npcs = np.c_[np.cos(6 * t), np.sin(6 * t), 2 * t] * [3, 2, 2] + rng.normal(0, 0.25, (800, 3))\\n\\nfig = plt.figure(figsize=(4.6, 3.8))\\nax = fig.add_subplot(projection=\\\"3d\\\")\\nsc = ax.scatter(*pcs.T, c=t * 500, cmap=\\\"viridis\\\", s=4, depthshade=False)\\nfig.colorbar(sc, ax=ax, shrink=0.6, pad=0.12, label=\\\"Time (ns)\\\")\\nax.set_xlabel(\\\"PC1\\\"); ax.set_ylabel(\\\"PC2\\\"); ax.set_zlabel(\\\"PC3\\\")\\nax.view_init(elev=22, azim=-55)\\nfig.tight_layout()\\nfig.savefig(\\\"scatter3d.png\\\", dpi=600, bbox_inches=\\\"tight\\\")\\nplt.show()\\n\", \"uses\": [\"numpy\", \"matplotlib\"], \"file\": \"scatter3d.py\", \"png\": \"scatter3d.png\"}, \"bar\": {\"code\": \"\\\"\\\"\\\"Bar chart: one numeric value per category, with error bars when you have them.\\\"\\\"\\\"\\nimport numpy as np\\nimport matplotlib.pyplot as plt\\n\\nmethods = [\\\"B3LYP-D3\\\", \\\"M06-2X\\\", \\\"$\\\\\\\\omega$B97X-D\\\", \\\"PBE0-D3\\\", \\\"DLPNO-CCSD(T)\\\"]\\nbarrier = np.array([14.2, 17.8, 17.1, 15.6, 18.3])   # kcal/mol\\nerr = np.array([0.6, 0.5, 0.5, 0.6, 0.3])\\n\\nfig, ax = plt.subplots(figsize=(4.8, 3.2))\\nax.bar(methods, barrier, yerr=err, capsize=3, color=\\\"#56B4E9\\\", edgecolor=\\\"k\\\", linewidth=0.5)\\nax.axhline(18.0, color=\\\"#D55E00\\\", linestyle=\\\"--\\\", linewidth=1, label=\\\"experiment\\\")\\nax.set_ylabel(\\\"$\\\\\\\\Delta G^\\\\\\\\ddagger$ (kcal mol$^{-1}$)\\\")\\nax.tick_params(axis=\\\"x\\\", rotation=30)\\nax.legend(frameon=False)\\nfig.tight_layout()\\nfig.savefig(\\\"bar.png\\\", dpi=600, bbox_inches=\\\"tight\\\")\\nplt.show()\\n\", \"uses\": [\"numpy\", \"matplotlib\"], \"file\": \"bar.py\", \"png\": \"bar.png\"}, \"grouped_bar\": {\"code\": \"\\\"\\\"\\\"Grouped bar chart: a numeric value for every combination of two categories.\\\"\\\"\\\"\\nimport numpy as np\\nimport pandas as pd\\nimport seaborn as sns\\nimport matplotlib.pyplot as plt\\n\\nrng = np.random.default_rng(14)\\nrows = [(s, m, v + rng.normal(0, 0.4))\\n        for s, base in [(\\\"IsPETase\\\", -9), (\\\"LCC\\\", -10.5), (\\\"FAST-PETase\\\", -11)]\\n        for m, shift in [(\\\"MM/GBSA\\\", 0), (\\\"MM/PBSA\\\", 1.2), (\\\"FEP\\\", 2.0)]\\n        for v in [base + shift] * 3]                       # three replicas each\\ndf = pd.DataFrame(rows, columns=[\\\"enzyme\\\", \\\"method\\\", \\\"dG\\\"])\\n\\nfig, ax = plt.subplots(figsize=(4.8, 3.2))\\nsns.barplot(data=df, x=\\\"enzyme\\\", y=\\\"dG\\\", hue=\\\"method\\\", errorbar=\\\"sd\\\", capsize=0.1, err_kws={\\\"linewidth\\\": 1},\\n            palette=\\\"Set2\\\", edgecolor=\\\"k\\\", linewidth=0.5, ax=ax)\\nax.set_xlabel(\\\"\\\")\\nax.set_ylabel(\\\"$\\\\\\\\Delta G_\\\\\\\\mathrm{bind}$ (kcal mol$^{-1}$)\\\")\\nax.legend(title=\\\"\\\", frameon=False, fontsize=8)\\nfig.tight_layout()\\nfig.savefig(\\\"grouped_bar.png\\\", dpi=600, bbox_inches=\\\"tight\\\")\\nplt.show()\\n\", \"uses\": [\"numpy\", \"pandas\", \"seaborn\", \"matplotlib\"], \"file\": \"grouped_bar.py\", \"png\": \"grouped_bar.png\"}, \"radar\": {\"code\": \"\\\"\\\"\\\"Radar / spider chart: several items compared on the same 4-8 normalised properties.\\\"\\\"\\\"\\nimport numpy as np\\nimport matplotlib.pyplot as plt\\n\\nlabels = [\\\"Activity\\\", \\\"Thermostability\\\", \\\"Expression\\\", \\\"Selectivity\\\", \\\"pH range\\\"]\\nitems = {\\\"Wild type\\\": [0.40, 0.30, 0.90, 0.60, 0.50],\\n         \\\"Variant A\\\": [0.80, 0.60, 0.70, 0.50, 0.60],\\n         \\\"Variant B\\\": [0.60, 0.90, 0.50, 0.80, 0.70]}   # scaled 0-1\\n\\nangles = np.linspace(0, 2 * np.pi, len(labels), endpoint=False).tolist()\\nangles += angles[:1]\\nfig, ax = plt.subplots(figsize=(4.2, 4.2), subplot_kw={\\\"projection\\\": \\\"polar\\\"})\\nfor name, vals in items.items():\\n    v = vals + vals[:1]\\n    ax.plot(angles, v, linewidth=1.4, label=name)\\n    ax.fill(angles, v, alpha=0.15)\\nax.set_xticks(angles[:-1], labels)\\nax.set_ylim(0, 1)\\nax.set_yticks([0.25, 0.5, 0.75], [\\\"0.25\\\", \\\"0.5\\\", \\\"0.75\\\"], fontsize=7, color=\\\"0.4\\\")\\nax.legend(loc=\\\"upper right\\\", bbox_to_anchor=(1.32, 1.12), frameon=False, fontsize=8)\\nfig.tight_layout()\\nfig.savefig(\\\"radar.png\\\", dpi=600, bbox_inches=\\\"tight\\\")\\nplt.show()\\n\", \"uses\": [\"numpy\", \"matplotlib\"], \"file\": \"radar.py\", \"png\": \"radar.png\"}, \"errorbar\": {\"code\": \"\\\"\\\"\\\"Error bar plot: measured or averaged values with their uncertainty, here an Arrhenius plot.\\\"\\\"\\\"\\nimport numpy as np\\nimport matplotlib.pyplot as plt\\n\\nT = np.array([288, 298, 308, 318, 328])              # K\\nk = np.array([0.021, 0.048, 0.10, 0.21, 0.40])         # s^-1, mean of replicates\\nk_sd = k * 0.08\\n\\nx, y = 1000 / T, np.log(k)\\ny_err = k_sd / k                                       # error propagated to ln k\\nslope, intercept = np.polyfit(x, y, 1)\\nEa = -slope * 8.314462618e-3 * 1000                    # kJ/mol (slope is per 1000/T)\\n\\nfig, ax = plt.subplots(figsize=(4.2, 3.2))\\nax.errorbar(x, y, yerr=y_err, fmt=\\\"o\\\", ms=4, capsize=3, color=\\\"#009E73\\\", label=\\\"measured\\\")\\nxs = np.linspace(x.min(), x.max(), 50)\\nax.plot(xs, intercept + slope * xs, color=\\\"0.3\\\", linewidth=1, label=f\\\"fit, $E_a$ = {Ea:.0f} kJ mol$^{{-1}}$\\\")\\nax.set_xlabel(\\\"1000 / T (K$^{-1}$)\\\")\\nax.set_ylabel(\\\"ln($k$ / s$^{-1}$)\\\")\\nax.legend(frameon=False)\\nfig.tight_layout()\\nfig.savefig(\\\"errorbar.png\\\", dpi=600, bbox_inches=\\\"tight\\\")\\nplt.show()\\n\", \"uses\": [\"numpy\", \"matplotlib\"], \"file\": \"errorbar.py\", \"png\": \"errorbar.png\"}, \"donut\": {\"code\": \"\\\"\\\"\\\"Pie / donut chart: parts of one whole, for a few categories only (here, atoms in a simulation box).\\\"\\\"\\\"\\nimport matplotlib.pyplot as plt\\n\\nparts = {\\\"Water\\\": 152340, \\\"Protein\\\": 4180, \\\"PET nanoparticle\\\": 9620, \\\"Ions\\\": 112}\\ncolors = [\\\"#9ecae1\\\", \\\"#fdae6b\\\", \\\"#a1d99b\\\", \\\"#bcbddc\\\"]\\n\\nfig, ax = plt.subplots(figsize=(4.0, 3.4))\\nwedges, _, autotexts = ax.pie(parts.values(), colors=colors, startangle=90, counterclock=False,\\n                              wedgeprops={\\\"width\\\": 0.38, \\\"edgecolor\\\": \\\"white\\\"},\\n                              autopct=lambda p: f\\\"{p:.1f}%\\\" if p > 5 else \\\"\\\", pctdistance=0.81, textprops={\\\"fontsize\\\": 8})\\nax.legend(wedges, [f\\\"{k} ({v:,})\\\" for k, v in parts.items()], loc=\\\"center left\\\", bbox_to_anchor=(1.0, 0.5), frameon=False, fontsize=8)\\nax.text(0, 0, f\\\"{sum(parts.values()):,}\\\\natoms\\\", ha=\\\"center\\\", va=\\\"center\\\", fontsize=9)\\nax.set(aspect=\\\"equal\\\")\\nfig.tight_layout()\\nfig.savefig(\\\"donut.png\\\", dpi=600, bbox_inches=\\\"tight\\\")\\nplt.show()\\n\", \"uses\": [\"matplotlib\"], \"file\": \"donut.py\", \"png\": \"donut.png\"}, \"stacked_bar\": {\"code\": \"\\\"\\\"\\\"Stacked bar chart: how each bar splits into parts (here, secondary structure per replica).\\\"\\\"\\\"\\nimport pandas as pd\\nimport matplotlib.pyplot as plt\\n\\ndf = pd.DataFrame({\\\"Helix\\\": [0.34, 0.31, 0.36, 0.29], \\\"Sheet\\\": [0.22, 0.24, 0.21, 0.18],\\n                   \\\"Turn\\\": [0.18, 0.19, 0.17, 0.20], \\\"Coil\\\": [0.26, 0.26, 0.26, 0.33]},\\n                  index=[\\\"R1\\\", \\\"R2\\\", \\\"R3\\\", \\\"R4\\\"])            # fractions that add up to 1\\n\\nfig, ax = plt.subplots(figsize=(4.4, 3.2))\\ndf.plot.bar(stacked=True, ax=ax, color=[\\\"#E69F00\\\", \\\"#56B4E9\\\", \\\"#009E73\\\", \\\"#CCCCCC\\\"], edgecolor=\\\"white\\\", linewidth=0.5, width=0.65)\\nax.set_ylabel(\\\"Fraction of residues\\\")\\nax.set_xlabel(\\\"\\\")\\nax.set_ylim(0, 1)\\nax.tick_params(axis=\\\"x\\\", rotation=0)\\nax.legend(frameon=False, bbox_to_anchor=(1.0, 1.0), loc=\\\"upper left\\\", fontsize=8)\\nfig.tight_layout()\\nfig.savefig(\\\"stacked_bar.png\\\", dpi=600, bbox_inches=\\\"tight\\\")\\nplt.show()\\n\", \"uses\": [\"pandas\", \"matplotlib\"], \"file\": \"stacked_bar.py\", \"png\": \"stacked_bar.png\"}, \"stacked_area\": {\"code\": \"\\\"\\\"\\\"Stacked area chart: how a total and its parts change over time (here, monthly core-hours by project).\\\"\\\"\\\"\\nimport numpy as np\\nimport pandas as pd\\nimport matplotlib.pyplot as plt\\n\\nmonths = pd.date_range(\\\"2025-01-01\\\", periods=12, freq=\\\"MS\\\")\\nrng = np.random.default_rng(19)\\nuse = {\\\"QM/MM\\\": rng.uniform(20, 60, 12), \\\"MD screening\\\": rng.uniform(40, 120, 12), \\\"DFT\\\": rng.uniform(10, 30, 12)}  # k core-h\\n\\nfig, ax = plt.subplots(figsize=(5.0, 3.2))\\nax.stackplot(months, *use.values(), labels=use.keys(), colors=[\\\"#CC79A7\\\", \\\"#0072B2\\\", \\\"#F0E442\\\"], alpha=0.85)\\nax.set_ylabel(\\\"Core-hours (thousands)\\\")\\nax.legend(loc=\\\"upper left\\\", frameon=False, fontsize=8)\\nax.margins(x=0)\\nfig.autofmt_xdate()\\nfig.tight_layout()\\nfig.savefig(\\\"stacked_area.png\\\", dpi=600, bbox_inches=\\\"tight\\\")\\nplt.show()\\n\", \"uses\": [\"numpy\", \"pandas\", \"matplotlib\"], \"file\": \"stacked_area.py\", \"png\": \"stacked_area.png\"}, \"treemap\": {\"code\": \"\\\"\\\"\\\"Treemap: parts of a whole as nested rectangles, good for many parts of very different size.\\nNeeds: pip install squarify\\\"\\\"\\\"\\nimport matplotlib.pyplot as plt\\nimport squarify\\n\\nsizes = {\\\"MD production\\\": 420, \\\"Enhanced sampling\\\": 180, \\\"QM/MM MD\\\": 140, \\\"DFT\\\": 60, \\\"Docking\\\": 25, \\\"Analysis\\\": 15}\\nlabels = [f\\\"{k}\\\\n{v} k core-h\\\" for k, v in sizes.items()]\\ncolors = plt.cm.Set3.colors[:len(sizes)]\\n\\nfig, ax = plt.subplots(figsize=(5.0, 3.4))\\nsquarify.plot(sizes=list(sizes.values()), label=labels, color=colors, pad=True, text_kwargs={\\\"fontsize\\\": 7}, ax=ax)\\nax.axis(\\\"off\\\")\\nfig.tight_layout()\\nfig.savefig(\\\"treemap.png\\\", dpi=600, bbox_inches=\\\"tight\\\")\\nplt.show()\\n\", \"uses\": [\"matplotlib\", \"squarify\"], \"file\": \"treemap.py\", \"png\": \"treemap.png\"}, \"waterfall\": {\"code\": \"\\\"\\\"\\\"Waterfall chart: how contributions add up step by step to a total (here, an energy decomposition).\\\"\\\"\\\"\\nimport numpy as np\\nimport matplotlib.pyplot as plt\\n\\nterms = {\\\"Electrostatics\\\": -42.0, \\\"van der Waals\\\": -31.5, \\\"Polar solvation\\\": 48.3, \\\"Nonpolar solvation\\\": -4.1, \\\"-T$\\\\\\\\Delta S$\\\": 18.6}\\nvals = np.array(list(terms.values()))\\nstarts = np.concatenate([[0], np.cumsum(vals)[:-1]])\\ntotal = vals.sum()\\n\\nfig, ax = plt.subplots(figsize=(5.0, 3.4))\\nax.bar(list(terms), vals, bottom=starts, color=np.where(vals \\u003c 0, \\\"#0072B2\\\", \\\"#D55E00\\\"), edgecolor=\\\"k\\\", linewidth=0.5)\\nax.bar(\\\"Total\\\", total, color=\\\"0.4\\\", edgecolor=\\\"k\\\", linewidth=0.5)\\nfor i, (s, v) in enumerate(zip(starts, vals)):\\n    ax.plot([i + 0.3, i + 0.7], [s + v, s + v], color=\\\"0.5\\\", linewidth=0.8)\\nax.axhline(0, color=\\\"k\\\", linewidth=0.6)\\nax.set_ylabel(\\\"Energy (kcal mol$^{-1}$)\\\")\\nax.tick_params(axis=\\\"x\\\", rotation=30)\\nax.text(len(vals), total, f\\\"{total:.1f}\\\", ha=\\\"center\\\", va=\\\"bottom\\\" if total > 0 else \\\"top\\\", fontsize=8)\\nfig.tight_layout()\\nfig.savefig(\\\"waterfall.png\\\", dpi=600, bbox_inches=\\\"tight\\\")\\nplt.show()\\n\", \"uses\": [\"numpy\", \"matplotlib\"], \"file\": \"waterfall.py\", \"png\": \"waterfall.png\"}, \"line\": {\"code\": \"\\\"\\\"\\\"Line plot: a value over time, with a running mean to show the trend.\\\"\\\"\\\"\\nimport numpy as np\\nimport pandas as pd\\nimport matplotlib.pyplot as plt\\n\\nrng = np.random.default_rng(22)\\nt = np.arange(0, 500, 0.1)                                  # ns\\ne = -1.25e5 + 300 * np.exp(-t / 40) + rng.normal(0, 60, t.size)   # kJ/mol\\ns = pd.Series(e, index=t)\\n\\nfig, ax = plt.subplots(figsize=(5.0, 3.0))\\nax.plot(s.index, s.values, color=\\\"0.75\\\", linewidth=0.5, label=\\\"every frame\\\")\\nax.plot(s.index, s.rolling(200, center=True).mean(), color=\\\"#0072B2\\\", linewidth=1.5, label=\\\"20 ns running mean\\\")\\nax.set_xlabel(\\\"Time (ns)\\\")\\nax.set_ylabel(\\\"Potential energy (kJ mol$^{-1}$)\\\")\\nax.ticklabel_format(axis=\\\"y\\\", style=\\\"sci\\\", scilimits=(0, 0), useMathText=True)\\nax.legend(frameon=False)\\nfig.tight_layout()\\nfig.savefig(\\\"line.png\\\", dpi=600, bbox_inches=\\\"tight\\\")\\nplt.show()\\n\", \"uses\": [\"numpy\", \"pandas\", \"matplotlib\"], \"file\": \"line.py\", \"png\": \"line.png\"}, \"step\": {\"code\": \"\\\"\\\"\\\"Step plot: values that hold until the next change (here, the protonation state seen in constant-pH MD).\\\"\\\"\\\"\\nimport numpy as np\\nimport matplotlib.pyplot as plt\\n\\nrng = np.random.default_rng(23)\\nt = np.sort(rng.uniform(0, 100, 40))                         # ns, times of state changes\\nstate = np.cumsum(rng.choice([-1, 1], 40)) % 2               # 0 = deprotonated, 1 = protonated\\n\\nfig, ax = plt.subplots(figsize=(5.0, 2.4))\\nax.step(np.r_[0, t], np.r_[state[0], state], where=\\\"post\\\", color=\\\"#CC79A7\\\", linewidth=1.2)\\nax.set_yticks([0, 1], [\\\"deprotonated\\\", \\\"protonated\\\"])\\nax.set_xlabel(\\\"Time (ns)\\\")\\nax.set_ylim(-0.3, 1.3)\\nax.set_xlim(0, 100)\\nfig.tight_layout()\\nfig.savefig(\\\"step.png\\\", dpi=600, bbox_inches=\\\"tight\\\")\\nplt.show()\\n\", \"uses\": [\"numpy\", \"matplotlib\"], \"file\": \"step.py\", \"png\": \"step.png\"}, \"candlestick\": {\"code\": \"\\\"\\\"\\\"Candlestick chart: open, high, low and close per period. Made for prices, but works for any\\nquantity summarised per interval (here, daily cluster queue wait in hours). Matplotlib only.\\\"\\\"\\\"\\nimport numpy as np\\nimport pandas as pd\\nimport matplotlib.pyplot as plt\\n\\nrng = np.random.default_rng(24)\\ndays = pd.date_range(\\\"2025-03-01\\\", periods=20, freq=\\\"D\\\")\\nop = np.abs(rng.normal(6, 2, 20)); cl = np.abs(op + rng.normal(0, 2, 20))\\nhi = np.maximum(op, cl) + rng.uniform(0.5, 3, 20); lo = np.clip(np.minimum(op, cl) - rng.uniform(0.5, 3, 20), 0, None)\\ndf = pd.DataFrame({\\\"open\\\": op, \\\"high\\\": hi, \\\"low\\\": lo, \\\"close\\\": cl}, index=days)\\n\\nfig, ax = plt.subplots(figsize=(5.2, 3.0))\\nx = np.arange(len(df))\\nup = df.close >= df.open\\nax.vlines(x, df.low, df.high, color=\\\"0.3\\\", linewidth=0.8)\\nax.bar(x, (df.close - df.open).abs(), bottom=df[[\\\"open\\\", \\\"close\\\"]].min(axis=1), width=0.6,\\n       color=np.where(up, \\\"#D55E00\\\", \\\"#009E73\\\"), edgecolor=\\\"0.3\\\", linewidth=0.5)\\nax.set_xticks(x[::3], df.index[::3].strftime(\\\"%d %b\\\"))\\nax.set_ylabel(\\\"Queue wait (h)\\\")\\nfig.tight_layout()\\nfig.savefig(\\\"candlestick.png\\\", dpi=600, bbox_inches=\\\"tight\\\")\\nplt.show()\\n\", \"uses\": [\"numpy\", \"pandas\", \"matplotlib\"], \"file\": \"candlestick.py\", \"png\": \"candlestick.png\"}, \"dendrogram\": {\"code\": \"\\\"\\\"\\\"Dendrogram: hierarchical clustering, here of trajectory frames by pairwise RMSD.\\\"\\\"\\\"\\nimport numpy as np\\nimport matplotlib.pyplot as plt\\nfrom scipy.cluster.hierarchy import dendrogram, linkage, fcluster\\nfrom scipy.spatial.distance import squareform\\n\\nrng = np.random.default_rng(25)\\ncentres = rng.normal(0, 3, (3, 5))\\nX = np.vstack([c + rng.normal(0, 0.6, (12, 5)) for c in centres])     # replace with your features\\nD = np.sqrt(((X[:, None] - X[None]) ** 2).sum(-1))                      # or a pairwise RMSD matrix (Å)\\n\\nZ = linkage(squareform(D, checks=False), method=\\\"average\\\")\\nlabels = fcluster(Z, t=3, criterion=\\\"maxclust\\\")\\nfig, ax = plt.subplots(figsize=(5.2, 3.0))\\ndendrogram(Z, ax=ax, color_threshold=Z[-2, 2], above_threshold_color=\\\"0.5\\\", no_labels=True)\\nax.set_ylabel(\\\"Distance (Å)\\\")\\nax.set_xlabel(f\\\"{len(X)} frames, {labels.max()} clusters\\\")\\nfig.tight_layout()\\nfig.savefig(\\\"dendrogram.png\\\", dpi=600, bbox_inches=\\\"tight\\\")\\nplt.show()\\n\", \"uses\": [\"numpy\", \"matplotlib\", \"scipy\"], \"file\": \"dendrogram.py\", \"png\": \"dendrogram.png\"}, \"network\": {\"code\": \"\\\"\\\"
